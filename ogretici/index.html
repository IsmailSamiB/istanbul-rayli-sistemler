"bottom\")\n\ndef footer_ekle(fig, donem, birim, not_metni=None):\n    satir = f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"\n    if not_metni:\n        satir = not_metni + \"\\n\" + satir\n    fig.text(0.01, 0.01, satir, fontsize=7, color=\"gray\", va=\"bottom\")<\/pre>\n<p><code>baslik_ekle<\/code> bir <b>eksen<\/b>, <code>footer_ekle<\/code> bir <b>figür<\/b> alıyor: başlık grafik alanına, kaynak satırı tuvalin dibine ait.<\/p>\n<h3>Koordinatlar<\/h3>\n<p><code>ax.text(x, y, ...)<\/code> normalde <b>veri<\/b> koordinatı kullanır. <code>transform=ax.transAxes<\/code> verince koordinat eksenin kendisine göre olur:\n(0, 0) sol alt köşe, (1, 1) sağ üst köşe. (0, 1.02) \"sol üst köşenin hemen üstü\" demek; veri ne olursa olsun alt başlık hep aynı yere düşer.\n<code>fig.text<\/code> ise zaten figüre göre çalışır: (0.01, 0.01) tuvalin sol alt köşesi.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Buna DRY (<i>Don't Repeat Yourself<\/i>, kendini tekrar etme) ilkesi denir. Kaynak metnini ya da yazı boyutunu değiştirmek istediğinde\non grafiği tek tek düzeltmezsin; fonksiyonu değiştirirsin, hepsi birlikte güncellenir. Grafik kodu da kısalır, asıl önemli satırlar öne çıkar.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Argümanı karıştırmak: <code>footer_ekle(ax, ...)<\/code> yazarsan <code>ax.text<\/code> çalışır ve kaynak satırı\nveri koordinatı (0.01, 0.01)'e, yani grafiğin içine düşer. Fonksiyonun ne beklediğini <code>def<\/code> satırından kontrol et.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\n\nKAYNAK = \"İBB Açık Veri Portalı\"\n\ndef baslik_ekle(ax, baslik, altbaslik=None):\n    ax.set_title(baslik, loc=\"left\", fontsize=12, fontweight=\"bold\", pad=22 if altbaslik else 10)\n    if altbaslik:\n        ax.text(0, 1.02, altbaslik, transform=ax.transAxes, fontsize=9, color=\"gray\", va=\"bottom\")\n\ndef footer_ekle(fig, donem, birim, not_metni=None):\n    satir = f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"\n    if not_metni:\n        satir = not_metni + \"\\n\" + satir\n    fig.text(0.01, 0.01, satir, fontsize=7, color=\"gray\", va=\"bottom\")\n\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values() / 1000\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.barh(veri.index, veri.values, color=\"#3b6ea5\")\nax.spines[[\"top\", \"right\"]].set_visible(False)\nbaslik_ekle(ax, \"Hat bazında yolcu\", \"Üç günün toplamı, örnek veri\")\nfooter_ekle(fig, \"2025\", \"yolcu (bin)\")\nplt.tight_layout(rect=[0, 0.05, 1, 1])\nplt.show()", "ornek_setup": ["yolcu"]}], "sorular": [{"t": "mc", "q": "<code>fig, ax = plt.subplots()<\/code> satırında <code>ax<\/code> nedir?", "opts": ["Tüm pencere", "Çizim yapılan grafik alanı (eksen)", "Renk listesi", "Dosya adı"], "a": 1, "why": "Çubuklar, yazılar, etiketler hep <code>ax<\/code> üzerinden eklenir. Tuvalin kendisi <code>fig<\/code>'dir.", "tags": ["grafik"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bir eksene başlık koymanın doğru yolu hangisi?", "opts": ["ax.title(\"Yolcu\")", "ax.set_title(\"Yolcu\")", "fig.set_title(\"Yolcu\")", "ax.baslik(\"Yolcu\")"], "a": 1, "why": "Eksen ayarları <code>set_<\/code> ile başlar. <code>ax.title<\/code> bir yöntem değil, başlığın yazı nesnesidir; çağırınca <code>TypeError<\/code> verir.", "tags": ["grafik"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu grafikte <b>en üstteki<\/b> çubuk hangi hattın?", "opts": ["M2", "T1", "Marmaray", "Sıra belli olmaz"], "a": 2, "why": "Sıralama küçükten büyüğe: T1, M2, Marmaray. <code>barh<\/code> ilk elemanı en alta, sonuncuyu en üste çizer.", "tags": ["grafik", "sort"], "code": "veri = pd.Series({\"M2\": 145, \"T1\": 107, \"Marmaray\": 190}).sort_values()\nfig, ax = plt.subplots()\nax.barh(veri.index, veri.values)", "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "\"60+ payı yüksek hatların hafta sonu kullanımı da yüksek mi?\" sorusu için hangi grafik uygun?", "opts": ["ax.pie", "ax.scatter", "ax. köşesine", "Başlığın yerine"], "a": 1, "why": "<code>transAxes<\/code> ile (0, 0) eksenin sol alt, (1, 1) sağ üst köşesidir; y = 1.02 üst kenarın biraz üstü.", "tags": ["grafik"], "code": null, "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "Kaynak adını bütün grafiklerde değiştirmek istiyorsun. Yardımcı fonksiyonlar sayesinde kaç yeri düzeltirsin?", "opts": ["Her grafik hücresini tek tek", "Yalnızca KAYNAK sabitini (ya da footer_ekle'yi)", "Hiçbirini, kendiliğinden değişir", "Yalnızca son grafiği"], "a": 1, "why": "Metin tek yerde üretiliyor; orayı değiştirmek hepsini günceller. DRY'nin kazancı bu.", "tags": ["grafik", "fonksiyon"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["(2, 3)", "(3, 2)", "6", "(1, 6)"], "a": 0, "why": "2 satır, 3 sütun eksen: <code>axes<\/code> 2×3'lük bir dizi. <code>axes[1, 2]<\/code> alt sıranın en sağındaki eksendir.", "tags": ["grafik"], "code": "fig, axes = plt.subplots(2, 3)\nprint(axes.shape)", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Grafiği yüksek çözünürlükle kaydet.", "code": "plt.___(\"figures/hat.png\", dpi=___)", "a": [["savefig"], ["150", "300", "200"]], "why": "<code>savefig<\/code> ve <code>dpi<\/code> (inç başına nokta). figsize × dpi = piksel boyutu.", "tags": ["grafik"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Aylara göre günlük ortalama yolcunun nasıl değiştiğini göstermek için hangisi?", "opts": ["ax.pie(degerler)", "ax.plot(aylar, degerler, marker=\"o\")", "ax.scatter(aylar, aylar)", "ax.legend(aylar)"], "a": 1, "why": "Zaman içindeki değişim çizgiyle gösterilir; <code>marker=\"o\"<\/code> her ayı nokta olarak da işaretler.", "tags": ["grafik"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Hat başına toplam yolcuyu yatay çubuk grafikle çiz; her çubuğun ucuna değeri yaz; üst ve sağ çerçeveyi kaldır. Grafik aşağıda görünecek.", "starter": "import matplotlib.pyplot as plt\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values()\n\nfig, ax = plt.subplots(figsize=(7, 4))\n", "sol": "import matplotlib.pyplot as plt\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values()\n\nfig, ax = plt.subplots(figsize=(7, 4))\nax.barh(veri.index, veri.values, color=\"#3b6ea5\")\nfor i, deger in enumerate(veri.values):\n    ax.text(deger + 300, i, f\"{deger:,}\", va=\"center\", fontsize=8)\nax.spines[[\"top\", \"right\"]].set_visible(False)\nax.set_xlabel(\"Yolcu\")", "test": "assert len(ax.patches) == 5, f\"5 çubuk olmalı, şu an {len(ax.patches)}\"\nassert len(ax.texts) >= 5, \"Her çubuğa bir yazı ekle (ax.text)\"\nassert not ax.spines[\"top\"].get_visible() and not ax.spines[\"right\"].get_visible(), \"Üst ve sağ çerçeve görünmez olmalı\"", "hint": "<code>ax.barh(veri.index, veri.values)<\/code>, <code>for i, deger in enumerate(veri.values): ax.text(...)<\/code>, <code>ax.spines[[\"top\", \"right\"]].set_visible(False)<\/code>", "tags": ["grafik", "dongu"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "order", "q": "Bir grafiği çizip dosyaya kaydeden satırları doğru sıraya koy.", "lines": ["import matplotlib.pyplot as plt", "fig, ax = plt.subplots(figsize=(6, 4))", "ax.barh(veri.index, veri.values)", "plt.tight_layout()", "plt.savefig(\"figures/hat.png\", dpi=150)", "plt.show()"], "why": "Önce eksen, sonra çizim; yerleşim her şey çizildikten sonra ayarlanır. Kaydetme <code>show<\/code>'dan önce gelir, yoksa boş görüntü yazılır.", "tags": ["grafik"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> TF1 hattının çubuğu vurgu renginde olmalı, ama grafikte başka bir çubuk boyanıyor. Hata mesajı yok. Düzelt.", "starter": "import matplotlib.pyplot as plt\nANA_RENK, VURGU_RENK = \"#3b6ea5\", \"#c2185b\"\n\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nrenkler = [VURGU_RENK if hat == \"TF1\" else ANA_RENK for hat in veri.index]\nveri = veri.sort_values()\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.barh(veri.index, veri.values, color=renkler)\n", "sol": "import matplotlib.pyplot as plt\nANA_RENK, VURGU_RENK = \"#3b6ea5\", \"#c2185b\"\n\nveri = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nveri = veri.sort_values()\nrenkler = [VURGU_RENK if hat == \"TF1\" else ANA_RENK for hat in veri.index]\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.barh(veri.index, veri.values, color=renkler)\n", "test": "from matplotlib.colors import to_hex\nassert len(ax.patches) == 5, f\"5 çubuk olmalı, şu an {len(ax.patches)}\"\nfor _p in ax.patches:\n    _bek = \"#c2185b\" if round(_p.get_width()) == 919 else \"#3b6ea5\"\n    assert to_hex(_p.get_facecolor()) == _bek, f\"{_p.get_width():.0f} yolculu çubuğun rengi {_bek} olmalı, şu an {to_hex(_p.get_facecolor())}\"", "hint": "Renk listesi sıralamadan önce üretilmiş; sıralama sonrası çubuklar yer değiştiriyor ama liste değişmiyor. <code>renkler<\/code> satırını <code>sort_values<\/code>'tan sonraya al.", "tags": ["grafik", "comprehension"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>salilar<\/code> (9 haftalık Salı yolcusu, bin) serisini çizgi grafikle çiz (<code>marker=\"o\"<\/code>). Serinin medyanına yatay, kesikli bir referans çizgisi ekle ve bayram haftasını (en düşük nokta) <code>ax.annotate<\/code> ya da <code>ax.text<\/code> ile işaretle.", "starter": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(7, 3))\n", "sol": "import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(7, 3))\nax.plot(salilar.index, salilar.values, marker=\"o\", color=\"#3b6ea5\")\nax.axhline(salilar.median(), color=\"gray\", linestyle=\"--\", linewidth=0.8)\ndip = salilar.idxmin()\nax.annotate(\"Bayram\", (dip, salilar[dip]), xytext=(0, -12), textcoords=\"offset points\", ha=\"center\", va=\"top\", fontsize=8)\nax.spines[[\"top\", \"right\"]].set_visible(False)", "test": "import numpy as np\ndef _duz(l, y):\n    try:\n        return np.allclose(np.asarray(l.get_ydata(), dtype=float), y)\n    except Exception:\n        return False\nassert len(ax.lines) >= 2, \"Bir veri çizgisi ve bir referans çizgisi olmalı\"\nassert any(len(l.get_ydata()) == 9 for l in ax.lines), \"salilar'ın 9 noktası çizilmeli (ax.plot)\"\nassert any(_duz(l, salilar.median()) for l in ax.lines), f\"Medyanda ({salilar.median()}) yatay çizgi yok: ax.axhline(salilar.median(), ...)\"\nassert len(ax.texts) >= 1, \"Bayram noktasını bir yazıyla işaretle (ax.annotate ya da ax.text)\"", "hint": "<code>ax.plot(salilar.index, salilar.values, marker=\"o\")<\/code>, <code>ax.axhline(salilar.median(), linestyle=\"--\")<\/code>, en düşük gün <code>salilar.idxmin()<\/code>: <code>ax.annotate(\"Bayram\", (gun, salilar[gun]))<\/code>.", "tags": ["grafik"], "setup": ["salilar"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "mc", "q": "<code>plt.tight_layout(rect=[0, 0.04, 1, 1])<\/code> ne yapar?", "opts": ["Grafiği %4 küçültür", "Yerleşimi figürün alttaki %4'lük şeridi dışında yapar; şerit alt bilgiye kalır", "x eksenini 0 ile 0.04 arasına sınırlar", "Kenarlara 4 piksel boşluk bırakır"], "a": 1, "why": "<code>rect<\/code> = [sol, alt, sağ, üst], figür oranı cinsinden. Alt 0.04 → en alttaki %4 boş kalır; <code>fig.text<\/code> ile yazılan kaynak satırı oraya sığar.", "tags": ["grafik"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["3 1", "3 0", "4 1", "1 3"], "a": 0, "why": "Üç çubuk <code>ax.patches<\/code>'e, <code>axvline<\/code>'ın çizdiği çizgi <code>ax.lines<\/code>'a eklenir.", "tags": ["grafik"], "code": "fig, ax = plt.subplots()\nax.barh([\"a\", \"b\", \"c\"], [3, 1, 2])\nax.axvline(2)\nprint(len(ax.patches), len(ax.lines))", "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Projendeki iki yardımcı fonksiyonu yaz. <code>baslik_ekle(ax, baslik, altbaslik=None)<\/code>: başlığı sola yaslı ve kalın koysun; alt başlık verildiyse onu <code>ax.text(0, 1.02, ..., transform=ax.transAxes)<\/code> ile başlığın altına yazsın. <code>footer_ekle(fig, donem, birim)<\/code>: <code>fig.text<\/code> ile sol alta <code>Kaynak: İBB Açık Veri Portalı | Dönem: 2025 | Birim: yolcu<\/code> biçiminde bir satır yazsın.", "starter": "import matplotlib.pyplot as plt\nKAYNAK = \"İBB Açık Veri Portalı\"\n\ndef baslik_ekle(ax, baslik, altbaslik=None):\n    pass\n\ndef footer_ekle(fig, donem, birim):\n    pass\n\nfig, ax = plt.subplots(figsize=(6, 3))\nax.plot([1, 2, 3], [2, 3, 1])\nbaslik_ekle(ax, \"Deneme\", \"Alt başlık\")\nfooter_ekle(fig, \"2025\", \"yolcu\")\n", "sol": "import matplotlib.pyplot as plt\nKAYNAK = \"İBB Açık Veri Portalı\"\n\ndef baslik_ekle(ax, baslik, altbaslik=None):\n    ax.set_title(baslik, loc=\"left\", fontsize=12, fontweight=\"bold\", pad=22 if altbaslik else 10)\n    if altbaslik:\n        ax.text(0, 1.02, altbaslik, transform=ax.transAxes, fontsize=9, color=\"gray\", va=\"bottom\")\n\ndef footer_ekle(fig, donem, birim):\n    fig.text(0.01, 0.01, f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\", fontsize=7, color=\"gray\", va=\"bottom\")\n\nfig, ax = plt.subplots(figsize=(6, 3))\nax.plot([1, 2, 3], [2, 3, 1])\nbaslik_ekle(ax, \"Deneme\", \"Alt başlık\")\nfooter_ekle(fig, \"2025\", \"yolcu\")\n", "test": "import matplotlib.pyplot as plt\n_f, _a = plt.subplots()\nbaslik_ekle(_a, \"Başlık\", \"Açıklama\")\nassert _a.get_title(loc=\"left\") == \"Başlık\", \"Başlık sola yaslı olmalı: ax.set_title(baslik, loc=\\\"left\\\")\"\nassert any(t.get_text() == \"Açıklama\" for t in _a.texts), \"Alt başlık ax.text ile eksene yazılmalı\"\n_f2, _a2 = plt.subplots()\nbaslik_ekle(_a2, \"Tek\")\nassert len(_a2.texts) == 0, \"Alt başlık verilmezse ek yazı eklenmemeli (if altbaslik:)\"\nfooter_ekle(_f, \"2025\", \"yolcu\")\nassert any(t.get_text() == \"Kaynak: İBB Açık Veri Portalı | Dönem: 2025 | Birim: yolcu\" for t in _f.texts), \"footer_ekle, fig.text ile beklenen kaynak satırını yazmalı\"", "hint": "<code>ax.set_title(baslik, loc=\"left\", fontweight=\"bold\")<\/code>; <code>if altbaslik: ax.text(0, 1.02, altbaslik, transform=ax.transAxes)<\/code>; <code>fig.text(0.01, 0.01, f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\")<\/code>.", "tags": ["grafik", "fonksiyon", "fstring"], "setup": [], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hafta sonu oranı grafiği.<\/b> Projendeki hafta sonu grafiğini <code>yolcu<\/code> verisiyle baştan kur:<ol><li>Önce hat–gün toplamını, sonra her hat için hafta içi ve hafta sonu <b>günlük ortalamasını<\/b> bul. <code>oran = hafta sonu ÷ hafta içi × 100<\/code> Series'ini küçükten büyüğe sırala.<\/li><li>Yatay çubuk çiz: oranı 100'ü geçen çubuk <code>VURGU_RENK<\/code>, diğerleri <code>ANA_RENK<\/code>.<\/li><li>Her çubuğun ucuna <code>%60<\/code> biçiminde değerini yaz.<\/li><li>x = 100'e gri, kesikli bir dikey çizgi çek.<\/li><li>Üst ve sağ çerçeveyi gizle.<\/li><\/ol>", "starter": "import matplotlib.pyplot as plt\n\nANA_RENK = \"#3b6ea5\"\nVURGU_RENK = \"#c2185b\"\n\n# 1) hat-gün toplamı, sonra hat × hafta sonu mu? bazında günlük ortalama\ngunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\n# ort = ...\n# oran = ...\n\n# 2–5) grafik\nfig, ax = plt.subplots(figsize=(7, 4))\n", "sol": "import matplotlib.pyplot as plt\n\nANA_RENK = \"#3b6ea5\"\nVURGU_RENK = \"#c2185b\"\n\ngunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\nort = gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean().unstack()\noran = (ort[True] / ort[False] * 100).sort_values()\n\nfig, ax = plt.subplots(figsize=(7, 4))\nrenkler = [VURGU_RENK if d > 100 else ANA_RENK for d in oran]\nax.barh(oran.index, oran.values, color=renkler)\nfor i, d in enumerate(oran):\n    ax.text(d + 1.5, i, f\"%{d:.0f}\", va=\"center\", fontsize=8)\nax.axvline(100, color=\"gray\", linestyle=\"--\", linewidth=1)\nax.spines[[\"top\", \"right\"]].set_visible(False)\nax.set_xlim(0, 135)\nax.set_xlabel(\"Hafta içi günlük ortalamaya göre (%)\")\nplt.tight_layout()\n", "test": "import numpy as np\nfrom matplotlib.colors import to_hex\ndef _dikey100(l):\n    try:\n        return np.allclose(np.asarray(l.get_xdata(), dtype=float), 100)\n    except Exception:\n        return False\nassert len(ax.patches) == 5, f\"5 hat için 5 çubuk olmalı, şu an {len(ax.patches)}\"\n_w = [p.get_width() for p in ax.patches]\nassert abs(max(_w) - 120.2) < 0.1, f\"En uzun çubuk TF1'in oranı (yaklaşık 120.2) olmalı, şu an {max(_w):.1f}\"\nassert _w == sorted(_w), \"Çubuklar küçükten büyüğe sıralı olmalı (sort_values)\"\nfor _p in ax.patches:\n    _bek = \"#c2185b\" if _p.get_width() > 100 else \"#3b6ea5\"\n    assert to_hex(_p.get_facecolor()) == _bek, f\"{_p.get_width():.0f} uzunluğundaki çubuğun rengi {_bek} olmalı\"\nassert any(_dikey100(l) for l in ax.lines), \"x = 100'de dikey çizgi yok: ax.axvline(100, ...)\"\n_y = {t.get_text() for t in ax.texts}\nassert \"%120\" in _y and \"%60\" in _y, f\"Çubuk uçlarında %120, %60 gibi yazılar olmalı; bulunanlar: {sorted(_y)}\"\nassert not ax.spines[\"top\"].get_visible() and not ax.spines[\"right\"].get_visible(), \"Üst ve sağ çerçeveyi gizle\"", "hint": "Ortalama: <code>gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean().unstack()<\/code> → sütunlar False/True. Oran: <code>(ort[True] / ort[False] * 100).sort_values()<\/code>. Renkler: <code>[VURGU_RENK if d &gt; 100 else ANA_RENK for d in oran]<\/code>. Yazılar: <code>for i, d in enumerate(oran): ax.text(d + 1.5, i, f\"%{d:.0f}\", va=\"center\")<\/code>.", "tags": ["grafik", "groupby", "unstack", "comprehension"], "setup": ["yolcu"], "rev": false, "why": "Bu grafik tek bir mesaj veriyor: hangi hatlar hafta sonu hafta içinden daha kalabalık. Renk, referans çizgisi ve sıralama bu mesajı okuyucunun gözüne ilk bakışta taşıyor.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>figsize=(8, 5)<\/code> ne demek?", "opts": ["8×5 piksel", "8 inç genişlik, 5 inç yükseklik", "8 satır 5 sütun grafik", "Yazı boyutu"], "a": 1, "why": "Figür boyutu inç cinsindendir; dpi ile çarpınca piksel olur.", "tags": ["grafik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>ax.barh(etiketler, degerler)<\/code> listenin <b>ilk<\/b> elemanını nereye çizer?", "opts": ["En üste", "En alta", "Ortaya", "Rastgele bir yere"], "a": 1, "why": "Yatay çubukta y ekseni aşağıdan yukarı sayar; bu yüzden en büyüğü üstte görmek için küçükten büyüğe sıralarsın.", "tags": ["grafik", "sort"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>fig.text(0.01, 0.01, ...)<\/code> ile <code>ax.text(0.01, 0.01, ...)<\/code> farkı nedir?", "opts": ["Fark yok", "fig.text figüre göre (0–1) konumlanır; ax.text varsayılan olarak veri koordinatı kullanır", "ax.text yalnızca başlık yazar", "fig.text yalnızca kaydedilen dosyada görünür"], "a": 1, "why": "Kaynak satırı tuvalin sol alt köşesine ait; bu yüzden <code>fig.text<\/code>.", "tags": ["grafik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Önce <code>plt.show()<\/code>, sonra <code>plt.savefig(\"a.png\")<\/code> çağırırsan ne olur?", "opts": ["Grafik iki kez kaydedilir", "Boş (beyaz) bir görüntü kaydedilir", "Hata verir", "Grafik daha yüksek çözünürlükle kaydedilir"], "a": 1, "why": "Gösterilen figür kapanır; <code>savefig<\/code> yeni ve boş bir figürü yazar. Önce kaydet, sonra göster.", "tags": ["grafik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b12", "no": 12, "tur": "ders", "baslik": "Zaman serisi ve olağan dışı günler", "hat": "T4", "ozet": "Tarihlerle hesap, eksik komşu günler, medyan ve MAD ile robust z-skoru; olağan dışı günleri bulmak ve 1 Mayıs'ı istasyon istasyon incelemek.", "dosya": "analiz.ipynb", "proje": "def referans_hesapla(seri, hafta=4):\n    medyanlar, madlar, n_ler = [], [], []\n    for tarih in seri.index:\n        komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]\n        degerler = seri.reindex(komsular).dropna()\n        m = degerler.median()\n        medyanlar.append(m)\n        madlar.append((degerler - m).abs().median())\n        n_ler.append(len(degerler))\n    return (pd.Series(medyanlar, seri.index), pd.Series(madlar, seri.index), pd.Series(n_ler, seri.index))\n\ngunluk[\"referans\"], gunluk[\"mad\"], gunluk[\"n_ref\"] = referans_hesapla(gunluk[\"yolcu\"])\ngunluk[\"robust_z\"] = 0.6745 * (gunluk[\"yolcu\"] - gunluk[\"referans\"]) / gunluk[\"mad\"]\ngunluk[\"sapma_yuzde\"] = (gunluk[\"yolcu\"] / gunluk[\"referans\"] - 1) * 100\ngunluk[\"anomali\"] = (gunluk[\"robust_z\"].abs() > 3.5) & (gunluk[\"sapma_yuzde\"].abs() > 5)\n...\no_gun = istasyon_gunluk.xs(hedef, level=\"date\")\nreferans = istasyon_gunluk[istasyon_gunluk.index.get_level_values(\"date\").isin(ref_gunler)].groupby(level=[0, 1]).median()", "adimlar": [{"baslik": "Tarihlerle hesap: Timestamp, Timedelta, date_range", "html": "\n<p>pandas'ta bir an <b>Timestamp<\/b>, iki an arasındaki süre <b>Timedelta<\/b>'dır. Metinden tarih üretip üzerine süre ekleyebilirsin:<\/p>\n<pre class=\"py\">tarih = pd.Timestamp(\"2025-04-01\")\ntarih.day_name()                      # 'Tuesday'\ntarih.dayofweek                       # 1  (Pazartesi = 0 … Pazar = 6)\ntarih + pd.Timedelta(days=1)          # 2025-04-02\ntarih + pd.Timedelta(weeks=-4)        # 2025-03-04, yine Salı\npd.Timestamp(\"2025-05-01\") - tarih    # Timedelta('30 days')<\/pre>\n<p>Düzenli aralıklı tarihler için <code>pd.date_range<\/code>: başlangıç, bitiş ya da adet (<code>periods<\/code>) ve adım (<code>freq<\/code>).<\/p>\n<pre class=\"py\">pd.date_range(\"2025-03-03\", periods=7, freq=\"D\")       # 7 ardışık gün\npd.date_range(\"2025-03-04\", periods=9, freq=\"7D\")      # 9 Salı\npd.date_range(\"2025-01-01\", \"2025-12-01\", freq=\"MS\")   # her ayın ilk günü<\/pre>\n<p>Projende anomali grafiğinin x eksenine ay başlarını <code>freq=\"MS\"<\/code> (month start) ile koymuşsun. Analizin kalbi ise şu satır:<\/p>\n<pre class=\"py\">komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]<\/pre>\n<p><code>range(-4, 5)<\/code> −4'ten 4'e kadar sayılar verir; 0 (günün kendisi) atılır. Sonuç: 4 hafta öncesinden 4 hafta sonrasına, haftanın <b>aynı günü<\/b> olan 8 tarih.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Yolcu sayısında güçlü bir haftalık desen var: Pazar, Salı'nın yarısı kadar olabilir. Bir Salı'yı ayın ortalamasına değil,\n<b>diğer Salılara<\/b> göre değerlendirmek bu deseni kendiliğinden hesaptan çıkarır. Hafta eklemek gün adını değiştirmediği için iş tek satırda biter.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>pd.Timedelta(months=1)<\/code> yazmak: aylar 28–31 gün arasında değiştiği için Timedelta ay kabul etmez,\n<code>ValueError<\/code> verir. Takvim ayı eklemek için <code>pd.DateOffset(months=1)<\/code> kullanılır.<\/div>\n", "ornek": "import pandas as pd\n\ntarih = pd.Timestamp(\"2025-04-01\")\nprint(tarih.day_name(), tarih.dayofweek)\n\nkomsular = [tarih + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\nfor t in komsular:\n    print(t.date(), t.day_name())\n\nprint(pd.Timestamp(\"2025-05-01\") - tarih)\nprint(pd.date_range(\"2025-01-01\", \"2025-06-01\", freq=\"MS\"))", "ornek_setup": []}, {"baslik": "Eksik komşular: reindex ve dropna", "html": "\n<p>Komşu tarihleri bulduk; sıra onların değerlerini seriden çekmekte. İlk akla gelen <code>seri.loc[komsular]<\/code>'dır. Ama yılın ilk haftalarında\n\"4 hafta öncesi\" veride yoktur ve <code>.loc<\/code> olmayan bir etiket görünce <code>KeyError<\/code> verir.<\/p>\n<p><code>reindex<\/code> ise hata vermez: istediğin etiket listesiyle yeni bir Series kurar, veride olmayan etiketlere <code>NaN<\/code> koyar.\nArdından <code>dropna()<\/code> bu boşlukları atar:<\/p>\n<pre class=\"py\">degerler = seri.reindex(komsular).dropna()   # yalnızca gerçekten var olan komşular\nn = len(degerler)                            # kaç komşu kaldı? (projende n_ref)<\/pre>\n<p><code>salilar<\/code> serisi 9 Salı'dan oluşuyor (4 Mart – 29 Nisan). İlk Salı'nın 4 hafta öncesi yok, sonrası var; onun için yalnızca 4 komşu kalır.\nOrtadaki Salı'nın (1 Nisan) 8 komşusu da vardır.<\/p>\n<p>Projende <code>n_ref<\/code>'i ayrıca kaydetmen bu yüzden önemli: yıl başı ve yıl sonundaki günlerin referansı daha az güne dayanır, daha az güvenilirdir.\n28 Aralık'ın \"referans penceresi kısa\" notu da buradan geliyor.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>reindex<\/code>'in sözü şudur: \"Sonuç tam olarak istediğin etiketlerle, istediğin sırada gelir.\" Eksikler NaN olur ve açıkça görünür;\n<code>try/except<\/code> ile uğraşmana gerek kalmaz.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>dropna()<\/code>'yı unutmak. pandas'ın <code>median()<\/code>'ı NaN'ları zaten atladığı için medyan doğru çıkar ve hata fark edilmez;\nama <code>len(degerler)<\/code> NaN'ları da sayar. Komşu sayısı hep 8 görünür, kısa pencereler gizlenir.<\/div>\n", "ornek": "import pandas as pd\n\nprint(salilar)\nfor tarih in [pd.Timestamp(\"2025-03-04\"), pd.Timestamp(\"2025-04-01\")]:\n    komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\n    ham = salilar.reindex(komsular)\n    degerler = ham.dropna()\n    print(tarih.date(), \"→ NaN:\", ham.isna().sum(), \"| kalan komşu:\", len(degerler))", "ornek_setup": ["salilar"]}, {"baslik": "Medyan, MAD ve robust z", "html": "\n<p>Şimdi \"normal\" düzeyi ve normalden ne kadar sapılabileceğini ölçmek gerekiyor. Alışılmış yol ortalama ve standart sapmadır;\nama ikisi de uç değerlere çok duyarlıdır:<\/p>\n<pre class=\"py\">x = pd.Series([410, 402, 415, 398, 205])   # sonuncusu bayram\nx.mean()      # 366.0  → bayram ortalamayı 40 bin aşağı çekti\nx.median()    # 402.0  → sıralayınca ortadaki değer, bayramdan etkilenmedi<\/pre>\n<p>Yayılım için de standart sapma yerine <b>MAD<\/b> (<i>median absolute deviation<\/i>) kullanıyorsun: her değerin medyana uzaklığını al, bu uzaklıkların medyanını bul.<\/p>\n<pre class=\"py\">m = degerler.median()\nmad = (degerler - m).abs().median()\nrobust_z = 0.6745 * (bugun - m) / mad<\/pre>\n<p><b>Robust z<\/b>, \"bugün normalden kaç tipik sapma uzakta?\" sorusunun cevabıdır. <code>0.6745<\/code> bir ölçek düzeltmesidir: veri normal dağılıyorsa MAD,\nstandart sapmanın yaklaşık 0,6745 katıdır. Bu çarpanla robust z, bildiğimiz z-skoruyla aynı ölçeğe gelir; 3,5 eşiği de bu ölçekte yaygın kullanılan bir sınırdır.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Referans penceresinde bir bayram olabilir. Ortalama ve standart sapma kullansaydın bayram hem referansı düşürür hem yayılımı şişirirdi;\ngerçek anomaliler \"normal\" görünürdü. Medyan ve MAD, 8 komşunun 3'ü bozuk olsa bile doğru düzeyi verir.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Sırayı karıştırmak: <code>(degerler.abs() - m).median()<\/code> değerlerin kendisinin mutlak değerini alır, MAD değildir.\nDoğrusu önce fark, sonra mutlak değer: <code>(degerler - m).abs().median()<\/code>.<\/div>\n", "ornek": "import pandas as pd\n\ndegerler = pd.Series([410, 402, 415, 398, 408, 412, 399, 405])   # 1 Nisan'ın 8 komşusu\nbugun = 205                                                       # 1 Nisan (bayram)\n\nm = degerler.median()\nmad = (degerler - m).abs().median()\nz = 0.6745 * (bugun - m) / mad\nprint(\"medyan:\", m, \" MAD:\", mad)\nprint(\"robust z:\", round(z, 1))\nprint(\"sapma (%):\", round((bugun / m - 1) * 100, 1))", "ornek_setup": []}, {"baslik": "referans_hesapla adım adım", "html": "\n<p>Tek gün için yaptığımızı her güne uygulayan fonksiyon, projendeki <code>referans_hesapla<\/code>:<\/p>\n<pre class=\"py\">def referans_hesapla(seri, hafta=4):\n    medyanlar, madlar, n_ler = [], [], []\n    for tarih in seri.index:\n        komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]\n        degerler = seri.reindex(komsular).dropna()\n        m = degerler.median()\n        medyanlar.append(m)\n        madlar.append((degerler - m).abs().median())\n        n_ler.append(len(degerler))\n    return (pd.Series(medyanlar, seri.index),\n            pd.Series(madlar, seri.index),\n            pd.Series(n_ler, seri.index))<\/pre>\n<p>Döngü her tarihte üç listeye birer değer ekler. Sonunda listeler, <b>seriyle aynı index'i<\/b> taşıyan Series'lere çevrilir; tabloya sütun olarak eklendiklerinde\nher değer kendi gününe oturur. <code>hafta=4<\/code> varsayılan değerdir; pencereyi değiştirmek tek argüman ister. Fonksiyon üç Series'lik bir demet döndürdüğü için\ntek satırda üç sütun açabiliyorsun:<\/p>\n<pre class=\"py\">gunluk[\"referans\"], gunluk[\"mad\"], gunluk[\"n_ref\"] = referans_hesapla(gunluk[\"yolcu\"])\ngunluk[\"robust_z\"] = 0.6745 * (gunluk[\"yolcu\"] - gunluk[\"referans\"]) / gunluk[\"mad\"]\ngunluk[\"sapma_yuzde\"] = (gunluk[\"yolcu\"] / gunluk[\"referans\"] - 1) * 100\ngunluk[\"anomali\"] = (gunluk[\"robust_z\"].abs() &gt; 3.5) &amp; (gunluk[\"sapma_yuzde\"].abs() &gt; 5)<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> Robust z tek başına yetmez: çok istikrarlı bir seride MAD küçüktür ve %2'lik sıradan bir oynama bile z'yi 3,5'in üstüne çıkarabilir.\n<code>|sapma| &gt; %5<\/code> şartı \"pratikte de önemli bir fark olsun\" der. İki koşul birlikte hem istatistiksel hem pratik anlamı olan günleri seçer.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Koşulları <code>and<\/code> ile bağlamak: <code>ValueError: The truth value of a Series is ambiguous<\/code>.\nSeries'lerde \"ve\" için <code>&amp;<\/code>, \"veya\" için <code>|<\/code> kullanılır ve her koşul paranteze alınır; çünkü <code>&amp;<\/code>, <code>&gt;<\/code>'den önce işlenir.<\/div>\n", "ornek": "import pandas as pd\n\ndef referans_hesapla(seri, hafta=4):\n    medyanlar, madlar, n_ler = [], [], []\n    for tarih in seri.index:\n        komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]\n        degerler = seri.reindex(komsular).dropna()\n        m = degerler.median()\n        medyanlar.append(m)\n        madlar.append((degerler - m).abs().median())\n        n_ler.append(len(degerler))\n    return (pd.Series(medyanlar, seri.index), pd.Series(madlar, seri.index), pd.Series(n_ler, seri.index))\n\ntablo = salilar.rename(\"yolcu\").to_frame()\ntablo[\"referans\"], tablo[\"mad\"], tablo[\"n_ref\"] = referans_hesapla(tablo[\"yolcu\"])\ntablo[\"robust_z\"] = 0.6745 * (tablo[\"yolcu\"] - tablo[\"referans\"]) / tablo[\"mad\"]\ntablo[\"sapma_yuzde\"] = (tablo[\"yolcu\"] / tablo[\"referans\"] - 1) * 100\ntablo[\"anomali\"] = (tablo[\"robust_z\"].abs() > 3.5) & (tablo[\"sapma_yuzde\"].abs() > 5)\nprint(tablo.round(1))", "ornek_setup": ["salilar"]}, {"baslik": "1 Mayıs: istasyon istasyon", "html": "\n<p>Toplam yolcuda 1 Mayıs'ın düşük olduğunu gördün. Peki düşüş her yere mi yayılmış, yoksa bazı istasyonlar tamamen mi kapalıydı?\nBunun için veriyi üç anahtarla gruplamışsın:<\/p>\n<pre class=\"py\">istasyon_gunluk = yolcu.groupby([\"line_code\", \"station_name\", \"date\"])[\"passanger_cnt\"].sum()<\/pre>\n<p>Sonuç, üç katmanlı index'i (<b>MultiIndex<\/b>) olan bir Series'tir: her satırın adı (hat, istasyon, tarih) üçlüsüdür. Bu yapıda üç araç işini görüyor:<\/p>\n<pre class=\"py\">o_gun = istasyon_gunluk.xs(hedef, level=\"date\")      # yalnızca 1 Mayıs; date katmanı düşer\nmaske = istasyon_gunluk.index.get_level_values(\"date\").isin(ref_gunler)\nreferans = istasyon_gunluk[maske].groupby(level=[0, 1]).median()<\/pre>\n<ul>\n<li><code>xs<\/code> (<i>cross-section<\/i>, kesit): bir katmanda tek bir değeri seçer ve o katmanı index'ten çıkarır. Geriye (hat, istasyon) index'li bir Series kalır.<\/li>\n<li><code>get_level_values(\"date\")<\/code> her satırın tarihini verir; <code>isin(ref_gunler)<\/code> tarih listedeyse True olan bir maske üretir.<\/li>\n<li><code>groupby(level=[0, 1])<\/code> ilk iki katmana göre gruplar; her istasyonun 8 referans gününün medyanı çıkar.<\/li>\n<\/ul>\n<p>İki Series de (hat, istasyon) index'li olduğu için <code>pd.DataFrame({\"1_mayis\": o_gun, \"referans\": referans})<\/code> onları satır satır doğru eşleştirir.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>istasyon_gunluk.loc[hedef]<\/code> yazmak. <code>.loc<\/code> tek değeri <b>ilk<\/b> katmanda (hat kodunda) arar;\nböyle bir hat olmadığı için <code>KeyError<\/code> alırsın. İç katmandan seçmek için <code>xs(..., level=...)<\/code> kullan.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> 1 Mayıs'ta hiç girişi olmayan bir istasyonun o güne ait satırı veride hiç yoktur. DataFrame kurulurken o istasyon\n<code>o_gun<\/code>'da eksik kalır ve NaN olur; <code>fillna(0)<\/code> onu \"0 yolcu\" yapar. Kapanan istasyonları tam da böyle yakalarsın.<\/div>\n", "ornek": "import pandas as pd\n\ntarihler = pd.date_range(\"2025-04-17\", periods=5, freq=\"7D\")     # 17 Nis … 15 May, hepsi Perşembe\nsatirlar = []\nfor tarih in tarihler:\n    kapali = tarih == pd.Timestamp(\"2025-05-01\")\n    if not kapali:                               # 1 Mayıs'ta Taksim'de giriş yok → satır da yok\n        satirlar.append((\"M2\", \"Taksim\", tarih, 3900))\n    satirlar.append((\"M2\", \"Yenikapı\", tarih, 4200 if kapali else 5200))\n    satirlar.append((\"T1\", \"Eminönü\", tarih, 2000 if kapali else 2600))\ndf = pd.DataFrame(satirlar, columns=[\"line_code\", \"station_name\", \"date\", \"passanger_cnt\"])\n\nistasyon_gunluk = df.groupby([\"line_code\", \"station_name\", \"date\"])[\"passanger_cnt\"].sum()\nhedef = pd.Timestamp(\"2025-05-01\")\nref_gunler = [hedef + pd.Timedelta(weeks=k) for k in range(-2, 3) if k != 0]\n\no_gun = istasyon_gunluk.xs(hedef, level=\"date\")\nmaske = istasyon_gunluk.index.get_level_values(\"date\").isin(ref_gunler)\nreferans = istasyon_gunluk[maske].groupby(level=[0, 1]).median()\n\nmayis = pd.DataFrame({\"1_mayis\": o_gun, \"referans\": referans}).fillna(0)\nmayis[\"degisim_yuzde\"] = (mayis[\"1_mayis\"] / mayis[\"referans\"] - 1) * 100\nprint(mayis.round(1))", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["Tuesday", "Thursday", "Wednesday", "hata verir"], "a": 0, "why": "Tam hafta eklemek haftanın gününü değiştirmez: 1 Nisan Salı, 15 Nisan da Salı.", "tags": ["zaman"], "code": "t = pd.Timestamp(\"2025-04-01\") + pd.Timedelta(weeks=2)\nprint(t.day_name())", "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "fill", "q": "4 hafta öncesinden 4 hafta sonrasına, günün kendisi hariç komşu tarihleri kur.", "code": "komsular = [tarih + pd.___(weeks=k) for k in range(-4, ___) if k != 0]", "a": [["Timedelta"], ["5"]], "why": "<code>range<\/code>'in sonu dahil değildir; 4'ü de almak için <code>range(-4, 5)<\/code>.", "tags": ["zaman", "comprehension"], "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>salilar<\/code> 4 Mart'ta başlıyor. <code>salilar.loc[[pd.Timestamp(\"2025-02-25\")]]<\/code> ne olur?", "opts": ["NaN döner", "KeyError verir", "Boş bir Series döner", "En yakın tarihin değeri gelir"], "a": 1, "why": "<code>.loc<\/code> olmayan etiketi kabul etmez. Aynı listeyi <code>reindex<\/code>'e verseydin NaN alırdın.", "tags": ["zaman", "loc"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>salilar<\/code>'ın <b>ilk<\/b> Salı'sı (4 Mart) için <code>reindex(...).dropna()<\/code> sonrası kaç komşu kalır?", "opts": ["8", "4", "0", "5"], "a": 1, "why": "Öncesinde veri yok; sonrasındaki 4 Salı (11, 18, 25 Mart ve 1 Nisan) var.", "tags": ["zaman"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>[1, 2, 3, 100]<\/code> için ortalama ve medyan?", "opts": ["26.5 ve 2.5", "26.5 ve 3", "2.5 ve 2.5", "100 ve 2"], "a": 0, "why": "Ortalama uç değer (100) yüzünden 26.5; medyan ortadaki iki değerin ortalaması: 2.5.", "tags": ["istatistik"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "fill", "q": "MAD: medyandan mutlak sapmaların medyanı.", "code": "mad = (degerler - m).___().___()", "a": [["abs"], ["median"]], "why": "Önce fark, sonra <code>abs()<\/code>, en son <code>median()<\/code>.", "tags": ["istatistik"], "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "fill", "q": "Anomali kuralını yaz: iki koşul da sağlanmalı.", "code": "gunluk[\"anomali\"] = (gunluk[\"robust_z\"].___() > 3.5) ___ (gunluk[\"sapma_yuzde\"].abs() > 5)", "a": [["abs"], ["&"]], "why": "Mutlak değer <code>.abs()<\/code>; pandas'ta \"ve\" <code>&amp;<\/code>.", "tags": ["maske", "zaman"], "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "Fonksiyon neden listeleri en sonda <code>pd.Series(liste, seri.index)<\/code> yapıyor?", "opts": ["Listeler daha yavaş olduğu için", "Sonuçlar tabloya eklendiğinde her değer kendi tarihine otursun diye", "median() yalnızca Series'te çalıştığı için", "Tarihleri metne çevirmek için"], "a": 1, "why": "Aynı index, pandas'ın değerleri satır satır doğru eşleştirmesini sağlar.", "tags": ["zaman", "pandas_temel"], "code": null, "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>istasyon_gunluk.xs(hedef, level=\"date\")<\/code> sonucunun index'inde hangi katmanlar kalır?", "opts": ["line_code, station_name, date", "line_code ve station_name", "Yalnızca date", "Hiçbiri, tek bir sayı döner"], "a": 1, "why": "<code>xs<\/code> seçtiği katmanı index'ten düşürür; geriye (hat, istasyon) kalır.", "tags": ["multiindex"], "code": null, "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[False, True, True]", "[5, 9]", "[True, False, False]", "2"], "a": 0, "why": "<code>isin<\/code> her eleman için \"listede var mı?\" sorusunun cevabını verir.", "tags": ["maske"], "code": "print(pd.Series([1, 5, 9]).isin([5, 9]).tolist())", "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "<code>[k for k in range(-2, 3) if k != 0]<\/code> neyi verir?", "opts": ["[-2, -1, 0, 1, 2]", "[-2, -1, 1, 2]", "[-1, 1]", "[1, 2]"], "a": 1, "why": "<code>range(-2, 3)<\/code> → -2..2; 0 atılır.", "tags": ["comprehension", "zaman"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["14 days 00:00:00", "2 weeks", "14", "hata verir"], "a": 0, "why": "İki Timestamp'in farkı bir Timedelta'dır; gün ve saat olarak yazılır.", "tags": ["zaman"], "code": "print(pd.Timestamp(\"2025-05-01\") - pd.Timestamp(\"2025-04-17\"))", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "4 Mart'tan başlayan 9 Salı'lık tarih dizisini kur.", "code": "pd.date_range(\"2025-03-04\", periods=9, freq=___)", "a": [["\"7D\"", "\"W-TUE\"", "\"W\""]], "why": "Yedi günde bir: <code>freq=\"7D\"<\/code> (ya da haftalık, Salı'ya sabit: <code>\"W-TUE\"<\/code>).", "tags": ["zaman"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Neden <code>seri.reindex(komsular)<\/code> ve ardından <code>.dropna()<\/code>?", "opts": ["Sıralamak için", "Veride olmayan tarihler (yıl başı/sonu) NaN olur; onları atmak için", "Tarihleri metne çevirmek için", "Gereksiz"], "a": 1, "why": "Ocak başındaki bir günün 4 hafta öncesi veride yok; <code>reindex<\/code> onu NaN yapar, <code>dropna<\/code> atar.", "tags": ["zaman"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>salilar<\/code> serisi bir hattın 9 haftalık Salı yolcusu (bin). 5. hafta (2025-04-01) için komşu 4'er haftadan medyan (<code>m<\/code>), MAD (<code>mad<\/code>) ve robust z (<code>z<\/code>) hesapla.", "starter": "print(salilar)\nhedef = pd.Timestamp(\"2025-04-01\")\nkomsular = [hedef + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\ndegerler = salilar.reindex(komsular).dropna()\n\nm = \nmad = \nz = \n", "sol": "hedef = pd.Timestamp(\"2025-04-01\")\nkomsular = [hedef + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\ndegerler = salilar.reindex(komsular).dropna()\nm = degerler.median()\nmad = (degerler - m).abs().median()\nz = 0.6745 * (salilar[hedef] - m) / mad", "test": "assert len(degerler) == 8, \"8 komşu olmalı\"\nassert m == 406.5, f\"Medyan 406.5 olmalı, şu an {m}\"\nassert abs(mad - 5.0) < 1e-9, f\"MAD 5.0 olmalı, şu an {mad}\"\nassert z < -3.5, f\"Bayram günü güçlü negatif z vermeli, şu an {z:.1f}\"", "hint": "<code>m = degerler.median()<\/code>, <code>mad = (degerler - m).abs().median()<\/code>, <code>z = 0.6745 * (salilar[hedef] - m) / mad<\/code>", "tags": ["zaman", "istatistik"], "setup": ["salilar"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "order", "q": "Tek bir günün robust z'sini hesaplayan satırları sıraya koy.", "lines": ["komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]", "degerler = seri.reindex(komsular).dropna()", "m = degerler.median()", "mad = (degerler - m).abs().median()", "z = 0.6745 * (seri[tarih] - m) / mad"], "why": "Her satır bir öncekinin sonucunu kullanır: tarihler → değerler → medyan → MAD → z.", "tags": ["zaman", "istatistik"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod <code>ValueError: The truth value of a Series is ambiguous<\/code> veriyor. Düzelt: iki koşul birlikte sağlanan günler anomali olsun.", "starter": "import pandas as pd\ntablo = pd.DataFrame({\"robust_z\": [-27.2, 0.8, -4.1, 5.0], \"sapma_yuzde\": [-49.6, 1.2, -3.0, 12.0]},\n                     index=pd.to_datetime([\"2025-04-01\", \"2025-04-08\", \"2025-04-15\", \"2025-04-22\"]))\ntablo[\"anomali\"] = tablo[\"robust_z\"].abs() > 3.5 and tablo[\"sapma_yuzde\"].abs() > 5\nprint(tablo)\n", "sol": "import pandas as pd\ntablo = pd.DataFrame({\"robust_z\": [-27.2, 0.8, -4.1, 5.0], \"sapma_yuzde\": [-49.6, 1.2, -3.0, 12.0]},\n                     index=pd.to_datetime([\"2025-04-01\", \"2025-04-08\", \"2025-04-15\", \"2025-04-22\"]))\ntablo[\"anomali\"] = (tablo[\"robust_z\"].abs() > 3.5) & (tablo[\"sapma_yuzde\"].abs() > 5)\nprint(tablo)\n", "test": "assert \"anomali\" in tablo.columns, \"anomali sütunu yok\"\nassert [bool(v) for v in tablo[\"anomali\"]] == [True, False, False, True], f\"Anomali [True, False, False, True] olmalı, şu an {list(tablo['anomali'])}\"", "hint": "Series'lerde <code>and<\/code> yerine <code>&amp;<\/code>; her koşul parantez içinde: <code>(a &gt; 3.5) &amp; (b &gt; 5)<\/code>. 15 Nisan'ın z'si büyük ama sapması %3; bu yüzden anomali sayılmaz.", "tags": ["maske", "zaman"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "mc", "q": "Robust z formülündeki <code>0.6745<\/code> ne işe yarar?", "opts": ["Anomali eşiğidir", "MAD'i standart sapmayla aynı ölçeğe getirir; z bildiğimiz z-skoru gibi okunur", "Sonucu yüzdeye çevirir", "Hafta sayısına göre düzeltme yapar"], "a": 1, "why": "Normal dağılımda MAD ≈ 0,6745 × standart sapma. Eşik ayrı bir şeydir: 3,5.", "tags": ["istatistik"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>b12_istasyon<\/code>, 6 istasyonun 9 Perşembe'lik girişleri (index: hat, istasyon, tarih). 1 Mayıs için <code>o_gun<\/code> (xs ile), 8 komşu Perşembe'nin istasyon bazında medyanı <code>referans<\/code> (isin + groupby(level=[0, 1])), yüzde değişim <code>degisim<\/code> ve %95'ten fazla düşen istasyonlar <code>kapananlar<\/code>'ı hesapla.", "starter": "import pandas as pd\nprint(b12_istasyon.head(10))\nhedef = pd.Timestamp(\"2025-05-01\")\nref_gunler = [hedef + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\n\no_gun = None\nreferans = None\ndegisim = None\nkapananlar = None\n", "sol": "import pandas as pd\nhedef = pd.Timestamp(\"2025-05-01\")\nref_gunler = [hedef + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\n\no_gun = b12_istasyon.xs(hedef, level=\"date\")\nmaske = b12_istasyon.index.get_level_values(\"date\").isin(ref_gunler)\nreferans = b12_istasyon[maske].groupby(level=[0, 1]).median()\ndegisim = (o_gun / referans - 1) * 100\nkapananlar = degisim[degisim < -95]\nprint(kapananlar.round(1))\n", "test": "assert o_gun is not None and len(o_gun) == 6 and o_gun.index.nlevels == 2, \"o_gun, (hat, istasyon) index'li 6 satır olmalı: xs(hedef, level=\\\"date\\\")\"\nassert referans is not None and len(referans) == 6, \"referans her istasyon için bir değer (6 satır) olmalı\"\nassert referans[(\"M2\", \"Taksim\")] == 3880.5, f\"Taksim'in referans medyanı 3880.5 olmalı, şu an {referans[('M2', 'Taksim')]}\"\nimport pandas as pd\n_k = kapananlar.index if isinstance(kapananlar, (pd.Series, pd.DataFrame)) else kapananlar\nassert set(_k) == {(\"M2\", \"Taksim\"), (\"T1\", \"Sultanahmet\")}, f\"Kapanan istasyonlar Taksim ve Sultanahmet olmalı, bulunan: {list(_k)}\"", "hint": "<code>o_gun = b12_istasyon.xs(hedef, level=\"date\")<\/code>; maske: <code>b12_istasyon.index.get_level_values(\"date\").isin(ref_gunler)<\/code>; <code>referans = b12_istasyon[maske].groupby(level=[0, 1]).median()<\/code>; <code>degisim = (o_gun / referans - 1) * 100<\/code>; <code>kapananlar = degisim[degisim &lt; -95]<\/code>.", "tags": ["multiindex", "groupby", "maske", "zaman"], "setup": ["b12_istasyon"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır? (<code>salilar<\/code> 4 Mart'ta başlıyor, haftalık.)", "opts": ["1 2", "0 3", "3 0", "2 1"], "a": 0, "why": "Tarihler 25 Şubat, 4 Mart, 11 Mart. İlki veride yok → 1 NaN; kalan 2 değer.", "tags": ["zaman"], "code": "s = salilar.reindex(pd.date_range(\"2025-02-25\", periods=3, freq=\"7D\"))\nprint(s.isna().sum(), len(s.dropna()))", "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>salilar<\/code>'daki her tarih için, 4'er haftalık pencerede veride <b>gerçekten bulunan<\/b> komşu sayısını hesapla ve <code>n_ref<\/code> listesine sırayla ekle. Kenardaki haftaların daha az komşusu olmalı.", "starter": "import pandas as pd\nn_ref = []\nfor tarih in salilar.index:\n    # komşu tarihleri kur, veride olanları say, n_ref'e ekle\n    pass\nprint(n_ref)\n", "sol": "import pandas as pd\nn_ref = []\nfor tarih in salilar.index:\n    komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-4, 5) if k != 0]\n    n_ref.append(len(salilar.reindex(komsular).dropna()))\nprint(n_ref)\n", "test": "assert list(n_ref) == [4, 5, 6, 7, 8, 7, 6, 5, 4], f\"Beklenen [4, 5, 6, 7, 8, 7, 6, 5, 4], senin sonucun {list(n_ref)}\"", "hint": "Döngü içinde: <code>komsular = [...]<\/code>, sonra <code>n_ref.append(len(salilar.reindex(komsular).dropna()))<\/code>.", "tags": ["zaman", "dongu"], "setup": ["salilar"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Olağan dışı günler.<\/b> <code>b12_gunluk<\/code>, bir raylı sistem ağının 10 haftalık günlük toplam yolcusu (milyon; 3 Mart – 11 Mayıs 2025).<ol><li><code>referans_hesapla(seri, hafta=4)<\/code> fonksiyonunu yaz: her tarih için önceki ve sonraki <code>hafta<\/code> haftanın aynı gününden, veride bulunanlarla medyan ve MAD hesaplasın; ikisini seriyle aynı index'e sahip iki Series olarak döndürsün (<code>return medyan, mad<\/code>).<\/li><li><code>gunluk<\/code> DataFrame'ine <code>referans<\/code>, <code>mad<\/code>, <code>robust_z<\/code>, <code>sapma_yuzde<\/code> ve <code>anomali<\/code> sütunlarını ekle. Kural: |robust z| &gt; 3,5 <b>ve<\/b> |sapma| &gt; %5.<\/li><li>Anomali günlerini gün adlarıyla yazdır.<\/li><\/ol>Fonksiyon <code>salilar<\/code> ile de denenecek.", "starter": "import pandas as pd\n\ndef referans_hesapla(seri, hafta=4):\n    medyanlar, madlar = [], []\n    for tarih in seri.index:\n        # komşu tarihler → var olan değerler → medyan ve MAD\n        pass\n    return pd.Series(medyanlar, seri.index, dtype=float), pd.Series(madlar, seri.index, dtype=float)\n\ngunluk = b12_gunluk.rename(\"yolcu\").to_frame()\n# gunluk[\"referans\"], gunluk[\"mad\"] = ...\n", "sol": "import pandas as pd\n\ndef referans_hesapla(seri, hafta=4):\n    medyanlar, madlar = [], []\n    for tarih in seri.index:\n        komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]\n        degerler = seri.reindex(komsular).dropna()\n        m = degerler.median()\n        medyanlar.append(m)\n        madlar.append((degerler - m).abs().median())\n    return pd.Series(medyanlar, seri.index, dtype=float), pd.Series(madlar, seri.index, dtype=float)\n\ngunluk = b12_gunluk.rename(\"yolcu\").to_frame()\ngunluk[\"referans\"], gunluk[\"mad\"] = referans_hesapla(gunluk[\"yolcu\"])\ngunluk[\"robust_z\"] = 0.6745 * (gunluk[\"yolcu\"] - gunluk[\"referans\"]) / gunluk[\"mad\"]\ngunluk[\"sapma_yuzde\"] = (gunluk[\"yolcu\"] / gunluk[\"referans\"] - 1) * 100\ngunluk[\"anomali\"] = (gunluk[\"robust_z\"].abs() > 3.5) & (gunluk[\"sapma_yuzde\"].abs() > 5)\n\nanomaliler = gunluk[gunluk[\"anomali\"]]\nfor tarih, satir in anomaliler.iterrows():\n    print(tarih.date(), tarih.day_name(), f\"sapma %{satir['sapma_yuzde']:.1f}, z = {satir['robust_z']:.1f}\")\n", "test": "import pandas as pd\n_s = referans_hesapla(salilar)\n_m, _d = _s[0], _s[1]\nassert isinstance(_m, pd.Series) and _m.index.equals(salilar.index), \"Fonksiyon, seriyle aynı index'e sahip Series döndürmeli\"\n_t = pd.Timestamp(\"2025-04-01\")\nassert _m[_t] == 406.5 and abs(_d[_t] - 5.0) < 1e-9, f\"salilar için 1 Nisan: medyan 406.5 ve MAD 5.0 olmalı; senin sonucun {_m[_t]}, {_d[_t]}\"\nassert _m[pd.Timestamp(\"2025-03-04\")] == 400.0, \"İlk Salı'nın yalnızca 4 komşusu var; referansı 400.0 olmalı\"\n_m1 = referans_hesapla(salilar, hafta=1)[0]\nassert _m1[_t] == 403.0, f\"hafta=1 iken 1 Nisan'ın referansı 403.0 olmalı (25 Mart ve 8 Nisan), şu an {_m1[_t]}; hafta parametresini kullan\"\nfor _k in [\"referans\", \"mad\", \"robust_z\", \"sapma_yuzde\", \"anomali\"]:\n    assert _k in gunluk.columns, f\"gunluk tablosunda {_k!r} sütunu yok\"\n_a = list(gunluk.index[gunluk[\"anomali\"].astype(bool)])\nassert _a == [pd.Timestamp(\"2025-03-31\"), pd.Timestamp(\"2025-04-23\")], f\"Anomali günleri 31 Mart ve 23 Nisan olmalı, bulunan: {[str(t.date()) for t in _a]}\"\nassert \"2025-03-31\" in __cikti__ or \"Monday\" in __cikti__, \"Anomali günlerini yazdır\"", "hint": "Döngü içi: <code>komsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]<\/code>, <code>degerler = seri.reindex(komsular).dropna()<\/code>, <code>m = degerler.median()<\/code>, sonra iki listeye ekle. Tabloda: <code>gunluk[\"referans\"], gunluk[\"mad\"] = referans_hesapla(gunluk[\"yolcu\"])<\/code>.", "tags": ["zaman", "istatistik", "fonksiyon", "maske"], "setup": ["b12_gunluk", "salilar"], "rev": false, "why": "Bu, projendeki anomali analizinin çekirdeği. Aynı fonksiyon 365 günlük gerçek veride Ramazan ve Kurban Bayramı'nı, 23 Nisan depremini ve 1 Mayıs kapatmalarını yakaladı.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "Medyan neden ortalamadan daha uygun referans?", "opts": ["Daha hızlı hesaplanır", "Tek bir uç değerden (bayram) etkilenmez", "Her zaman daha büyüktür", "pandas ortalama hesaplayamaz"], "a": 1, "why": "Dayanıklı (robust) istatistik: uç değer sıralamada kenarda kalır, ortayı değiştirmez.", "tags": ["istatistik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>pd.Timestamp(\"2025-01-31\") + pd.Timedelta(months=1)<\/code> ne olur?", "opts": ["2025-02-28", "2025-03-03", "ValueError verir", "2025-02-31"], "a": 2, "why": "Timedelta ay kabul etmez; takvim ayı için <code>pd.DateOffset(months=1)<\/code>.", "tags": ["zaman"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Üç katmanlı (hat, istasyon, tarih) index'ten tek bir tarihin satırlarını almanın doğru yolu?", "opts": ["seri.loc[tarih]", "seri.xs(tarih, level=\"date\")", "seri[tarih]", "seri.iloc[tarih]"], "a": 1, "why": "<code>.loc<\/code> tek değeri ilk katmanda arar; iç katman için <code>xs<\/code>.", "tags": ["multiindex"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "İki Series koşulunu \"ve\" ile bağlamanın doğru yolu?", "opts": ["(a > 1) and (b > 2)", "(a > 1) & (b > 2)", "a > 1 & b > 2", "(a > 1) + (b > 2)"], "a": 1, "why": "Series'te <code>and<\/code> ValueError verir; <code>&amp;<\/code> ve parantez gerekir.", "tags": ["maske"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b13", "no": 13, "tur": "ders", "baslik": "İstatistik: ilişki var mı?", "hat": "T5", "ozet": "Pearson ve Spearman korelasyonu, p-değerinin gerçek anlamı, permütasyon testi, bootstrap güven aralığı, duyarlılık analizi ve ekolojik yanılgı.", "dosya": "analiz.ipynb", "proje": "rho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\n\nrng = np.random.default_rng(42)\nx_sira, y_sira = iliski[\"pay_60\"].rank().values, iliski[\"hafta_sonu\"].rank().values\nperm = np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(10_000)])\np_perm = (np.abs(perm) >= abs(rho)).mean()\n\nboot = []\nfor _ in range(5_000):\n    i = rng.integers(0, len(iliski), len(iliski))\n    boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])\n\ntoplam_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nbuyuk = iliski[toplam_yolcu.reindex(iliski.index) > 1_000_000]\nrho_b, p_b = stats.spearmanr(buyuk[\"pay_60\"], buyuk[\"hafta_sonu\"])", "adimlar": [{"baslik": "Korelasyon: Pearson ve Spearman", "html": "\n<p><b>Korelasyon katsayısı<\/b>, iki değişkenin birlikte hareket edip etmediğini −1 ile +1 arasında tek bir sayıyla özetler. +1'e yakınsa biri artarken öbürü de artar,\n−1'e yakınsa biri artarken öbürü azalır, 0 civarındaysa belirgin bir birlikte hareket yoktur.<\/p>\n<p>Önce gözle bak: her hat bir nokta olacak şekilde <code>ax.scatter(x, y)<\/code> çiz. Katsayı bu resmi özetler, resmin yerini tutmaz.<\/p>\n<ul>\n<li><b>Pearson<\/b> (<code>seri1.corr(seri2)<\/code>): ham değerlerle çalışır ve <b>doğrusal<\/b> ilişkiyi ölçer. Tek bir uç nokta sonucu çok değiştirebilir.<\/li>\n<li><b>Spearman<\/b> (<code>stats.spearmanr(x, y)<\/code>): önce değerleri <b>sıraya<\/b> çevirir (en küçüğü 1, sonraki 2 …), sonra sıralar arasında Pearson hesaplar.\n\"Biri artınca öbürü de artıyor mu?\" diye bakar; artışın düz bir çizgi olmasını istemez. Buna <b>monoton<\/b> ilişki denir.<\/li>\n<\/ul>\n<pre class=\"py\">iliski[\"pay_60\"].rank()      # sıralar: en küçük 60+ payı → 1.0\nfrom scipy import stats\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> Projende Spearman seçmen yerinde: hat sayısı az, Nostaljik Tramvay'ın 60+ payı (%46) diğerlerinden çok uzakta ve\nilişkinin doğrusal olacağına dair bir beklenti yok. Sıralar, uç değeri \"en büyük\" diye işaretler ama ne kadar büyük olduğuna bakmaz.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Katsayı 0'a yakın diye \"ilişki yok\" demek. Korelasyon yalnızca doğrusal (Pearson) ya da monoton (Spearman) ilişkiyi yakalar.\nU biçimli bir ilişkide (önce azalan, sonra artan) katsayı 0 çıkabilir. Bu yüzden önce grafiğe bak.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\nfrom scipy import stats\n\nprint(iliski)\nprint(\"60+ payının sırası:\", iliski[\"pay_60\"].rank().tolist())\n\npearson = iliski[\"pay_60\"].corr(iliski[\"hafta_sonu\"])\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nprint(f\"Pearson r = {pearson:.2f}   Spearman rho = {rho:.2f}\")\n\nfig, ax = plt.subplots(figsize=(5, 3.5))\nax.scatter(iliski[\"pay_60\"], iliski[\"hafta_sonu\"], color=\"#3b6ea5\")\nfor hat, satir in iliski.iterrows():\n    ax.annotate(hat[:10], (satir[\"pay_60\"], satir[\"hafta_sonu\"]), xytext=(4, 3), textcoords=\"offset points\", fontsize=7)\nax.set_xlabel(\"60+ payı (%)\")\nax.set_ylabel(\"Hafta sonu / hafta içi (%)\")\nplt.show()", "ornek_setup": ["iliski"]}, {"baslik": "p-değeri: ne söyler, ne söylemez?", "html": "\n<p><code>stats.spearmanr<\/code> iki sayı döndürür: katsayı (ρ, \"ro\") ve <b>p-değeri<\/b>. p'yi anlamak için bir \"sıkıcı dünya\" düşün:\n60+ payı ile hafta sonu kullanımı arasında <b>hiçbir ilişki yok<\/b> (buna sıfır hipotezi denir). p, o dünyada yalnızca şans eseri,\nen az bizim bulduğumuz kadar güçlü bir ρ görme olasılığıdır.<\/p>\n<pre class=\"py\">rho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nprint(f\"rho = {rho:.2f}, p = {p:.4f}\")     # rho = 0.95, p = 0.0003<\/pre>\n<p>p = 0,0003 şu demek: ilişki gerçekten olmasaydı, 8 hatlık bir örneklemde bu kadar güçlü bir sıra uyumu 10.000 denemede yaklaşık 3 kez çıkardı.\nBu çok nadir; \"şans eseri\" açıklamasını zayıf buluruz.<\/p>\n<p>p-değeri ne <b>değildir<\/b>:<\/p>\n<ul>\n<li>\"Sıfır hipotezinin doğru olma olasılığı\" değildir. p = 0,0003, \"ilişkinin olmama ihtimali %0,03\" demek değildir.<\/li>\n<li>Etkinin <b>büyüklüğü<\/b> değildir. Çok büyük bir örneklemde minicik bir ρ bile çok küçük p verir. Büyüklük için ρ'ya ve güven aralığına bakılır.<\/li>\n<li>Nedensellik kanıtı değildir. Küçük p, ilişkinin şansla açıklanmasının zor olduğunu söyler; <b>neden<\/b> olduğunu söylemez.<\/li>\n<\/ul>\n<div class=\"neden\"><b>Neden böyle?<\/b> Projende ρ, p, permütasyon p'si ve güven aralığını birlikte raporluyorsun. ρ \"ne kadar güçlü\", p \"şans olabilir mi\",\ngüven aralığı \"ne kadar emin olabiliriz\" sorusunu cevaplıyor. Tek bir sayı hepsini söyleyemez.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>sonuc = stats.spearmanr(x, y)<\/code> yazıp <code>sonuc<\/code>'u sayı sanmak. Dönen şey iki değerli bir nesnedir:\nya <code>rho, p = stats.spearmanr(x, y)<\/code> diye aç ya da katsayıyı <code>stats.spearmanr(x, y)[0]<\/code> ile al.<\/div>\n", "ornek": "import numpy as np\nfrom scipy import stats\n\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nprint(f\"Gerçek veri:    rho = {rho:.2f}, p = {p:.4f}\")\n\n# Hafta sonu sütununu karıştırıp ilişkiyi bilerek bozalım\nrng = np.random.default_rng(1)\nkarisik = rng.permutation(iliski[\"hafta_sonu\"].values)\nrho_k, p_k = stats.spearmanr(iliski[\"pay_60\"], karisik)\nprint(f\"Karıştırılmış:  rho = {rho_k:.2f}, p = {p_k:.4f}\")", "ornek_setup": ["iliski"]}, {"baslik": "Permütasyon testi: şansı kendin üret", "html": "\n<p>Spearman'ın p-değeri bir formülden gelir; formülün varsayımları küçük örneklemlerde tam tutmayabilir. <b>Permütasyon testi<\/b> aynı soruyu formülsüz,\nsimülasyonla sorar: \"İlişki olmasaydı ρ nasıl dağılırdı?\"<\/p>\n<p>Fikir basit: hafta sonu sütununu rastgele karıştırırsan hangi hatta hangi değerin geldiği tesadüfe kalır; ilişki bilerek bozulur. Binlerce kez karıştırıp\nher seferinde ρ'yu hesaplarsan \"sıkıcı dünya\"nın ρ dağılımı çıkar. Gerçek ρ kadar uç olanların oranı, simülasyonla bulunmuş p-değeridir.<\/p>\n<pre class=\"py\">rng = np.random.default_rng(42)\nx_sira = iliski[\"pay_60\"].rank().values\ny_sira = iliski[\"hafta_sonu\"].rank().values\nperm = np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(10_000)])\np_perm = (np.abs(perm) &gt;= abs(rho)).mean()<\/pre>\n<ul>\n<li><code>default_rng(42)<\/code>: rastgele sayı üreteci. 42 bir <b>tohum<\/b>dur; aynı tohum her çalıştırmada aynı \"rastgele\" sırayı verir, sonuç tekrarlanabilir olur.<\/li>\n<li><code>rng.permutation(dizi)<\/code>: dizinin karıştırılmış bir kopyası.<\/li>\n<li><code>np.corrcoef(a, b)<\/code> 2×2'lik bir korelasyon <b>matrisi<\/b> döndürür; <code>[0, 1]<\/code> a ile b'nin korelasyonudur. Sıralar üzerinde Pearson, Spearman'a eşittir.<\/li>\n<li><code>(koşul).mean()<\/code>: True 1, False 0 sayıldığı için ortalama, koşulu sağlayanların oranıdır.<\/li>\n<\/ul>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>np.abs<\/code> ile mutlak değere bakmak testi <b>iki yönlü<\/b> yapar: \"bu kadar güçlü pozitif <i>ya da<\/i> negatif bir ilişki\nşans eseri ne sıklıkla çıkar?\" Önceden bir yön iddia etmediğin sürece doğru olan budur.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>[0, 1]<\/code>'i unutmak: <code>np.corrcoef(...)<\/code> tek sayı değil matris döndürür. Liste matrislerden oluşur,\n<code>p_perm<\/code> anlamsız bir sayı çıkar ve hata mesajı bile almazsın.<\/div>\n", "ornek": "import numpy as np\nimport matplotlib.pyplot as plt\nfrom scipy import stats\n\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nrng = np.random.default_rng(42)\nx_sira = iliski[\"pay_60\"].rank().values\ny_sira = iliski[\"hafta_sonu\"].rank().values\nprint(np.corrcoef(x_sira, y_sira).round(2))          # 2x2 matris\n\nperm = np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(2000)])\np_perm = (np.abs(perm) >= abs(rho)).mean()\nprint(f\"rho = {rho:.2f}, permütasyon p = {p_perm:.4f}\")\n\nfig, ax = plt.subplots(figsize=(6, 3))\nax.hist(perm, bins=30, color=\"#c8c8c8\")\nax.axvline(rho, color=\"#c2185b\", linewidth=2)\nax.set_xlabel(\"Karıştırılmış verilerde rho (kırmızı: gerçek rho)\")\nplt.show()", "ornek_setup": ["iliski"]}, {"baslik": "Bootstrap: güven aralığı", "html": "\n<p>ρ = 0,95 çıktı; ama yalnızca 8 hat var. Başka 8 hatla çalışsaydık ne çıkardı? Elimizde başka hat yok; <b>bootstrap<\/b> bu durumu taklit eder:\neldeki örneklemden, <b>iadeli<\/b> olarak, aynı büyüklükte yeni örneklemler çeker.<\/p>\n<pre class=\"py\">boot = []\nfor _ in range(5_000):\n    i = rng.integers(0, len(iliski), len(iliski))   # 0–7 arası 8 konum, tekrar olabilir\n    boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])<\/pre>\n<p>\"İadeli\", bir hattı seçtikten sonra torbaya geri koymak demek: aynı hat bir örneklemde iki kez gelebilir, bir başkası hiç gelmeyebilir.\nHer yeni örneklem biraz farklı olduğundan ρ da biraz farklı çıkar. Bu ρ'ların ortadaki %95'i, yani %2,5 ve %97,5 yüzdelikleri arası,\n<b>%95 bootstrap güven aralığı<\/b>dır.<\/p>\n<p>Bizim veride aralık kabaca [0,62, 1,00]: ilişkinin yönü çok net (aralığın tamamı pozitif), gücü ise orta ile çok güçlü arasında bir yerde. Az veriyle geniş aralık doğaldır.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>np.nanpercentile<\/code> NaN değerleri atlar. Bir bootstrap örnekleminde aynı hat 8 kez gelirse bütün değerler aynı olur,\nkorelasyon tanımsızdır ve <code>spearmanr<\/code> NaN döndürür. Düz <code>np.percentile<\/code> tek bir NaN yüzünden NaN verirdi.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> İadesiz çekmek: <code>rng.choice(8, 8, replace=False)<\/code> yalnızca sırayı karıştırır, her seferinde aynı 8 hat gelir.\nρ hiç değişmez ve aralık tek bir noktaya çöker. Bootstrap'in bütün fikri iadeli çekmektir.<\/div>\n", "ornek": "import numpy as np\nfrom scipy import stats\n\nrng = np.random.default_rng(42)\ni = rng.integers(0, len(iliski), len(iliski))\nprint(\"Örnek bir bootstrap çekilişi:\", list(iliski.index[i]))\n\nboot = []\nfor _ in range(2000):\n    i = rng.integers(0, len(iliski), len(iliski))\n    boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])\nprint(f\"%95 bootstrap güven aralığı: [{alt:.2f}, {ust:.2f}]\")", "ornek_setup": ["iliski"]}, {"baslik": "Duyarlılık analizi ve ekolojik yanılgı", "html": "\n<p>Son soru: sonuç bir iki hatta mı bağlı? 8 noktalık bir grafikte tek bir uç nokta bütün hikâyeyi taşıyabilir. <b>Duyarlılık analizi<\/b>, analizi makul biçimde\ndeğiştirip sonucun ayakta kalıp kalmadığına bakar. Projende yalnızca büyük hatlarla tekrar hesaplamışsın:<\/p>\n<pre class=\"py\">buyuk = iliski[toplam_yolcu.reindex(iliski.index) &gt; 1_000_000]\nrho_b, p_b = stats.spearmanr(buyuk[\"pay_60\"], buyuk[\"hafta_sonu\"])<\/pre>\n<p>Bir başka yol, her hattı <b>sırayla<\/b> dışarıda bırakmaktır: <code>iliski.drop(hat)<\/code>. 8 ayrı ρ çıkar; hepsi birbirine yakınsa sonuç tek bir hatta dayanmıyor demektir.\nBizim veride hepsi 0,93 ile 0,96 arasında.<\/p>\n<h3>Ekolojik yanılgı<\/h3>\n<p>Verin <b>hat düzeyinde<\/b>: her satır bir hattın ortalamaları. Buradan \"60+ payı yüksek <b>hatların<\/b> hafta sonu kullanımı da görece yüksek\" diyebilirsin.\n\"<b>Yaşlılar<\/b> hafta sonu daha çok yolculuk yapar\" diyemezsin. Grup düzeyindeki bir ilişki bireyler için geçerli olmak zorunda değildir.\nBelki bu hatlar turistik bölgelerden geçiyor ve hafta sonu kalabalığını gençler oluşturuyor; hat düzeyindeki veri bunu ayırt edemez.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Grafiğin notuna \"hat düzeyinde bir ilişkidir; bireylerin davranışı hakkında sonuç çıkarılamaz\" yazman bu yüzden önemli.\nOkuyucu, grafiğe bakınca en doğal görünen ama yanlış olan yorumu yapmaya hazırdır.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> En güzel sonucu veren alt kümeyi seçip yalnızca onu raporlamak. Hangi kontrolleri yapacağına sonucu görmeden karar ver\nve hepsini raporla; beklediğin gibi çıkmayanlar dahil.<\/div>\n", "ornek": "from scipy import stats\n\nrho, _ = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nprint(f\"Tüm hatlar: rho = {rho:.3f}\")\nfor hat in iliski.index:\n    kalan = iliski.drop(hat)\n    r, _ = stats.spearmanr(kalan[\"pay_60\"], kalan[\"hafta_sonu\"])\n    print(f\"  {hat:<24} çıkarılınca rho = {r:.3f}\")\n\nbuyuk = iliski.loc[[\"M2\", \"M4\", \"M5\", \"Marmaray\", \"T1\"]]\nr_b, p_b = stats.spearmanr(buyuk[\"pay_60\"], buyuk[\"hafta_sonu\"])\nprint(f\"Yalnız 5 büyük hat: rho = {r_b:.2f}, p = {p_b:.3f}\")", "ornek_setup": ["iliski"]}], "sorular": [{"t": "mc", "q": "Spearman korelasyonu neyi kullanır?", "opts": ["Ham değerleri", "Sıraları (rank)", "Ortalamaları", "Logaritmaları"], "a": 1, "why": "Değerler önce sıraya çevrilir, sonra sıralar arasında Pearson hesaplanır.", "tags": ["korelasyon"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[1.0, 3.0, 2.0]", "[1.0, 2.0, 3.0]", "[10, 30, 20]", "[3.0, 1.0, 2.0]"], "a": 0, "why": "10 en küçük → 1, 30 en büyük → 3, 20 ortada → 2. Sıra, değerin yerinde yazılır.", "tags": ["korelasyon"], "code": "print(pd.Series([10, 30, 20]).rank().tolist())", "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bir analizde p = 0,01 çıktı. Hangisi doğru yorum?", "opts": ["İlişkinin olmama olasılığı %1", "İlişki olmasaydı, en az bu kadar güçlü bir sonucu şans eseri görme olasılığı %1", "İlişki %99 güçlü", "Sonucun %1'i hatalı"], "a": 1, "why": "p, sıfır hipotezi doğruysa bu kadar uç bir sonucun çıkma olasılığıdır; hipotezin kendisinin olasılığı değildir.", "tags": ["istatistik"], "code": null, "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "100.000 kişilik bir veride ρ = 0,03 ve p = 0,000001 bulundu. En doğru yorum?", "opts": ["Çok güçlü bir ilişki var", "İlişki şansla açıklanamayacak kadar tutarlı ama çok zayıf", "Hesap hatalı olmalı", "İlişki nedenseldir"], "a": 1, "why": "Büyük örneklemde küçük etkiler bile küçük p verir. Gücü ρ söyler: 0,03 neredeyse sıfır.", "tags": ["istatistik", "korelasyon"], "code": null, "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "<code>np.corrcoef(a, b)<\/code> ne döndürür?", "opts": ["Tek bir sayı", "2×2'lik bir matris; a ile b'nin korelasyonu [0, 1] konumunda", "a ve b'nin sıraları", "p-değeri"], "a": 1, "why": "Köşegende her değişkenin kendisiyle korelasyonu (1) var; köşegen dışı ikisi aynı sayı.", "tags": ["korelasyon"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "fill", "q": "Hafta sonu sıralarını karıştırıp korelasyonu hesapla.", "code": "perm = [np.corrcoef(x_sira, rng.___(y_sira))[0, 1] for _ in range(2000)]", "a": [["permutation"]], "why": "<code>rng.permutation<\/code> dizinin karıştırılmış bir kopyasını döndürür; orijinal dizi değişmez.", "tags": ["yeniden_ornekleme", "comprehension"], "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Bootstrap'te örnekleme nasıl yapılır?", "opts": ["İadesiz, yarısı alınır", "İadeli, aynı büyüklükte", "Sadece uç değerler", "Sıralı"], "a": 1, "why": "Bir hat birden çok kez seçilebilir; örneklem boyu aynı kalır.", "tags": ["yeniden_ornekleme"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "fill", "q": "Bootstrap değerlerinden %95 güven aralığını al.", "code": "alt, ust = np.nanpercentile(boot, [___, ___])", "a": [["2.5"], ["97.5"]], "why": "Ortadaki %95: alttan %2,5 ve üstten %2,5 kesilir.", "tags": ["yeniden_ornekleme"], "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "ρ = 0,62 ve veri hat düzeyinde. Hangi cümle <b>doğru<\/b>?", "opts": ["Yaşlılar hafta sonu daha çok metroya biner", "60+ payı yüksek hatların hafta sonu kullanımı da görece yüksek", "60+ yolcu hafta sonu oranını artırır", "İlişki kesinlikle nedenseldir"], "a": 1, "why": "Hat düzeyinde ilişki; bireylere veya nedenselliğe genellenemez (ekolojik yanılgı).", "tags": ["istatistik"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Her hattı sırayla çıkarınca ρ hep 0,93–0,96 arasında kaldı. Bu ne gösterir?", "opts": ["İlişki nedenseldir", "Sonuç tek bir hatta bağlı değil", "p-değeri yanlış hesaplanmış", "Hat sayısı yeterince büyük"], "a": 1, "why": "Hangi hat çıkarılırsa çıkarılsın sonuç benzer: tek bir uç nokta sonucu taşımıyor. Az veri sorunu ise ayrıca geçerli.", "tags": ["istatistik", "korelasyon"], "code": null, "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "ρ = −0,8 ne anlatır?", "opts": ["İki değişken arasında ilişki yok", "Biri artarken öbürü güçlü biçimde azalma eğiliminde", "Biri öbürünün %80'i", "Hesap hatalı; ρ negatif olamaz"], "a": 1, "why": "İşaret yönü, büyüklük gücü gösterir: −0,8 güçlü, ters yönlü bir ilişki.", "tags": ["korelasyon"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[1.5, 1.5, 3.0]", "[1.0, 2.0, 3.0]", "[1.0, 1.0, 3.0]", "[2.0, 2.0, 3.0]"], "a": 0, "why": "Eşit değerler sıraların ortalamasını paylaşır: 1. ve 2. sıra → ikisi de 1.5.", "tags": ["korelasyon"], "code": "print(pd.Series([5, 5, 9]).rank().tolist())", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>iliski<\/code> tablosunda (8 hat) 60+ payı ile hafta sonu oranı arasındaki Spearman korelasyonunu hesapla: <code>rho, p<\/code>.", "starter": "from scipy import stats\nprint(iliski)\nrho, p = \n", "sol": "from scipy import stats\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])", "test": "assert 0.9 < rho <= 1, f\"rho yaklaşık 0.95 olmalı, şu an {rho:.2f}\"\nassert p < 0.01, \"p değeri 0.01'den küçük olmalı\"", "hint": "<code>stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])<\/code> iki değer döndürür.", "tags": ["korelasyon"], "setup": ["iliski"], "rev": false, "why": "", "zorluk": 1, "hata": false, "yer": "al"}, {"t": "mc", "q": "<code>np.random.default_rng(42)<\/code>'deki 42 ne işe yarar?", "opts": ["Tekrar sayısı", "Aynı rastgele sayıların her çalıştırmada üretilmesi (tekrarlanabilirlik)", "Güven düzeyi", "Hat sayısı"], "a": 1, "why": "Tohum (seed) sabitlenince sonuçlar değişmez; başkası kodunu çalıştırınca aynı sayıları görür.", "tags": ["yeniden_ornekleme"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Permütasyon p-değeri: gözlenen kadar ya da daha uç (iki yönlü) ρ'ların oranı.", "code": "p_perm = (np.___(perm) >= abs(rho)).___()", "a": [["abs"], ["mean"]], "why": "Mutlak değer iki yönü birden sayar; True/False dizisinin ortalaması orandır.", "tags": ["yeniden_ornekleme"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Permütasyon testini yaz: <code>hafta_sonu<\/code> sıralarını 2000 kez karıştır, her seferinde sıra korelasyonunu hesapla; gözlenenden büyük/eşit olanların oranını <code>p_perm<\/code>'e ata.", "starter": "import numpy as np\nfrom scipy import stats\nrho = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])[0]\nrng = np.random.default_rng(42)\nx_sira = iliski[\"pay_60\"].rank().values\ny_sira = iliski[\"hafta_sonu\"].rank().values\n\nperm = \np_perm = \n", "sol": "import numpy as np\nfrom scipy import stats\nrho = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])[0]\nrng = np.random.default_rng(42)\nx_sira = iliski[\"pay_60\"].rank().values\ny_sira = iliski[\"hafta_sonu\"].rank().values\nperm = np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(2000)])\np_perm = (np.abs(perm) >= abs(rho)).mean()", "test": "assert len(perm) == 2000, f\"2000 permütasyon olmalı, şu an {len(perm)}\"\nassert p_perm < 0.01, f\"p_perm çok küçük olmalı, şu an {p_perm}\"", "hint": "<code>np.array([np.corrcoef(x_sira, rng.permutation(y_sira))[0, 1] for _ in range(2000)])<\/code>, sonra <code>(np.abs(perm) &gt;= abs(rho)).mean()<\/code>", "tags": ["yeniden_ornekleme", "comprehension"], "setup": ["iliski"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "order", "q": "Tek bir bootstrap örnekleminin ρ'sunu hesaplayan satırları sıraya koy.", "lines": ["rng = np.random.default_rng(42)", "i = rng.integers(0, len(iliski), len(iliski))", "ornek = iliski.iloc[i]", "rho_b, _ = stats.spearmanr(ornek[\"pay_60\"], ornek[\"hafta_sonu\"])", "print(round(rho_b, 2))"], "why": "Üreteç → rastgele konumlar → o satırlar → korelasyon → çıktı. Her satır bir öncekinin sonucunu kullanır.", "tags": ["yeniden_ornekleme"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu bootstrap kodu çalışıyor ama güven aralığı tek bir noktaya çöküyor: <code>[0.95, 0.95]<\/code>. Düzelt.", "starter": "import numpy as np\nfrom scipy import stats\nrng = np.random.default_rng(42)\nboot = []\nfor _ in range(1000):\n    i = rng.choice(len(iliski), len(iliski), replace=False)\n    boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])\nprint(f\"[{alt:.2f}, {ust:.2f}]\")\n", "sol": "import numpy as np\nfrom scipy import stats\nrng = np.random.default_rng(42)\nboot = []\nfor _ in range(1000):\n    i = rng.choice(len(iliski), len(iliski), replace=True)\n    boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])\nprint(f\"[{alt:.2f}, {ust:.2f}]\")\n", "test": "assert len(boot) == 1000, f\"1000 bootstrap değeri olmalı, şu an {len(boot)}\"\nassert ust - alt > 0.1, f\"Aralık çok dar: [{alt:.2f}, {ust:.2f}]. Hatlar iadeli çekilmeli.\"\nassert alt < 0.9, f\"Alt sınır 0.9'un altında olmalı, şu an {alt:.2f}\"", "hint": "İadesiz 8'den 8 çekmek yalnızca sırayı karıştırır; aynı 8 hat hep gelir. <code>replace=True<\/code> (ya da <code>rng.integers(0, 8, 8)<\/code>) kullan.", "tags": ["yeniden_ornekleme"], "setup": ["iliski"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "mc", "q": "x = 1…8 ve y = [2, 1, 4, 3, 6, 5, 8, 40]. Pearson 0,70, Spearman 0,93 çıkıyor. Fark neden?", "opts": ["Spearman her zaman büyük çıkar", "Son y değeri (40) çok uçta; Pearson ham değerle etkilenir, Spearman için o yalnızca \"en büyük\"", "Pearson sıralarla çalışır", "Veri sayısı az olduğu için ikisi de rastgele"], "a": 1, "why": "Sıralar uç değerin ne kadar büyük olduğunu unutturur; bu yüzden Spearman uç değerlere dayanıklıdır.", "tags": ["korelasyon"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "8 hatlık bir analizde ρ = 0,55, p = 0,03, %95 bootstrap aralığı [0,05, 0,95]. En dengeli yorum hangisi?", "opts": ["Güçlü ve kesin bir ilişki var", "İlişki muhtemelen pozitif ama gücü hakkında belirsizlik çok büyük", "p < 0,05 olduğu için ilişki nedenseldir", "Aralık 0'ı içermediği için ρ tam 0,55'tir"], "a": 1, "why": "p şansın zayıf bir açıklama olduğunu, aralığın tamamen pozitif olması yönü söyler; ama 0,05'ten 0,95'e uzanan aralık gücü neredeyse belirsiz bırakıyor.", "tags": ["istatistik", "yeniden_ornekleme"], "code": null, "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Duyarlılık analizi: her hattı <b>sırayla<\/b> çıkarıp kalan 7 hatla Spearman ρ'yu hesapla ve <code>loo<\/code> sözlüğüne <code>{hat: rho}<\/code> olarak yaz. Sonra en düşük ve en yüksek değeri yazdır.", "starter": "from scipy import stats\nloo = {}\nfor hat in iliski.index:\n    # hattı çıkar, kalanlarla rho hesapla, loo[hat]'a yaz\n    pass\nprint(loo)\n", "sol": "from scipy import stats\nloo = {}\nfor hat in iliski.index:\n    kalan = iliski.drop(hat)\n    loo[hat] = stats.spearmanr(kalan[\"pay_60\"], kalan[\"hafta_sonu\"])[0]\nprint(round(min(loo.values()), 3), round(max(loo.values()), 3))\n", "test": "import pandas as pd\n_l = pd.Series(loo, dtype=float)\nassert len(_l) == 8, f\"8 hat için 8 değer olmalı, şu an {len(_l)}\"\nassert abs(_l.min() - 0.929) < 0.001 and abs(_l.max() - 0.964) < 0.001, f\"En düşük 0.929, en yüksek 0.964 olmalı; şu an {_l.min():.3f}, {_l.max():.3f}\"\nassert abs(_l[\"M2\"] - 0.964) < 0.001, \"M2 çıkarılınca rho yaklaşık 0.964 olmalı\"", "hint": "Döngüde: <code>kalan = iliski.drop(hat)<\/code>, <code>loo[hat] = stats.spearmanr(kalan[\"pay_60\"], kalan[\"hafta_sonu\"])[0]<\/code>.", "tags": ["istatistik", "korelasyon", "dongu"], "setup": ["iliski"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Ne kadar emin olabiliriz?<\/b> <code>iliski<\/code> tablosunda projendeki analizi tamamla:<ol><li>Spearman <code>rho<\/code>'yu hesapla (başlangıç kodunda hazır).<\/li><li><code>rng = np.random.default_rng(42)<\/code> ile <b>2000<\/b> bootstrap örneklemi çek: hatları iadeli, 8'er tane; her birinin ρ'sunu <code>boot<\/code> listesine ekle.<\/li><li><code>np.nanpercentile<\/code> ile %95 güven aralığını <code>alt, ust<\/code>'a yaz.<\/li><li>Duyarlılık: 60+ payı en yüksek hattı (<code>idxmax<\/code>) çıkarıp ρ'yu yeniden hesapla, <code>rho_duyarli<\/code>'ya ata.<\/li><li>Sonucu tek satırda yazdır, örneğin: <code>rho = 0.95, %95 GA [0.62, 1.00], en uç hat çıkarılınca rho = 0.96<\/code>.<\/li><\/ol>", "starter": "import numpy as np\nfrom scipy import stats\n\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nrng = np.random.default_rng(42)\nboot = []\n# 2) 2000 kez: iadeli 8 konum seç, rho hesapla, boot'a ekle\n\n# 3) alt, ust = ...\n\n# 4) 60+ payı en yüksek hattı çıkar\n# rho_duyarli = ...\n\n# 5) yazdır\n", "sol": "import numpy as np\nfrom scipy import stats\n\nrho, p = stats.spearmanr(iliski[\"pay_60\"], iliski[\"hafta_sonu\"])\nrng = np.random.default_rng(42)\nboot = []\nfor _ in range(2000):\n    i = rng.integers(0, len(iliski), len(iliski))\n    boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])\nalt, ust = np.nanpercentile(boot, [2.5, 97.5])\n\nuc = iliski[\"pay_60\"].idxmax()\nkalan = iliski.drop(uc)\nrho_duyarli, _ = stats.spearmanr(kalan[\"pay_60\"], kalan[\"hafta_sonu\"])\n\nprint(f\"rho = {rho:.2f}, %95 GA [{alt:.2f}, {ust:.2f}], en uç hat ({uc}) çıkarılınca rho = {rho_duyarli:.2f}\")\n", "test": "import numpy as np\nassert abs(rho - 0.952) < 0.001, f\"rho yaklaşık 0.952 olmalı, şu an {rho}\"\nassert len(boot) == 2000, f\"2000 bootstrap değeri olmalı, şu an {len(boot)}\"\n_b = np.asarray(boot, dtype=float)\nassert np.nanstd(_b) > 0.01, \"Bootstrap değerleri hep aynı; hatları iadeli çek\"\nassert abs(alt - np.nanpercentile(_b, 2.5)) < 1e-9 and abs(ust - np.nanpercentile(_b, 97.5)) < 1e-9, \"alt ve ust, boot'un %2.5 ve %97.5 yüzdelikleri olmalı\"\nassert 0.4 < alt < 0.85 and ust > 0.95, f\"Güven aralığı beklenenden farklı: [{alt:.2f}, {ust:.2f}]\"\nassert abs(rho_duyarli - 0.964) < 0.001, f\"Nostaljik tramvay (60+ payı en yüksek) çıkarılınca rho yaklaşık 0.964 olmalı, şu an {rho_duyarli}\"\nassert \"GA\" in __cikti__, \"Sonucu yazdır (içinde GA geçsin)\"", "hint": "Döngü: <code>i = rng.integers(0, len(iliski), len(iliski))<\/code>, <code>boot.append(stats.spearmanr(iliski[\"pay_60\"].iloc[i], iliski[\"hafta_sonu\"].iloc[i])[0])<\/code>. Aralık: <code>alt, ust = np.nanpercentile(boot, [2.5, 97.5])<\/code>. Uç hat: <code>iliski[\"pay_60\"].idxmax()<\/code>, sonra <code>iliski.drop(...)<\/code>.", "tags": ["yeniden_ornekleme", "korelasyon", "istatistik", "dongu"], "setup": ["iliski"], "rev": false, "why": "Tek bir ρ yerine ρ, güven aralığı ve duyarlılık birlikte: okuyucu hem ilişkinin gücünü hem de bu güce ne kadar güvenebileceğini görür.", "zorluk":
