3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "Spearman korelasyonu neden uç değerlere dayanıklıdır?", "opts": ["Uç değerleri siler", "Değerleri sıraya çevirdiği için uç değer yalnızca \"en büyük\" olur", "Ortalamayı kullanır", "Logaritma alır"], "a": 1, "why": "En büyük değer 46 da olsa 31 de olsa sırası 8'dir; ne kadar büyük olduğu hesaba girmez.", "tags": ["korelasyon"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "p-değeri hangisidir?", "opts": ["İlişkinin olmama olasılığı", "İlişki yoksa en az bu kadar uç bir sonucun şans eseri çıkma olasılığı", "Etkinin büyüklüğü", "Nedensellik ölçüsü"], "a": 1, "why": "p, sıfır hipotezi altında hesaplanan bir olasılıktır.", "tags": ["istatistik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Bootstrap'te bir örneklemde aynı hat iki kez gelebilir mi?", "opts": ["Hayır, hiçbir zaman", "Evet, iadeli çekildiği için", "Yalnızca uç hatlar", "Yalnızca ilk hat"], "a": 1, "why": "İadeli çekimde seçilen hat torbaya geri döner.", "tags": ["yeniden_ornekleme"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Veri hat düzeyinde. \"60+ yolcular hafta sonu daha çok yolculuk yapar\" demek hangi hatadır?", "opts": ["Ekolojik yanılgı", "Aşırı uyum", "Örneklem hatası", "Yuvarlama hatası"], "a": 0, "why": "Grup düzeyindeki ilişkiyi bireylere aktarmak ekolojik yanılgıdır.", "tags": ["istatistik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b14", "no": 14, "tur": "ders", "baslik": "build_map.py: özyineleme ve çizgi sadeleştirme", "hat": "Marmaray", "ozet": "HTTP isteği fikri, iç içe JSON'da gezinme, set ile tekrarları ayıklama, özyineleme ve Douglas–Peucker, Path ve komut satırı argümanları.", "dosya": "harita/build_map.py", "proje": "def sadelestir(noktalar, tol):\n    if len(noktalar) < 3:\n        return noktalar\n    ...\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)\n\ndef hat_geometrileri():\n    ham = json.loads(OSM_HAM.read_text(encoding=\"utf-8\"))\n    iliskiler = {e[\"id\"]: e for e in ham[\"elements\"] if e[\"type\"] == \"relation\"}\n    for hat, rel_idler in HAT_ROTALARI.items():\n        gorulen, parcalar = set(), []\n        for rid in rel_idler:\n            ...\n            for uye in rel[\"members\"]:\n                if uye[\"type\"] != \"way\" or uye.get(\"role\") not in (\"\", \"forward\", \"backward\"):\n                    continue\n                if uye[\"ref\"] in gorulen or \"geometry\" not in uye:\n                    continue\n                gorulen.add(uye[\"ref\"])\n                nokta = [(g[\"lon\"], g[\"lat\"]) for g in uye[\"geometry\"] if g]\n                nokta = sadelestir(nokta, TOLERANS)\n                ...\n\ndef main():\n    if \"--yenile\" in sys.argv or not OSM_HAM.exists():\n        osm_indir()", "adimlar": [{"baslik": "Veriyi internetten almak: HTTP isteği", "html": "\n<p><code>build_map.py<\/code>'nin ilk işi OpenStreetMap'ten ray geometrisini indirmek. İnternetten veri almak, bir sunucuya <b>istek<\/b> (request) gönderip\n<b>yanıt<\/b> (response) beklemektir; tarayıcın bir sayfayı açarken yaptığı da budur. Sen Overpass API'ye bir sorgu gönderiyorsun, o da JSON metni döndürüyor:<\/p>\n<pre class=\"py\">veri = urllib.parse.urlencode({\"data\": SORGU}).encode()     # 'data=...' metni → bayt\nistek = urllib.request.Request(url, data=veri, headers={\"User-Agent\": \"istasyon-haritasi/1.0\"})\nwith urllib.request.urlopen(istek, timeout=240) as yanit:\n    govde = yanit.read()                                      # yanıtın gövdesi: bayt dizisi\nham = json.loads(govde)                                       # JSON metni → Python sözlüğü<\/pre>\n<ul>\n<li><code>urlencode<\/code> sözlüğü sunucunun anlayacağı <code>anahtar=değer<\/code> biçimine çevirir, boşluk gibi özel karakterleri kodlar.\n<code>.encode()<\/code> metni bayta çevirir; ağ üzerinden bayt gider.<\/li>\n<li><code>data=<\/code> verildiği için istek <b>POST<\/b> olarak gider: sorgu adreste değil, isteğin gövdesinde taşınır.<\/li>\n<li><code>with ... as yanit<\/code> bağlantıyı iş bitince kendiliğinden kapatır.<\/li>\n<\/ul>\n<p><code>osm_indir<\/code> üç sunucuyu üç tur dener, olmazsa <code>sys.exit<\/code> ile çıkar. İndirdiğini <code>osm_ham.json<\/code>'a yazar; sonraki çalıştırmalar bu önbellekten okur.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>timeout=240<\/code> olmasa, cevap vermeyen bir sunucu programı sonsuza kadar bekletebilir. Zaman aşımı bekleyişi bir hataya çevirir;\n<code>except<\/code> onu yakalar ve sıradaki sunucuya geçer. Ağ işlerinde \"başarısız olabilir\" varsayımıyla yazmak gerekir.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>yanit.read()<\/code>'in metin döndürdüğünü sanmak. Dönen değer <b>bayt<\/b>tır (<code>b'{\"elements\": ...}'<\/code>).\n<code>json.loads<\/code> baytı da kabul eder; ama metin yöntemleri için önce <code>govde.decode(\"utf-8\")<\/code> gerekir.<\/div>\n", "ornek": "import io\nimport json\nimport urllib.parse\n\nSORGU = '[out:json];rel[\"route\"=\"subway\"](40.75,28.55,41.30,29.45);out geom;'\nveri = urllib.parse.urlencode({\"data\": SORGU}).encode()\nprint(veri[:45], \"...\")\n\n# İnternete çıkmıyoruz: sunucunun yanıtını elimizdeki metinle taklit ediyoruz.\n# Gerçekte bu nesneyi urllib.request.urlopen(istek, timeout=240) verir.\nwith io.BytesIO(b14_osm_metin.encode(\"utf-8\")) as yanit:\n    govde = yanit.read()\n\nprint(type(govde).__name__, len(govde), \"bayt\")\nham = json.loads(govde)\nprint(type(ham).__name__, list(ham))\nprint(len(ham[\"elements\"]), \"öğe\")", "ornek_setup": []}, {"baslik": "İç içe JSON'da gezinme ve set ile tekrarları ayıklama", "html": "\n<p><code>json.loads<\/code>'un döndürdüğü şey sıradan Python sözlükleri ve listeleridir, yalnızca iç içe geçmişlerdir. Overpass yanıtının iskeleti:<\/p>\n<pre class=\"py\">{\"elements\": [                                   # liste: düğümler, ilişkiler\n   {\"type\": \"relation\", \"id\": 9987139,           # bir rota (Marmaray, tek yön)\n    \"members\": [                                 # rotanın parçaları\n       {\"type\": \"way\", \"ref\": 1001, \"role\": \"\",            # ray parçası\n        \"geometry\": [{\"lat\": 40.995, \"lon\": 28.92}, ...]},\n       {\"type\": \"node\", \"ref\": 7001, \"role\": \"stop\"},      # durak\n       ...]}]}<\/pre>\n<p>Projende önce ilişkileri kimliğe (id) göre bir sözlükte toplamışsın, sonra üyeler arasında döngüyle inmişsin:<\/p>\n<pre class=\"py\">iliskiler = {e[\"id\"]: e for e in ham[\"elements\"] if e[\"type\"] == \"relation\"}\nfor uye in iliskiler[rid][\"members\"]:\n    if uye[\"type\"] != \"way\" or uye.get(\"role\") != \"\":\n        continue                                # durak, peron: atla\n    nokta = [(g[\"lon\"], g[\"lat\"]) for g in uye[\"geometry\"]]<\/pre>\n<p><code>uye.get(\"role\")<\/code> anahtar yoksa hata vermek yerine <code>None<\/code> döndürür. <code>continue<\/code> döngünün kalanını atlayıp sıradaki üyeye geçer.<\/p>\n<h3>Aynı parçayı iki kez çizmemek<\/h3>\n<p>Aynı ray parçası iki yönün rotasında da bulunabilir. Gördüğün <code>ref<\/code>'leri bir <b>küme<\/b>de (<code>set<\/code>) tutuyorsun:\n<code>if uye[\"ref\"] in gorulen: continue<\/code>, sonra <code>gorulen.add(uye[\"ref\"])<\/code>. Küme her elemanı bir kez tutar ve \"içinde var mı?\" sorusunu,\neleman sayısı ne olursa olsun anında cevaplar; listede baştan sona aramak gerekir.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Boş kümeyi <code>gorulen = {}<\/code> diye kurmak. <code>{}<\/code> boş bir <b>sözlük<\/b>tür ve <code>gorulen.add(...)<\/code>\n<code>AttributeError<\/code> verir. Boş küme <code>set()<\/code> ile kurulur.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> GeoJSON koordinatları <b>[boylam, enlem]<\/b> (lon, lat) sırasıyla ister; OSM noktaları <code>{\"lat\": …, \"lon\": …}<\/code> diye verir.\nTuple'ı <code>(g[\"lon\"], g[\"lat\"])<\/code> diye kurman bu yüzden. Sırayı karıştırırsan İstanbul (41 K, 29 D) haritada Arabistan çölüne düşer.<\/div>\n", "ornek": "iliskiler = {e[\"id\"]: e for e in b14_osm[\"elements\"] if e[\"type\"] == \"relation\"}\nprint(\"İlişkiler:\", list(iliskiler))\n\ngorulen, parcalar = set(), []\nfor rid in [9987139, 9987140]:                  # Marmaray'ın iki yönü\n    for uye in iliskiler[rid][\"members\"]:\n        if uye[\"type\"] != \"way\" or uye.get(\"role\") != \"\":\n            print(\"  atlandı:\", uye[\"type\"], uye[\"ref\"], repr(uye.get(\"role\")))\n            continue\n        if uye[\"ref\"] in gorulen or \"geometry\" not in uye:\n            print(\"  tekrar ya da geometrisiz:\", uye[\"ref\"])\n            continue\n        gorulen.add(uye[\"ref\"])\n        nokta = [(g[\"lon\"], g[\"lat\"]) for g in uye[\"geometry\"]]\n        parcalar.append(nokta)\n        print(\"  eklendi:\", uye[\"ref\"], len(nokta), \"nokta\")\nprint(len(parcalar), \"parça; görülen:\", sorted(gorulen))", "ornek_setup": ["b14_osm"]}, {"baslik": "Özyineleme: kendini çağıran fonksiyon", "html": "\n<p>Bazı problemler kendilerinin daha küçük bir kopyasını içerir: 4! (faktöriyel) = 4 × 3!, 3! = 3 × 2! … Bunu kodla aynen yazabilirsin: fonksiyon işin küçük bir kısmını yapar,\ngeri kalanı için <b>kendini<\/b> çağırır. Buna <b>özyineleme<\/b> (recursion) denir.<\/p>\n<pre class=\"py\">def faktoriyel(n):\n    if n &lt;= 1:                      # durma koşulu (base case)\n        return 1\n    return n * faktoriyel(n - 1)    # kendini daha küçük n ile çağırır<\/pre>\n<p><code>faktoriyel(4)<\/code> önce <code>faktoriyel(3)<\/code>'ü çağırır, o <code>faktoriyel(2)<\/code>'yi, o da <code>faktoriyel(1)<\/code>'i.\n<code>faktoriyel(1)<\/code> 1 döndürünce zincir geri çözülür: 2 × 1 = 2, 3 × 2 = 6, 4 × 6 = 24. Her çağrının kendi <code>n<\/code>'i vardır.\nHer özyinelemeli fonksiyonun iki parçası olmalı:<\/p>\n<ol>\n<li><b>Durma koşulu:<\/b> cevabı doğrudan bilinen en küçük durum (burada <code>n &lt;= 1<\/code>).<\/li>\n<li><b>Küçülen adım:<\/b> her çağrı problemi durma koşuluna biraz daha yaklaştırmalı (<code>n - 1<\/code>).<\/li>\n<\/ol>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Durma koşulunu unutmak ya da problemi küçültmemek (<code>faktoriyel(n)<\/code> içinde yine <code>faktoriyel(n)<\/code>'i çağırmak).\nFonksiyon kendini durmadan çağırır; Python yaklaşık 1000 çağrı derinliğinde <code>RecursionError: maximum recursion depth exceeded<\/code> ile durdurur.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Faktöriyel döngüyle de yazılır. Özyinelemenin asıl gücü problem <b>ikiye bölündüğünde<\/b> ortaya çıkar:\nDouglas–Peucker çizgiyi iki parçaya ayırıp her parçaya aynı işlemi uygular; bunu döngüyle yazmak çok daha karışık olurdu.<\/div>\n", "ornek": "def faktoriyel(n, girinti=\"\"):\n    print(f\"{girinti}faktoriyel({n}) çağrıldı\")\n    if n <= 1:\n        print(f\"{girinti}→ durma koşulu, 1 döner\")\n        return 1\n    sonuc = n * faktoriyel(n - 1, girinti + \"    \")\n    print(f\"{girinti}→ {n} × faktoriyel({n - 1}) = {sonuc}\")\n    return sonuc\n\nprint(\"Sonuç:\", faktoriyel(4))", "ornek_setup": []}, {"baslik": "Douglas–Peucker: çizgiyi sadeleştirmek", "html": "\n<p>OSM'den gelen ray çizgilerinde binlerce nokta var; çoğu neredeyse düz bir hattın üzerinde duruyor. Hepsini haritaya gömmek dosyayı şişirir.\n<b>Douglas–Peucker<\/b> algoritması şekli bozmadan gereksiz noktaları atar:<\/p>\n<ol>\n<li>İlk ve son noktayı düz bir çizgiyle birleştir.<\/li>\n<li>Aradaki noktalardan bu çizgiye <b>en uzak<\/b> olanı bul.<\/li>\n<li>O uzaklık toleranstan küçükse aradaki noktaların hepsi gereksizdir: yalnızca iki uç kalır.<\/li>\n<li>Değilse o nokta önemlidir. Çizgiyi o noktadan ikiye böl ve <b>her yarıya aynı işlemi uygula<\/b>.<\/li>\n<\/ol>\n<pre class=\"py\">def sadelestir(noktalar, tol):\n    if len(noktalar) &lt; 3:                  # durma koşulu 1: ara nokta yok\n        return noktalar\n    ...                                    # en uzak noktayı ve indeksini bul\n    if en_uzak &lt;= tol:                     # durma koşulu 2: hepsi tolerans içinde\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)<\/pre>\n<p>Son satırda iki özyinelemeli çağrı var. Sol yarı <code>noktalar[:indeks + 1]<\/code> bölme noktasını <b>içerir<\/b> (dilimin sonu dahil değildir, bu yüzden <code>+ 1<\/code>);\nsağ yarı <code>noktalar[indeks:]<\/code> da bölme noktasıyla <b>başlar<\/b>. Birleştirirken nokta iki kez yazılmasın diye sol sonucun son elemanı <code>[:-1]<\/code> ile atılır.<\/p>\n<p>Uzaklık, noktanın iki uçtan geçen doğruya dik uzaklığıdır. Tolerans <code>0.00003<\/code> derece, yaklaşık 3 metre: harita ölçeğinde fark edilmez.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Algoritma önemli noktaları korur: virajın tepesi \"en uzak nokta\" olarak seçilir, düz kısımların ara noktaları atılır.\nNokta sayısı çok azalır ama çizginin şekli gözle ayırt edilemez.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>[:-1]<\/code>'i unutmak. Sonuç yine çizilir, hata mesajı çıkmaz; ama her bölme noktası iki kez yazılır ve dosya boşuna büyür.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\n\ndef sadelestir(noktalar, tol, derinlik=0):\n    print(\"    \" * derinlik + f\"sadelestir: {len(noktalar)} nokta\")\n    if len(noktalar) < 3:\n        return noktalar\n    (x1, y1), (x2, y2) = noktalar[0], noktalar[-1]\n    dx, dy = x2 - x1, y2 - y1\n    uzunluk2 = dx * dx + dy * dy\n    en_uzak, indeks = 0.0, 0\n    for i in range(1, len(noktalar) - 1):\n        px, py = noktalar[i]\n        if uzunluk2 == 0:\n            d = ((px - x1) ** 2 + (py - y1) ** 2) ** 0.5\n        else:\n            d = abs(dy * px - dx * py + x2 * y1 - y2 * x1) / uzunluk2 ** 0.5\n        if d > en_uzak:\n            en_uzak, indeks = d, i\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    sol = sadelestir(noktalar[: indeks + 1], tol, derinlik + 1)\n    sag = sadelestir(noktalar[indeks:], tol, derinlik + 1)\n    return sol[:-1] + sag\n\nhat = [(0, 0), (1, 0.05), (2, -0.03), (3, 0), (4, 2), (5, 4), (6, 4.02), (7, 4)]\nsonuc = sadelestir(hat, 0.1)\nprint(len(hat), \"→\", len(sonuc), \"nokta:\", sonuc)\n\nfig, ax = plt.subplots(figsize=(5, 3))\nax.plot([x for x, y in hat], [y for x, y in hat], \"o-\", color=\"#c8c8c8\", label=\"özgün\")\nax.plot([x for x, y in sonuc], [y for x, y in sonuc], \"s--\", color=\"#c2185b\", label=\"sadeleştirilmiş\")\nax.legend(frameon=False)\nplt.show()", "ornek_setup": []}, {"baslik": "Path ve komut satırı", "html": "\n<p>Dosya yollarını metin olarak birleştirmek (<code>\"harita\" + \"/\" + \"data\"<\/code>) Windows'ta ters bölü, Mac'te düz bölü derdi yaratır.\n<code>pathlib.Path<\/code> yolu bir nesne olarak tutar ve <code>/<\/code> işleciyle parça ekler:<\/p>\n<pre class=\"py\">from pathlib import Path\nKOK = Path(__file__).resolve().parent      # bu script'in bulunduğu klasör\nOSM_HAM = KOK / \"data\" / \"osm_ham.json\"\nOSM_HAM.name                        # 'osm_ham.json'\nOSM_HAM.suffix                      # '.json'\nOSM_HAM.stem                        # 'osm_ham'\nOSM_HAM.exists()                    # dosya var mı?<\/pre>\n<p><code>__file__<\/code> çalışan script'in yoludur; <code>resolve()<\/code> onu tam yola çevirir, <code>parent<\/code> bulunduğu klasörü verir.<\/p>\n<h3>Komut satırı: sys.argv<\/h3>\n<p><code>python harita/build_map.py --yenile<\/code> yazdığında Python kelimeleri <code>sys.argv<\/code> listesine koyar: <code>[\"harita/build_map.py\", \"--yenile\"]<\/code>.\nİlk eleman script'in adıdır, gerisi senin yazdıkların. <code>main()<\/code> şöyle karar veriyor:<\/p>\n<pre class=\"py\">if \"--yenile\" in sys.argv or not OSM_HAM.exists():\n    osm_indir()<\/pre>\n<p>\"Kullanıcı yenile dediyse ya da önbellek yoksa indir; yoksa dosyadakini kullan.\"<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Yolları <code>KOK<\/code>'a göre kurmasaydın <code>\"data/osm_ham.json\"<\/code> gibi göreli bir yol, <b>o an bulunduğun klasöre<\/b> göre aranırdı.\nScript'i proje kökünden çalıştırınca <code>FileNotFoundError<\/code> alırdın. <code>Path(__file__)<\/code>, nereden çalıştırırsan çalıştır doğru dosyayı bulur.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>sys.argv[1]<\/code>'i koşulsuz okumak. Argümansız çalıştırınca liste tek elemanlıdır ve <code>IndexError<\/code> alırsın.\n<code>\"--yenile\" in sys.argv<\/code> kontrolü argüman olsa da olmasa da güvenle çalışır.<\/div>\n", "ornek": "import sys\nfrom pathlib import Path\n\nKOK = Path(\"harita\")                  # gerçek kodda: Path(__file__).resolve().parent\nOSM_HAM = KOK / \"data\" / \"osm_ham.json\"\nprint(OSM_HAM.name, OSM_HAM.suffix, OSM_HAM.stem)\nprint(\"Klasör:\", OSM_HAM.parent.name)\nprint(\"Dosya var mı?\", OSM_HAM.exists())\n\nsys.argv = [\"build_map.py\", \"--yenile\"]      # komut satırını taklit ediyoruz\nprint(sys.argv)\nif \"--yenile\" in sys.argv or not OSM_HAM.exists():\n    print(\"OSM verisi yeniden indirilecek\")\nelse:\n    print(\"Önbellekteki dosya kullanılacak\")", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["data=a b", "data=a+b", "{'data': 'a b'}", "data:a b"], "a": 1, "why": "<code>urlencode<\/code> boşluğu <code>+<\/code> olarak kodlar; adreste ve istek gövdesinde boşluk bulunmaz.", "tags": ["http"], "code": "import urllib.parse\nprint(urllib.parse.urlencode({\"data\": \"a b\"}))", "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>urlopen(istek, timeout=240)<\/code>'daki <code>timeout<\/code> neden verilir?", "opts": ["İndirmeyi hızlandırmak için", "Sunucu cevap vermezse sonsuza kadar beklememek için", "240 kez denemek için", "Dosyayı 240 saniye önbellekte tutmak için"], "a": 1, "why": "Süre dolunca hata oluşur; <code>except<\/code> yakalar ve sıradaki sunucu denenir.", "tags": ["http"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "fill", "q": "OSM noktalarını GeoJSON'un istediği sırayla tuple'a çevir.", "code": "nokta = [(g[\"___\"], g[\"___\"]) for g in uye[\"geometry\"]]", "a": [["lon"], ["lat"]], "why": "GeoJSON önce boylam (lon, x), sonra enlem (lat, y) ister.", "tags": ["json", "comprehension"], "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["5", "3", "2", "hata verir"], "a": 1, "why": "Küme aynı elemanı ikinci kez eklemez: {11, 12, 13}.", "tags": ["kume"], "code": "s = set()\nfor r in [11, 12, 11, 13, 12]:\n    s.add(r)\nprint(len(s))", "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>faktoriyel(4)<\/code> kaç döner?", "opts": ["4", "10", "24", "sonsuz döngü"], "a": 2, "why": "4 × 3 × 2 × 1 = 24.", "tags": ["ozyineleme"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Durma koşulu olmayan özyinelemeli fonksiyonda ne olur?", "opts": ["Normal biter", "Kendini durmadan çağırır, RecursionError", "0 döner", "Python otomatik durdurup doğru sonucu verir"], "a": 1, "why": "Python belli bir derinlikte <code>RecursionError<\/code> verir.", "tags": ["ozyineleme"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Birleştirirken ilk yarıya neden <code>[:-1]<\/code> uygulanıyor?", "opts": ["Son noktayı gizlemek için", "Bölme noktası iki yarıda da var; iki kez yazılmasın diye", "Listeyi ters çevirmek için", "Hata vermesin diye"], "a": 1, "why": "Ortadaki nokta ilk yarının sonu ve ikinci yarının başı.", "tags": ["dilim", "ozyineleme"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "fill", "q": "Douglas–Peucker'ın iki durma koşulunu tamamla.", "code": "if len(noktalar) < ___:\n    return noktalar\n...\nif en_uzak <= tol:\n    return [noktalar[0], noktalar[___]]", "a": [["3"], ["-1"]], "why": "Üçten az noktada ara nokta yoktur; tolerans içindeyse ilk ve <b>son<\/b> (<code>-1<\/code>) nokta kalır.", "tags": ["ozyineleme", "dilim"], "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>\"--yenile\" in sys.argv<\/code> ne kontrol eder?", "opts": ["Dosya var mı", "Komut satırında --yenile yazılmış mı", "İnternet var mı", "Python sürümü"], "a": 1, "why": "<code>sys.argv<\/code> komut satırındaki kelimelerin listesi.", "tags": ["script"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["hatlar_osm .geojson", "hatlar_osm.geojson .geojson", "data .geojson", "hatlar_osm geojson"], "a": 0, "why": "<code>stem<\/code> uzantısız ad, <code>suffix<\/code> noktayla birlikte uzantı.", "tags": ["dosya"], "code": "from pathlib import Path\np = Path(\"harita\") / \"data\" / \"hatlar_osm.geojson\"\nprint(p.stem, p.suffix)", "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Hangisi boş bir <b>küme<\/b> kurar?", "opts": ["{}", "set()", "[]", "()"], "a": 1, "why": "<code>{}<\/code> boş sözlüktür; boş küme yalnızca <code>set()<\/code> ile kurulur.", "tags": ["kume"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "<code>uye.get(\"role\")<\/code> ile <code>uye[\"role\"]<\/code> arasındaki fark nedir?", "opts": ["Fark yok", "Anahtar yoksa get None döndürür, köşeli parantez KeyError verir", "get daha yavaştır", "get yalnızca listelerde çalışır"], "a": 1, "why": "OSM'de bazı üyelerde <code>role<\/code> olmayabilir; <code>get<\/code> programı durdurmaz.", "tags": ["sozluk", "json"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "İlişkileri id'lerine göre bir sözlükte topla.", "code": "iliskiler = {e[___]: e for e in ham[\"elements\"] if e[\"type\"] == ___}", "a": [["\"id\""], ["\"relation\""]], "why": "Anahtar <code>e[\"id\"]<\/code>, filtre <code>e[\"type\"] == \"relation\"<\/code>.", "tags": ["sozluk", "comprehension", "json"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Bir listedeki sayıların toplamını <b>döngü kullanmadan<\/b>, özyinelemeyle hesaplayan <code>toplam(liste)<\/code> yaz.", "starter": "def toplam(liste):\n    # boş liste → 0\n    # değilse: ilk eleman + geri kalanının toplamı\n    pass\n", "sol": "def toplam(liste):\n    if not liste:\n        return 0\n    return liste[0] + toplam(liste[1:])", "test": "assert toplam([]) == 0, \"Boş liste 0 vermeli\"\nassert toplam([5, 3, 2]) == 10, f\"[5, 3, 2] → 10 olmalı, şu an {toplam([5, 3, 2])}\"\nassert \"for \" not in __kod__ and \"sum(\" not in __kod__, \"for veya sum kullanmadan yaz\"", "hint": "<code>if not liste: return 0<\/code> ve <code>return liste[0] + toplam(liste[1:])<\/code>", "tags": ["ozyineleme", "dilim"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["321", "123", "3", "hata verir"], "a": 1, "why": "<code>f(3)<\/code> önce <code>f(2)<\/code>'nin bitmesini bekler; en içteki <code>f(0)<\/code> boş metin döndürür, sonra \"1\", \"2\", \"3\" sırayla eklenir.", "tags": ["ozyineleme"], "code": "def f(n):\n    if n == 0:\n        return \"\"\n    return f(n - 1) + str(n)\n\nprint(f(3))", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>b14_osm<\/code>'den ilişkileri <code>iliskiler<\/code> sözlüğünde (id → ilişki) topla. Sonra her ilişkinin <code>\"way\"<\/code> türündeki üye sayısını <code>yol_sayisi<\/code> sözlüğüne (<code>{id: sayı}<\/code>) yaz ve ilişki adıyla (<code>tags[\"name\"]<\/code>) birlikte yazdır.", "starter": "iliskiler = {}\nyol_sayisi = {}\n", "sol": "iliskiler = {e[\"id\"]: e for e in b14_osm[\"elements\"] if e[\"type\"] == \"relation\"}\nyol_sayisi = {}\nfor rid, rel in iliskiler.items():\n    yol_sayisi[rid] = sum(1 for u in rel[\"members\"] if u[\"type\"] == \"way\")\n    print(rel[\"tags\"][\"name\"], yol_sayisi[rid])\n", "test": "assert set(iliskiler) == {9987139, 9987140, 2962729}, f\"3 ilişki olmalı (düğümler hariç), bulunan: {sorted(iliskiler)}\"\nassert yol_sayisi == {9987139: 4, 9987140: 2, 2962729: 1}, f\"Yol sayıları farklı: {yol_sayisi}\"\nassert \"Marmaray\" in __cikti__, \"İlişki adlarını da yazdır\"", "hint": "<code>iliskiler = {e[\"id\"]: e for e in b14_osm[\"elements\"] if e[\"type\"] == \"relation\"}<\/code>; her ilişkide <code>len([u for u in rel[\"members\"] if u[\"type\"] == \"way\"])<\/code>.", "tags": ["json", "sozluk", "comprehension"], "setup": ["b14_osm"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Tekrar eden ray parçaları ayıklanmıyor: çıktı <code>[11, 12, 11, 13, 12]<\/code>, beklenen <code>[11, 12, 13]<\/code>. Düzelt.", "starter": "refs = [11, 12, 11, 13, 12]\ntekil = []\nfor r in refs:\n    gorulen = set()\n    if r in gorulen:\n        continue\n    gorulen.add(r)\n    tekil.append(r)\nprint(tekil)\n", "sol": "refs = [11, 12, 11, 13, 12]\ntekil = []\ngorulen = set()\nfor r in refs:\n    if r in gorulen:\n        continue\n    gorulen.add(r)\n    tekil.append(r)\nprint(tekil)\n", "test": "assert tekil == [11, 12, 13], f\"Beklenen [11, 12, 13], senin sonucun {tekil}\"", "hint": "Küme döngünün <b>içinde<\/b> kuruluyor; her turda sıfırlanıyor ve hiçbir şeyi hatırlamıyor. <code>gorulen = set()<\/code> satırını döngüden önceye al.", "tags": ["kume", "dongu"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "order", "q": "Douglas–Peucker fonksiyonunun gövdesini sıraya koy.", "lines": ["if len(noktalar) < 3: return noktalar", "uzakliklar = [uzaklik(p, noktalar[0], noktalar[-1]) for p in noktalar[1:-1]]", "en_uzak = max(uzakliklar)", "indeks = uzakliklar.index(en_uzak) + 1", "if en_uzak <= tol: return [noktalar[0], noktalar[-1]]", "return sadelestir(noktalar[:indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)"], "why": "Önce ilk durma koşulu, sonra uzaklıklar ve en uzak nokta, ikinci durma koşulu ve en son iki yarıya özyineleme.", "tags": ["ozyineleme"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "<code>sadelestir([(0, 0), (1, 0), (2, 0), (3, 0)], 0.1)<\/code> kaç nokta döndürür?", "opts": ["4", "2", "3", "0"], "a": 1, "why": "Bütün noktalar aynı doğru üzerinde; en uzak ara nokta 0 uzaklıkta, tolerans içinde. Yalnızca iki uç kalır.", "tags": ["ozyineleme"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Douglas–Peucker'ı tamamla. Hazır <code>uzaklik(p, a, b)<\/code> noktanın a–b doğrusuna uzaklığını veriyor.", "starter": "def uzaklik(p, a, b):\n    (x, y), (x1, y1), (x2, y2) = p, a, b\n    dx, dy = x2 - x1, y2 - y1\n    return abs(dy * x - dx * y + x2 * y1 - y2 * x1) / (dx * dx + dy * dy) ** 0.5\n\ndef sadelestir(noktalar, tol):\n    if len(noktalar) < 3:\n        return noktalar\n    uzakliklar = [uzaklik(p, noktalar[0], noktalar[-1]) for p in noktalar[1:-1]]\n    en_uzak = max(uzakliklar)\n    indeks = uzakliklar.index(en_uzak) + 1\n    # tolerans altındaysa: sadece iki uç\n    # değilse: iki yarıyı sadeleştirip birleştir\n", "sol": "def uzaklik(p, a, b):\n    (x, y), (x1, y1), (x2, y2) = p, a, b\n    dx, dy = x2 - x1, y2 - y1\n    return abs(dy * x - dx * y + x2 * y1 - y2 * x1) / (dx * dx + dy * dy) ** 0.5\n\ndef sadelestir(noktalar, tol):\n    if len(noktalar) < 3:\n        return noktalar\n    uzakliklar = [uzaklik(p, noktalar[0], noktalar[-1]) for p in noktalar[1:-1]]\n    en_uzak = max(uzakliklar)\n    indeks = uzakliklar.index(en_uzak) + 1\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)", "test": "hat = [(0, 0), (1, 0.05), (2, -0.03), (3, 0), (4, 2), (5, 4), (6, 4.02), (7, 4)]\nsonuc = sadelestir(hat, 0.1)\nassert sonuc == [(0, 0), (3, 0), (5, 4), (7, 4)], f\"Beklenen [(0,0),(3,0),(5,4),(7,4)], senin sonucun {sonuc}\"\nassert sadelestir([(0, 0), (1, 1)], 0.1) == [(0, 0), (1, 1)], \"İki nokta aynen dönmeli\"", "hint": "<code>if en_uzak &lt;= tol: return [noktalar[0], noktalar[-1]]<\/code>, sonra <code>return sadelestir(noktalar[:indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)<\/code>", "tags": ["ozyineleme", "dilim"], "setup": [], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "mc", "q": "<code>TOLERANS<\/code>'ı 0.00003'ten 0.01'e (yaklaşık 1 km) çıkarırsan haritada ne olur?", "opts": ["Hiçbir şey değişmez", "Nokta sayısı çok azalır; virajlar köşeli, düz çizgiler gibi görünür", "Nokta sayısı artar", "Program hata verir"], "a": 1, "why": "Tolerans büyüdükçe daha çok nokta \"gereksiz\" sayılır. Dosya küçülür ama şekil bozulur.", "tags": ["ozyineleme"], "code": null, "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>Ray geometrisinden GeoJSON.<\/b> <code>b14_osm<\/code>, Overpass yanıtının küçük bir kopyası; <code>sadelestir<\/code> hazır. <code>hat_geojson(ham, hatlar, tol)<\/code> fonksiyonunu yaz. <code>hatlar<\/code> bir <code>{hat kodu: [ilişki id'leri]}<\/code> sözlüğü. Her hat için:<ol><li>İlişkileri id'ye göre bul; veride olmayan id için bir uyarı yazdır ve geç.<\/li><li>Yalnızca <code>type == \"way\"<\/code> ve <code>role == \"\"<\/code> olan, <code>geometry<\/code>'si bulunan üyeleri al. Aynı <code>ref<\/code>'i <b>bir hat içinde<\/b> ikinci kez görürsen atla (<code>set<\/code>).<\/li><li>Noktaları <b>(lon, lat)<\/b> sırasıyla kur ve <code>sadelestir(nokta, tol)<\/code> ile sadeleştir; her parça <code>parcalar<\/code> listesine.<\/li><li>En az bir parçası olan her hat için <code>{\"type\": \"Feature\", \"properties\": {\"line\": hat}, \"geometry\": {\"type\": \"MultiLineString\", \"coordinates\": parcalar}}<\/code> üret.<\/li><\/ol>Sonunda <code>{\"type\": \"FeatureCollection\", \"features\": [...]}<\/code> döndür.", "starter": "def sadelestir(noktalar, tol):\n    \"\"\"Douglas–Peucker çizgi sadeleştirme (projedeki fonksiyon).\"\"\"\n    if len(noktalar) < 3:\n        return noktalar\n    (x1, y1), (x2, y2) = noktalar[0], noktalar[-1]\n    dx, dy = x2 - x1, y2 - y1\n    uzunluk2 = dx * dx + dy * dy\n    en_uzak, indeks = 0.0, 0\n    for i in range(1, len(noktalar) - 1):\n        px, py = noktalar[i]\n        if uzunluk2 == 0:\n            d = ((px - x1) ** 2 + (py - y1) ** 2) ** 0.5\n        else:\n            d = abs(dy * px - dx * py + x2 * y1 - y2 * x1) / uzunluk2 ** 0.5\n        if d > en_uzak:\n            en_uzak, indeks = d, i\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)\n\ndef hat_geojson(ham, hatlar, tol):\n    iliskiler = {}                 # id → ilişki\n    ozellikler = []\n    for hat, rel_idler in hatlar.items():\n        gorulen, parcalar = set(), []\n        # ilişkileri ve üyelerini gez\n\n    return {\"type\": \"FeatureCollection\", \"features\": ozellikler}\n\nsonuc = hat_geojson(b14_osm, {\"Marmaray\": [9987139, 9987140], \"T1\": [2962729, 1234], \"M99\": [555]}, 0.0005)\nfor f in sonuc[\"features\"]:\n    print(f[\"properties\"][\"line\"], [len(p) for p in f[\"geometry\"][\"coordinates\"]])\n", "sol": "def sadelestir(noktalar, tol):\n    \"\"\"Douglas–Peucker çizgi sadeleştirme (projedeki fonksiyon).\"\"\"\n    if len(noktalar) < 3:\n        return noktalar\n    (x1, y1), (x2, y2) = noktalar[0], noktalar[-1]\n    dx, dy = x2 - x1, y2 - y1\n    uzunluk2 = dx * dx + dy * dy\n    en_uzak, indeks = 0.0, 0\n    for i in range(1, len(noktalar) - 1):\n        px, py = noktalar[i]\n        if uzunluk2 == 0:\n            d = ((px - x1) ** 2 + (py - y1) ** 2) ** 0.5\n        else:\n            d = abs(dy * px - dx * py + x2 * y1 - y2 * x1) / uzunluk2 ** 0.5\n        if d > en_uzak:\n            en_uzak, indeks = d, i\n    if en_uzak <= tol:\n        return [noktalar[0], noktalar[-1]]\n    return sadelestir(noktalar[: indeks + 1], tol)[:-1] + sadelestir(noktalar[indeks:], tol)\n\ndef hat_geojson(ham, hatlar, tol):\n    iliskiler = {e[\"id\"]: e for e in ham[\"elements\"] if e[\"type\"] == \"relation\"}\n    ozellikler = []\n    for hat, rel_idler in hatlar.items():\n        gorulen, parcalar = set(), []\n        for rid in rel_idler:\n            rel = iliskiler.get(rid)\n            if rel is None:\n                print(f\"UYARI: {hat} için ilişki {rid} bulunamadı\")\n                continue\n            for uye in rel[\"members\"]:\n                if uye[\"type\"] != \"way\" or uye.get(\"role\") != \"\":\n                    continue\n                if uye[\"ref\"] in gorulen or \"geometry\" not in uye:\n                    continue\n                gorulen.add(uye[\"ref\"])\n                nokta = [(g[\"lon\"], g[\"lat\"]) for g in uye[\"geometry\"]]\n                parcalar.append(sadelestir(nokta, tol))\n        if parcalar:\n            ozellikler.append({\"type\": \"Feature\", \"properties\": {\"line\": hat},\n                               \"geometry\": {\"type\": \"MultiLineString\", \"coordinates\": parcalar}})\n    return {\"type\": \"FeatureCollection\", \"features\": ozellikler}\n\nsonuc = hat_geojson(b14_osm, {\"Marmaray\": [9987139, 9987140], \"T1\": [2962729, 1234], \"M99\": [555]}, 0.0005)\nfor f in sonuc[\"features\"]:\n    print(f[\"properties\"][\"line\"], [len(p) for p in f[\"geometry\"][\"coordinates\"]])\n", "test": "import contextlib, io\nwith contextlib.redirect_stdout(io.StringIO()):\n    _s = hat_geojson(b14_osm, {\"Marmaray\": [9987139, 9987140], \"T1\": [2962729, 1234], \"M99\": [555]}, 0.0005)\nassert isinstance(_s, dict) and _s.get(\"type\") == \"FeatureCollection\", \"Dönen sözlüğün type'ı FeatureCollection olmalı\"\n_f = {f[\"properties\"][\"line\"]: f for f in _s[\"features\"]}\nassert set(_f) == {\"Marmaray\", \"T1\"}, f\"Marmaray ve T1 için birer Feature olmalı (M99'un hiç parçası yok), bulunan: {sorted(_f)}\"\n_g = _f[\"Marmaray\"][\"geometry\"]\nassert _g[\"type\"] == \"MultiLineString\", \"geometry'nin type'ı MultiLineString olmalı\"\n_p = _g[\"coordinates\"]\nassert len(_p) == 3, f\"Marmaray'da 3 ray parçası olmalı (durak, peron, geometrisiz ve tekrar eden parça atlanır), şu an {len(_p)}\"\nassert [len(x) for x in _p] == [2, 4, 3], f\"Sadeleştirme sonrası parça boyları [2, 4, 3] olmalı, şu an {[len(x) for x in _p]}\"\n_ilk = tuple(_p[0][0])\nassert abs(_ilk[0] - 28.92) < 1e-6 and abs(_ilk[1] - 40.995) < 1e-6, f\"Koordinatlar (lon, lat) sırasında olmalı; ilk nokta (28.92, 40.995) bekleniyor, şu an {_ilk}\"\nassert len(_f[\"T1\"][\"geometry\"][\"coordinates\"]) == 1, \"T1'de 1 parça olmalı\"", "hint": "İskelet: <code>iliskiler = {e[\"id\"]: e for e in ham[\"elements\"] if e[\"type\"] == \"relation\"}<\/code>; hat döngüsünde <code>for rid in rel_idler:<\/code>, <code>rel = iliskiler.get(rid)<\/code> (None ise uyar, <code>continue<\/code>); üye döngüsünde iki <code>continue<\/code> filtresi, sonra <code>gorulen.add(uye[\"ref\"])<\/code> ve <code>parcalar.append(sadelestir([(g[\"lon\"], g[\"lat\"]) for g in uye[\"geometry\"]], tol))<\/code>; en sonda <code>if parcalar:<\/code> ise Feature ekle.", "tags": ["json", "kume", "ozyineleme", "sozluk", "dongu"], "setup": ["b14_osm"], "rev": false, "why": "Bu, <code>hat_geometrileri<\/code>'nin küçük bir kopyası. Aynı mantık gerçek veride 23 hattın binlerce ray parçasını haritaya hazırlıyor.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>python build_map.py --yenile<\/code> çalıştırıldığında <code>sys.argv<\/code> nedir?", "opts": ["[\"build_map.py\", \"--yenile\"]", "[\"--yenile\"]", "\"build_map.py --yenile\"", "[\"python\", \"build_map.py\", \"--yenile\"]"], "a": 0, "why": "İlk eleman script'in adı, gerisi argümanlar; <code>python<\/code> kelimesi listeye girmez.", "tags": ["script"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>type({})<\/code> nedir?", "opts": ["set", "dict", "list", "tuple"], "a": 1, "why": "Boş süslü parantez boş bir sözlüktür; boş küme için <code>set()<\/code>.", "tags": ["kume", "sozluk"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "GeoJSON'da bir koordinat hangi sırayla yazılır?", "opts": ["[enlem, boylam]", "[boylam, enlem]", "{\"lat\": …, \"lon\": …}", "Sıra önemli değil"], "a": 1, "why": "Ge <script>
const C = JSON.parse(document.getElementById("icerik").textContent);
const BOL = C.bolumler, ETK = C.etiketler;
const HAT_RENK = {M1:"#e3232c",M2:"#1fa149",M3:"#1da1e2",M4:"#e6007e",M5:"#7c3f98",M6:"#b58c5a",M7:"#e57fae",M8:"#1b62b5",M9:"#e9b10d",M11:"#8f73b7",T1:"#1b4f9c",T4:"#e5732a",T5:"#8c5a3c",Marmaray:"#4a5a70"};
const kisa = h => h === "Marmaray" ? "B1" : h;

/* ─── soru dizini ─── */
const SORU = {};
BOL.forEach(b => (b.sorular || []).forEach((q, i) => { q.id = `${b.id}-${i}`; q.bolum = b; SORU[q.id] = q; }));
const dersler = BOL.filter(b => b.tur === "ders");

/* ─── kayıt (tarayıcıda; erişilemezse yalnızca bellekte) ─── */
const ANAHTAR = "kodhatti.v2";
let K = { q: {}, t: {}, tema: "system" };
try { const s = localStorage.getItem(ANAHTAR); if (s) K = Object.assign(K, JSON.parse(s)); } catch (e) {}
const kaydet = () => { try { localStorage.setItem(ANAHTAR, JSON.stringify(K)); } catch (e) {} };
function kaydetSonuc(q, dogru) {
  const r = K.q[q.id] || (K.q[q.id] = { d: 0, y: 0, cozuldu: false });
  dogru ? r.d++ : r.y++;
  if (dogru) r.cozuldu = true;
  r.son = Date.now();
  q.tags.forEach(t => { const s = K.t[t] || (K.t[t] = { d: 0, y: 0 }); dogru ? s.d++ : s.y++; s.son = Date.now(); });
  kaydet(); yanPanel();
}
const zayiflik = t => { const s = K.t[t]; if (!s) return 0; return s.y * 2 - s.d * 0.6; };
function oncelik(q) {
  const r = K.q[q.id];
  let p = q.tags.reduce((a, t) => a + zayiflik(t), 0);
  if (!r) p += 2;                                   // hiç görülmemiş
  else { p += r.y * 1.5 - r.d * 0.5; p += Math.min(4, (Date.now() - (r.son || 0)) / 864e5); }
  if (q.rev) p += 1.5;                              // tekrar için yazılmış sorular
  if (q.t === "code") p -= 1.5;                     // tekrarlarda hızlı sorular önde
  return p + Math.random() * 1.2;
}
function sec(havuz, adet, enFazlaKod = 2) {
  const s = [...havuz].sort((a, b) => oncelik(b) - oncelik(a)); const secilen = []; let kod = 0;
  for (const q of s) { if (secilen.length >= adet) break; if (q.t === "code") { if (kod >= enFazlaKod) continue; kod++; } secilen.push(q); }
  return secilen.sort(() => Math.random() - .5);
}
function bolumDurumu(b) {
  const qs = b.sorular.filter(q => !q.rev); const c = qs.filter(q => K.q[q.id]?.cozuldu).length;
  return { c, n: qs.length, bitti: c === qs.length };
}

/* ─── sözdizimi renklendirme ─── */
const KW = new Set("False None True and as assert break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield".split(" "));
const kacis = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function renklendir(kod) {
  const re = /(#[^\n]*)|([rfb]{0,2}"""[\s\S]*?"""|[rfb]{0,2}'''[\s\S]*?'''|[rfb]{0,2}"(?:\\.|[^"\\\n])*"|[rfb]{0,2}'(?:\\.|[^'\\\n])*')|(\b\d[\d_]*\.?\d*(?:e-?\d+)?\b)|([A-Za-z_ğüşıöçĞÜŞİÖÇ][\wğüşıöçĞÜŞİÖÇ]*)(?=\s*\()|([A-Za-z_ğüşıöçĞÜŞİÖÇ][\wğüşıöçĞÜŞİÖÇ]*)/g;
  let out = "", son = 0, m;
  while ((m = re.exec(kod))) {
    out += kacis(kod.slice(son, m.index)); son = re.lastIndex;
    const [t, com, str, num, fn, id] = m;
    if (com) out += `<span class="t-com">${kacis(com)}</span>`;
    else if (str) out += `<span class="t-str">${kacis(str)}</span>`;
    else if (num) out += `<span class="t-num">${num}</span>`;
    else if (fn) out += KW.has(fn) ? `<span class="t-kw">${fn}</span>` : `<span class="t-fn">${fn}</span>`;
    else out += KW.has(id) ? `<span class="t-kw">${id}</span>` : kacis(id);
  }
  return out + kacis(kod.slice(son));
}
function renklendirHepsi(kok) {
  kok.querySelectorAll("pre.py").forEach(p => { if (!p.dataset.r) { p.innerHTML = renklendir(p.textContent); p.dataset.r = 1; } });
}

/* ─── Python (Pyodide) ─── */
const PYO = "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/";
let py = null, pyYukleniyor = null;
function pyDurum(s, metin) { const b = document.getElementById("pybar"); b.dataset.s = s; document.getElementById("pytxt").textContent = metin; document.getElementById("pyload").hidden = s !== "yok" && s !== "hata"; }
function pyHazirla() {
  if (py) return Promise.resolve(py);
  if (pyYukleniyor) return pyYukleniyor;
  pyDurum("yukleniyor", "Python yükleniyor… (ilk sefer ~20 sn)");
  pyYukleniyor = new Promise((ok, no) => {
    const s = document.createElement("script"); s.src = PYO + "pyodide.js";
    s.onload = async () => {
      try {
        py = await loadPyodide({ indexURL: PYO });
        pyDurum("yukleniyor", "pandas yükleniyor…");
        await py.loadPackage(["pandas"]);
        for (const [k, v] of Object.entries(C.veriler)) py.globals.set(k, py.toPy(v));
        pyDurum("hazir", "Python hazır"); ok(py);
      } catch (e) { pyDurum("hata", "Python yüklenemedi"); pyYukleniyor = null; no(e); }
    };
    s.onerror = () => { pyDurum("hata", "Python indirilemedi (internet?)"); pyYukleniyor = null; no(new Error("indirilemedi")); };
    document.head.appendChild(s);
  });
  return pyYukleniyor;
}
document.getElementById("pyload").onclick = () => pyHazirla().catch(() => {});

const GRAFIK_ON = 'import matplotlib\nmatplotlib.use("Agg")\nimport matplotlib.pyplot as plt\nplt.show = lambda *a, **k: None\n';
const GRAFIK_SON = 'import sys, io, base64\n__figler = []\nif "matplotlib.pyplot" in sys.modules:\n    import matplotlib.pyplot as _plt\n    for _n in _plt.get_fignums():\n        _b = io.BytesIO(); _plt.figure(_n).savefig(_b, format="png", dpi=110, bbox_inches="tight"); __figler.append(base64.b64encode(_b.getvalue()).decode())\n    _plt.close("all")\n__figler';
async function calistir(kod, setup = [], test = null) {
  const p = await pyHazirla();
  const kurulum = setup.map(k => C.kurulum[k]).join("\n");
  const grafik = /matplotlib|plt\./.test(kod);
  await p.loadPackagesFromImports(kurulum + "\n" + kod + (grafik ? "\nimport matplotlib" : "") + (test && /scipy|stats/.test(kod) ? "\nimport scipy" : ""));
  const ns = p.globals.get("dict")();
  for (const k of Object.keys(C.veriler)) ns.set(k, p.globals.get(k));
  ns.set("__kod__", kod);
  let cikti = ""; p.setStdout({ batched: s => { cikti += s + "\n"; } }); p.setStderr({ batched: s => { cikti += s + "\n"; } });
  const sonuc = { cikti: "", hata: null, test: null, figler: [] };
  try {
    if (grafik) await p.runPythonAsync(GRAFIK_ON, { globals: ns });
    if (kurulum) await p.runPythonAsync(kurulum, { globals: ns });
    await p.runPythonAsync(kod, { globals: ns });
    ns.set("__cikti__", cikti);
    if (test) {
      try { await p.runPythonAsync(test, { globals: ns }); sonuc.test = { ok: true }; }
      catch (e) { sonuc.test = { ok: false, mesaj: hataOzet(e, true) }; }
    }
  } catch (e) { sonuc.hata = hataOzet(e); }
  try { const f = await p.runPythonAsync(GRAFIK_SON, { globals: ns }); sonuc.figler = f.toJs ? f.toJs() : []; } catch (e) {}
  sonuc.cikti = cikti; ns.destroy();
  return sonuc;
}
function hataOzet(e, test) {
  const m = String(e && e.message || e).trim().split("\n");
  const son = m[m.length - 1] || "Hata";
  if (test && son.startsWith("AssertionError")) return son.replace(/^AssertionError:?\s*/, "") || "Sonuç beklenenle aynı değil.";
  const satir = m.reverse().find(l => /File "<exec>", line \d+/.test(l));
  const ipucu = { NameError: "Bu isim tanımlı değil; yazımı ya da tanımlandığı satırı kontrol et.", SyntaxError: "Yazım hatası: parantez, tırnak veya iki nokta eksik olabilir.",
    IndentationError: "Girinti hatası: blok içindeki satırlar aynı miktarda (4 boşluk) içeride olmalı.", KeyError: "Olmayan bir anahtar/sütun adı istendi.",
    TypeError: "Yanlış tipte değerle işlem yapılıyor.", AttributeError: "Bu nesnede böyle bir özellik/yöntem yok." };
  const tip = (son.match(/^(\w+Error)/) || [])[1];
  return son + (satir ? `  (${satir.trim().replace(/File "<exec>", /, "")})` : "") + (ipucu[tip] ? `\n→ ${ipucu[tip]}` : "");
}

/* ─── soru bileşenleri ─── */
const TUR_AD = { mc: "Seç", fill: "Boşluk doldur", order: "Sırala", code: "Kod yaz" };
const ZOR_AD = ["", "Kolay", "Orta", "Zor"];
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function soruKart(q, no, toplam, opt = {}) {
  const kart = el(`<article class="q" id="q-${q.id}">
    <div class="q-top"><span class="tur">${opt.baslik || `Soru ${no}/${toplam}`}${opt.ornek ? "" : " · " + (q.hata ? "Hatayı bul" : q.code && q.t === "mc" ? "Çıktıyı tahmin et" : TUR_AD[q.t])}</span>
      <span class="tags">${opt.ornek ? "" : `<span class="zor z${q.zorluk || 1}">${ZOR_AD[q.zorluk || 1]}</span>`}${q.tags.map(t => `<span class="tag">${ETK[t] || t}</span>`).join("")}${opt.kaynak ? `<span class="tag">${opt.kaynak}</span>` : ""}</span></div>
    <div class="q-text">${q.q}</div></article>`);
  const r = K.q[q.id]; if (r?.cozuldu && !opt.taze) kart.dataset.durum = "dogru";
  const ekle = n => kart.appendChild(n);
  const geri = (ok, html) => { let f = kart.querySelector(".fb"); if (!f) f = ekle(el(`<div class="fb"></div>`)); f.className = "fb " + (ok === null ? "info" : ok ? "ok" : "bad"); f.innerHTML = html; };
  let ilkDeneme = true;
  const sonuc = ok => { if (ilkDeneme || ok) kaydetSonuc(q, ok); ilkDeneme = false; if (ok) kart.dataset.durum = "dogru"; opt.bitince && opt.bitince(q, ok); };

  if (q.t === "mc") {
    if (q.code) ekle(el(`<pre class="q-code">${renklendir(q.code)}</pre>`));
    const ops = ekle(el(`<div class="opts"></div>`)); const kodMu = q.opts.every(o => /[\[\]"'(){}=0-9]/.test(o) || o.length < 12);
    q.opts.forEach((o, i) => {
      const b = el(`<button class="opt${kodMu ? "" : " duz"}">${o.startsWith("<") ? o : kacis(o).replace(/&lt;(\/?(code|b))&gt;/g, "<$1>")}</button>`);
      b.onclick = () => {
        const dogru = i === q.a; b.classList.add(dogru ? "dogru" : "yanlis");
        if (dogru) { ops.querySelectorAll("button").forEach(x => x.disabled = true); geri(true, "Doğru. " + q.why); }
        else { b.disabled = true; geri(false, "Olmadı, tekrar dene."); }
        sonuc(dogru);
      };
      ops.appendChild(b);
    });
  }

  if (q.t === "fill") {
    const parcalar = q.code.split("___"); const kutu = ekle(el(`<div class="fill-code"></div>`));
    parcalar.forEach((p, i) => {
      kutu.appendChild(el(`<span>${renklendir(p)}</span>`));
      if (i < parcalar.length - 1) { const inp = el(`<input aria-label="Boşluk ${i + 1}" autocomplete="off" spellcheck="false">`); inp.size = Math.max(4, ...q.a[i].map(x => x.length)); kutu.appendChild(inp); }
    });
    const norm = s => s.trim().replace(/\s+/g, " ").replace(/'/g, '"');
    let yanlis = 0;
    const satir = ekle(el(`<div class="row"><button class="btn ana">Kontrol et</button><button class="btn" hidden>Cevabı göster</button></div>`));
    const [kb, gb] = satir.querySelectorAll("button");
    const kontrol = () => {
      const inps = [...kutu.querySelectorAll("input")]; let hepsi = true;
      inps.forEach((inp, i) => { const ok = q.a[i].some(c => norm(c) === norm(inp.value)); inp.className = ok ? "dogru" : "yanlis"; hepsi = hepsi && ok; });
      if (hepsi) { geri(true, "Doğru. " + q.why); kb.disabled = true; } else { yanlis++; geri(false, "Kırmızı kutuları kontrol et."); if (yanlis >= 2) gb.hidden = false; }
      sonuc(hepsi);
    };
    kb.onclick = kontrol; kutu.addEventListener("keydown", e => { if (e.key === "Enter") kontrol(); });
    gb.onclick = () => { [...kutu.querySelectorAll("input")].forEach((inp, i) => { inp.value = q.a[i][0]; inp.className = "dogru"; }); geri(null, "Cevap: " + q.why); };
  }

  if (q.t === "order") {
    const karisik = q.lines.map((l, i) => ({ l, i })); do { karisik.sort(() => Math.random() - .5); } while (karisik.length > 1 && karisik.every((x, j) => x.i === j));
    const alan = ekle(el(`<div class="ord"><div class="ord-box havuz"><span class="lbl">Satırlar — tıkla, cevaba ekle</span></div><div class="ord-box cevap"><span class="lbl">Cevabın — tıkla, geri al</span></div></div>`));
    const [havuz, cevap] = alan.querySelectorAll(".ord-box");
    karisik.forEach(x => { const b = el(`<button class="ord-line"></button>`); b.innerHTML = renklendir(x.l); b.dataset.i = x.i; b.onclick = () => (b.parentElement === havuz ? cevap : havuz).appendChild(b); havuz.appendChild(b); });
    const satir = ekle(el(`<div class="row"><button class="btn ana">Kontrol et</button><button class="btn">Karıştır</button></div>`));
    const [kb, sb] = satir.querySelectorAll("button");
    kb.onclick = () => {
      const sira = [...cevap.querySelectorAll(".ord-line")].map(b => +b.dataset.i);
      if (sira.length < q.lines.length) { geri(null, "Önce bütün satırları cevaba taşı."); return; }
      const ok = sira.every((v, j) => v === j); geri(ok, ok ? "Doğru. " + q.why : "Sıra doğru değil. İpucu: " + q.why.split(".")[0] + ".");
      sonuc(ok);
    };
    sb.onclick = () => { [...cevap.querySelectorAll(".ord-line")].forEach(b => havuz.appendChild(b)); };
  }

  if (q.t === "code") {
    const ed = ekle(el(`<div class="ed"><textarea spellcheck="false" autocapitalize="off" aria-label="Kod editörü"></textarea></div>`));
    const ta = ed.querySelector("textarea"); const tasl = "kodhatti.taslak." + q.id;
    let bas = q.starter; if (!opt.taze) try { bas = localStorage.getItem(tasl) ?? q.starter; } catch (e) {}
    ta.value = bas; const boy = () => { ta.style.height = "auto"; ta.style.height = Math.max(opt.ornek ? 60 : 150, ta.scrollHeight + 4) + "px"; }; setTimeout(boy);
    ta.addEventListener("input", () => { boy(); if (!opt.taze) try { localStorage.setItem(tasl, ta.value); } catch (e) {} });
    ta.addEventListener("keydown", e => {
      if (e.key === "Tab") { e.preventDefault(); const s = ta.selectionStart; ta.setRangeText("    ", s, ta.selectionEnd, "end"); }
      if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); (opt.ornek ? cb : kb).click(); }
      if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
        const s = ta.selectionStart, satirBas = ta.value.lastIndexOf("\n", s - 1) + 1, satirMetin = ta.value.slice(satirBas, s);
        let girinti = satirMetin.match(/^\s*/)[0]; if (/:\s*$/.test(satirMetin)) girinti += "    ";
        e.preventDefault(); ta.setRangeText("\n" + girinti, s, ta.selectionEnd, "end"); boy();
      }
    });
    const satir = ekle(el(`<div class="row"><button class="btn">Çalıştır</button><button class="btn ana">Kontrol et</button><button class="btn">İpucu</button><button class="btn" hidden>Çözümü göster</button><button class="btn">Sıfırla</button><span class="kbd">Ctrl+Enter: kontrol</span></div>`));
    const [cb, kb, ib, gb, rb] = satir.querySelectorAll("button");
    const cikti = ekle(el(`<div class="out" hidden></div>`)); let yanlis = 0;
    const goster = s => {
      cikti.hidden = false; cikti.innerHTML = "";
      if (s.cikti) cikti.appendChild(document.createTextNode(s.cikti));
      if (s.hata) cikti.appendChild(el(`<div class="err">${kacis(s.hata)}</div>`));
      if (!s.cikti && !s.hata && !s.figler.length) cikti.appendChild(el(`<span style="color:var(--faint)">(çıktı yok — bir şey görmek için print() kullan)</span>`));
      s.figler.forEach(b => cikti.appendChild(el(`<img alt="Kodunun çizdiği grafik" src="data:image/png;base64,${b}">`)));
    };
    const calis = async test => {
      [cb, kb].forEach(b => b.disabled = true); const eski = cb.textContent; cb.textContent = py ? "Çalışıyor…" : "Python yükleniyor…";
      try { const s = await calistir(ta.value, q.setup, test ? q.test : null); goster(s); return s; }
      catch (e) { goster({ cikti: "", hata: "Python yüklenemedi. İnternet bağlantını kontrol edip sayfayı yenile.", figler: [] }); return null; }
      finally { [cb, kb].forEach(b => b.disabled = false); cb.textContent = eski; }
    };
    cb.onclick = () => calis(false);
    kb.onclick = async () => {
      const s = await calis(true); if (!s) return;
      if (s.hata) { geri(false, "Kod hata verdi; çıktıdaki kırmızı satıra bak."); sonuc(false); yanlis++; }
      else if (s.test?.ok) { geri(true, "Doğru, testler geçti." + (q.why ? " " + q.why : "")); sonuc(true); }

      if (yanlis >= 2) gb.hidden = false;
    };
    ib.onclick = () => { if (!kart.querySelector(".hint")) satir.after(el(`<div class="hint"><b>İpucu:</b> ${q.hint}</div>`)); };
    gb.onclick = () => { ta.value = q.sol; boy(); geri(null, "Örnek çözüm editöre yazıldı. Çalıştırıp incele; farklı ama doğru çözümler de olabilir."); };
    rb.onclick = () => { ta.value = q.starter; boy(); try { localStorage.removeItem(tasl); } catch (e) {} };
    if (opt.ornek) { [kb, ib, gb].forEach(b => b.remove()); satir.querySelector(".kbd").textContent = "Değiştir, dene · Ctrl+Enter: çalıştır"; kart.querySelector(".q-text").remove(); }
  }
  return kart;
}

const view = document.getElementById("view");

    ${al.length ? `<section class="adim" id="alistirma"><div class="adim-bas"><span class="no">✎</span><h2>Alıştırmalar</h2><span style="margin-left:auto;font-size:13px;color:var(--muted)">kolaydan zora</span></div><div class="liste" style="display:flex;flex-direction:column;gap:14px"></div></section>` : ""}

function tekrarSayfasi(b) {

/* ─── yönlendirme ─── */
function git() {
  const r = location.hash.slice(1) || "harita"; const b = BOL.find(x => x.id === r);
  if (b) b.tur === "ders" ? dersSayfasi(b) : tekrarSayfasi(b);

  document.getElementById("side").classList.remove("acik"); document.getElementById("menuBtn").setAttribute("aria-expanded", "false");

document.getElementById("menuBtn").onclick = e => { const s = document.getElementById("side"); s.classList.toggle("acik"); e.currentTarget.setAttribute("aria-expanded", s.classList.contains("acik")); };

/* ─── tema ─── */

document.querySelectorAll(".theme-row button").forEach(b => b.onclick = () => tema(b.dataset.t));

window.__tumunuDene = async () => {
  const sonuc = [];
  for (const q of Object.values(SORU).filter(q => q.t === "code")) {
    const s = await calistir(q.sol, q.setup, q.test); sonuc.push([q.id, s.hata || (s.test?.ok ? "OK" : s.test?.mesaj)]);
