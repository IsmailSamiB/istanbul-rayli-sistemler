_name()\ndf[\"is_weekend\"] = df[\"date\"].dt.weekday >= 5\n\nbos_istasyon = df[\"station_name\"].isna()\ndf.loc[bos_istasyon & (df[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"\ndf.loc[bos_istasyon & (df[\"line\"] == \"IETT NOSTALJIK TRAMVAY\"), \"station_name\"] = \"Taksim-Tünel Nostaljik Tramvay\"\n\ndf.loc[df[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"town\"] = \"EyüpSultan\"\n\ndf[\"age\"] = df[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})\ndf[\"age\"] = pd.Categorical(df[\"age\"], categories=yas_sirasi, ordered=True)\n\ndf[\"line_code\"] = df[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0].fillna(df[\"line\"])\ndf[\"line_code\"] = df[\"line_code\"].replace({\n    \"TCDD TASIMACILIK A.S.\": \"Marmaray\",\n    \"TCDD - GAYRETTEPE-ISTANBUL YENI HAVALIMANI\": \"M11\",\n})\n\nprint(df)", "test": "for s in [\"longitude\", \"latitude\", \"station_number\"]:\n    assert s not in df.columns, f\"{s} sütunu silinmeli\"\nassert \"date\" in df.columns and pd.api.types.is_datetime64_any_dtype(df[\"date\"]), \"date sütunu tarih tipinde olmalı\"\nassert list(df[\"weekday\"]) == [\"Monday\", \"Monday\", \"Saturday\", \"Saturday\", \"Saturday\", \"Monday\", \"Monday\"], f\"weekday yanlış: {list(df['weekday'])}\"\nassert list(df[\"is_weekend\"]) == [False, False, True, True, True, False, False], \"is_weekend yanlış (dt.weekday >= 5)\"\nassert df[\"station_name\"].isna().sum() == 0, \"Boş istasyon adı kaldı\"\nassert df.loc[3, \"station_name\"] == \"Kadıköy-Moda T3\", \"T3 satırının istasyon adı Kadıköy-Moda T3 olmalı\"\nassert df.loc[4, \"station_name\"] == \"Taksim-Tünel Nostaljik Tramvay\", \"Nostaljik tramvay satırının istasyon adı yanlış\"\nassert df.loc[5, \"town\"] == \"EyüpSultan\", \"ÇIRÇIR DOĞU'nun ilçesi EyüpSultan olmalı\"\nassert isinstance(df[\"age\"].dtype, pd.CategoricalDtype) and df[\"age\"].cat.ordered, \"age sıralı kategori olmalı (ordered=True)\"\nassert list(df[\"age\"].cat.categories) == [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"], \"Kategori sırası yas_sirasi olmalı\"\nassert df[\"age\"].isna().sum() == 0 and (df[\"age\"] == \"Bilinmiyor\").sum() == 1, \"Unkown → Bilinmiyor düzeltmesi kategoriden ÖNCE yapılmalı\"\nassert list(df[\"line_code\"]) == [\"M4\", \"M4\", \"Marmaray\", \"T3\", \"IETT NOSTALJIK TRAMVAY\", \"M7\", \"M11\"], f\"line_code yanlış: {list(df['line_code'])}\"", "hint": "Sıra önemli: sütunları sil → tarih → <code>bos_istasyon = df[\"station_name\"].isna()<\/code> ile maske ve <code>df.loc[maske &amp; (df[\"line\"] == ...), \"station_name\"] = ...<\/code> → ilçe düzeltmesi → önce <code>replace<\/code> sonra <code>pd.Categorical<\/code> → <code>str.extract(...)[0].fillna(df[\"line\"])<\/code> ve sözlüklü <code>replace<\/code>.", "tags": ["pandas_metin", "kategori", "fillna", "loc", "tarih"], "setup": ["ham"], "rev": false, "why": "Bu, gerçek clean_data.py'nin neredeyse satır satır aynısı. Tek fark, gerçek dosyada en sonda to_csv ile passenger_clean.csv'ye kaydetmen.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "Bir sütunda NaN varken <code>.astype(int)<\/code> çağırırsan ne olur?", "opts": ["NaN 0 olur", "Hata verir", "NaN silinir", "Hiçbir şey olmaz"], "a": 1, "why": "Tam sayı tipi NaN tutamaz; önce <code>dropna<\/code> ya da <code>fillna<\/code>.", "tags": ["fillna"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>melt<\/code> sonrası tablo nasıl değişir?", "opts": ["Daha geniş ve kısa olur", "Daha uzun ve dar olur", "Aynı kalır", "Sütunlar silinir"], "a": 1, "why": "Her hat sütunu satırlara dönüşür: satır sayısı artar, sütun sayısı azalır.", "tags": ["melt"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>str.extract(...)<\/code> neden sonunda <code>[0]<\/code> ile kullanılıyor?", "opts": ["İlk satırı almak için", "extract bir DataFrame döndürür; [0] ilk grubun sütununu alır", "NaN'ları silmek için", "Metni sayıya çevirmek için"], "a": 1, "why": "Her yakalama grubu bir sütun olur. Tek grup var; onu <code>[0]<\/code> ile Series olarak alırsın.", "tags": ["pandas_metin"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Yaş sütunu sıralı kategoriyken <code>df[\"age\"] &lt; \"60+\"<\/code> hangi satırları seçer?", "opts": ["Yalnızca 60+ satırlarını", "Kategori sırasında 60+'dan önce gelen grupları", "Hiçbirini; metinler karşılaştırılamaz", "Bilinmiyor satırlarını"], "a": 1, "why": "<code>ordered=True<\/code> olduğu için karşılaştırma senin verdiğin sıraya göre yapılır: &lt;20, 20-30 ve 30-60.", "tags": ["kategori"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b9", "no": 9, "tur": "ders", "baslik": "Gruplama: groupby", "hat": "M9", "ozet": "Böl-uygula-birleştir: hat ve istasyon bazında toplamlar, agg ile birden çok özet, sıralama ve pay, çok seviyeli index ve pasta grafiği için \"Diğer\" satırı.", "dosya": "analiz.ipynb", "proje": "gecis_orani = yolcu.groupby(\"line_code\")[[\"passage_cnt\", \"passanger_cnt\"]].sum()\ngecis_orani = (gecis_orani[\"passage_cnt\"] / gecis_orani[\"passanger_cnt\"]).sort_values()\n\nhat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values(ascending=False)\n\npay = hat_yolcu / hat_yolcu.sum() * 100\nilk = pay.sort_values(ascending=False).head(6)\ndiger = pay.drop(ilk.index)\npasta = pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])\n...\nyolcu[\"istasyon\"] = yolcu[\"station_name\"].map(istasyon_adi)\nistasyon_yolcu = yolcu.groupby([\"line_code\", \"istasyon\"])[\"passanger_cnt\"].sum().sort_values(ascending=False)\nilk10 = istasyon_yolcu.head(10) / 1_000_000\n...\naylik_toplam = yolcu.groupby(\"transaction_month\")[\"passanger_cnt\"].sum()\ngun_sayisi = yolcu.groupby(\"transaction_month\")[\"date\"].nunique()\ngunluk_ort = aylik_toplam / gun_sayisi", "adimlar": [{"baslik": "Böl, uygula, birleştir", "html": "\n<p><code>groupby<\/code>, bir soruyu \"her … için\" diye sormanın yoludur: <i>her hat için<\/i> toplam yolcu, <i>her ay için<\/i> gün sayısı.\nArka planda üç adım var:<\/p>\n<pre class=\"py\">1) BÖL       aynı line_code'lu satırlar bir grup olur\n             M2 → 27 satır   M4 → 27 satır   ...   TF1 → 9 satır\n2) UYGULA    her grubun passanger_cnt sütununa sum()\n             M2 → 37757      M4 → 18382      ...   TF1 → 919\n3) BİRLEŞTİR sonuçlar tek bir Series olur; index'i hat kodları\n             line_code\n             M2      37757\n             M4      18382\n             ...<\/pre>\n<pre class=\"py\">hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\n#                 └─── böl ───────────┘└─ hangi sütun ┘ └ uygula<\/pre>\n<h3>Hangi özet?<\/h3>\n<pre class=\"py\">g = yolcu.groupby(\"line_code\")\ng[\"passanger_cnt\"].sum()      # toplam\ng[\"passanger_cnt\"].mean()     # satırların ortalaması\ng.size()                      # her grupta kaç satır var\ng[\"station_name\"].nunique()   # her grupta kaç FARKLI istasyon var<\/pre>\n<p>Not defterinde <code>yolcu.groupby(\"transaction_month\")[\"date\"].nunique()<\/code> ile her ayda kaç farklı gün olduğunu buluyorsun.\nAy toplamını buna bölünce günlük ortalama çıkıyor.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Sonuçta grup anahtarları <b>index<\/b> olur. Bu sayede <code>hat_yolcu[\"M2\"]<\/code> diye doğrudan okuyabilirsin.\nİki sonucu birbirine bölerken de (<code>aylik_toplam / gun_sayisi<\/code>) pandas ayları etiketlerinden eşleştirir.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>size()<\/code> ile <code>nunique()<\/code>'i karıştırmak. Örnek veride M2'nin 27 <b>satırı<\/b> var ama yalnızca 3\n<b>farklı<\/b> istasyonu. \"Kaç istasyon?\" sorusu <code>nunique<\/code>, \"kaç kayıt?\" sorusu <code>size<\/code> ister.<\/div>\n", "ornek": "g = yolcu.groupby(\"line_code\")\nprint(g[\"passanger_cnt\"].sum())\nprint(g.size())\nprint(g[\"station_name\"].nunique())\n\nprint(yolcu.groupby(\"transaction_month\")[\"date\"].nunique())", "ornek_setup": ["yolcu"]}, {"baslik": "Birden çok özet: agg", "html": "\n<p>Aynı gruplama için birkaç sayı birden istiyorsan <code>agg<\/code> kullan. İşlev adlarını liste olarak verirsin:<\/p>\n<pre class=\"py\">yolcu.groupby(\"line_code\")[\"passanger_cnt\"].agg([\"sum\", \"mean\", \"max\"])\n#              sum    mean   max\n# M2         37757  1398.4  2965\n# M4         18382   680.8  1409 ...<\/pre>\n<p>Sütun adlarını kendin koymak istersen <b>adlandırılmış agg<\/b> kullan: <code>yeni_ad=(\"sütun\", \"işlev\")<\/code>.<\/p>\n<pre class=\"py\">ozet = yolcu.groupby(\"line_code\").agg(\n    toplam=(\"passanger_cnt\", \"sum\"),\n    istasyon=(\"station_name\", \"nunique\"),\n    gun=(\"date\", \"nunique\"),\n)<\/pre>\n<h3>Birden çok sütunu birlikte toplamak<\/h3>\n<p>Not defterinin ilk analizinde geçiş ve yolcu sütunlarını birlikte topluyorsun. Çift köşeli parantez bir <b>DataFrame<\/b> seçer:<\/p>\n<pre class=\"py\">gecis_orani = yolcu.groupby(\"line_code\")[[\"passage_cnt\", \"passanger_cnt\"]].sum()\ngecis_orani = gecis_orani[\"passage_cnt\"] / gecis_orani[\"passanger_cnt\"]<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> \"Ortalama\"nın neyin ortalaması olduğunu unutmak. <code>groupby(\"line_code\")[\"passanger_cnt\"].mean()<\/code> <b>satırların<\/b>\nortalamasıdır; bir satır da istasyon × gün × yaş grubu demek. M2 için 1398 çıkar. Hattın <b>günlük<\/b> ortalaması için önce hat + gün toplamını al, sonra onun\nortalamasını: 12586. Not defterindeki hafta sonu hesabında iki adımlı gruplama bu yüzden var.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Oranı toplamlardan hesaplamak (önce topla, sonra böl) büyük istasyonlara hak ettikleri ağırlığı verir. Her satırın oranını\nalıp ortalamasını hesaplasaydın 20 yolculu bir satır ile 3000 yolculu bir satır aynı ağırlıkta sayılırdı.<\/div>\n", "ornek": "ozet = yolcu.groupby(\"line_code\").agg(\n    toplam=(\"passanger_cnt\", \"sum\"),\n    istasyon=(\"station_name\", \"nunique\"),\n)\nprint(ozet)\n\ngunluk = yolcu.groupby([\"line_code\", \"date\"])[\"passanger_cnt\"].sum().reset_index()\nprint(gunluk.groupby(\"line_code\")[\"passanger_cnt\"].mean().round(0))   # günlük ortalama\nprint(yolcu.groupby(\"line_code\")[\"passanger_cnt\"].mean().round(0))    # satır ortalaması: bambaşka", "ornek_setup": ["yolcu"]}, {"baslik": "Sıralamak, en büyükleri seçmek, pay hesaplamak", "html": "\n<pre class=\"py\">hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values(ascending=False)\nhat_yolcu.head(3)        # en büyük 3\nhat_yolcu.nlargest(3)    # sıralayıp head(3) ile aynı\nhat_yolcu.idxmax()       # en büyük değerin ETİKETİ: 'M2'\nhat_yolcu.max()          # en büyük DEĞER: 37757<\/pre>\n<p><code>sort_values<\/code> varsayılan olarak küçükten büyüğe sıralar; büyükten küçüğe için <code>ascending=False<\/code>. DataFrame'de hangi sütuna göre\nsıralanacağını da söylersin: <code>hat_oran.sort_values(\"sefer_basina_yolcu\", ascending=False)<\/code>.<\/p>\n<h3>Pay<\/h3>\n<pre class=\"py\">pay = hat_yolcu / hat_yolcu.sum() * 100<\/pre>\n<p>Series'i tek bir sayıya bölmek her elemanı böler. Sonuç yine hat kodlarıyla etiketli bir Series'tir; toplamı 100.<\/p>\n<h3>reset_index: index'i sütuna geri çevirmek<\/h3>\n<pre class=\"py\">hat_yolcu.reset_index()\n#   line_code  passanger_cnt\n# 0        M2          37757\n# 1  Marmaray          28069 ...<\/pre>\n<p>Sonuç yeniden düz bir tablo olur. <code>merge<\/code> yapacaksan ya da sonucu başka bir sütunla tekrar gruplayacaksan bu gerekir.\nNot defterindeki <code>aylik_yolcu<\/code> tam olarak bunu yapıyor.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>hat_yolcu.sort_values(ascending=False)<\/code> yazıp sonucu atamamak. Sıralanmış yeni bir Series üretilir ve kaybolur;\nsonraki <code>head(3)<\/code> alfabetik ilk üçü (M2, M4, Marmaray) verir.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>idxmax<\/code> \"hangisi?\" sorusunu, <code>max<\/code> \"ne kadar?\" sorusunu cevaplar. Grafik başlığına en kalabalık hattın adını\nyazacaksan <code>idxmax<\/code> gerekir.<\/div>\n", "ornek": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values(ascending=False)\nprint(hat_yolcu.head(3))\nprint(hat_yolcu.idxmax(), hat_yolcu.max())\n\npay = hat_yolcu / hat_yolcu.sum() * 100\nprint(pay.round(1))\nprint(hat_yolcu.reset_index())", "ornek_setup": ["yolcu"]}, {"baslik": "Çok seviyeli index: iki sütunla gruplamak", "html": "\n<p>Birden çok sütunla gruplarsan her grup bir <b>ikili<\/b> olur ve sonucun index'i iki seviyeli olur (MultiIndex):<\/p>\n<pre class=\"py\">ist = yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\n# line_code  station_name\n# M2         Taksim              9686\n#            Yenikapı           12917\n#            Şişli-Mecidiyeköy  15154\n# ...\n# Marmaray   Yenikapı           16146\n#            Üsküdar 1          11923<\/pre>\n<p>Yenikapı iki kez var: bir kez M2, bir kez Marmaray altında. Aktarma istasyonları her hat için ayrı sayılır; grafiğinin dipnotu da bunu söylüyor.<\/p>\n<h3>İçinden seçmek<\/h3>\n<pre class=\"py\">ist.loc[\"M2\"]                              # M2'nin bütün istasyonları\nist.loc[(\"M2\", \"Taksim\")]                  # tek değer: 9686\nist.xs(\"Yenikapı\", level=\"station_name\")   # Yenikapı, her hatta\nist.groupby(level=\"line_code\").sum()       # yeniden hat toplamına dön<\/pre>\n<h3>.map ile grup anahtarını düzeltmek<\/h3>\n<p>Aynı istasyon farklı girişlerle yazılmış olabilir: \"Kadıköy (Doğu)\" ve \"Kadıköy (Batı)\". Not defterinde her adı bir fonksiyondan geçirip yeni bir sütun\nyapıyorsun, sonra onunla grupluyorsun:<\/p>\n<pre class=\"py\">yolcu[\"istasyon\"] = yolcu[\"station_name\"].map(istasyon_adi)<\/pre>\n<p><code>.map<\/code> her hücreyi fonksiyona (ya da sözlüğe) sokar ve dönen değeri yazar. Sözlükte karşılığı olmayan değerler NaN olur.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Temizlik gruplamadan <b>önce<\/b> yapılır. Anahtarı düzeltirsen <code>groupby<\/code> iki girişi kendiliğinden tek grupta toplar;\nsonradan elle toplamaya uğraşmazsın.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>ist.loc[\"Yenikapı\"]<\/code> yazmak. <code>.loc<\/code> ilk seviyeye (hat koduna) bakar ve <code>KeyError<\/code> verir.\nİkinci seviyeden seçmek için <code>xs(..., level=...)<\/code> kullan.<\/div>\n", "ornek": "import re\n\nist = yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\nprint(ist.loc[\"M2\"])\nprint(ist.xs(\"Yenikapı\", level=\"station_name\"))\n\ndef istasyon_adi(ad):\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)      # parantez içini sil\n    ad = re.sub(r\"\\s\\d+$\", \" \", ad)       # sondaki numarayı sil\n    return re.sub(r\"\\s+\", \" \", ad).strip()\n\nyolcu[\"istasyon\"] = yolcu[\"station_name\"].map(istasyon_adi)\nprint(yolcu[\"station_name\"].nunique(), \"giriş adı →\", yolcu[\"istasyon\"].nunique(), \"istasyon\")\nprint(yolcu.groupby([\"line_code\", \"istasyon\"])[\"passanger_cnt\"].sum().loc[\"M4\"])", "ornek_setup": ["yolcu"]}, {"baslik": "pd.concat ile \"Diğer\" satırı", "html": "\n<p>Gerçek veride 23 hat var; pasta grafiğinde hepsini göstermek okunmaz. Not defterinde ilk 6 hattı ayrı bırakıp kalanları tek bir \"Diğer\" diliminde topluyorsun:<\/p>\n<pre class=\"py\">pay = hat_yolcu / hat_yolcu.sum() * 100\nilk = pay.sort_values(ascending=False).head(6)    # en büyük 6\ndiger = pay.drop(ilk.index)                        # geri kalanlar\npasta = pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])<\/pre>\n<ul>\n<li><code>pay.drop(ilk.index)<\/code>: ilk 6'nın etiketlerini çıkarır; kalan hatlar <code>diger<\/code>'de.<\/li>\n<li><code>pd.Series({\"Diğer 17 hat\": 26.7})<\/code>: tek elemanlı yeni bir Series. Etiketi f-string ile kurduğun için hat sayısı değişse de doğru yazılır.<\/li>\n<li><code>pd.concat([a, b])<\/code>: Series'leri alt alta ekler. Sıra korunur, \"Diğer\" en sona gelir.<\/li>\n<\/ul>\n<pre class=\"py\">M2             38.3\nMarmaray       28.5     ← ilk (örnek veride N = 3)\nM4             18.6\nDiğer 2 hat    14.6     ← pd.Series ile eklenen satır\n                ────\ntoplam        100.0<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> Payları \"Diğer\"e koymadan sadece ilk 6'yı çizseydin pasta %100'e tamamlanmaz, dilimler olduğundan büyük görünürdü.\nToplamın 100 kaldığını <code>pasta.sum()<\/code> ile kontrol etmek iyi bir alışkanlık.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>pd.concat(ilk, diger_satiri)<\/code> yazmak. <code>concat<\/code> tek bir <b>liste<\/b> alır:\n<code>pd.concat([ilk, diger_satiri])<\/code>. Köşeli parantez unutulursa hata verir.<\/div>\n", "ornek": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\npay = hat_yolcu / hat_yolcu.sum() * 100\n\nilk = pay.sort_values(ascending=False).head(3)\ndiger = pay.drop(ilk.index)\npasta = pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])\nprint(pasta.round(1))\nprint(\"Toplam:\", round(pasta.sum(), 1))\nprint(f\"İlk 3 hattın payı: %{ilk.sum():.0f}\")", "ornek_setup": ["yolcu"]}], "sorular": [{"t": "mc", "q": "<code>yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()<\/code> sonucunun index'inde ne olur?", "opts": ["0, 1, 2… satır numaraları", "Hat kodları", "Sütun adları", "Tarihler"], "a": 1, "why": "Grup anahtarları sonucun index'i olur; her hat için bir satır.", "tags": ["groupby"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["1", "2", "3", "0"], "a": 0, "why": "M2'nin iki satırı var ama ikisi de Taksim. <code>nunique<\/code> farklı değerleri sayar: 1. <code>size()<\/code> olsaydı 2 çıkardı.", "tags": ["groupby", "nunique"], "code": "df = pd.DataFrame({\"hat\": [\"M2\", \"M2\", \"T1\"],\n                   \"istasyon\": [\"Taksim\", \"Taksim\", \"Eminönü\"]})\nprint(df.groupby(\"hat\")[\"istasyon\"].nunique()[\"M2\"])", "rev": false, "zorluk": 2, "yer": "a0"}, {"t": "fill", "q": "Boşlukları doldur: her hat için toplam yolcu ve farklı istasyon sayısı.", "code": "ozet = yolcu.groupby(\"line_code\").agg(\n    toplam=(\"passanger_cnt\", ___),\n    istasyon=(\"station_name\", ___),\n)", "a": [["\"sum\""], ["\"nunique\""]], "why": "Adlandırılmış agg'de her sütun <code>(\"sütun\", \"işlev\")<\/code> ikilisidir: <code>\"sum\"<\/code> ve <code>\"nunique\"<\/code>.", "tags": ["agg", "nunique"], "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>yolcu.groupby(\"line_code\")[[\"passage_cnt\", \"passanger_cnt\"]].sum()<\/code> ne döndürür?", "opts": ["Tek bir sayı", "Hat başına iki sütunlu bir DataFrame", "İki ayrı Series'ten oluşan liste", "Hata verir"], "a": 1, "why": "Çift köşeli parantez bir sütun <b>listesi<\/b> seçer; sonuç her hat için iki toplamlı bir tablodur.", "tags": ["groupby", "agg"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>hat_yolcu.idxmax()<\/code> ne döndürür?", "opts": ["En büyük değeri", "En büyük değerin etiketini (index)", "En büyük değerin sıra numarasını", "Sıralanmış seriyi"], "a": 1, "why": "<code>idxmax<\/code> etiketi (ör. \"M2\"), <code>max<\/code> değeri verir.", "tags": ["sort"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[50.0, 30.0, 20.0]", "[0.5, 0.3, 0.2]", "100.0", "[50, 30, 20]"], "a": 0, "why": "Her eleman toplama (100) bölünüp 100'le çarpılır. Bölme her zaman float verir.", "tags": ["pay"], "code": "s = pd.Series({\"M2\": 50, \"T1\": 30, \"M4\": 20})\nprint((s / s.sum() * 100).tolist())", "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "<code>yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()<\/code> sonucunun index'i nasıldır?", "opts": ["Tek seviye: hat", "İki seviye: (hat, istasyon)", "0, 1, 2…", "Sütun adları"], "a": 1, "why": "Birden çok sütunla gruplama çok seviyeli index (MultiIndex) üretir.", "tags": ["groupby", "multiindex"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>ist<\/code> yukarıdaki iki seviyeli Series ise <code>ist.loc[\"Yenikapı\"]<\/code> ne olur?", "opts": ["Yenikapı'nın her hattaki değeri gelir", "KeyError: .loc ilk seviyeye (hat) bakar", "Boş bir Series döner", "Yenikapı'nın toplamı gelir"], "a": 1, "why": "İlk seviyede \"Yenikapı\" diye bir hat yok. İkinci seviyeden seçmek için <code>ist.xs(\"Yenikapı\", level=\"station_name\")<\/code>.", "tags": ["multiindex"], "code": null, "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>pay.drop(ilk.index)<\/code> ne döndürür?", "opts": ["İlk 6 hattı", "İlk 6 dışındaki hatları", "Boş bir Series", "Yalnızca en küçük hattı"], "a": 1, "why": "<code>drop<\/code> verilen etiketleri çıkarır; geriye \"Diğer\"e girecek hatlar kalır.", "tags": ["concat", "sort"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "order", "q": "Pasta grafiğinin verisini hazırlayan satırları sıraya koy.", "lines": ["hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()", "pay = hat_yolcu / hat_yolcu.sum() * 100", "ilk = pay.sort_values(ascending=False).head(6)", "diger = pay.drop(ilk.index)", "pasta = pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])"], "why": "Topla → paya çevir → en büyük 6'yı seç → kalanları ayır → birleştir. Her satır bir öncekinin sonucunu kullanıyor.", "tags": ["groupby", "concat", "pay"], "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "<code>yolcu.groupby(\"line_code\").size()<\/code> neyi sayar?", "opts": ["Her hattaki farklı istasyon sayısını", "Her hattaki satır sayısını", "Kaç hat olduğunu", "Her hattın toplam yolcusunu"], "a": 1, "why": "<code>size()<\/code> her gruptaki satırları sayar. Farklı değer sayısı için <code>nunique()<\/code>.", "tags": ["groupby"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "En büyük 6 hattı al, kalanları çıkar.", "code": "ilk = pay.sort_values(ascending=___).head(___)\ndiger = pay.drop(ilk.index)", "a": [["False"], ["6"]], "why": "Büyükten küçüğe için <code>ascending=False<\/code>, ilk 6 için <code>head(6)<\/code>.", "tags": ["sort"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>yolcu<\/code> tablosunda hat başına toplam <code>passanger_cnt<\/code>'yi hesapla, büyükten küçüğe sırala ve <code>hat_yolcu<\/code>'ya ata.", "starter": "print(yolcu.head())\nhat_yolcu = \n", "sol": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().sort_values(ascending=False)\nprint(hat_yolcu)", "test": "assert list(hat_yolcu.index[:2]) == [\"M2\", \"Marmaray\"], f\"İlk iki hat M2 ve Marmaray olmalı: {list(hat_yolcu.index[:2])}\"\nassert hat_yolcu.index[-1] == \"TF1\", \"En sonda TF1 olmalı\"\nassert int(hat_yolcu.sum()) == int(yolcu[\"passanger_cnt\"].sum()), \"Toplam tutmuyor\"", "hint": "<code>yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()<\/code>, sonra <code>.sort_values(ascending=False)<\/code>.", "tags": ["groupby", "sort"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 1, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Her hattın toplam yolcu içindeki payını (%) hesapla (<code>pay<\/code>) ve bir basamağa yuvarla.", "starter": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\npay = \n", "sol": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\npay = (hat_yolcu / hat_yolcu.sum() * 100).round(1)\nprint(pay)", "test": "assert abs(pay.sum() - 100) < 0.5, f\"Payların toplamı ~100 olmalı, şu an {pay.sum()}\"\nassert pay.idxmax() == \"M2\", \"En büyük pay M2'de olmalı\"\nassert (pay.round(1) == pay).all(), \"Paylar bir basamağa yuvarlanmalı (.round(1))\"", "hint": "<code>hat_yolcu / hat_yolcu.sum() * 100<\/code>, sonra <code>.round(1)<\/code>.", "tags": ["groupby", "pay"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Her ayda (<code>transaction_month<\/code>) kaç farklı gün (<code>date<\/code>) olduğunu bul: <code>gun_sayisi<\/code>.", "starter": "gun_sayisi = \n", "sol": "gun_sayisi = yolcu.groupby(\"transaction_month\")[\"date\"].nunique()\nprint(gun_sayisi)", "test": "assert gun_sayisi.to_dict() == {3: 2, 10: 1}, f\"Mart 2, Ekim 1 gün olmalı: {gun_sayisi.to_dict()}\"", "hint": "<code>.nunique()<\/code> farklı değerlerin sayısıdır.", "tags": ["groupby", "nunique"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["['Metro', 'Tramvay', nan]", "['Metro', 'Tramvay', 'M9']", "['Metro', 'Tramvay']", "KeyError verir"], "a": 0, "why": "<code>.map<\/code> sözlükte karşılığı olmayan değerleri NaN yapar; hata vermez, değeri olduğu gibi de bırakmaz.", "tags": ["map"], "code": "s = pd.Series([\"M2\", \"T1\", \"M9\"])\nprint(s.map({\"M2\": \"Metro\", \"T1\": \"Tramvay\"}).tolist())", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Her hat için toplam yolcuyu (<code>toplam<\/code>), farklı istasyon sayısını (<code>istasyon<\/code>) ve farklı gün sayısını (<code>gun<\/code>) tek tabloda topla: <code>ozet<\/code>. Adlandırılmış agg kullan.", "starter": "ozet = yolcu.groupby(\"line_code\").agg(\n    \n)\nprint(ozet)\n", "sol": "ozet = yolcu.groupby(\"line_code\").agg(\n    toplam=(\"passanger_cnt\", \"sum\"),\n    istasyon=(\"station_name\", \"nunique\"),\n    gun=(\"date\", \"nunique\"),\n)\nprint(ozet)", "test": "assert {\"toplam\", \"istasyon\", \"gun\"} <= set(ozet.columns), f\"Sütunlar: {list(ozet.columns)}\"\nassert ozet.loc[\"M2\", \"toplam\"] == 37757, \"M2 toplamı 37757 olmalı\"\nassert ozet.loc[\"Marmaray\", \"istasyon\"] == 2 and ozet.loc[\"M4\", \"istasyon\"] == 3, \"İstasyon sayıları yanlış (nunique kullan)\"\nassert (ozet[\"gun\"] == 3).all(), \"Her hat 3 farklı günde görünmeli\"", "hint": "<code>toplam=(\"passanger_cnt\", \"sum\")<\/code> gibi üç satır; istasyon ve gün için <code>\"nunique\"<\/code>.", "tags": ["agg", "nunique"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod en kalabalık üç hattı bulmak istiyor ama M4'ü Marmaray'ın önüne koyuyor. Düzelt: <code>ilk3<\/code>'ün sırası M2, Marmaray, M4 olmalı.", "starter": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nhat_yolcu.sort_values(ascending=False)\nilk3 = hat_yolcu.head(3)\nprint(ilk3)\n", "sol": "hat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nhat_yolcu = hat_yolcu.sort_values(ascending=False)\nilk3 = hat_yolcu.head(3)\nprint(ilk3)", "test": "assert list(ilk3.index) == [\"M2\", \"Marmaray\", \"M4\"], f\"İlk üç: {list(ilk3.index)}\"", "hint": "<code>sort_values<\/code> yeni bir Series döndürür; sonucu <code>hat_yolcu<\/code>'ya geri ata.", "tags": ["sort"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod her hattın <b>günlük<\/b> ortalama yolcusunu bulmak istiyor ama M2 için 1398 gibi çok küçük bir sayı çıkıyor. Neden? Düzelt: M2 için yaklaşık 12586 çıkmalı.", "starter": "gunluk_ort = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].mean()\nprint(gunluk_ort.round(0))\n", "sol": "gunluk = yolcu.groupby([\"line_code\", \"date\"])[\"passanger_cnt\"].sum().reset_index()\ngunluk_ort = gunluk.groupby(\"line_code\")[\"passanger_cnt\"].mean()\nprint(gunluk_ort.round(0))", "test": "assert abs(gunluk_ort[\"M2\"] - 37757 / 3) < 1, f\"M2 günlük ortalaması ~12586 olmalı, şu an {gunluk_ort['M2']:.0f}\"\nassert abs(gunluk_ort[\"TF1\"] - 919 / 3) < 1, \"TF1 günlük ortalaması ~306 olmalı\"", "hint": "Bir satır bir gün değil; istasyon × yaş grubu × gün. Önce <code>groupby([\"line_code\", \"date\"])<\/code> ile günlük toplamı al, sonra onu hatta göre ortala.", "tags": ["groupby", "agg"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Hat × istasyon toplamı <code>ist<\/code>'te hazır. Yenikapı'nın her hattaki yolcusunu bul: <code>yenikapi<\/code> (index'i hat kodu olan bir Series).", "starter": "ist = yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\nyenikapi = \n", "sol": "ist = yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\nyenikapi = ist.xs(\"Yenikapı\", level=\"station_name\")\nprint(yenikapi)", "test": "assert {k: int(v) for k, v in yenikapi.items()} == {\"M2\": 12917, \"Marmaray\": 16146}, f\"Sonuç: {dict(yenikapi)}\"", "hint": "<code>ist.xs(\"Yenikapı\", level=\"station_name\")<\/code>. İkinci seviyeden seçtiğin için <code>.loc<\/code> işe yaramaz.", "tags": ["multiindex", "groupby"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["3 100.0", "2 85.0", "1 100.0", "hata verir"], "a": 0, "why": "<code>concat<\/code> iki Series'i alt alta ekler: 2 + 1 = 3 eleman, toplamları 60 + 25 + 15 = 100.", "tags": ["concat"], "code": "a = pd.Series({\"M2\": 60.0, \"T1\": 25.0})\nb = pd.Series({\"Diğer\": 15.0})\npasta = pd.concat([a, b])\nprint(len(pasta), pasta.sum())", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Her hattın <b>en kalabalık istasyonunu<\/b> bul: <code>en_kalabalik<\/code>, index'i hat kodu, değeri istasyon adı olan bir Series (ör. M2 → Şişli-Mecidiyeköy).", "starter": "ist = yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\nen_kalabalik = \n", "sol": "ist = yolcu.groupby([\"line_code\", \"station_name\"])[\"passanger_cnt\"].sum()\nen_kalabalik = ist.groupby(level=\"line_code\").idxmax().map(lambda t: t[1])\nprint(en_kalabalik)", "test": "beklenen = {\"M2\": \"Şişli-Mecidiyeköy\", \"M4\": \"Kozyatağı\", \"Marmaray\": \"Yenikapı\", \"T1\": \"Eminönü\", \"TF1\": \"Maçka\"}\nassert dict(en_kalabalik) == beklenen, f\"Sonuç: {dict(en_kalabalik)}\"", "hint": "<code>ist.groupby(level=\"line_code\").idxmax()<\/code> her hat için (hat, istasyon) ikilisini verir; istasyonu <code>.map(lambda t: t[1])<\/code> ile al. Başka yol: <code>ist.reset_index()<\/code>'i büyükten küçüğe sırala, <code>drop_duplicates(\"line_code\")<\/code> ile her hattın ilk satırını tut.", "tags": ["multiindex", "groupby", "sort"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Pasta grafiğinin verisi.<\/b> Not defterindeki hat payı grafiğinin tablosunu kur. Örnek veride 5 hat olduğu için ilk <code>N = 3<\/code> hattı al:<ol><li>Hat başına toplam yolcu (<code>hat_yolcu<\/code>) ve yüzde payı (<code>pay<\/code>).<\/li><li>En büyük N hat <code>ilk<\/code>, geri kalanlar <code>diger<\/code>.<\/li><li><code>pasta<\/code>: <code>ilk<\/code>'in sonuna <code>\"Diğer k hat\"<\/code> adlı tek bir satır ekle (k = <code>diger<\/code>'deki hat sayısı, değer = onların pay toplamı). <code>pd.concat<\/code> kullan.<\/li><li>Alt başlık olarak <code>İlk 3 hattın payı: %85<\/code> satırını yazdır (sayı <code>ilk.sum()<\/code>'dan, ondalıksız).<\/li><\/ol>Sonuç sırası M2, Marmaray, M4, Diğer 2 hat; toplamı 100.", "starter": "N = 3\n\nhat_yolcu = \npay = \n\n", "sol": "N = 3\n\nhat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\npay = hat_yolcu / hat_yolcu.sum() * 100\n\nilk = pay.sort_values(ascending=False).head(N)\ndiger = pay.drop(ilk.index)\npasta = pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])\n\nprint(pasta.round(1))\nprint(f\"İlk {N} hattın payı: %{ilk.sum():.0f}\")", "test": "assert list(pasta.index) == [\"M2\", \"Marmaray\", \"M4\", \"Diğer 2 hat\"], f\"Sıra/etiketler: {list(pasta.index)}\"\nassert abs(pasta.sum() - 100) < 1e-6, f\"pasta toplamı 100 olmalı, şu an {pasta.sum()}\"\nassert abs(pasta[\"Diğer 2 hat\"] - 14.63) < 0.01, f\"Diğer 2 hat ~14.63 olmalı, şu an {pasta['Diğer 2 hat']:.2f}\"\nassert abs(pasta[\"M2\"] - 38.28) < 0.01, \"M2 payı ~38.28 olmalı (yüzde)\"\nassert \"concat\" in __kod__, \"Diğer satırını pd.concat ile ekle\"\nassert \"İlk 3 hattın payı: %85\" in __cikti__, f\"Alt başlık satırı bulunamadı: {__cikti__!r}\"", "hint": "<code>ilk = pay.sort_values(ascending=False).head(N)<\/code>, <code>diger = pay.drop(ilk.index)<\/code>, <code>pd.concat([ilk, pd.Series({f\"Diğer {len(diger)} hat\": diger.sum()})])<\/code>. Alt başlık için <code>f\"… %{ilk.sum():.0f}\"<\/code>.", "tags": ["groupby", "pay", "sort", "concat"], "setup": ["yolcu"], "rev": false, "why": "Etiketi <code>len(diger)<\/code> ile kurduğun için N'yi değiştirdiğinde (gerçek veride N = 6 iken) \"Diğer 17 hat\" gibi doğru sayı kendiliğinden yazılır.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>seri / seri.sum()<\/code> ne yapar?", "opts": ["Tek bir sayı verir", "Her elemanı toplama böler (paylar)", "Hata verir", "Seriyi sıralar"], "a": 1, "why": "Series ile sayı arasındaki işlem her elemana uygulanır.", "tags": ["pay"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>.sort_values()<\/code> varsayılan olarak nasıl sıralar?", "opts": ["Büyükten küçüğe", "Küçükten büyüğe", "Alfabetik", "Rastgele"], "a": 1, "why": "Varsayılan <code>ascending=True<\/code>.", "tags": ["sort"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>reset_index()<\/code> bir groupby sonucuna ne yapar?", "opts": ["Satırları siler", "Index'teki grup anahtarlarını yeniden sütun yapar; düz bir tablo çıkar", "Değerleri sıfırlar", "Sıralamayı geri alır"], "a": 1, "why": "Grup anahtarları sütuna döner, index 0, 1, 2… olur. <code>merge<\/code> öncesi sık kullanılır.", "tags": ["groupby"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "\"Her ayda kaç farklı gün var?\" sorusu için hangisi?", "opts": ["groupby(\"transaction_month\").size()", "groupby(\"transaction_month\")[\"date\"].nunique()", "groupby(\"date\")[\"transaction_month\"].sum()", "groupby(\"transaction_month\")[\"date\"].count()"], "a": 1, "why": "<code>size<\/code> ve <code>count<\/code> satırları sayar; aynı gün birçok satırda geçer. Farklı gün için <code>nunique<\/code>.", "tags": ["nunique", "groupby"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b10", "no": 10, "tur": "ders", "baslik": "Birleştirme ve pivot", "hat": "M11", "ozet": "merge ile iki tabloyu eşleştirmek ve eşleşmeyenleri bulmak; pivot_table, unstack ve axis ile tabloyu çevirip satır bazında pay hesaplamak.", "dosya": "analiz.ipynb", "proje": "aylik_yolcu = (\n    yolcu.groupby([\"line_code\", \"transaction_year\", \"transaction_month\"])[\"passanger_cnt\"]\n    .sum()\n    .reset_index()\n    .rename(columns={\"transaction_year\": \"year\", \"transaction_month\": \"month\"})\n)\nsefer_2025 = sefer[sefer[\"year\"] == 2025]\nbirlesik = aylik_yolcu.merge(\n    sefer_2025[[\"line_code\", \"year\", \"month\", \"sefer_sayisi\"]],\n    on=[\"line_code\", \"year\", \"month\"],\n    how=\"left\"\n)\nprint(birlesik[birlesik[\"sefer_sayisi\"].isna()][\"line_code\"].unique())\nbirlesik = birlesik.dropna(subset=[\"sefer_sayisi\"])\nhat_oran = birlesik.groupby(\"line_code\")[[\"passanger_cnt\", \"sefer_sayisi\"]].sum()\nhat_oran[\"sefer_basina_yolcu\"] = hat_oran[\"passanger_cnt\"] / hat_oran[\"sefer_sayisi\"]\n...\nhat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\", values=\"passanger_cnt\",\n                            aggfunc=\"sum\", observed=True)\nhat_yas = hat_yas.reindex(columns=yas_sirasi)\nhat_yas_pay = hat_yas.div(hat_yas.sum(axis=1), axis=0) * 100\n...\ngunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\nort = gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean().unstack()\noran = (ort[True] / ort[False] * 100).sort_values()", "adimlar": [{"baslik": "merge: iki tabloyu anahtarla eşleştirmek", "html": "\n<p>Yolcu sayıları bir tabloda, sefer sayıları başka bir tabloda. Sefer başına yolcuyu hesaplamak için ikisini <b>ortak bir sütuna<\/b> (anahtar) göre\nyan yana getirmen gerekir. Excel'deki DÜŞEYARA'nın pandas karşılığı <code>merge<\/code>'dür.<\/p>\n<pre class=\"py\">sol (yolcu)                sag (sefer)\nline_code  yolcu           line_code  sefer\nM2         37757           M2         14200\nMarmaray   28069           T1         15500\nT1         13510           M4         12100<\/pre>\n<pre class=\"py\">sol.merge(sag, on=\"line_code\", how=...)\n\nhow=\"left\"                       how=\"inner\"\nline_code  yolcu  sefer          line_code  yolcu  sefer\nM2         37757  14200          M2         37757  14200\nMarmaray   28069  NaN            T1         13510  15500\nT1         13510  15500\n\nhow=\"outer\"\nline_code  yolcu  sefer\nM2         37757  14200\nM4         NaN    12100\nMarmaray   28069  NaN\nT1         13510  15500<\/pre>\n<ul>\n<li><b>left<\/b>: soldaki bütün satırlar kalır; sağda karşılığı yoksa NaN.<\/li>\n<li><b>inner<\/b>: yalnızca iki tarafta da bulunan anahtarlar.<\/li>\n<li><b>outer<\/b>: iki taraftaki bütün anahtarlar; eksik taraf NaN.<\/li>\n<\/ul>\n<p>Not defterinde anahtar üç sütun: <code>on=[\"line_code\", \"year\", \"month\"]<\/code>. Satırlar ancak üçü birden tutarsa eşleşir.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>how=\"left\"<\/code> seçimin bilinçli: yolcu tablosundaki hiçbir hat sessizce kaybolmaz. Sefer verisi olmayanlar NaN ile\ngörünür kalır, sen de onları raporlayıp sonra atarsın.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Anahtar sütunların tipini kontrol etmemek. Bir tabloda <code>month<\/code> sayı (3), ötekinde metin (\"3\") ise\npandas birleştirmeyi reddedip hata verir. Sağ tabloda bir anahtar iki kez geçerse de soldaki satır iki kez tekrarlanır ve toplamlar şişer.<\/div>\n", "ornek": "import pandas as pd\n\nsol = pd.DataFrame({\"line_code\": [\"M2\", \"Marmaray\", \"T1\"], \"yolcu\": [37757, 28069, 13510]})\nsag = pd.DataFrame({\"line_code\": [\"M2\", \"T1\", \"M4\"], \"sefer\": [14200, 15500, 12100]})\n\nfor how in [\"left\", \"inner\", \"outer\"]:\n    print(f\"--- how={how!r}\")\n    print(sol.merge(sag, on=\"line_code\", how=how))", "ornek_setup": []}, {"baslik": "Eşleşmeyenleri bulmak: isna ve indicator", "html": "\n<p>Birleştirmeden sonra ilk soru: \"Kim eşleşmedi?\" Not defterinde bunu şöyle soruyorsun:<\/p>\n<pre class=\"py\">birlesik = aylik_yolcu.merge(sefer_2025[[\"line_code\", \"year\", \"month\", \"sefer_sayisi\"]],\n                             on=[\"line_code\", \"year\", \"month\"], how=\"left\")\nprint(birlesik[birlesik[\"sefer_sayisi\"].isna()][\"line_code\"].unique())<\/pre>\n<p>Sağdan gelen sütun boşsa o satırın karşılığı yok demektir. Daha açık bir yol <code>indicator=True<\/code>: pandas her satırın nereden geldiğini yazan bir\n<code>_merge<\/code> sütunu ekler.<\/p>\n<pre class=\"py\">m = sol.merge(sag, on=\"line_code\", how=\"outer\", indicator=True)\n#   line_code    yolcu    sefer      _merge\n# 0        M2  37757.0  14200.0        both\n# 1        M4      NaN  12100.0  right_only\n# 2  Marmaray  28069.0      NaN   left_only\n# 3        T1  13510.0  15500.0        both<\/pre>\n<p><code>left_only<\/code> yalnızca solda, <code>right_only<\/code> yalnızca sağda, <code>both<\/code> eşleşti demek. <code>isna<\/code> yöntemi, eşleştiği hâlde değeri boş\nolan satırı da \"eşleşmedi\" sayar; <code>indicator<\/code> bu ikisini ayırır. Boşluk yüzünden tam sayı sütunlarının float'a (37757.0) döndüğüne de dikkat et.<\/p>\n<p>Raporladıktan sonra eksik satırları atarsın:<\/p>\n<pre class=\"py\">birlesik = birlesik.dropna(subset=[\"sefer_sayisi\"])<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>subset<\/code>'siz <code>dropna()<\/code>. Tablonun <b>herhangi<\/b> bir sütununda boşluk olan her satır gider;\nilgisiz bir sütundaki tek bir NaN yüzünden veri kaybedebilirsin.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Önce yazdırıp sonra atmak, grafiğin dipnotunu dürüst yazmanı sağlar: \"Marmaray, M11, TCDD ve İETT hatlarının sefer verisi\nolmadığından dahil edilmemiştir.\" Hangi hatların düştüğünü bilmeden bu cümleyi kuramazdın.<\/div>\n", "ornek": "import pandas as pd\n\nsol = pd.DataFrame({\"line_code\": [\"M2\", \"Marmaray\", \"T1\"], \"yolcu\": [37757, 28069, 13510]})\nsag = pd.DataFrame({\"line_code\": [\"M2\", \"T1\", \"M4\"], \"sefer\": [14200, 15500, 12100]})\n\nm = sol.merge(sag, on=\"line_code\", how=\"outer\", indicator=True)\nprint(m)\nprint(m[\"_merge\"].value_counts())\nprint(\"Sefer verisi yok:\", m.loc[m[\"_merge\"] == \"left_only\", \"line_code\"].tolist())\n\nbirlesik = sol.merge(sag, on=\"line_code\", how=\"left\")\nprint(\"isna ile:\", birlesik[birlesik[\"sefer\"].isna()][\"line_code\"].tolist())\nbirlesik = birlesik.dropna(subset=[\"sefer\"])\nprint(birlesik)", "ornek_setup": []}, {"baslik": "pivot_table ve groupby + unstack", "html": "\n<p>Hat × yaş grubu gibi iki boyutlu bir özeti <b>tablo<\/b> olarak görmek istersin: satırlar hat, sütunlar yaş grubu, hücreler toplam yolcu.<\/p>\n<pre class=\"py\">hat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\",\n                            values=\"passanger_cnt\", aggfunc=\"sum\", observed=True)\n# age        20-30  30-60   60+\n# line_code\n# M2         14364  18468  4925\n# M4          6993   8991  2398\n# T1          4252   5467  3791 ...<\/pre>\n<p>Aynı tabloyu bildiğin araçlarla da kurabilirsin: iki sütunla grupla, sonra ikinci seviyeyi <code>unstack<\/code> ile sütunlara çevir.<\/p>\n<pre class=\"py\">yolcu.groupby([\"line_code\", \"age\"])[\"passanger_cnt\"].sum().unstack()<\/pre>\n<p>İkisi aynı sonucu verir. <code>pivot_table<\/code> niyeti tek satırda söyler; <code>groupby<\/code> ise adım adım düşünmeyi kolaylaştırır.<\/p>\n<h3>Sütun sırası: reindex<\/h3>\n<p>Not defterinde ardından <code>hat_yas = hat_yas.reindex(columns=yas_sirasi)<\/code> yazıyorsun. <code>reindex<\/code> sütunları verdiğin listeye göre dizer;\nlistede olup tabloda olmayan sütunlar NaN olarak eklenir. Böylece yığılmış çubuk grafikte her renk her zaman aynı yaş grubuna düşer.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>pivot<\/code> ile <code>pivot_table<\/code>'ı karıştırmak. <code>pivot<\/code> hiçbir şeyi toplamaz; aynı (hat, yaş) çifti\nbirden çok satırda geçiyorsa \"Index contains duplicate entries\" hatası verir. Özet gerekiyorsa <code>pivot_table<\/code> kullan. Onun varsayılan\n<code>aggfunc<\/code>'i ortalamadır (\"mean\"); toplam istiyorsan açıkça <code>\"sum\"<\/code> yaz.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Yaş sütunu kategoriyken <code>observed=True<\/code>, veride hiç görünmeyen grupların tabloya eklenmemesini sağlar. Hangi\ngrupların hangi sırayla görüneceğine sonra <code>reindex<\/code> ile sen karar veriyorsun.<\/div>\n", "ornek": "hat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\",\n                            values=\"passanger_cnt\", aggfunc=\"sum\", observed=True)\nprint(hat_yas)\n\nayni = yolcu.groupby([\"line_code\", \"age\"])[\"passanger_cnt\"].sum().unstack()\nprint(\"Aynı mı?\", (ayni == hat_yas).all().all())\n\nyas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nprint(hat_yas.reindex(columns=yas_sirasi))", "ornek_setup": ["yolcu"]}, {"baslik": "axis=0 mı, axis=1 mi?", "html": "\n<p>Bir tabloda toplam iki yönde alınabilir. <code>axis<\/code> hangi yönde <b>ilerleyeceğini<\/b> söyler:<\/p>\n<pre class=\"py\">              20-30  30-60   60+   │ sum(axis=1)\nM2            14364  18468  4925   │ 37757   ← her satırın toplamı\nT1             4252   5467  3791   │ 13510\n───────────────────────────────────┘\nsum(axis=0)   18616  23935  8716     ← her sütunun toplamı<\/pre>\n<ul>\n<li><code>axis=0<\/code> (varsayılan): satırlar boyunca aşağı in; sonuç <b>her sütun<\/b> için bir sayı.<\/li>\n<li><code>axis=1<\/code>: sütunlar boyunca sağa git; sonuç <b>her satır<\/b> için bir sayı.<\/li>\n<\/ul>\n<h3>Her satırı kendi toplamına bölmek<\/h3>\n<pre class=\"py\">hat_yas_pay = hat_yas.div(hat_yas.sum(axis=1), axis=0) * 100<\/pre>\n<p><code>hat_yas.sum(axis=1)<\/code> hat başına toplamdır; index'i hat kodlarıdır. <code>div(..., axis=0)<\/code> \"bu Series'i satır etiketleriyle eşleştir\" demek:\nM2 satırındaki her hücre M2'nin toplamına bölünür. Sonuçta her satır %100'e tamamlanır.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>hat_yas / hat_yas.sum(axis=1)<\/code> yazmak. <code>/<\/code> işareti Series'i <b>sütun<\/b> adlarıyla eşleştirmeye çalışır;\n\"M2\" diye bir sütun olmadığı için hat adları yeni sütun olarak eklenir ve tablo NaN'larla dolar. Satır bazında bölme için <code>div(..., axis=0)<\/code> şart.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> pandas işlemleri <b>etikete<\/b> göre eşleştirir, konuma göre değil. Sıralar farklı olsa da doğru hücreler birbirine bölünür;\nama etiketin satırda mı sütunda mı aranacağını senin söylemen gerekir.<\/div>\n", "ornek": "hat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\", values=\"passanger_cnt\", aggfunc=\"sum\")\nprint(hat_yas.sum(axis=0))       # her yaş grubunun toplamı\nprint(hat_yas.sum(axis=1))       # her hattın toplamı\n\nhat_yas_pay = hat_yas.div(hat_yas.sum(axis=1), axis=0) * 100\nprint(hat_yas_pay.round(1))\nprint(hat_yas_pay.sum(axis=1))   # her satır 100", "ornek_setup": ["yolcu"]}, {"baslik": "unstack ile hafta sonu / hafta içi", "html": "\n<p><code>unstack<\/code>, çok seviyeli bir index'in bir seviyesini <b>sütunlara<\/b> çevirir. Not defterindeki hafta sonu hesabı iyi bir örnek:<\/p>\n<pre class=\"py\">gunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\nort = gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean().unstack()\noran = (ort[True] / ort[False] * 100).sort_values()<\/pre>\n<pre class=\"py\">ÖNCE (iki seviyeli Series)        SONRA: .unstack()\nline_code  is_weekend             is_weekend    False    True\nM2         False     14543.5      line_code\n           True       8670.0      M2          14543.5   8670.0\nTF1        False       287.0      TF1           287.0    345.0\n           True        345.0<\/pre>\n<p>İlk satır her hattın <b>her gününün<\/b> toplamını çıkarır. İkinci satır bu günlük toplamların hafta içi ve hafta sonu ortalamasını alır ve\n<code>is_weekend<\/code> seviyesini sütunlara açar. Artık <code>ort[True]<\/code> hafta sonu, <code>ort[False]<\/code> hafta içi sütunu; oran tek satırda hesaplanır.\n%100'ün üstü \"hafta sonu daha kalabalık\" demek.<\/p>\n<p><code>unstack()<\/code> varsayılan olarak <b>son<\/b> seviyeyi açar; <code>unstack(0)<\/code> ya da <code>unstack(\"line_code\")<\/code> ile başka bir seviyeyi seçersin.\nTersi <code>stack()<\/code>'tir.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Günlük toplamı almadan doğrudan ortalamak. <code>yolcu.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean()<\/code>\nbir istasyon-yaş satırının ortalamasıdır, bir <b>günün<\/b> değil.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Sütun adları metin değil, <code>True<\/code>/<code>False<\/code> değerleri. Bu yüzden tırnaksız yazılır: <code>ort[True]<\/code>.\n<code>ort[\"True\"]<\/code> yazarsan <code>KeyError<\/code> alırsın.<\/div>\n", "ornek": "gunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\nuzun = gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean()\nprint(uzun.head(4))\n\nort = uzun.unstack()\nprint(ort)\noran = (ort[True] / ort[False] * 100).sort_values()\nprint(oran.round(0))", "ornek_setup": ["yolcu"]}], "sorular": [{"t": "mc", "q": "<code>how=\"left\"<\/code> ile merge'de sağ tabloda karşılığı olmayan satır ne olur?", "opts": ["Silinir", "Kalır, sağdan gelen sütunlar NaN olur", "Hata verir", "Sağ tablodan rastgele bir satırla eşleşir"], "a": 1, "why": "Sol tablonun bütün satırları korunur.", "tags": ["merge"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Yukarıdaki <code>sol<\/code> (M2, Marmaray, T1) ve <code>sag<\/code> (M2, T1, M4) tablolarıyla <code>how=\"outer\"<\/code> kaç satır verir?", "opts": ["2", "3", "4", "6"], "a": 2, "why": "İki taraftaki farklı anahtarların hepsi: M2, M4, Marmaray, T1.", "tags": ["merge"], "code": null, "rev": false, "zorluk": 2, "yer": "a0"}, {"t": "mc", "q": "<code>indicator=True<\/code> ile eklenen <code>_merge<\/code> sütununda <code>right_only<\/code> ne demek?", "opts": ["Satır yalnızca sağ tabloda var", "Satır yalnızca sol tabloda var", "İki tabloda da var", "Sağdaki değer boş"], "a": 0, "why": "Anahtar yalnızca sağ tabloda bulundu; sol taraftan gelen sütunlar NaN.", "tags": ["merge"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "fill", "q": "Boşluğu doldur: sefer verisi eşleşmeyen hatları listele.", "code": "eksik = birlesik[birlesik[\"sefer_sayisi\"].___()][\"line_code\"].unique()", "a": [["isna", "isnull"]], "why": "<code>isna()<\/code> boş hücreler için True verir; maske olarak kullanırsın.", "tags": ["merge", "fillna"], "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "Hangisi <code>yolcu.pivot_table(index=\"line_code\", columns=\"age\", values=\"passanger_cnt\", aggfunc=\"sum\")<\/code> ile aynı tabloyu verir?", "opts": ["yolcu.groupby([\"line_code\", \"age\"])[\"passanger_cnt\"].sum().unstack()", "yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()", "yolcu.melt(id_vars=\"line_code\")", "yolcu.groupby(\"age\")[\"passanger_cnt\"].sum()"], "a": 0, "why": "İki sütunla grupla, ikinci seviyeyi (yaş) sütunlara aç: pivot_table'ın yaptığı tam olarak bu.", "tags": ["pivot", "unstack"], "code": null, "rev": false, "zorluk": 2, "yer": "a2"}, {"t": "mc", "q": "<code>pivot_table<\/code>'da <code>aggfunc<\/code> yazmazsan hücrelere ne gelir?", "opts": ["sum", "mean", "count", "max"], "a": 1, "why": "Varsayılan ortalamadır. Projende toplam istediğin için <code>aggfunc=\"sum\"<\/code> yazmışsın.", "tags": ["pivot"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "<code>df.sum(axis=1)<\/code> neyi toplar?", "opts": ["Her sütunu", "Her satırı", "Bütün tabloyu tek sayıya", "Index'i"], "a": 1, "why": "<code>axis=1<\/code> sütunlar boyunca yatay ilerler: her satır için bir toplam. <code>axis=0<\/code> her sütun için.", "tags": ["axis"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>hat_yas / hat_yas.sum(axis=1)<\/code> neden NaN dolu bir tablo verir?", "opts": ["Sıfıra bölme olduğu için", "Series sütun adlarıyla eşleştirilir; hat adları sütunlarda yok", "sum(axis=1) sütun toplamı olduğu için", "pivot_table her zaman NaN ürettiği için"], "a": 1, "why": "<code>/<\/code> Series'i sütunlarla hizalar. Satırlarla hizalamak için <code>div(..., axis=0)<\/code>.", "tags": ["axis", "pay"], "code": null, "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>unstack()<\/code> ne yapar?", "opts": ["Satırları siler", "Index'in bir seviyesini sütunlara çevirir", "Tabloyu sıralar", "Sütunları siler"], "a": 1, "why": "İki seviyeli bir Series'i geniş bir tabloya çevirir; varsayılan olarak son seviye sütun olur.", "tags": ["unstack"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "fill", "q": "Boşlukları doldur: hafta sonu ortalamasını hafta içi ortalamasına oranla.", "code": "oran = ort[___] / ort[___] * 100", "a": [["True"], ["False"]], "why": "Sütun adları <code>True<\/code> (hafta sonu) ve <code>False<\/code> (hafta içi); tırnaksız yazılır.", "tags": ["unstack"], "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "Hangi <code>how<\/code> değeri yalnızca iki tabloda da bulunan anahtarları tutar?", "opts": ["left", "right", "inner", "outer"], "a": 2, "why": "<code>inner<\/code> kesişimdir; <code>outer<\/code> birleşim, <code>left<\/code> soldakilerin hepsi.", "tags": ["merge"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[3, 30]", "[11, 22]", "33", "[1, 2, 10, 20]"], "a": 1, "why": "<code>axis=1<\/code> her satırı toplar: 1 + 10 = 11, 2 + 20 = 22.", "tags": ["axis"], "code": "df = pd.DataFrame({\"a\": [1, 2], \"b\": [10, 20]})\nprint(df.sum(axis=1).tolist())", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Boşlukları doldur: yolcu tablosundaki bütün satırlar kalsın, sonra sefer verisi olmayan hatları bul.", "code": "birlesik = aylik_yolcu.merge(sefer_2025, on=[\"line_code\", \"year\", \"month\"], how=___)\neksik = birlesik[birlesik[\"sefer_sayisi\"].___()][\"line_code\"].unique()", "a": [["\"left\""], ["isna", "isnull"]], "why": "<code>how=\"left\"<\/code> soldaki satırları korur; eşleşmeyenlerin sefer sütunu NaN olur, <code>isna()<\/code> onları seçer.", "tags": ["merge", "fillna"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["2", "3", "5", "6"], "a": 1, "why": "Sağda M2 iki kez geçiyor; soldaki M2 satırı ikisiyle de eşleşir ve iki kez yazılır. T1 bir kez: toplam 3 satır.", "tags": ["merge"], "code": "sol = pd.DataFrame({\"hat\": [\"M2\", \"T1\"], \"yolcu\": [100, 50]})\nsag = pd.DataFrame({\"hat\": [\"M2\", \"M2\", \"T1\"], \"ay\": [3, 10, 3]})\nprint(len(sol.merge(sag, on=\"hat\")))", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Hat başına 2025 Mart yolcusunu (<code>mart<\/code>) Mart 2025 sefer tablosuyla birleştir ve <code>sefer_basina<\/code> sütununu hesapla (yolcu ÷ sefer). Seferi olmayan hatları at. Sonuç <code>birlesik<\/code> olsun. (Örnek veri yalnızca 2 günlük, bu yüzden sayılar küçük çıkacak.)", "starter": "mart = (yolcu[yolcu[\"transaction_month\"] == 3]\n        .groupby(\"line_code\")[\"passanger_cnt\"].sum().reset_index())\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_mart = sefer_uzun[sefer_uzun[\"Tarih\"] == \"2025-03-01\"]\n\nbirlesik = \n", "sol": "mart = (yolcu[yolcu[\"transaction_month\"] == 3]\n        .groupby(\"line_code\")[\"passanger_cnt\"].sum().reset_index())\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_mart = sefer_uzun[sefer_uzun[\"Tarih\"] == \"2025-03-01\"]\n\nbirlesik = mart.merge(sefer_mart[[\"line_code\", \"sefer_sayisi\"]], on=\"line_code\", how=\"left\")\nbirlesik = birlesik.dropna(subset=[\"sefer_sayisi\"])\nbirlesik[\"sefer_basina\"] = birlesik[\"passanger_cnt\"] / birlesik[\"sefer_sayisi\"]\nprint(birlesik)", "test": "assert \"Marmaray\" not in set(birlesik[\"line_code\"]), \"Marmaray'ın sefer verisi yok; dropna ile atılmalı\"\nassert len(birlesik) == 4, f\"4 hat kalmalı (M2, M4, T1, TF1): {list(birlesik['line_code'])}\"\nassert \"sefer_basina\" in birlesik.columns, \"sefer_basina sütunu yok\"\nassert abs(birlesik.set_index(\"line_code\").loc[\"M2\", \"sefer_basina\"] - 1.595) < 0.01, \"M2 için sefer başına ~1.60 olmalı\"", "hint": "<code>mart.merge(sefer_mart[[\"line_code\", \"sefer_sayisi\"]], on=\"line_code\", how=\"left\")<\/code>, sonra <code>dropna(subset=[...])<\/code>.", "tags": ["merge", "fillna"], "setup": ["yolcu", "sefer"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Hat × yaş grubu tablosu yap (<code>hat_yas<\/code>: satır hat, sütun yaş, değer toplam yolcu), sonra her satırı kendi toplamına bölerek yüzdeye çevir (<code>hat_yas_pay<\/code>).", "starter": "hat_yas = \nhat_yas_pay = \n", "sol": "hat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\", values=\"passanger_cnt\", aggfunc=\"sum\")\nhat_yas_pay = hat_yas.div(hat_yas.sum(axis=1), axis=0) * 100\nprint(hat_yas_pay.round(1))", "test": "assert set(hat_yas.columns) == {\"20-30\", \"30-60\", \"60+\"}, f\"Sütunlar yaş grupları olmalı: {list(hat_yas.columns)}\"\nassert (hat_yas_pay.sum(axis=1).round(6) == 100).all(), \"Her satırın toplamı 100 olmalı\"\nassert hat_yas_pay[\"60+\"].idxmax() == \"T1\", \"60+ payı en yüksek hat T1 olmalı\"", "hint": "<code>pivot_table(index=..., columns=..., values=..., aggfunc=\"sum\")<\/code>; pay için <code>.div(hat_yas.sum(axis=1), axis=0)<\/code>.", "tags": ["pivot", "pay", "axis"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod her hattın yaş paylarını hesaplamak istiyor ama tablo NaN'larla dolu ve sütunlara hat adları eklenmiş. Düzelt.", "starter": "hat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\", values=\"passanger_cnt\", aggfunc=\"sum\")\nhat_yas_pay = hat_yas / hat_yas.sum(axis=1) * 100\nprint(hat_yas_pay.round(1))\n", "sol": "hat_yas = yolcu.pivot_table(index=\"line_code\", columns=\"age\", values=\"passanger_cnt\", aggfunc=\"sum\")\nhat_yas_pay = hat_yas.div(hat_yas.sum(axis=1), axis=0) * 100\nprint(hat_yas_pay.round(1))", "test": "assert list(hat_yas_pay.columns) == [\"20-30\", \"30-60\", \"60+\"], f\"Sütunlar yalnızca yaş grupları olmalı: {list(hat_yas_pay.columns)}\"\nassert hat_yas_pay.notna().all().all(), \"Tabloda NaN kaldı\"\nassert (hat_yas_pay.sum(axis=1).round(6) == 100).all(), \"Her satırın toplamı 100 olmalı\"", "hint": "<code>/<\/code> Series'i sütun adlarıyla eşleştiriyor. Satır etiketleriyle eşleştirmek için <code>hat_yas.div(..., axis=0)<\/code>.", "tags": ["axis", "pay"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Hat başına hafta sonu ve hafta içi <b>günlük ortalama<\/b> yolcuyu bul ve oranı (%) hesapla: <code>oran<\/code>. Önce hat + gün toplamını al (hazır), sonra hat + hafta sonu ortalamasını <code>unstack<\/code> et.", "starter": "gunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\nort = \noran = \n", "sol": "gunluk_hat = yolcu.groupby([\"line_code\", \"date\", \"is_weekend\"])[\"passanger_cnt\"].sum().reset_index()\nort = gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean().unstack()\noran = ort[True] / ort[False] * 100\nprint(oran.round(1))", "test": "assert oran.idxmax() == \"TF1\", \"Hafta sonu en güçlü hat TF1 olmalı\"\nassert oran[\"TF1\"] > 100 and oran[\"M2\"] < 100, \"TF1 %100'ün üstünde, M2 altında olmalı\"\nassert abs(oran[\"M2\"] - 59.6) < 0.1, f\"M2 oranı ~59.6 olmalı, şu an {oran['M2']:.1f}\"", "hint": "<code>ort = gunluk_hat.groupby([\"line_code\", \"is_weekend\"])[\"passanger_cnt\"].mean().unstack()<\/code>, sonra <code>ort[True] / ort[False] * 100<\/code>.", "tags": ["unstack", "groupby"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Marmaray'ın sefer verisi yok ama bu kod onu \"sefer verisi olmayan\" listesinde göstermiyor. Neden? Düzelt: <code>eksik<\/code> hem Marmaray'ı hem TF1'i (Ekim'de seferi boş) içermeli.", "starter": "aylik = yolcu.groupby([\"line_code\", \"transaction_month\"])[\"passanger_cnt\"].sum().reset_index()\naylik = aylik.rename(columns={\"transaction_month\": \"month\"})\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun[\"month\"] = sefer_uzun[\"Tarih\"].dt.month\nsefer_2025 = sefer_uzun[sefer_uzun[\"Tarih\"].dt.year == 2025]\n\nbirlesik = aylik.merge(sefer_2025[[\"line_code\", \"month\", \"sefer_sayisi\"]], on=[\"line_code\", \"month\"], how=\"inner\")\neksik = birlesik[birlesik[\"sefer_sayisi\"].isna()][\"line_code\"].unique()\nprint(\"Sefer verisi olmayan:\", list(eksik))\n", "sol": "aylik = yolcu.groupby([\"line_code\", \"transaction_month\"])[\"passanger_cnt\"].sum().reset_index()\naylik = aylik.rename(columns={\"transaction_month\": \"month\"})\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun[\"month\"] = sefer_uzun[\"Tarih\"].dt.month\nsefer_2025 = sefer_uzun[sefer_uzun[\"Tarih\"].dt.year == 2025]\n\nbirlesik = aylik.merge(sefer_2025[[\"line_code\", \"month\", \"sefer_sayisi\"]], on=[\"line_code\", \"month\"], how=\"left\")\neksik = birlesik[birlesik[\"sefer_sayisi\"].isna()][\"line_code\"].unique()\nprint(\"Sefer verisi olmayan:\", list(eksik))", "test": "assert set(eksik) == {\"Marmaray\", \"TF1\"}, f\"eksik: {list(eksik)}\"\nassert len(birlesik) == 10, f\"Yolcu tablosundaki 10 satırın hepsi kalmalı, şu an {len(birlesik)}\"", "hint": "<code>how=\"inner\"<\/code> sağda karşılığı olmayan satırları hiç almıyor; NaN oluşmadığı için <code>isna<\/code> onları göremiyor. <code>how=\"left\"<\/code> kullan.", "tags": ["merge"], "setup": ["yolcu", "sefer"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Hat toplamlarını bir hat türü tablosuyla <code>how=\"outer\"<\/code> ve <code>indicator=True<\/code> kullanarak birleştir (<code>m<\/code>). Sonra yalnızca yolcu tablosunda olan hatları <code>sadece_yolcu<\/code>, yalnızca tür tablosunda olanları <code>sadece_tur<\/code> listesine yaz.", "starter": "hat_toplam = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().reset_index()\nturler = pd.DataFrame({\"line_code\": [\"M2\", \"M4\", \"T1\", \"TF1\", \"F1\"],\n                       \"tur\": [\"Metro\", \"Metro\", \"Tramvay\", \"Teleferik\", \"Füniküler\"]})\n\nm = \nsadece_yolcu = \nsadece_tur = \n", "sol": "hat_toplam = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum().reset_index()\nturler = pd.DataFrame({\"line_code\": [\"M2\", \"M4\", \"T1\", \"TF1\", \"F1\"],\n                       \"tur\": [\"Metro\", \"Metro\", \"Tramvay\", \"Teleferik\", \"Füniküler\"]})\n\nm = hat_toplam.merge(turler, on=\"line_code\", how=\"outer\", indicator=True)\nsadece_yolcu = m.loc[m[\"_merge\"] == \"left_only\", \"line_code\"].tolist()\nsadece_tur = m.loc[m[\"_merge\"] == \"right_only\", \"line_code\"].tolist()\nprint(m)\nprint(sadece_yolcu, sadece_tur)", "test": "assert \"_merge\" in m.columns, \"indicator=True ile _merge sütunu eklenmeli\"\nassert len(m) == 6, f\"outer birleştirmede 6 satır olmalı, şu an {len(m)}\"\nassert list(sadece_yolcu) == [\"Marmaray\"], f\"sadece_yolcu: {list(sadece_yolcu)}\"\nassert list(sadece_tur) == [\"F1\"], f\"sadece_tur: {list(sadece_tur)}\"", "hint": "<code>m = hat_toplam.merge(turler, on=\"line_code\", how=\"outer\", indicator=True)<\/code>; sonra <code>m.loc[m[\"_merge\"] == \"left_only\", \"line_code\"].tolist()<\/code>.", "tags": ["merge"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Bu kez <code>pivot_table<\/code> kullanmadan, <code>groupby<\/code> + <code>unstack<\/code> ile hat × yaş toplam yolcu tablosunu kur. Sütunları <code>yas_sirasi<\/code>'na göre diz (<code>reindex<\/code>) ve veride olmayan grupları 0 yap: <code>tablo<\/code>.", "starter": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\ntablo = \n", "sol": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\ntablo = (yolcu.groupby([\"line_code\", \"age\"])[\"passanger_cnt\"].sum()\n         .unstack()\n         .reindex(columns=yas_sirasi)\n         .fillna(0))\nprint(tablo)", "test": "assert \"pivot\" not in __kod__, \"Bu kez pivot_table kullanma; groupby + unstack ile kur\"\nassert list(tablo.columns) == [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"], f\"Sütun sırası: {list(tablo.columns)}\"\nassert tablo.notna().all().all(), \"Boş hücre kalmamalı (fillna(0))\"\nassert tablo.loc[\"T1\", \"60+\"] == 3791 and tablo.loc[\"M2\", \"<20\"] == 0, \"Değerler yanlış\"", "hint": "<code>groupby([\"line_code\", \"age\"])[\"passanger_cnt\"].sum().unstack()<\/code>, ardından <code>.reindex(columns=yas_sirasi)<\/code> ve <code>.fillna(0)<\/code>.", "tags": ["unstack", "pivot", "fillna"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Sefer başına yolcu tablosu.<\/b> Not defterindeki 2. analizi baştan kur. (Örnek yolcu tablosunda <code>transaction_year<\/code> yok; bütün satırlar 2025.)<ol><li><code>aylik_yolcu<\/code>: hat ve ay bazında toplam yolcu; <code>reset_index<\/code> ile düz tablo, ay sütununun adı <code>month<\/code>.<\/li><li><code>sefer<\/code>'i <code>melt<\/code> ile uzun hâle getir, <code>Tarih<\/code>'ten <code>year<\/code> ve <code>month<\/code> çıkar, yalnızca 2025'i al: <code>sefer_2025<\/code>.<\/li><li><code>how=\"left\"<\/code> ile birleştir (<code>birlesik<\/code>) ve sefer verisi olmayan hatları yazdır.<\/li><li>Boş satırları at; hat bazında yolcu ve seferi topla, <code>sefer_basina_yolcu<\/code> sütununu hesapla ve büyükten küçüğe sırala: <code>hat_oran<\/code>.<\/li><\/ol>", "starter": "# 1) aylik_yolcu\n\n# 2) sefer_2025\n\n# 3) birlesik + eksik hatlar\n\n# 4) hat_oran\n", "sol": "aylik_yolcu = (yolcu.groupby([\"line_code\", \"transaction_month\"])[\"passanger_cnt\"].sum()\n               .reset_index()\n               .rename(columns={\"transaction_month\": \"month\"}))\n\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun[\"year\"] = sefer_uzun[\"Tarih\"].dt.year\nsefer_uzun[\"month\"] = sefer_uzun[\"Tarih\"].dt.month\nsefer_2025 = sefer_uzun[sefer_uzun[\"year\"] == 2025]\n\nbirlesik = aylik_yolcu.merge(sefer_2025[[\"line_code\", \"month\", \"sefer_sayisi\"]],\n                             on=[\"line_code\", \"month\"], how=\"left\")\nprint(\"Sefer verisi olmayan:\", birlesik[birlesik[\"sefer_sayisi\"].isna()][\"line_code\"].unique().tolist())\n\nbirlesik = birlesik.dropna(subset=[\"sefer_sayisi\"])\nhat_oran = birlesik.groupby(\"line_code\")[[\"passanger_cnt\", \"sefer_sayisi\"]].sum()\nhat_oran[\"sefer_basina_yolcu\"] = hat_oran[\"passanger_cnt\"] / hat_oran[\"sefer_sayisi\"]\nhat_oran = hat_oran.sort_values(\"sefer_basina_yolcu\", ascending=False)\nprint(hat_oran.round(2))", "test": "assert \"month\" in aylik_yolcu.columns, \"aylik_yolcu'da month sütunu olmalı (rename)\"\nassert list(hat_oran.index) == [\"M2\", \"M4\", \"T1\", \"TF1\"], f\"Sıra: {list(hat_oran.index)}\"\nassert \"sefer_basina_yolcu\" in hat_oran.columns, \"sefer_basina_yolcu sütunu yok\"\nassert abs(hat_oran.loc[\"M2\", \"sefer_basina_yolcu\"] - 37757 / 29000) < 1e-3, f\"M2 değeri yanlış ({hat_oran.loc['M2', 'sefer_basina_yolcu']:.3f}); 2024 seferleri de karışmış olabilir\"\nassert abs(hat_oran.loc[\"TF1\", \"sefer_basina_yolcu\"] - 621 / 3000) < 1e-3, \"TF1 değeri yanlış: Ekim'in sefer verisi yok, o satır atılmalı\"\nassert \"Marmaray\" in __cikti__, \"Sefer verisi olmayan hatları (Marmaray…) yazdır\"", "hint": "Yıl filtresini unutma: 2024 Mart seferleri de <code>month == 3<\/code> olduğundan filtre olmazsa M2 Mart satırı iki kez eşleşir. Eksikleri <code>birlesik[birlesik[\"sefer_sayisi\"].isna()][\"line_code\"].unique()<\/code> ile yazdır; sonra <code>dropna(subset=[\"sefer_sayisi\"])<\/code>, <code>groupby(\"line_code\")[[...]].sum()<\/code> ve bölme.", "tags": ["merge", "melt", "groupby", "fillna"], "setup": ["yolcu", "sefer"], "rev": false, "why": "Gerçek veride de sonuç aynı mantıkla çıktı: Marmaray, M11, TCDD ve İETT hatları sefer verisi olmadığı için grafiğe girmedi.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>indicator=True<\/code> merge sonucuna ne ekler?", "opts": ["Satır numarası sütunu", "Her satırın hangi tablodan geldiğini gösteren _merge sütunu", "Eşleşmeyen satırları siler", "Anahtar sütunu tekrarlar"], "a": 1, "why": "<code>_merge<\/code>: <code>both<\/code>, <code>left_only<\/code> ya da <code>right_only<\/code>.", "tags": ["merge"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>how=\"outer\"<\/code> hangi satırları tutar?", "opts": ["Yalnızca eşleşenleri", "Yalnızca soldakileri", "İki taraftaki bütün anahtarları", "Yalnızca sağdakileri"], "a": 2, "why": "Birleşim: iki tablodaki bütün anahtarlar; eksik taraf NaN.", "tags": ["merge"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>hat_yas.reindex(columns=yas_sirasi)<\/code> tabloda olmayan bir yaş grubu için ne yapar?", "opts": ["Hata verir", "O sütunu NaN değerlerle ekler", "O grubu atlar", "0 ile doldurur"], "a": 1, "why": "<code>reindex<\/code> listeyi olduğu gibi uygular; eksik sütunlar NaN'dır. 0 istersen ardından <code>fillna(0)<\/code>.", "tags": ["pivot"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>df.sum()<\/code> (axis yazılmadan) ne döndürür?", "opts": ["Her satırın toplamını", "Her sütunun toplamını", "Tek bir sayı", "Hata"], "a": 1, "why": "Varsayılan <code>axis=0<\/code>: satırlar boyunca aşağı iner, her sütun için bir toplam verir.", "tags": ["axis"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"sonra": 10, "id": "t3", "no": 3, "tur": "tekrar", "baslik": "Tekrar durağı 3", "aralik": [5, 6, 7, 8, 9, 10], "adet": 8, "ozet": "pandas'ı oturtma zamanı: regex'ten pivot'a kadar."}, {"id": "b11", "no": 11, "tur": "ders", "baslik": "Grafik: matplotlib", "hat": "T1", "ozet": "Figür ve eksen, çubuk/çizgi/pasta grafik, yazı ve lejant, referans çizgileri; her grafikte tekrar eden işi yardımcı fonksiyona taşımak.", "dosya": "analiz.ipynb", "proje": "def baslik_ekle(ax, baslik, altbaslik=None):\n    ax.set_title(baslik, loc=\"left\", fontsize=12, fontweight=\"bold\", pad=22 if altbaslik else 10)\n    if altbaslik:\n        ax.text(0, 1.02, altbaslik, transform=ax.transAxes, fontsize=9, color=\"gray\", va=\"bottom\")\n...\nfig, ax = plt.subplots(figsize=(8, 9))\nrenkler = [VURGU_RENK if d > 100 else ANA_RENK for d in oran]\noran.plot(kind=\"barh\", ax=ax, color=renkler)\n\nfor i, d in enumerate(oran):\n    ax.text(d + 1.5, i, f\"%{d:.0f}\", va=\"center\", fontsize=8)\n\nax.axvline(100, color=\"gray\", linestyle=\"--\", linewidth=1)\nax.spines[[\"top\", \"right\"]].set_visible(False)\nbaslik_ekle(ax, \"2025'te hafta sonu yolcusunun hafta içine oranı\", \"Hafta sonu günlük ortalama yolcu ÷ hafta içi günlük ortalama yolcu\")\nax.set_xlim(0, 125)\nfooter_ekle(fig, \"2025\", \"%\", \"Not: Kesikli çizgi (%100) hafta sonu ile hafta içinin eşit olduğu düzeyi gösterir. ...\")\nplt.tight_layout(rect=[0, 0.06, 1, 1])\nplt.savefig(\"figures/hafta_sonu_orani.png\", dpi=150)", "adimlar": [{"baslik": "Figür ve eksen: fig, ax", "html": "\n<p>matplotlib'de her grafik iki katmandan oluşur. <b>Figür<\/b> (<code>fig<\/code>) tuvalin kendisidir: boyutu ve en alttaki kaynak satırı ona aittir.\n<b>Eksen<\/b> (<code>ax<\/code>) tuvalin üstündeki grafik alanıdır: çubuklar, çizgiler, eksen yazıları ve başlık ona eklenir. Bir figürde birden çok eksen olabilir.<\/p>\n<pre class=\"py\">import matplotlib.pyplot as plt\n\nfig, ax = plt.subplots(figsize=(8, 5))    # 8 inç geniş, 5 inç yüksek, tek eksen\nax.barh([\"M2\", \"T1\"], [145, 107])\nax.set_xlabel(\"Yolcu (milyon)\")\nax.set_title(\"Hat bazında yolcu\")\nplt.show()<\/pre>\n<p><code>plt.subplots()<\/code> iki değer döndürür; <code>fig, ax = ...<\/code> ile ikisini birden alırsın. Satır ve sütun sayısı verirsen eksenler bir dizi olarak gelir:<\/p>\n<pre class=\"py\">fig, (ax1, ax2) = plt.subplots(1, 2, figsize=(10, 4))   # yan yana iki grafik\nfig, axes = plt.subplots(2, 2)                          # axes[0, 1] → üst sıra, sağdaki<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> matplotlib'de <code>plt.barh(...)<\/code>, <code>plt.title(...)<\/code> gibi kısa bir yazım da var; o, \"en son hangi grafik açıksa ona çiz\" der.\nProjende hep <code>ax.<\/code> ile yazmışsın. Bu yazımda hangi eksene çizdiğin açıkça görünür, iki grafik yan yana olunca karışıklık çıkmaz\nve <code>ax<\/code>'i bir fonksiyona argüman olarak verebilirsin.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>plt.title(\"...\")<\/code> alışkanlığıyla <code>ax.title(\"...\")<\/code> yazmak:\n<code>TypeError: 'Text' object is not callable<\/code>. Eksende ayar yöntemlerinin çoğu <code>set_<\/code> ile başlar:\n<code>ax.set_title<\/code>, <code>ax.set_xlabel<\/code>, <code>ax.set_xlim<\/code>.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(8, 3))\nax1.barh([\"M2\", \"Marmaray\", \"T1\"], [145, 190, 107], color=\"#3b6ea5\")\nax1.set_title(\"Yıllık yolcu (milyon)\")\nax2.plot([\"Oca\", \"Şub\", \"Mar\", \"Nis\"], [2.9, 3.0, 3.1, 2.8], marker=\"o\")\nax2.set_title(\"Günlük ortalama (milyon)\")\nprint(\"Figürdeki eksen sayısı:\", len(fig.axes))\nplt.show()", "ornek_setup": []}, {"baslik": "Grafik türleri: barh, plot, scatter, pie", "html": "\n<p>Projendeki grafiklerin neredeyse hepsi dört yöntemle çiziliyor:<\/p>\n<pre class=\"py\">ax.barh(etiketler, degerler, color=renkler)    # yatay çubuk: hatları karşılaştırmak\nax.plot(aylar, degerler, marker=\"o\")           # çizgi: zaman içindeki değişim\nax.scatter(x, y, s=40)                         # nokta: iki değişken arasındaki ilişki\ndilimler, yazilar = ax.pie(degerler)           # pasta: bütünün parçaları<\/pre>\n<p>pandas Series'in kendi <code>.plot<\/code> yöntemi de aynı işi yapar: <code>veri.plot(kind=\"barh\", ax=ax, color=renkler)<\/code>.\nBuradaki <code>ax=ax<\/code> hangi eksene çizileceğini söyler. Etiketler Series'in index'inden, uzunluklar değerlerinden gelir.<\/p>\n<h3>Çubukların sırası<\/h3>\n<p><code>barh<\/code> ilk elemanı <b>en alta<\/b> çizer. Bu yüzden projende önce <code>sort_values()<\/code> ile küçükten büyüğe sıralayıp sonra çizmişsin:\nen büyük çubuk en üstte durur, göz yukarıdan aşağı okurken önce en önemliyi görür.<\/p>\n<p>Pasta grafikte dilim sayısını sınırlamışsın: ilk 6 hat ayrı, kalanlar tek bir \"Diğer\" diliminde.\n<code>ax.pie<\/code> dilim nesnelerini döndürdüğü için her dilimin açısından (<code>theta1<\/code>, <code>theta2<\/code>) etiketin yerini hesaplayabilmişsin.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Grafik türünü soru belirler. \"Hangisi daha büyük?\" → çubuk. \"Zamanla nasıl değişti?\" → çizgi.\n\"İkisi birlikte artıyor mu?\" → nokta. \"Bütünün ne kadarı?\" → pasta, ama az dilimle; 20 dilimli bir pasta okunmaz.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>sort_values(ascending=False)<\/code> ile büyükten küçüğe sıralayıp <code>barh<\/code> çizmek:\nen büyük çubuk en altta kalır. Yatay çubukta ya küçükten büyüğe sırala ya da çizdikten sonra <code>ax.invert_yaxis()<\/code> kullan.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\n\nhat_yolcu = yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum()\nveri = hat_yolcu.sort_values()        # küçükten büyüğe → en büyük en üstte\nprint(veri)\n\nfig, (ax1, ax2) = plt.subplots(1, 2, figsize=(9, 3.5))\nveri.plot(kind=\"barh\", ax=ax1, color=\"#3b6ea5\")\nax1.set_title(\"barh\")\nax1.set_ylabel(\"\")\nax2.pie(veri.values, labels=veri.index, startangle=90, counterclock=False)\nax2.set_title(\"pie\")\nplt.show()", "ornek_setup": ["yolcu"]}, {"baslik": "Yazılar, renkler ve kendi lejantın", "html": "\n<p>Çubuğun ucuna değerini yazmak için <code>ax.text(x, y, metin)<\/code> kullanıyorsun. Yatay çubukta <b>y<\/b> çubuğun sıra numarasıdır (0, 1, 2 …),\n<b>x<\/b> ise değerin biraz sağı. Sıra numarasını <code>enumerate<\/code> verir:<\/p>\n<pre class=\"py\">for i, deger in enumerate(veri):\n    ax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)<\/pre>\n<p><code>va=\"center\"<\/code> yazıyı çubuğun ortasına hizalar. Okla gösterilen yazı için <code>ax.annotate(metin, xy=nokta, xytext=yazının_yeri, arrowprops={...})<\/code> var;\npasta grafiğinin etiketlerini böyle yerleştirmişsin.<\/p>\n<h3>Her çubuğa kendi rengi<\/h3>\n<p><code>color<\/code>'a tek renk yerine bir <b>liste<\/b> verirsen her çubuk sıradaki rengi alır. Projende listeyi hat türünden üretiyorsun:<\/p>\n<pre class=\"py\">renkler = [TUR_RENK[hat_turu(kod)] for kod in veri.index]<\/pre>\n<p>Tek bir çubuk serisi olduğu için otomatik lejant tek satır gösterirdi. Tür başına bir kutu için lejantı <code>Patch<\/code> (renkli kutu + etiket) ile elle kurmuşsun:<\/p>\n<pre class=\"py\">from matplotlib.patches import Patch\nax.legend(handles=[Patch(color=TUR_RENK[t], label=t) for t in turler], frameon=False)<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Renk listesini veriyi sıralamadan <b>önce<\/b> üretmek. Liste eski sırada kalır, renkler yanlış çubuklara gider\nve hiçbir hata mesajı çıkmaz. Kural: renkleri, çizeceğin son hâliyle aynı <code>veri<\/code>'den üret.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>turler<\/code>'i <code>sorted(..., key=list(TUR_RENK).index)<\/code> ile sıralaman, lejantın her grafikte\naynı sırayla (Metro, Tramvay, …) çıkmasını sağlıyor. Okuyucu bir kez öğrendiği düzeni sonraki grafiklerde de bulur.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\nfrom matplotlib.patches import Patch\n\nTUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\", \"Banliyö\": \"#8c564b\", \"Teleferik\": \"#8c6bb1\"}\ntur = {\"M2\": \"Metro\", \"M4\": \"Metro\", \"T1\": \"Tramvay\", \"Marmaray\": \"Banliyö\", \"TF1\": \"Teleferik\"}\n\nveri = (yolcu.groupby(\"line_code\")[\"passanger_cnt\"].sum() / 1000).sort_values()\nrenkler = [TUR_RENK[tur[kod]] for kod in veri.index]    # sıralanmış veriden üretildi\n\nfig, ax = plt.subplots(figsize=(6, 3.5))\nax.barh(veri.index, veri.values, color=renkler)\nfor i, deger in enumerate(veri):\n    ax.text(deger + 0.5, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)\nax.legend(handles=[Patch(color=r, label=t) for t, r in TUR_RENK.items()], loc=\"lower right\", frameon=False)\nax.set_xlabel(\"Yolcu (bin)\")\nplt.show()", "ornek_setup": ["yolcu"]}, {"baslik": "Referans çizgisi, çerçeve ve yerleşim", "html": "\n<p>Bir grafiği okunur kılan küçük dokunuşlar:<\/p>\n<pre class=\"py\">ax.axvline(100, color=\"gray\", linestyle=\"--\", linewidth=1)   # x = 100'de dikey çizgi\nax.axhline(0, color=\"gray\", linewidth=0.8)                   # y = 0'da yatay çizgi\nax.axhspan(-5, 5, color=\"#eeeeee\", zorder=0)                 # -5 ile 5 arası gri bant\nax.spines[[\"top\", \"right\"]].set_visible(False)               # üst ve sağ çerçeveyi gizle\nax.set_xlim(0, 125)                                          # x ekseninin aralığı\nax.set_ylabel(\"\")                                            # pandas'ın koyduğu etiketi sil<\/pre>\n<p><code>axvline<\/code> ve <code>axhline<\/code> eksenin bir ucundan öbürüne uzanır. Hafta sonu grafiğinde %100 çizgisi \"hafta sonu = hafta içi\" düzeyini gösteriyor;\nbir çubuğun çizgiyi geçip geçmediği tek bakışta anlaşılıyor.<\/p>\n<h3>Yerleşim ve kaydetme<\/h3>\n<p><code>plt.tight_layout()<\/code> başlık ve etiketler taşmasın diye boşlukları ayarlar. Projende <code>rect=[0, 0.04, 1, 1]<\/code> vermişsin:\n\"yerleşimi, figürün alttaki %4'lük şeridi hariç yap\". O şerit, <code>footer_ekle<\/code>'nin yazdığı kaynak satırına kalır.\nArdından <code>plt.savefig(\"figures/....png\", dpi=150)<\/code> dosyaya yazar.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>tight_layout<\/code> yalnızca eksenleri ve onların yazılarını hesaba katar; <code>fig.text<\/code> ile eklenen alt bilgiyi görmez.\n<code>rect<\/code> vermezsen x ekseni etiketi ile kaynak satırı üst üste binebilir.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>plt.show()<\/code>'u <code>plt.savefig(...)<\/code>'dan önce çağırmak. Gösterilen figür kapanır;\nardından gelen <code>savefig<\/code> boş, beyaz bir PNG yazar. Önce kaydet, sonra göster.<\/div>\n", "ornek": "import matplotlib.pyplot as plt\n\naylar = [\"Oca\", \"Şub\", \"Mar\", \"Nis\", \"May\", \"Haz\"]\nendeks = [104, 101, 99, 97, 102, 88]\n\nfig, ax = plt.subplots(figsize=(6, 3))\nax.plot(aylar, endeks, marker=\"o\", color=\"#3b6ea5\")\nax.axhline(100, color=\"gray\", linestyle=\":\", linewidth=0.8)   # yıllık ortalama = 100\nax.spines[[\"top\", \"right\"]].set_visible(False)\nax.set_ylim(80, 110)\nax.set_ylabel(\"Endeks\")\nfig.text(0.01, 0.01, \"Kaynak: örnek veri\", fontsize=7, color=\"gray\")\nplt.tight_layout(rect=[0, 0.05, 1, 1])\nplt.show()", "ornek_setup": []}, {"baslik": "Yardımcı fonksiyonlar: baslik_ekle ve footer_ekle", "html": "\n<p>Projende on kadar grafik var ve hepsinde aynı düzen tekrar ediyor: sola yaslı kalın başlık, altında gri bir açıklama, en altta kaynak satırı.\nBunu her grafikte elle yazmak yerine iki fonksiyona taşımışsın:<\/p>\n<pre class=\"py\">def baslik_ekle(ax, baslik, altbaslik=None):\n    ax.set_title(baslik, loc=\"left\", fontsize=12, fontweight=\"bold\", pad=22 if altbaslik else 10)\n    if altbaslik:\n        ax.text(0, 1.02, altbaslik, transform=ax.transAxes, fontsize=9, color=\"gray\", va=\
