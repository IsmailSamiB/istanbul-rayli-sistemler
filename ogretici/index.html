turu(\"F4\")<\/code> ne döndürür?", "opts": ["\"Metro\"", "\"Tramvay\"", "\"Füniküler\"", "None"], "a": 2, "why": "Hiçbir if tutmaz, en alttaki <code>return \"Füniküler\"<\/code> çalışır.", "tags": ["fonksiyon", "kosul"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>TF<\/code> kontrolü <code>T<\/code> kontrolünün <b>altına<\/b> taşınsaydı <code>hat_turu(\"TF2\")<\/code> ne döndürürdü?", "opts": ["\"Teleferik\"", "\"Tramvay\"", "\"Metro\"", "hata"], "a": 1, "why": "İlk tutan koşulda <code>return<\/code> çalışır. \"TF2\" \"T\" ile de başladığı için Tramvay dönerdi.", "tags": ["kosul"], "code": null, "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "fill", "q": "<code>baslik_ekle<\/code> fonksiyonuna, verilmezse <code>None<\/code> olan bir <code>altbaslik<\/code> parametresi ekle.", "code": "def baslik_ekle(ax, baslik, ___):\n    if ___:\n        ax.text(0, 1.02, altbaslik)", "a": [["altbaslik=None", "altbaslik = None"], ["altbaslik", "altbaslik is not None"]], "why": "Varsayılan değer <code>=None<\/code> ile verilir; <code>if altbaslik:<\/code> boş ya da None değilse çalışır.", "tags": ["fonksiyon"], "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Bu kod ne olur?", "opts": ["42 yazdırır", "None yazdırır", "NameError hatası", "Hiçbir şey yazdırmaz"], "a": 2, "why": "<code>sonuc<\/code> yalnızca fonksiyonun içinde var. Dışarıda kullanmak için <code>sonuc = f()<\/code> diye dönen değeri ata.", "tags": ["fonksiyon"], "code": "def f():\n    sonuc = 42\n    return sonuc\n\nf()\nprint(sonuc)", "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "Hangisi karşılaştırma değil, <b>atamadır<\/b>?", "opts": ["kod == \"M2\"", "kod = \"M2\"", "kod != \"M2\"", "kod >= \"M2\""], "a": 1, "why": "Tek <code>=<\/code> değer atar; <code>==<\/code>, <code>!=<\/code>, <code>&gt;=<\/code> karşılaştırır.", "tags": ["kosul"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["B", "B ve C", "C", "D"], "a": 0, "why": "İlk doğru koşul (x &gt; 5) çalışır; <code>elif<\/code> zincirinde sonrakilere bakılmaz.", "tags": ["kosul"], "code": "x = 7\nif x > 10:\n    print(\"A\")\nelif x > 5:\n    print(\"B\")\nelif x > 0:\n    print(\"C\")\nelse:\n    print(\"D\")", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "<code>hat_turu<\/code>'nun başını tamamla.", "code": "def hat_turu(kod):\n    if kod == \"Marmaray\" ___ kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod.___(\"TF\"):\n        return \"Teleferik\"", "a": [["or"], ["startswith"]], "why": "İki durumdan biri yeter: <code>or<\/code>. Başlangıç kontrolü: <code>.startswith(...)<\/code>.", "tags": ["kosul", "fonksiyon"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "order", "q": "Satırları doğru sıraya koy: kod <code>\"M\"<\/code> ile başlıyorsa \"Metro\", değilse \"Diğer\" döndüren fonksiyon.", "lines": ["def tur(kod):", "    if kod.startswith(\"M\"):", "        return \"Metro\"", "    return \"Diğer\""], "why": "Önce def, sonra koşul ve içindeki return, en son koşulun dışındaki return.", "tags": ["fonksiyon"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Projendeki <code>hat_turu<\/code>'dan ilk <code>if<\/code> (Marmaray/TCDD satırı) silinseydi <code>hat_turu(\"Marmaray\")<\/code> ne döndürürdü?", "opts": ["\"Banliyö (TCDD)\"", "\"Metro\"", "\"Füniküler\"", "None"], "a": 1, "why": "\"Marmaray\" \"M\" ile başlıyor; ilk tutan koşul <code>kod.startswith(\"M\")<\/code> olur ve \"Metro\" döner.", "tags": ["kosul", "fonksiyon"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["~23.3 milyon", "23.3 ~", "~23.3", "hata"], "a": 0, "why": "<code>onek<\/code> adıyla verildi; <code>birim<\/code> varsayılan \"milyon\" kaldı. Sırayla verilseydi \"~\" <code>birim<\/code>'e giderdi.", "tags": ["fonksiyon", "fstring"], "code": "def etiket(deger, birim=\"milyon\", onek=\"\"):\n    return f\"{onek}{deger} {birim}\"\n\nprint(etiket(23.3, onek=\"~\"))", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["10 10 22", "10 22 22", "22 22 22", "10 10 10"], "a": 0, "why": "Verilmeyen <code>alt<\/code> None, verilen <code>\"\"<\/code> boş metin: ikisi de yanlış sayılır, 10 döner. Yalnızca \"B\" doğru sayılır.", "tags": ["kosul", "fonksiyon"], "code": "def pad(alt=None):\n    return 22 if alt else 10\n\nprint(pad(), pad(\"\"), pad(\"B\"))", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>buyukluk(yolcu)<\/code> fonksiyonu yaz: 10 milyondan fazlaysa <code>\"büyük\"<\/code>, 1 milyondan fazlaysa <code>\"orta\"<\/code>, değilse <code>\"küçük\"<\/code> döndürsün.", "starter": "def buyukluk(yolcu):\n    # buraya yaz\n    pass\n", "sol": "def buyukluk(yolcu):\n    if yolcu > 10_000_000:\n        return \"büyük\"\n    elif yolcu > 1_000_000:\n        return \"orta\"\n    return \"küçük\"", "test": "assert buyukluk(23_000_000) == \"büyük\", \"23 milyon → büyük olmalı\"\nassert buyukluk(5_000_000) == \"orta\", \"5 milyon → orta olmalı\"\nassert buyukluk(200_000) == \"küçük\", \"200 bin → küçük olmalı\"\nassert buyukluk(10_000_000) == \"orta\", \"Tam 10 milyon 'fazla' değil → orta olmalı\"", "hint": "Büyükten küçüğe kontrol et: önce 10 milyon, sonra 1 milyon. <code>&gt;<\/code> kullan ve <code>return<\/code> et.", "tags": ["fonksiyon", "kosul"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Projendeki anomali kuralını fonksiyon yap. <code>anomali_mi(robust_z, sapma_yuzde)<\/code>, robust z'nin mutlak değeri 3.5'ten <b>ve<\/b> sapmanın mutlak değeri 5'ten büyükse <code>True<\/code>, değilse <code>False<\/code> döndürsün. (Mutlak değer: <code>abs(-12)<\/code> → 12.)", "starter": "def anomali_mi(robust_z, sapma_yuzde):\n    pass\n", "sol": "def anomali_mi(robust_z, sapma_yuzde):\n    return abs(robust_z) > 3.5 and abs(sapma_yuzde) > 5\n", "test": "assert anomali_mi(4.0, -12), \"z=4, sapma=-12 → anomali olmalı\"\nassert anomali_mi(-6.2, -31), \"z=-6.2, sapma=-31 → anomali olmalı (mutlak değer!)\"\nassert not anomali_mi(4.0, 3), \"sapma %3 → anomali değil\"\nassert not anomali_mi(2.0, -20), \"z=2 → anomali değil\"\nassert not anomali_mi(3.5, 10), \"z tam 3.5 → büyük değil, anomali değil\"", "hint": "Tek satır yeter: <code>return abs(robust_z) &gt; 3.5 and abs(sapma_yuzde) &gt; 5<\/code>. Karşılaştırma zaten True/False üretir.", "tags": ["fonksiyon", "kosul"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>yuzde<\/code> fonksiyonu sonucu ekrana yazıyor ama <code>pay<\/code> <code>None<\/code> çıkıyor. Düzelt ki <code>pay<\/code> 57.5 olsun.", "starter": "def yuzde(parca, butun):\n    print(round(parca / butun * 100, 1))\n\npay = yuzde(145, 252)\nprint(\"M2 payı:\", pay)\n", "sol": "def yuzde(parca, butun):\n    return round(parca / butun * 100, 1)\n\npay = yuzde(145, 252)\nprint(\"M2 payı:\", pay)\n", "test": "assert pay == 57.5, f\"pay 57.5 olmalı, şu an {pay}\"\nassert yuzde(1, 4) == 25.0, \"yuzde(1, 4) 25.0 döndürmeli\"", "hint": "Fonksiyon değeri <code>print<\/code> etmemeli, <code>return<\/code> etmeli.", "tags": ["fonksiyon"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>yenikapi_hatti_mi<\/code> fonksiyonu Yenikapı'dan geçen M1, M2 ve Marmaray için <code>True<\/code>, diğerleri için <code>False<\/code> döndürmeli. Ama her koda <code>True<\/code> diyor.", "starter": "def yenikapi_hatti_mi(kod):\n    if kod == \"M1\" or \"M2\" or \"Marmaray\":\n        return True\n    return False\n", "sol": "def yenikapi_hatti_mi(kod):\n    if kod in (\"M1\", \"M2\", \"Marmaray\"):\n        return True\n    return False\n", "test": "for k in [\"M1\", \"M2\", \"Marmaray\"]:\n    assert yenikapi_hatti_mi(k), f\"{k} için True olmalı\"\nfor k in [\"T1\", \"M4\", \"TF1\"]:\n    assert not yenikapi_hatti_mi(k), f\"{k} için False olmalı\"", "hint": "<code>or \"M2\"<\/code> her zaman doğrudur. Her karşılaştırmayı tam yaz (<code>kod == \"M2\"<\/code>) ya da <code>kod in (\"M1\", \"M2\", \"Marmaray\")<\/code> kullan.", "tags": ["kosul", "fonksiyon"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Saçılım grafiğindeki etiketler için <code>etiket_yaz(kod, kisa_ad=None, uzunluk=12)<\/code> yaz:<br>• <code>kisa_ad<\/code> verilmişse ve boş değilse onu döndür;<br>• yoksa kod <code>uzunluk<\/code>'tan uzunsa ilk <code>uzunluk - 1<\/code> karakterini alıp sonuna <code>…<\/code> ekle (toplam <code>uzunluk<\/code> karakter);<br>• değilse kodu olduğu gibi döndür.<br>Örnek: <code>etiket_yaz(\"IETT NOSTALJIK TRAMVAY\")<\/code> → <code>\"IETT NOSTAL…\"<\/code>", "starter": "def etiket_yaz(kod, kisa_ad=None, uzunluk=12):\n    # kısaltırken sona \"…\" ekle (bu karakteri buradan kopyalayabilirsin)\n    pass\n", "sol": "def etiket_yaz(kod, kisa_ad=None, uzunluk=12):\n    if kisa_ad:\n        return kisa_ad\n    if len(kod) > uzunluk:\n        return kod[:uzunluk - 1] + \"…\"\n    return kod\n", "test": "assert etiket_yaz(\"M2\") == \"M2\", \"Kısa kod olduğu gibi dönmeli\"\nassert etiket_yaz(\"IETT TUNEL\", kisa_ad=\"Tünel\") == \"Tünel\", \"kisa_ad verilince o dönmeli\"\nassert etiket_yaz(\"M2\", kisa_ad=\"\") == \"M2\", \"Boş kisa_ad verilmemiş sayılmalı\"\nassert etiket_yaz(\"IETT NOSTALJIK TRAMVAY\") == \"IETT NOSTAL…\", f\"Beklenen 'IETT NOSTAL…', senin sonucun {etiket_yaz('IETT NOSTALJIK TRAMVAY')!r}\"\nassert etiket_yaz(\"TCDD SIRKECI-KAZLICESME\", uzunluk=8) == \"TCDD SI…\", \"uzunluk=8 ile 'TCDD SI…' olmalı\"\nassert etiket_yaz(\"Marmaray\", uzunluk=8) == \"Marmaray\", \"Tam 8 karakter uzun sayılmaz\"", "hint": "Sıra: önce <code>if kisa_ad:<\/code> (None ve \"\" yanlış sayılır), sonra <code>if len(kod) &gt; uzunluk:<\/code> ve <code>kod[:uzunluk - 1] + \"…\"<\/code>, en sonda <code>return kod<\/code>.", "tags": ["fonksiyon", "kosul", "dilim"], "setup": [], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>hat_turu'yu sıfırdan yaz.<\/b> Kurallar aşağıda karışık sırada; doğru sırayı bulmak senin işin.<br>• <code>\"T\"<\/code> ile başlayan → <code>\"Tramvay\"<\/code><br>• <code>\"Marmaray\"<\/code> ve <code>\"TCDD\"<\/code> ile başlayan her kod → <code>\"Banliyö (TCDD)\"<\/code><br>• <code>\"M\"<\/code> ile başlayan → <code>\"Metro\"<\/code><br>• <code>\"IETT NOSTALJIK TRAMVAY\"<\/code> → <code>\"Tramvay\"<\/code>, <code>\"IETT TUNEL\"<\/code> → <code>\"Füniküler\"<\/code><br>• <code>\"TF\"<\/code> ile başlayan → <code>\"Teleferik\"<\/code><br>• geri kalan her şey (F1, F2, F4) → <code>\"Füniküler\"<\/code><br>Sonra: 2) <code>renk(kod)<\/code> fonksiyonu, hattın türünün <code>TUR_RENK<\/code>'teki rengini döndürsün. 3) <code>kodlar<\/code>'daki her hat için <code>TF1: Teleferik<\/code> biçiminde bir satır yazdır.", "starter": "TUR_RENK = {\n    \"Metro\": \"#3b6ea5\",\n    \"Tramvay\": \"#e08a3c\",\n    \"Füniküler\": \"#5a9e6f\",\n    \"Teleferik\": \"#8c6bb1\",\n    \"Banliyö (TCDD)\": \"#8c564b\",\n}\n\ndef hat_turu(kod):\n    # 1) kuralları doğru sırayla yaz\n    pass\n\ndef renk(kod):\n    # 2) türün rengini döndür\n    pass\n\nkodlar = [\"M4\", \"T1\", \"TF1\", \"Marmaray\", \"TCDD SIRKECI-KAZLICESME\", \"IETT TUNEL\",\n          \"IETT NOSTALJIK TRAMVAY\", \"F4\", \"TF2\", \"M11\", \"T5\", \"F1\"]\n\n# 3) her hat için \"TF1: Teleferik\" yazdır\n", "sol": "TUR_RENK = {\n    \"Metro\": \"#3b6ea5\",\n    \"Tramvay\": \"#e08a3c\",\n    \"Füniküler\": \"#5a9e6f\",\n    \"Teleferik\": \"#8c6bb1\",\n    \"Banliyö (TCDD)\": \"#8c564b\",\n}\n\ndef hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod == \"IETT TUNEL\":\n        return \"Füniküler\"\n    if kod == \"IETT NOSTALJIK TRAMVAY\":\n        return \"Tramvay\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"\n\ndef renk(kod):\n    return TUR_RENK[hat_turu(kod)]\n\nkodlar = [\"M4\", \"T1\", \"TF1\", \"Marmaray\", \"TCDD SIRKECI-KAZLICESME\", \"IETT TUNEL\",\n          \"IETT NOSTALJIK TRAMVAY\", \"F4\", \"TF2\", \"M11\", \"T5\", \"F1\"]\n\nfor kod in kodlar:\n    print(f\"{kod}: {hat_turu(kod)}\")\n", "test": "beklenen = {\"M4\": \"Metro\", \"M11\": \"Metro\", \"M1\": \"Metro\", \"T1\": \"Tramvay\", \"T5\": \"Tramvay\", \"TF1\": \"Teleferik\", \"TF2\": \"Teleferik\",\n            \"Marmaray\": \"Banliyö (TCDD)\", \"TCDD SIRKECI-KAZLICESME\": \"Banliyö (TCDD)\", \"TCDD - HALKALI-BASAKSEHIR\": \"Banliyö (TCDD)\",\n            \"IETT TUNEL\": \"Füniküler\", \"IETT NOSTALJIK TRAMVAY\": \"Tramvay\", \"F1\": \"Füniküler\", \"F2\": \"Füniküler\", \"F4\": \"Füniküler\"}\nfor k, v in beklenen.items():\n    assert hat_turu(k) == v, f\"hat_turu({k!r}) {v!r} olmalı, senin sonucun {hat_turu(k)!r}\"\nassert renk(\"TF1\") == \"#8c6bb1\", f\"renk('TF1') teleferik rengi olmalı, senin sonucun {renk('TF1')!r}\"\nassert renk(\"Marmaray\") == \"#8c564b\", \"renk('Marmaray') banliyö rengi olmalı\"\nfor satir in [\"TF1: Teleferik\", \"Marmaray: Banliyö (TCDD)\", \"IETT NOSTALJIK TRAMVAY: Tramvay\", \"F4: Füniküler\", \"M11: Metro\"]:\n    assert satir in __cikti__, f\"Çıktıda şu satır yok: {satir!r}\"", "hint": "Sıra: önce istisnalar (Marmaray/TCDD, IETT'nin iki hattı), sonra <code>\"TF\"<\/code>, sonra <code>\"M\"<\/code> ve <code>\"T\"<\/code>, en sonda <code>return \"Füniküler\"<\/code>. <code>renk<\/code> tek satır: <code>return TUR_RENK[hat_turu(kod)]<\/code>. Yazdırma: <code>for kod in kodlar:<\/code> ve <code>print(f\"{kod}: {hat_turu(kod)}\")<\/code>.", "tags": ["fonksiyon", "kosul", "sozluk"], "setup": [], "rev": false, "why": "Aslında <code>\"IETT TUNEL\"<\/code> satırı olmasa da sonuç değişmezdi (I ile başladığı için en alttaki Füniküler'e düşer); ama açıkça yazmak niyeti belgeler. Nostaljik tramvay satırı ise zorunlu: yoksa o da Füniküler olurdu.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "Hangi tanım <code>SyntaxError<\/code> verir?", "opts": ["def f(a, b=1):", "def f(a=1, b):", "def f(a, b):", "def f(a=1, b=2):"], "a": 1, "why": "Varsayılanlı parametreler varsayılansızlardan sonra gelmek zorunda.", "tags": ["fonksiyon"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>bool(\"0\")<\/code> neyi verir?", "opts": ["True", "False", "0", "hata"], "a": 0, "why": "\"0\" boş olmayan bir metin; yalnızca boş metin <code>\"\"<\/code> yanlış sayılır.", "tags": ["kosul", "tipler"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>return<\/code> satırı olmayan bir fonksiyon ne döndürür?", "opts": ["0", "\"\"", "None", "Hata verir"], "a": 2, "why": "Python, <code>return<\/code> görmeden biten her fonksiyondan <code>None<\/code> döndürür.", "tags": ["fonksiyon"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>pad = 22 if \"\" else 10<\/code> satırından sonra <code>pad<\/code> kaçtır?", "opts": ["22", "10", "\"\"", "hata"], "a": 1, "why": "Boş metin yanlış sayılır, <code>else<\/code> tarafı seçilir.", "tags": ["kosul"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b4", "no": 4, "tur": "ders", "baslik": "Döngüler ve comprehension", "hat": "M4", "ozet": "for, range, enumerate, zip ve while; tek satırda liste, küme ve sözlük üretmek; sorted ile key ve lambda.", "dosya": "analiz.ipynb", "proje": "renkler = [TUR_RENK[hat_turu(kod)] for kod in veri.index]\nturler = sorted({hat_turu(kod) for kod in veri.index}, key=list(TUR_RENK).index)\n\nfor i, deger in enumerate(veri):\n    ax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)\n...\nfor ay, deger in zip(aylar, veri):\n    ax.text(ay, deger + 0.02, f\"{deger:.2f}\", ha=\"center\", fontsize=8)\n...\nkomsular = [tarih + pd.Timedelta(weeks=k) for k in range(-hafta, hafta + 1) if k != 0]\n...\nrenkler = [VURGU_RENK if d > 100 else ANA_RENK for d in oran]\n...\nfor tur, renk in TUR_RENK.items():\n    grup = iliski[iliski[\"tur\"] == tur]\n    ax.scatter(grup[\"pay_60\"], grup[\"hafta_sonu\"], color=renk, s=40, label=tur, zorder=3)", "adimlar": [{"baslik": "for döngüsü ve range", "html": "\n<p><code>for<\/code> bir topluluğun (liste, metin, tuple, sözlük…) elemanlarını <b>sırayla<\/b> tek tek alır ve her biri için\ngirintili bloğu bir kez çalıştırır.<\/p>\n<pre class=\"py\">for hat in [\"M1\", \"M2\", \"M4\"]:\n    print(hat)          # üç kez çalışır: M1, M2, M4\nprint(\"bitti\")          # girintisiz: döngüden sonra bir kez<\/pre>\n<p><code>hat<\/code> her turda sıradaki elemana bağlanır. Sözlükte gezerken anahtarlar gelir; anahtar ve değeri birlikte\nistiyorsan <code>.items()<\/code>. Projende saçılım grafiğinde her türü kendi rengiyle çizmek için\n<code>for tur, renk in TUR_RENK.items():<\/code> yazmışsın.<\/p>\n<h3>range: sayı dizisi<\/h3>\n<pre class=\"py\">range(5)          # 0, 1, 2, 3, 4   → 5 dahil değil\nrange(2, 6)       # 2, 3, 4, 5\nrange(0, 10, 3)   # 0, 3, 6, 9      → üçer üçer\nrange(-4, 5)      # -4, -3, ..., 3, 4<\/pre>\n<p>Bitişin dahil olmaması dilimdeki mantığın aynısı. Projende anomali referansını hesaplarken tam bunu kullanmışsın:\n<code>range(-hafta, hafta + 1)<\/code> −4'ten +4'e kadar gider; <code>+ 1<\/code> olmasa +4. hafta dışarıda kalırdı.<\/p>\n<h3>Biriktirme kalıbı<\/h3>\n<pre class=\"py\">toplam = 0\nfor y in [145, 107, 73]:\n    toplam += y        # toplam = toplam + y'nin kısası\nprint(toplam)          # 325<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Başlangıç değerini döngünün <b>içine<\/b> koymak. <code>toplam = 0<\/code> döngünün\niçinde olursa her turda sıfırlanır; sonunda elinde yalnızca son eleman kalır. Biriktirilecek şey (sayı, boş liste, boş sözlük)\ndöngüden <b>önce<\/b> tanımlanır.<\/div>\n", "ornek": "for k in range(-4, 5):\n    print(k, end=\" \")\nprint()\n\ntoplam = 0\nfor y in [145, 107, 73]:\n    toplam += y\n    print(\"şu ana kadar:\", toplam)\nprint(\"toplam:\", toplam)", "ornek_setup": []}, {"baslik": "enumerate ve zip", "html": "\n<h3>enumerate: sıra numarasıyla birlikte<\/h3>\n<pre class=\"py\">veri = [12.5, 9.8, 4.1]\nfor i, deger in enumerate(veri):\n    print(i, deger)       # 0 12.5 / 1 9.8 / 2 4.1<\/pre>\n<p><code>enumerate<\/code> her turda bir <b>(sıra, eleman)<\/b> çifti verir; <code>i, deger<\/code> bu çifti açar (2. duraktaki\ntuple açma). Projende çubukların ucuna sayı yazarken <code>for i, deger in enumerate(veri):<\/code> kullanıyorsun: yatay çubuk\ngrafikte <code>i<\/code>. çubuk y = <code>i<\/code> hizasında durur, <code>ax.text(deger + 2, i, …)<\/code> de yazıyı çubuğun\nucunun biraz sağına koyar. Saymaya 1'den başlamak istersen: <code>enumerate(veri, start=1)<\/code>.<\/p>\n<h3>zip: listeleri yan yana gezmek<\/h3>\n<pre class=\"py\">aylar = [\"Oca\", \"Şub\", \"Mar\"]\nveri = [2.91, 3.02, 3.05]\nfor ay, deger in zip(aylar, veri):\n    print(f\"{ay}: {deger:.2f}\")<\/pre>\n<p><code>zip<\/code> iki (ya da daha çok) listenin aynı sıradaki elemanlarını eşleştirir. Aylık çizgi grafiğinde her noktanın\nüstüne değerini böyle yazmışsın; pasta grafiğinde de <code>zip(dilimler, pasta.index, pasta.values)<\/code> ile üç şeyi birden\neşleştiriyorsun.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Aynı işi <code>for i in range(len(aylar)): print(aylar[i], veri[i])<\/code> diye de\nyapabilirdin. Ama indeksle uğraşmak hataya açıktır: yanlış listeyi indekslemek, bir fazla saymak… <code>enumerate<\/code> ve\n<code>zip<\/code> neyi gezdiğini doğrudan söyler.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Uzunlukları farklı listeleri zip'lemek. <code>zip<\/code> <b>kısa olan<\/b> liste bitince\nsessizce durur; 12 ay adına karşılık 11 değer verirsen son ay hata vermeden kaybolur. Emin değilsen önce\n<code>len(aylar) == len(veri)<\/code> diye kontrol et.<\/div>\n", "ornek": "aylar = [\"Oca\", \"Şub\", \"Mar\", \"Nis\"]\nveri = [2.91, 3.02, 3.05]          # bir değer eksik!\n\nfor i, ay in enumerate(aylar, start=1):\n    print(i, ay)\n\nfor ay, deger in zip(aylar, veri):\n    print(f\"{ay}: {deger:.2f}\")     # Nis yok: zip kısa listede durur", "ornek_setup": []}, {"baslik": "while, break ve continue", "html": "\n<p><code>for<\/code> \"şu topluluğun her elemanı için\" der. <code>while<\/code> ise \"koşul doğru olduğu sürece\" tekrarlar; kaç tur\ndöneceğini önceden bilmediğin durumlar içindir.<\/p>\n<pre class=\"py\">yolcu = 1_000\nyil = 0\nwhile yolcu &lt; 2_000:          # koşul her turun başında kontrol edilir\n    yolcu = yolcu * 1.10      # her yıl %10 artış\n    yil += 1\nprint(yil)                    # 8 → kaç yılda ikiye katlanır?<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Koşulu değiştiren satırı unutmak. <code>yolcu = yolcu * 1.10<\/code> olmasaydı koşul\nhep doğru kalır, döngü <b>hiç bitmez<\/b> ve program donar. <code>while<\/code> yazarken ilk soru şu olmalı: \"Bu döngü nasıl\nbitecek?\"<\/div>\n<h3>break ve continue<\/h3>\n<pre class=\"py\">for kod in [\"M2\", \"\", \"T1\", \"DUR\", \"M4\"]:\n    if kod == \"\":\n        continue       # bu turu atla, sonrakine geç\n    if kod == \"DUR\":\n        break          # döngüden tamamen çık\n    print(kod)         # M2, T1<\/pre>\n<p><code>continue<\/code> o turun geri kalanını atlar; <code>break<\/code> döngüyü bitirir. <code>build_map.py<\/code> ikisini de\nkullanıyor: <code>hat_geometrileri<\/code> içinde OSM ilişkisi bulunamayan hat için uyarı yazılıp <code>continue<\/code> ile\nsıradakine geçiliyor; <code>osm_indir<\/code> ise sunuculardan biri cevap verince <code>return<\/code> ile hem döngüden hem\nfonksiyondan çıkıyor.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>continue<\/code> ile \"işime yaramayan durumu en başta ele, gerisini rahat yaz\"\nyaklaşımı kodu düz tutar: asıl iş, iç içe <code>if<\/code>'lerin derinine gömülmez. <code>build_map.py<\/code>'deki\n<code>if uye[\"type\"] != \"way\" ...: continue<\/code> satırı da stop ve platform üyelerini böyle en baştan eliyor.<\/div>\n", "ornek": "yolcu = 1_000\nyil = 0\nwhile yolcu < 2_000:\n    yolcu = yolcu * 1.10\n    yil += 1\nprint(yil, \"yılda\", round(yolcu))\n\nfor kod in [\"M2\", \"\", \"T1\", \"DUR\", \"M4\"]:\n    if kod == \"\":\n        continue\n    if kod == \"DUR\":\n        break\n    print(kod)", "ornek_setup": []}, {"baslik": "Comprehension: tek satırda liste, küme, sözlük", "html": "\n<pre class=\"py\">renkler = []\nfor kod in veri.index:\n    renkler.append(TUR_RENK[hat_turu(kod)])\n\n# aynısı, tek satırda:\nrenkler = [TUR_RENK[hat_turu(kod)] for kod in veri.index]<\/pre>\n<p>Okuma sırası: <code>[ne üretilecek  for eleman in topluluk]<\/code>. Projendeki bu satır her hat kodu için türünün rengini\nüretiyor; çubuklar bu listeyle boyanıyor.<\/p>\n<h3>Koşullu comprehension<\/h3>\n<p>Sona <code>if<\/code> eklersen eleman <b>süzülür<\/b>:<\/p>\n<pre class=\"py\">[k for k in range(-4, 5) if k != 0]    # [-4, -3, -2, -1, 1, 2, 3, 4]<\/pre>\n<p>Başa <code>… if … else …<\/code> koyarsan eleman atılmaz, <b>değeri seçilir<\/b>:<\/p>\n<pre class=\"py\">renkler = [VURGU_RENK if d &gt; 100 else ANA_RENK for d in oran]<\/pre>\n<p>İkisi de projende var: ilki anomali referansındaki komşu haftalar, ikincisi hafta sonu grafiğinde %100'ü geçen hatları\nvurgu rengine boyamak.<\/p>\n<h3>Küme ve sözlük üreteçleri<\/h3>\n<pre class=\"py\">{hat_turu(kod) for kod in kodlar}          # küme: tekrarsız türler\n{kod: hat_turu(kod) for kod in kodlar}     # sözlük: kod → tür<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>if<\/code>'in yerini karıştırmak. <code>[x for x in liste if x &gt; 0 else 0]<\/code>\nhata verir: sondaki <code>if<\/code> yalnızca süzer, <code>else<\/code> alamaz. Değer seçmek istiyorsan koşul başa gelir:\n<code>[x if x &gt; 0 else 0 for x in liste]<\/code>.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Comprehension listenin <b>ne olduğunu<\/b> tek bakışta söyler; <code>append<\/code>'li döngü\nise <b>nasıl yapıldığını<\/b> adım adım anlatır. Kısa dönüşümlerde comprehension, çok adımlı işlerde (projendeki\n<code>referans_hesapla<\/code> gibi) normal döngü daha okunur.<\/div>\n", "ornek": "kodlar = [\"M2\", \"T1\", \"M4\", \"TF1\", \"M2\"]\nprint([k for k in range(-4, 5) if k != 0])\nprint({kod: len(kod) for kod in kodlar})\nprint(sorted({kod[0] for kod in kodlar}))\n\noran = [62, 80, 112, 98]\nprint([\"vurgu\" if d > 100 else \"ana\" for d in oran])", "ornek_setup": []}, {"baslik": "sorted: key, reverse ve lambda", "html": "\n<pre class=\"py\">sorted([3, 1, 2])                 # [1, 2, 3]\nsorted([3, 1, 2], reverse=True)   # [3, 2, 1] → büyükten küçüğe\nsorted([\"T1\", \"M2\", \"F1\"])        # ['F1', 'M2', 'T1'] → alfabetik<\/pre>\n<h3>key: neye göre sıralansın?<\/h3>\n<p><code>key<\/code>'e bir <b>fonksiyon<\/b> verirsin. <code>sorted<\/code> her eleman için onu çağırır ve çıkan değere (sıralama\npuanına) göre dizer; elemanların kendisi değişmez.<\/p>\n<pre class=\"py\">sorted([\"Marmaray\", \"M2\", \"TF1\"], key=len)   # ['M2', 'TF1', 'Marmaray']<\/pre>\n<p>Projendeki lejant satırı bunun akıllıca bir kullanımı:<\/p>\n<pre class=\"py\">turler = sorted({hat_turu(kod) for kod in veri.index}, key=list(TUR_RENK).index)<\/pre>\n<p><code>list(TUR_RENK)<\/code> türleri sözlükteki sırayla verir; <code>.index<\/code> yöntemi bir türün o listede kaçıncı olduğunu\nsöyler: Metro → 0, Tramvay → 1… Küme sırasızdı; <code>sorted<\/code> onu TUR_RENK'teki sıraya sokuyor. Böylece her grafikte\nlejant aynı sırada.<\/p>\n<h3>lambda: tek satırlık isimsiz fonksiyon<\/h3>\n<pre class=\"py\">hat_yolcu = {\"M2\": 145, \"T1\": 107, \"M5\": 73}\nsorted(hat_yolcu.items(), key=lambda cift: cift[1], reverse=True)\n# [('M2', 145), ('T1', 107), ('M5', 73)]<\/pre>\n<p><code>lambda cift: cift[1]<\/code>, <code>def f(cift): return cift[1]<\/code> ile aynıdır; isim vermeye değmeyecek kadar kısa\nişler için. Burada \"her (hat, yolcu) çiftini 2. elemanına göre sırala\" diyor. pandas'taki\n<code>sort_values(ascending=False)<\/code> da aynı fikir.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>key=len()<\/code> ya da <code>key=list(TUR_RENK).index()<\/code> yazmak.\n<code>key<\/code> fonksiyonun <b>kendisini<\/b> ister, sonucunu değil. Parantez koyarsan fonksiyonu o anda argümansız çağırırsın\nve <code>TypeError<\/code> alırsın.<\/div>\n", "ornek": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\", \"Füniküler\": \"#5a9e6f\",\n            \"Teleferik\": \"#8c6bb1\", \"Banliyö (TCDD)\": \"#8c564b\"}\nturler = {\"Teleferik\", \"Metro\", \"Banliyö (TCDD)\", \"Tramvay\"}\nprint(sorted(turler))                              # alfabetik\nprint(sorted(turler, key=list(TUR_RENK).index))    # TUR_RENK sırası\n\nhat_yolcu = {\"M2\": 145, \"T1\": 107, \"M5\": 73, \"Marmaray\": 190}\nfor hat, y in sorted(hat_yolcu.items(), key=lambda c: c[1], reverse=True):\n    print(hat, y)", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "<code>list(range(2, 6))<\/code> neyi verir?", "opts": ["[2, 3, 4, 5, 6]", "[2, 3, 4, 5]", "[3, 4, 5]", "[2, 6]"], "a": 1, "why": "Başlangıç dahil, bitiş hariç: 2'den 5'e.", "tags": ["dongu"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>hafta = 4<\/code> iken <code>range(-hafta, hafta + 1)<\/code> kaç sayı üretir?", "opts": ["8", "9", "10", "4"], "a": 1, "why": "−4'ten +4'e kadar, 0 dahil: 9 sayı. Projende <code>if k != 0<\/code> ile gün kendisi atılınca 8 komşu hafta kalıyor.", "tags": ["dongu"], "code": null, "rev": false, "zorluk": 2, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["0 M1 1 M2", "1 M1 2 M2", "M1 0 M2 1", "0 1"], "a": 0, "why": "<code>enumerate<\/code> 0'dan sayar ve (sıra, değer) çiftleri verir.", "tags": ["dongu"], "code": "for i, h in enumerate([\"M1\", \"M2\"]):\n    print(i, h, end=\" \")", "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "fill", "q": "İki listeyi yan yana gezerek <code>Oca: 2.9<\/code> gibi satırlar yazdır.", "code": "aylar = [\"Oca\", \"Şub\"]\ndegerler = [2.9, 3.0]\nfor ay, d in ___(aylar, degerler):\n    print(f\"{___}: {d}\")", "a": [["zip"], ["ay"]], "why": "Yan yana gezmek için <code>zip<\/code>; ay adı <code>ay<\/code> değişkeninde.", "tags": ["dongu"], "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "Bu kod hangi sayıları yazdırır?", "opts": ["1 ve 3", "1, 3 ve 5", "1, 2 ve 3", "yalnızca 1"], "a": 0, "why": "2'de <code>continue<\/code> o turu atlar, 4'te <code>break<\/code> döngüyü bitirir; 5'e hiç gelinmez.", "tags": ["dongu"], "code": "for x in [1, 2, 3, 4, 5]:\n    if x == 2:\n        continue\n    if x == 4:\n        break\n    print(x)", "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["3", "4", "5", "10"], "a": 0, "why": "10 → 5 → 2 → 1: üç turda n 1'e iner ve <code>n &gt; 1<\/code> yanlış olur.", "tags": ["dongu"], "code": "n = 10\nadim = 0\nwhile n > 1:\n    n = n // 2\n    adim += 1\nprint(adim)", "rev": false, "zorluk": 2, "yer": "a2"}, {"t": "fill", "q": "Hafta sonu oranı 100'ü geçen hatların kodlarını topla.", "code": "oran = {\"M2\": 62, \"TF2\": 112, \"T1\": 80}\nvurgulu = [hat for hat, d in oran.___() ___ d > 100]", "a": [["items"], ["if"]], "why": "Anahtar ve değer birlikte: <code>.items()<\/code>; süzmek için sona <code>if<\/code>.", "tags": ["comprehension", "sozluk"], "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>{x % 3 for x in [1, 4, 7, 2]}<\/code> neyi verir?", "opts": ["[1, 1, 1, 2]", "{1, 2}", "{1, 1, 1, 2}", "[1, 2]"], "a": 1, "why": "Süslü parantez ve tek ifade → küme; tekrar eden 1'ler tek kalır.", "tags": ["comprehension"], "code": null, "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>sorted([\"Tramvay\", \"Metro\"], key=[\"Metro\", \"Tramvay\"].index)<\/code> neyi verir?", "opts": ["[\"Tramvay\", \"Metro\"]", "[\"Metro\", \"Tramvay\"]", "hata", "[\"Metro\"]"], "a": 1, "why": "Her elemanın puanı referans listedeki konumudur: Metro 0, Tramvay 1.", "tags": ["sorted"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "<code>sorted([\"M2\", \"TF1\", \"Marmaray\"], key=len, reverse=True)<\/code> neyi verir?", "opts": ["['Marmaray', 'TF1', 'M2']", "['M2', 'TF1', 'Marmaray']", "['TF1', 'Marmaray', 'M2']", "[8, 3, 2]"], "a": 0, "why": "Puan uzunluktur (2, 3, 8); <code>reverse=True<\/code> büyükten küçüğe dizer. Dönen liste yine elemanların kendisidir.", "tags": ["sorted"], "code": null, "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "<code>[x * 2 for x in range(3)]<\/code> neyi verir?", "opts": ["[2, 4, 6]", "[0, 2, 4]", "[0, 1, 2]", "6"], "a": 1, "why": "<code>range(3)<\/code> 0, 1, 2 üretir; her biri 2 ile çarpılır.", "tags": ["comprehension"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kodun yazdırdığı <b>ilk satır<\/b> nedir?", "opts": ["0 M1", "1 M1", "1 M2", "M1 1"], "a": 1, "why": "<code>start=1<\/code> sayacı 1'den başlatır; ilk eleman yine M1.", "tags": ["dongu"], "code": "for i, h in enumerate([\"M1\", \"M2\"], start=1):\n    print(i, h)", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Her hat kodunu türüne eşleyen bir sözlük üret.", "code": "kodlar = [\"M2\", \"TF1\", \"T1\"]\nturler = {___: hat_turu(kod) for kod ___ kodlar}", "a": [["kod"], ["in"]], "why": "Sözlük üreteci: <code>{anahtar: değer for eleman in topluluk}<\/code>.", "tags": ["comprehension", "sozluk"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>yolcular<\/code> listesindeki sayıları milyona çevirip bir basamağa yuvarlayan bir list comprehension yaz; sonucu <code>milyon<\/code>'a ata.", "starter": "yolcular = [23_301_956, 12_527_183, 950_000]\nmilyon = \n", "sol": "yolcular = [23_301_956, 12_527_183, 950_000]\nmilyon = [round(y / 1_000_000, 1) for y in yolcular]", "test": "assert milyon == [23.3, 12.5, 0.9], f\"Beklenen [23.3, 12.5, 0.9], senin sonucun {milyon}\"", "hint": "<code>[round(y / 1_000_000, 1) for y in yolcular]<\/code>", "tags": ["comprehension"], "setup": [], "rev": false, "why": "", "zorluk": 1, "hata": false, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["325", "73", "0", "145"], "a": 1, "why": "<code>toplam = 0<\/code> döngünün içinde: her tur sıfırlanıyor. Sonunda yalnızca son eleman (73) kalır.", "tags": ["dongu"], "code": "toplam = 0\nfor y in [145, 107, 73]:\n    toplam = 0\n    toplam += y\nprint(toplam)", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "order", "q": "Satırları sırala: <code>[\"vurgu\" if d &gt; 100 else \"ana\" for d in oran]<\/code> satırının döngülü hâli.", "lines": ["renkler = []", "for d in oran:", "    if d > 100:", "        renkler.append(\"vurgu\")", "    else:", "        renkler.append(\"ana\")"], "why": "Önce boş liste, sonra döngü, içinde if ve onun append'i, sonra else ve onun append'i.", "tags": ["dongu", "comprehension"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>hat_yolcu<\/code> sözlüğünü dolaşıp yolcusu 5 milyondan fazla olan hatların kodlarını <code>buyukler<\/code> listesine topla.", "starter": "hat_yolcu = {\"M2\": 145_000_000, \"TF1\": 221_000, \"T1\": 107_000_000, \"F2\": 2_700_000}\nbuyukler = []\n", "sol": "hat_yolcu = {\"M2\": 145_000_000, \"TF1\": 221_000, \"T1\": 107_000_000, \"F2\": 2_700_000}\nbuyukler = [h for h, y in hat_yolcu.items() if y > 5_000_000]", "test": "assert sorted(buyukler) == [\"M2\", \"T1\"], f\"Beklenen M2 ve T1, senin sonucun {buyukler}\"", "hint": "Anahtar ve değeri birlikte gezmek için <code>.items()<\/code>: <code>for h, y in hat_yolcu.items():<\/code>, sonra <code>if y &gt; 5_000_000<\/code>.", "tags": ["dongu", "sozluk", "comprehension"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> M2'nin yıllık yolcusu 145 milyon. Her yıl %4 artarsa kaç yılda 200 milyonu <b>geçer<\/b>? <code>while<\/code> ile hesapla, sonucu <code>yil<\/code>'da tut.", "starter": "yolcu = 145\nyil = 0\n", "sol": "yolcu = 145\nyil = 0\nwhile yolcu <= 200:\n    yolcu = yolcu * 1.04\n    yil += 1\nprint(yil, round(yolcu, 1))", "test": "assert yil == 9, f\"yil 9 olmalı, şu an {yil}\"\nassert \"while\" in __kod__, \"while döngüsü kullan\"", "hint": "<code>while yolcu &lt;= 200:<\/code> içinde hem <code>yolcu<\/code>'yu 1.04 ile çarp hem <code>yil<\/code>'ı 1 artır.", "tags": ["dongu"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Lejant türlerini <code>TUR_RENK<\/code>'teki sıraya dizmek istiyor ama <code>TypeError<\/code> alıyor. Düzelt ki <code>sirali<\/code> <code>[\"Metro\", \"Tramvay\", \"Teleferik\"]<\/code> olsun.", "starter": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\", \"Füniküler\": \"#5a9e6f\", \"Teleferik\": \"#8c6bb1\", \"Banliyö (TCDD)\": \"#8c564b\"}\nturler = {\"Teleferik\", \"Metro\", \"Tramvay\"}\nsirali = sorted(turler, key=list(TUR_RENK).index())\nprint(sirali)\n", "sol": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\", \"Füniküler\": \"#5a9e6f\", \"Teleferik\": \"#8c6bb1\", \"Banliyö (TCDD)\": \"#8c564b\"}\nturler = {\"Teleferik\", \"Metro\", \"Tramvay\"}\nsirali = sorted(turler, key=list(TUR_RENK).index)\nprint(sirali)\n", "test": "assert sirali == [\"Metro\", \"Tramvay\", \"Teleferik\"], f\"Beklenen Metro, Tramvay, Teleferik; senin sonucun {sirali}\"", "hint": "<code>key<\/code> fonksiyonun kendisini ister: <code>.index()<\/code> değil <code>.index<\/code>.", "tags": ["sorted"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> 100'ü geçen oranlar <code>\"vurgu\"<\/code>, diğerleri <code>\"ana\"<\/code> olsun istiyor ama <code>SyntaxError<\/code> alıyor. Düzelt.", "starter": "oran = [62, 80, 112, 98, 105]\nrenkler = [\"vurgu\" for d in oran if d > 100 else \"ana\"]\nprint(renkler)\n", "sol": "oran = [62, 80, 112, 98, 105]\nrenkler = [\"vurgu\" if d > 100 else \"ana\" for d in oran]\nprint(renkler)\n", "test": "assert renkler == [\"ana\", \"ana\", \"vurgu\", \"ana\", \"vurgu\"], f\"Beklenen ['ana', 'ana', 'vurgu', 'ana', 'vurgu'], senin sonucun {renkler}\"", "hint": "Değer seçen <code>if … else<\/code> başa gelir: <code>[\"vurgu\" if d &gt; 100 else \"ana\" for d in oran]<\/code>. Sondaki <code>if<\/code> yalnızca süzer.", "tags": ["comprehension"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["M2", "T1", "Marmaray", "hata"], "a": 1, "why": "<code>reverse<\/code> yok, küçükten büyüğe: T1 (107), M2 (145), Marmaray (190). İlk eleman T1.", "tags": ["sorted", "comprehension"], "code": "d = {\"M2\": 145, \"T1\": 107, \"Marmaray\": 190}\nsirali = [h for h, y in sorted(d.items(), key=lambda c: c[1])]\nprint(sirali[0])", "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Bir hattın 9 haftalık Salı yolcusu (bin) <code>haftalik<\/code> listesinde. Bir önceki haftaya göre <b>%20'den fazla<\/b> düşen <b>ilk<\/b> haftanın sırasını (0'dan sayarak) <code>ilk_dusus<\/code>'e ata ve bulunca <code>break<\/code> ile döngüden çık. Hiç yoksa <code>None<\/code> kalsın.", "starter": "haftalik = [410, 402, 415, 398, 205, 408, 412, 300, 405]\nilk_dusus = None\n", "sol": "haftalik = [410, 402, 415, 398, 205, 408, 412, 300, 405]\nilk_dusus = None\nfor i in range(1, len(haftalik)):\n    if haftalik[i] < haftalik[i - 1] * 0.8:\n        ilk_dusus = i\n        break\nprint(ilk_dusus)", "test": "assert ilk_dusus == 4, f\"ilk_dusus 4 olmalı (205, önceki hafta 398), şu an {ilk_dusus}\"\nassert \"break\" in __kod__, \"break kullan\"", "hint": "<code>for i in range(1, len(haftalik)):<\/code> ile her haftayı öncekiyle (<code>haftalik[i - 1]<\/code>) karşılaştır. %20'den fazla düşüş: <code>haftalik[i] &lt; haftalik[i - 1] * 0.8<\/code>. <code>break<\/code> olmazsa 7. haftadaki ikinci düşüş üzerine yazar.", "tags": ["dongu", "kosul"], "setup": [], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Lejant sırası.<\/b> Projende her grafiğin renkleri ve lejantı aynı kalıpla kuruluyor. <code>TUR_RENK<\/code>, <code>hat_turu<\/code> ve grafikte görünecek hatların <code>kodlar<\/code> listesi hazır.<br>1) <code>renkler<\/code>: her kod için türünün rengi (aynı sırayla, comprehension ile).<br>2) <code>turler<\/code>: kodlarda geçen <b>farklı<\/b> türler, <code>TUR_RENK<\/code>'teki sırayla.<br>3) <code>tur_renkleri<\/code>: <code>turler<\/code>'deki her türün rengi.<br>4) <code>sayilar<\/code>: tür → o türden kaç hat olduğu (sözlük).<br>5) Lejantı <code>Metro (#3b6ea5): 5 hat<\/code> biçiminde, <code>turler<\/code> sırasıyla yazdır.", "starter": "TUR_RENK = {\n    \"Metro\": \"#3b6ea5\",\n    \"Tramvay\": \"#e08a3c\",\n    \"Füniküler\": \"#5a9e6f\",\n    \"Teleferik\": \"#8c6bb1\",\n    \"Banliyö (TCDD)\": \"#8c564b\",\n}\n\ndef hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod == \"IETT TUNEL\":\n        return \"Füniküler\"\n    if kod == \"IETT NOSTALJIK TRAMVAY\":\n        return \"Tramvay\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"\n\nkodlar = [\"F1\", \"T5\", \"M9\", \"Marmaray\", \"M5\", \"IETT TUNEL\", \"T1\", \"M4\", \"T4\", \"M2\", \"TCDD SIRKECI-KAZLICESME\", \"M1\"]\n\n# 1)\nrenkler =\n\n# 2)\nturler =\n\n# 3)\ntur_renkleri =\n\n# 4)\nsayilar =\n\n# 5)\n", "sol": "TUR_RENK = {\n    \"Metro\": \"#3b6ea5\",\n    \"Tramvay\": \"#e08a3c\",\n    \"Füniküler\": \"#5a9e6f\",\n    \"Teleferik\": \"#8c6bb1\",\n    \"Banliyö (TCDD)\": \"#8c564b\",\n}\n\ndef hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod == \"IETT TUNEL\":\n        return \"Füniküler\"\n    if kod == \"IETT NOSTALJIK TRAMVAY\":\n        return \"Tramvay\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"\n\nkodlar = [\"F1\", \"T5\", \"M9\", \"Marmaray\", \"M5\", \"IETT TUNEL\", \"T1\", \"M4\", \"T4\", \"M2\", \"TCDD SIRKECI-KAZLICESME\", \"M1\"]\n\n# 1)\nrenkler = [TUR_RENK[hat_turu(kod)] for kod in kodlar]\n\n# 2)\nturler = sorted({hat_turu(kod) for kod in kodlar}, key=list(TUR_RENK).index)\n\n# 3)\ntur_renkleri = [TUR_RENK[tur] for tur in turler]\n\n# 4)\ntum = [hat_turu(kod) for kod in kodlar]\nsayilar = {tur: tum.count(tur) for tur in turler}\n\n# 5)\nfor tur, renk in zip(turler, tur_renkleri):\n    print(f\"{tur} ({renk}): {sayilar[tur]} hat\")\n", "test": "assert renkler == [TUR_RENK[hat_turu(k)] for k in kodlar], \"renkler: her kod için, aynı sırayla, türünün rengi olmalı\"\nassert turler == [\"Metro\", \"Tramvay\", \"Füniküler\", \"Banliyö (TCDD)\"], f\"turler yanlış: {turler}\"\nassert tur_renkleri == [\"#3b6ea5\", \"#e08a3c\", \"#5a9e6f\", \"#8c564b\"], f\"tur_renkleri yanlış: {tur_renkleri}\"\nassert dict(sayilar) == {\"Metro\": 5, \"Tramvay\": 3, \"Füniküler\": 2, \"Banliyö (TCDD)\": 2}, f\"sayilar yanlış: {sayilar}\"\nbeklenen = [\"Metro (#3b6ea5): 5 hat\", \"Tramvay (#e08a3c): 3 hat\", \"Füniküler (#5a9e6f): 2 hat\", \"Banliyö (TCDD) (#8c564b): 2 hat\"]\nfor satir in beklenen:\n    assert satir in __cikti__, f\"Çıktıda şu satır yok: {satir!r}\"\nkonumlar = [__cikti__.index(s) for s in beklenen]\nassert konumlar == sorted(konumlar), \"Lejant satırları TUR_RENK sırasıyla (Metro, Tramvay, Füniküler, Banliyö) yazılmalı\"", "hint": "1) <code>[TUR_RENK[hat_turu(kod)] for kod in kodlar]<\/code>. 2) Küme üreteci + <code>sorted(..., key=list(TUR_RENK).index)<\/code>. 3) <code>[TUR_RENK[tur] for tur in turler]<\/code>. 4) Önce <code>tum = [hat_turu(kod) for kod in kodlar]<\/code>, sonra <code>{tur: tum.count(tur) for tur in turler}<\/code>. 5) <code>for tur, renk in zip(turler, tur_renkleri):<\/code>.", "tags": ["comprehension", "sorted", "dongu"], "setup": [], "rev": false, "why": "Bu beş adım, projedeki <code>renkler = [...]<\/code>, <code>turler = sorted({...}, key=...)<\/code> ve <code>[Patch(color=TUR_RENK[tur], label=tur) for tur in turler]<\/code> satırlarının ta kendisi; yalnızca Patch yerine metin yazdırdın.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>for a, b in zip([1, 2, 3], [\"x\", \"y\"])<\/code> kaç tur döner?", "opts": ["3", "2", "5", "hata"], "a": 1, "why": "<code>zip<\/code> kısa olan liste bitince durur.", "tags": ["dongu"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>list(range(0, 10, 3))<\/code> neyi verir?", "opts": ["[0, 3, 6, 9]", "[3, 6, 9]", "[0, 3, 6]", "[0, 3, 6, 9, 12]"], "a": 0, "why": "0'dan başlar, üçer artar, 10'a ulaşmadan durur.", "tags": ["dongu"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Döngü içinde <code>continue<\/code> ne yapar?", "opts": ["Döngüyü tamamen bitirir", "O turun geri kalanını atlayıp sonraki tura geçer", "Döngüyü baştan başlatır", "Programı durdurur"], "a": 1, "why": "<code>continue<\/code> sonraki tura geçer; döngüyü bitiren <code>break<\/code>'tir.", "tags": ["dongu"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>sorted([3, 1, 2], reverse=True)<\/code> neyi verir?", "opts": ["[1, 2, 3]", "[3, 2, 1]", "[2, 1, 3]", "None"], "a": 1, "why": "<code>reverse=True<\/code> büyükten küçüğe sıralar.", "tags": ["sorted"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"sonra": 4, "id": "t1", "no": 1, "tur": "tekrar", "baslik": "Tekrar durağı 1", "aralik": [1, 2, 3, 4], "adet": 8, "ozet": "Python temellerini ne kadar hatırlıyorsun? İlk dört duraktan karışık sorular."}, {"id": "b5", "no": 5, "tur": "ders", "baslik": "Metin işleme ve regex", "hat": "M5", "ozet": "Metin yöntemleri, Türkçe İ/ı tuzağı ve istasyon adlarını düzenli ifadelerle (regex) temizlemek.", "dosya": "analiz.ipynb", "proje": "import re\n\ndef tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()\n\ndef tr_baslik(metin):\n    kelimeler = []\n    for k in metin.split():\n        ilk = {\"i\": \"İ\", \"ı\": \"I\"}.get(k[0], k[0].upper())\n        kelimeler.append(ilk + k[1:])\n    return \" \".join(kelimeler)\n\ndef istasyon_adi(ad):\n    ad = tr_kucuk(ad)\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)\n    ad = re.sub(r\"\\b(m\\d+|hol|konkors)\\b\", \" \", ad)\n    ad = re.sub(r\"\\b(kuzey|güney|guney|doğu|dogu|batı|bati)\\b\", \" \", ad)\n    ad = re.sub(r\"-\\s*\\d+$\", \" \", ad)\n    ad = re.sub(r\"(?<=\\D)\\s\\d+(\\s|$)\", \" \", ad)\n    ad = re.sub(r\"\\s+\", \" \", ad).strip()\n    ad = {\"ayrılıkçeşmesi\": \"ayrılıkçeşme\", \"özgürlük meydan\": \"özgürlük meydanı\"}.get(ad, ad)\n    return tr_baslik(ad).replace(\"İtü\", \"İTÜ\")\n\nyolcu[\"istasyon\"] = yolcu[\"station_name\"].map(istasyon_adi)", "adimlar": [{"baslik": "Metin yöntemleri: küçük araçlar", "html": "\n<p>Metin (<code>str<\/code>), veri temizlerken en çok uğraşacağın tip. Her metnin, noktadan sonra çağrılan hazır <b>yöntemleri<\/b> vardır.\nEn sık kullanacakların şunlar:<\/p>\n<pre class=\"py\">ad = \"  Kadıköy Doğu  \"\nad.strip()                          # \"Kadıköy Doğu\"  → baştaki/sondaki boşluğu atar\nad.strip().upper()                  # \"KADIKÖY DOĞU\"  → yöntemler art arda zincirlenebilir\n\"M4-KADIKOY-TAVSANTEPE\".split(\"-\")  # [\"M4\", \"KADIKOY\", \"TAVSANTEPE\"]\n\" \".join([\"Hacı\", \"Osman\"])         # \"Hacı Osman\"\n\"Şişli M2\".replace(\" M2\", \"\")       # \"Şişli\"\n\"TF1\".startswith(\"TF\")              # True\n\"doğu\" in \"kadıköy doğu\"            # True<\/pre>\n<p><code>split<\/code> metni parçalara bölüp bir liste verir. <code>join<\/code> tersini yapar: listedeki metinleri, aralarına ayırıcıyı koyarak\nbirleştirir. Ayırıcı <code>join<\/code>'in <b>önüne<\/b> yazılır; bu ilk başta herkese ters gelir. <code>in<\/code> ise \"bu parça metnin içinde geçiyor mu?\"\nsorusunu True/False ile yanıtlar.<\/p>\n<p>Projende bunların hepsi var. <code>hat_turu<\/code> fonksiyonun teleferikleri <code>kod.startswith(\"TF\")<\/code> ile ayırıyor.\n<code>tr_baslik<\/code> adı <code>split()<\/code> ile kelimelere bölüyor, her kelimeyi düzeltiyor ve <code>\" \".join(...)<\/code> ile geri birleştiriyor.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Metinler <b>değiştirilemez<\/b>. <code>ad.upper()<\/code> <code>ad<\/code>'ı değiştirmez; büyük harfli\n<b>yeni<\/b> bir metin döndürür. Sonucu saklamak istiyorsan bir isme bağlaman gerekir: <code>ad = ad.upper()<\/code>.\n<code>istasyon_adi<\/code> fonksiyonunda her satırın <code>ad = ...<\/code> diye başlamasının sebebi bu.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>split()<\/code> ile <code>split(\" \")<\/code> aynı şey değildir. Parametresiz <code>split()<\/code>\nart arda gelen boşlukları tek boşluk sayar, baştaki ve sondaki boşlukları yok sayar. <code>\"a  b\".split(\" \")<\/code> ise araya boş bir metin koyar:\n<code>[\"a\", \"\", \"b\"]<\/code>. Kelimelere bölmek istiyorsan parametresiz hâlini kullan.<\/div>\n", "ornek": "ad = \"  KADIKÖY Doğu  \"\nprint(repr(ad.strip()))            # repr: tırnaklarıyla gösterir, boşluklar görünür\nprint(ad.split())\nprint(\"-\".join([\"M4\", \"KADIKOY\", \"TAVSANTEPE\"]))\nprint(\"TF1\".startswith(\"TF\"))\nprint(\"doğu\" in ad)                # büyük/küçük harf farklı sayılır!\n\nad.upper()                         # sonucu bir isme bağlamadık...\nprint(repr(ad))                    # ...o yüzden ad hiç değişmedi", "ornek_setup": []}, {"baslik": "Türkçe İ ve ı: lower() neden yetmiyor?", "html": "\n<p>Python'un <code>lower()<\/code> ve <code>upper()<\/code> yöntemleri İngilizce kuralıyla çalışır. İngilizcede I'nın küçüğü i'dir.\nTürkçede ise iki ayrı çift var: <b>I–ı<\/b> ve <b>İ–i<\/b>. Sonuç:<\/p>\n<pre class=\"py\">\"ISTOÇ\".lower()      # \"istoç\"    → Türkçesi \"ıstoç\" olmalıydı\n\"İSTANBUL\".lower()   # \"i̇stanbul\" → i + görünmez bir nokta işareti (2 karakter!)\n\"istanbul\".upper()   # \"ISTANBUL\" → Türkçesi \"İSTANBUL\"<\/pre>\n<p>İkincisi en sinsi olanı. Ekranda neredeyse aynı görünür ama <code>\"İSTANBUL\".lower() == \"istanbul\"<\/code> sonucu <b>False<\/b>'tur.\nVeride aynı istasyon iki farklı ad gibi görünür ve toplamlar ikiye bölünür.<\/p>\n<p>Projendeki çözüm, işi Python'a bırakmadan önce iki sorunlu harfi elle çevirmek:<\/p>\n<pre class=\"py\">def tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()<\/pre>\n<p>Önce büyük I'lar ı'ya, büyük İ'ler i'ye döner. Geri kalan harfleri (Ş, Ç, Ö…) <code>lower()<\/code> zaten doğru çevirir.\nAdı yeniden büyük harfle başlatırken de ters yön gerekir: <code>tr_baslik<\/code> her kelimenin ilk harfine bakar. Harf <code>i<\/code> ise <code>İ<\/code>,\n<code>ı<\/code> ise <code>I<\/code> yapar; diğer harflerde <code>upper()<\/code>'a güvenir.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Sırayı karıştırmak: <code>metin.lower().replace(\"I\", \"ı\")<\/code> işe yaramaz. <code>lower()<\/code> çalıştığında\nbüyük I'lar zaten i olmuştur; <code>replace<\/code> değiştirecek I bulamaz. Önce <code>replace<\/code>, sonra <code>lower<\/code>.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Python'un hazır <code>title()<\/code> yöntemi de aynı İ/ı sorununu taşır. Üstelik kesme işaretinden sonrasını da büyütür:\n<code>\"kadıköy'de\".title()<\/code> → <code>\"Kadıköy'De\"<\/code>. Projede kendi <code>tr_baslik<\/code> fonksiyonunu yazman bu yüzden doğru bir karar.<\/div>\n", "ornek": "def tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()\n\ndef tr_baslik(metin):\n    kelimeler = []\n    for k in metin.split():\n        ilk = {\"i\": \"İ\", \"ı\": \"I\"}.get(k[0], k[0].upper())\n        kelimeler.append(ilk + k[1:])\n    return \" \".join(kelimeler)\n\nfor ad in [\"ISTOÇ\", \"İSTANBUL\", \"HACIOSMAN\"]:\n    print(ad.lower(), len(ad.lower()), \"|\", tr_kucuk(ad), len(tr_kucuk(ad)))\n\nprint(tr_baslik(\"ıhlamur işçi blokları\"))\nprint(\"İSTANBUL\".lower() == \"istanbul\", tr_kucuk(\"İSTANBUL\") == \"istanbul\")", "ornek_setup": []}, {"baslik": "Regex'in yapı taşları", "html": "\n<p><code>replace<\/code> yalnızca <b>sabit<\/b> bir metni değiştirir. \"Sondaki herhangi bir sayı\" ya da \"parantez içindeki her şey\" gibi\n<b>kalıpları<\/b> tarif etmek için <b>düzenli ifadeler<\/b> (regex) kullanılır. Python'da <code>re<\/code> modülündedir ve üç fonksiyon işin çoğunu görür:<\/p>\n<pre class=\"py\">import re\nre.findall(r\"\\d+\", \"T1 ve T4, 2025\")      # ['1', '4', '2025']  → uyan bütün parçalar\nre.search(r\"\\d+$\", \"Üsküdar 1\")           # ilk eşleşme; yoksa None\nre.sub(r\"\\s+\", \" \", \"Hacı    Osman\")      # 'Hacı Osman'        → uyanları değiştir<\/pre>\n<h3>Yapı taşları<\/h3>\n<ul>\n<li><code>\\d<\/code> rakam, <code>\\s<\/code> boşluk (sekme ve yeni satır dahil), <code>\\w<\/code> harf, rakam ya da alt çizgi (Türkçe harfler dahil),\n<code>.<\/code> herhangi bir karakter. Büyük harfli hâlleri tersini eşler: <code>\\D<\/code> rakam olmayan her şey.<\/li>\n<li><code>+<\/code> bir veya daha fazla, <code>*<\/code> sıfır veya daha fazla, <code>?<\/code> olsa da olur olmasa da.<\/li>\n<li><code>[abc]<\/code> köşeli parantezdekilerden biri, <code>[0-9]<\/code> bir aralık, <code>[^0-9]<\/code> bunların dışındaki herhangi biri.<\/li>\n<li><code>^<\/code> metnin başı, <code>$<\/code> metnin sonu, <code>|<\/code> \"veya\".<\/li>\n<li>Özel bir karakterin kendisini arıyorsan önüne ters bölü koyarsın: <code>\\(<\/code>, <code>\\.<\/code><\/li>\n<\/ul>\n<p>Parçaları birleştirince cümle kurarsın: <code>^[A-Z]+\\d+<\/code> \"başta bir veya daha çok büyük harf, hemen ardından rakamlar\" demek.\n<code>M4-KADIKOY-TAVSANTEPE<\/code> içinden <code>M4<\/code>'ü bulur. 8. durakta <code>line_code<\/code> sütununu tam bu desenle çıkaracaksın.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Desenin önündeki <code>r<\/code> (<i>raw string<\/i>, ham metin) Python'a \"ters bölülere dokunma\" der.\nNormal bir metinde Python <code>\\n<\/code>'yi yeni satıra, <code>\\b<\/code>'yi görünmez bir \"geri sil\" karakterine çevirir; desen regex'e ulaşmadan bozulur.\n<code>r\"...\"<\/code> yazınca ters bölü regex'e aynen gider. Kural basit: regex yazarken her zaman <code>r<\/code> koy.<\/div>\n", "ornek": "import re\n\nmetin = \"M2 hattı 2025'te 145 milyon yolcu taşıdı\"\nprint(re.findall(r\"\\d+\", metin))       # rakam grupları\nprint(re.findall(r\"\\d\", metin))        # + olmadan: rakamlar tek tek\nprint(re.findall(r\"^[A-Z]+\\d+\", \"M4-KADIKOY-TAVSANTEPE\"))\nprint(re.sub(r\"\\s+\", \" \", \"Hacı    Osman   Bayırı\"))\nprint(re.search(r\"\\d+$\", \"Üsküdar 1\"))\nprint(re.search(r\"\\d+$\", \"Taksim\"))     # eşleşme yok → None", "ornek_setup": []}, {"baslik": "Gruplar, kelime sınırı ve tembel eşleşme", "html": "\n<h3>( ) ile gruplama<\/h3>\n<p><code>|<\/code> \"veya\" demek; neyin \"veya\"sı olduğunu parantezle sınırlarsın. <code>(kuzey|güney|doğu)<\/code> \"bu üç kelimeden biri\" demek.\nParantez ayrıca eşleşen parçayı <b>yakalar<\/b>: <code>re.search(r\"^([A-Z]+)(\\d+)\", \"M11-GAYRETTEPE\")<\/code> için\n<code>.group(1)<\/code> → <code>'M'<\/code>, <code>.group(2)<\/code> → <code>'11'<\/code>, <code>.group(0)<\/code> ise eşleşmenin tamamı.<\/p>\n<h3>\\b: kelime sınırı<\/h3>\n<p><code>\\b<\/code> bir karakter değil, bir <b>konumdur<\/b>: harf ile harf olmayan şeyin arasındaki çizgi. <code>r\"\\bhol\\b\"<\/code> tek başına duran\n\"hol\" kelimesini bulur ama \"hollanda\"nın içindeki hol'e dokunmaz. Projendeki <code>\\b(m\\d+|hol|konkors)\\b<\/code> bu sayede yalnızca \"m2\", \"m11\" gibi bağımsız kelimeleri siler.<\/p>\n<h3>.*? : tembel eşleşme<\/h3>\n<p><code>.*<\/code> <b>açgözlüdür<\/b>, olabildiğince uzun eşleşir. Arkasına <code>?<\/code> koyunca <b>tembel<\/b> olur, olabildiğince kısa eşleşir:<\/p>\n<pre class=\"py\">ad = \"şişli (m2) mecidiyeköy (kuzey)\"\nre.sub(r\"\\(.*\\)\", \"\", ad)     # 'şişli '                → ilk ( ile son ) arası tamamen gitti\nre.sub(r\"\\(.*?\\)\", \"\", ad)    # 'şişli  mecidiyeköy '   → her parantez ayrı silindi<\/pre>\n<h3>(?&lt;=\\D): geriye bakış<\/h3>\n<p><code>(?&lt;=\\D)<\/code> \"hemen solumda rakam olmayan bir karakter olsun\" der ama o karakteri eşleşmeye <b>katmaz<\/b>.\n<code>(?&lt;=\\D)\\s\\d+(\\s|$)<\/code> böylece \"üsküdar 1\"deki \" 1\"i siler, \"r\" harfine dokunmaz.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Geriye bakış yerine düz <code>\\D<\/code> yazmak: <code>re.sub(r\"\\D\\s\\d+$\", \"\", \"üsküdar 1\")<\/code>\nsonucu <code>'üsküda'<\/code> olur. <code>\\D<\/code> \"r\" harfini de eşleşmeye kattığı için onu da siler.<\/div>\n", "ornek": "import re\n\nad = \"şişli (m2) mecidiyeköy (kuzey)\"\nprint(repr(re.sub(r\"\\(.*\\)\", \"\", ad)))     # açgözlü\nprint(repr(re.sub(r\"\\(.*?\\)\", \"\", ad)))    # tembel\n\nprint(re.sub(r\"\\b(m\\d+|hol)\\b\", \"_\", \"yenikapı m2 hol m11 hollanda\"))\n\neslesme = re.search(r\"^([A-Z]+)(\\d+)\", \"M11-GAYRETTEPE\")\nprint(eslesme.group(0), eslesme.group(1), eslesme.group(2))\n\nprint(repr(re.sub(r\"(?<=\\D)\\s\\d+(\\s|$)\", \" \", \"üsküdar 1\")))\nprint(repr(re.sub(r\"\\D\\s\\d+$\", \"\", \"üsküdar 1\")))", "ornek_setup": []}, {"baslik": "istasyon_adi adım adım", "html": "\n<p>Artık projendeki fonksiyonu satır satır okuyabilirsin. Amacı, aynı istasyonun farklı giriş adlarını (\"Kadıköy (Doğu)\", \"Kadıköy (Batı)\")\ntek bir ada indirmek; böylece <code>groupby<\/code> onları birlikte toplar.<\/p>\n<pre class=\"py\">def istasyon_adi(ad):\n    ad = tr_kucuk(ad)                                   # 1. Türkçe küçük harf\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)                    # 2. parantez içi\n    ad = re.sub(r\"\\b(m\\d+|hol|konkors)\\b\", \" \", ad)     # 3. hat kodu, hol, konkors\n    ad = re.sub(r\"\\b(kuzey|güney|guney|doğu|dogu|batı|bati)\\b\", \" \", ad)   # 4. yön\n    ad = re.sub(r\"-\\s*\\d+$\", \" \", ad)                   # 5. sondaki \"- 2\"\n    ad = re.sub(r\"(?&lt;=\\D)\\s\\d+(\\s|$)\", \" \", ad)         # 6. sondaki \" 2\"\n    ad = re.sub(r\"\\s+\", \" \", ad).strip()                # 7. boşlukları topla\n    ad = {\"ayrılıkçeşmesi\": \"ayrılıkçeşme\"}.get(ad, ad)  # 8. kural dışı adlar\n    return tr_baslik(ad).replace(\"İtü\", \"İTÜ\")          # 9. başlık hâli<\/pre>\n<p>Silinen parçalar boş metinle değil <b>boşlukla<\/b> değiştiriliyor; \"kadıköy(doğu)m4\" gibi bitişik yazımlarda iki kelime birbirine yapışmasın diye.\nYön kelimelerinin hem \"doğu\" hem \"dogu\" hâli var, çünkü veride ikisi de geçiyor. 8. adımdaki <code>.get(ad, ad)<\/code> \"sözlükte varsa karşılığını, yoksa adın kendisini ver\" demek. Kurala uymayan birkaç adı elle düzeltmenin kısa yolu.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Sıra önemli. Desenler küçük harfle yazıldığı için <code>tr_kucuk<\/code> en başta. \"levent - 2\" için 5. adım 6'dan önce gelmeli:\ntersi olsaydı 6. adım yalnızca \" 2\"yi silip \"levent -\" bırakırdı, 5. adım da artık rakam bulamazdı. Boşluk toplama ise hep sonda, çünkü önceki adımların\nbıraktığı boşlukları süpürüyor.<\/div>\n<p>Aşağıdaki örnek, her <code>re.sub<\/code>'dan sonra adın nasıl değiştiğini gösteriyor. Girişi değiştirip \"LEVENT - 2\" ya da \"Şişli (M2) Mecidiyeköy\" dene.<\/p>\n", "ornek": "import re\n\ndef tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()\n\nadimlar = [\n    r\"\\(.*?\\)\",                                      # parantez içi\n    r\"\\b(m\\d+|hol|konkors)\\b\",                       # hat kodu, hol, konkors\n    r\"\\b(kuzey|güney|guney|doğu|dogu|batı|bati)\\b\",  # yön kelimeleri\n    r\"-\\s*\\d+$\",                                     # sondaki \"- 2\"\n    r\"(?<=\\D)\\s\\d+(\\s|$)\",                           # sondaki \" 2\"\n    r\"\\s+\",                                          # fazla boşluklar\n]\n\nad = tr_kucuk(\"KADIKÖY (İSKELE) M4 HOL KUZEY 2\")\nprint(f\"{'başlangıç':48} {ad!r}\")\nfor desen in adimlar:\n    ad = re.sub(desen, \" \", ad)\n    print(f\"{desen:48} {ad!r}\")\nprint(\"sonuç:\", repr(ad.strip()))", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "<code>\"M4-KADIKOY-TAVSANTEPE\".split(\"-\")[0]<\/code> neyi verir?", "opts": ["\"M4\"", "[\"M4\"]", "\"M4-\"", "\"KADIKOY\""], "a": 0, "why": "<code>split(\"-\")<\/code> bir liste verir: <code>[\"M4\", \"KADIKOY\", \"TAVSANTEPE\"]<\/code>. <code>[0]<\/code> ilk elemanı, yani <code>\"M4\"<\/code> metnini alır.", "tags": ["metin", "liste"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["Taksim", "TAKSIM", "taksim", "None"], "a": 0, "why": "Metinler değiştirilemez. <code>ad.upper()<\/code> yeni bir metin üretti ama onu hiçbir isme bağlamadık; <code>ad<\/code> hâlâ \"Taksim\".", "tags": ["metin"], "code": "ad = \"Taksim\"\nad.upper()\nprint(ad)", "rev": false, "zorluk": 2, "yer": "a0"}, {"t": "mc", "q": "<code>\"ISTOÇ\".lower()<\/code> (Python'un kendi yöntemi) ne verir?", "opts": ["\"ıstoç\"", "\"istoç\"", "\"ISTOÇ\"", "hata"], "a": 1, "why": "<code>lower()<\/code> I'yı i yapar; Türkçe doğrusu \"ıstoç\" olurdu. <code>tr_kucuk<\/code> bunun için var.", "tags": ["turkce", "metin"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>tr_kucuk<\/code> neden önce <code>.replace(\"I\", \"ı\")<\/code> yapıyor?", "opts": ["Daha hızlı çalışsın diye", "Türkçede büyük I'nın küçüğü ı olduğu ve lower() bunu bilmediği için", "Regex çalışsın diye", "Gerek yok, süs"], "a": 1, "why": "Python'un <code>lower()<\/code>'ı dil bilmez; Türkçe kuralı elle, <b>lower()'dan önce<\/b> uygulanır.", "tags": ["turkce"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["['1', '4', '2025']", "['T1', 'T4', '2025']", "['1', '4', '2', '0', '2', '5']", "['2025']"], "a": 0, "why": "<code>\\d+<\/code> art arda gelen rakamları tek parça alır; harfler desene girmez. T1'den 1, T4'ten 4, sonra 2025.", "tags": ["regex"], "code": "import re\nprint(re.findall(r\"\\d+\", \"T1 ve T4, 2025\"))", "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "fill", "q": "Deseni ham metin (raw string) olarak yaz ki ters bölüler bozulmasın.", "code": "ad = re.sub(___\"\\s+\", \" \", ad)", "a": [["r"]], "why": "Tırnaktan önce <code>r<\/code>: <code>r\"\\s+\"<\/code>.", "tags": ["regex"], "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["['m2', 'm11']", "['m2', 'm11', 'm3', 'm4']", "['m2', 'm11', 'm4']", "['m2']"], "a": 0, "why": "<code>\\b<\/code> iki yanda da kelime sınırı ister. \"hm3\"te m'den önce harf var; \"m4a\"da rakamdan sonra harf var. İkisi de elenir.", "tags": ["regex"], "code": "import re\nprint(re.findall(r\"\\bm\\d+\\b\", \"m2 m11 hm3 m4a\"))", "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>re.sub(r\"\\(.*?\\)\", \"\", metin)<\/code> içindeki <code>?<\/code> ne işe yarar?", "opts": ["Parantezi isteğe bağlı yapar", "Eşleşmeyi olabildiğince kısa tutar; her parantez ayrı silinir", "Soru işaretlerini siler", "Büyük/küçük harf farkını kaldırır"], "a": 1, "why": "<code>*<\/code>'dan sonra gelen <code>?<\/code> onu tembel yapar: ilk kapanan parantezde durur.", "tags": ["regex"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "5. ve 6. adımların yeri değişseydi <code>\"levent - 2\"<\/code> sonunda neye dönüşürdü?", "opts": ["\"Levent\"", "\"Levent -\"", "\"Levent - 2\"", "\"Levent 2\""], "a": 1, "why": "6. adım önce \" 2\"yi siler, geriye \"levent - \" kalır. 5. adımın deseni sonda rakam aradığı için artık eşleşmez; tire kalır.", "tags": ["regex"], "code": null, "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "fill", "q": "Sözlükte varsa karşılığını, yoksa adın kendisini döndür.", "code": "duzeltme = {\"ayrılıkçeşmesi\": \"ayrılıkçeşme\"}\nad = duzeltme.___(ad, ___)", "a": [["get"], ["ad"]], "why": "<code>sozluk.get(anahtar, varsayilan)<\/code>: anahtar yoksa hata vermez, ikinci değeri döndürür.", "tags": ["sozluk", "metin"], "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "<code>\"-\".join([\"a\", \"b\", \"c\"])<\/code> neyi verir?", "opts": ["\"abc\"", "\"a-b-c\"", "[\"a\",\"b\",\"c\"]", "\"-abc\""], "a": 1, "why": "<code>join<\/code> listeyi, araya öndeki ayırıcıyı koyarak birleştirir.", "tags": ["metin"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Hangisi <code>True<\/code> verir?", "opts": ["\"TF1\".startswith(\"tf\")", "\"TF1\".startswith(\"TF\")", "\"tf\" in \"TF1\"", "\"TF1\".endswith(\"TF\")"], "a": 1, "why": "Metin karşılaştırmalarında büyük/küçük harf farklı sayılır. \"TF1\" \"TF\" ile başlar, \"1\" ile biter.", "tags": ["metin"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Sondaki rakamları sil: <code>\"Üsküdar 1\"<\/code> → <code>\"Üsküdar\"<\/code>", "code": "import re\nre.sub(r\"\\s\\d___$\", \"\", \"Üsküdar 1\")", "a": [["+"]], "why": "<code>\\d+<\/code> bir veya daha fazla rakam; <code>$<\/code> metnin sonu.", "tags": ["regex"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["ae", "ace", "a(b)c(d)e", "abcde"], "a": 0, "why": "<code>.*<\/code> açgözlüdür: ilk <code>(<\/code>'den son <code>)<\/code>'e kadar her şeyi alır, \"c\" de gider. <code>.*?<\/code> yazsaydın sonuç \"ace\" olurdu.", "tags": ["regex"], "code": "import re\nprint(re.sub(r\"\\(.*\\)\", \"\", \"a(b)c(d)e\"))", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>temizle(ad)<\/code> fonksiyonu yaz: parantez içini sil (<code>re.sub(r\"\\(.*?\\)\", \" \", ad)<\/code>), fazla boşlukları teke indir ve baştan/sondan boşluğu at.", "starter": "import re\n\ndef temizle(ad):\n    # buraya yaz\n    return ad\n\nprint(temizle(\"Kadıköy (Doğu)\"))\n", "sol": "import re\n\ndef temizle(ad):\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)\n    ad = re.sub(r\"\\s+\", \" \", ad).strip()\n    return ad", "test": "assert temizle(\"Kadıköy (Doğu)\") == \"Kadıköy\", f\"temizle('Kadıköy (Doğu)') → {temizle('Kadıköy (Doğu)')!r}, beklenen 'Kadıköy'\"\nassert temizle(\"Şişli (M2)  Mecidiyeköy\") == \"Şişli Mecidiyeköy\", f\"temizle('Şişli (M2)  Mecidiyeköy') → {temizle('Şişli (M2)  Mecidiyeköy')!r}\"\nassert temizle(\"Taksim\") == \"Taksim\", \"Parantezsiz ad olduğu gibi kalmalı\"", "hint": "İki <code>re.sub<\/code> art arda, sonra <code>.strip()<\/code>. Parantezi silerken yerine boşluk koy; fazlalığı ikinci adım toplar.", "tags": ["regex"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>tr_kucuk(\"ISTOÇ\")<\/code> <code>\"ıstoç\"<\/code> vermeli ama <code>\"istoç\"<\/code> veriyor. Düzelt.", "starter": "def tr_kucuk(metin):\n    return metin.lower().replace(\"I\", \"ı\").replace(\"İ\", \"i\")\n\nprint(tr_kucuk(\"ISTOÇ\"), tr_kucuk(\"İSTANBUL\"))\n", "sol": "def tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()\n\nprint(tr_kucuk(\"ISTOÇ\"), tr_kucuk(\"İSTANBUL\"))\n", "test": "assert tr_kucuk(\"ISTOÇ\") == \"ıstoç\", f\"tr_kucuk('ISTOÇ') → {tr_kucuk('ISTOÇ')!r}\"\nassert tr_kucuk(\"İSTANBUL\") == \"istanbul\", f\"tr_kucuk('İSTANBUL') → {tr_kucuk('İSTANBUL')!r}\"\nassert tr_kucuk(\"Şişli\") == \"şişli\", \"Diğer harfler de küçülmeli\"", "hint": "<code>lower()<\/code> çalıştığında I'lar çoktan i olmuş olur. <code>replace<\/code>'leri <b>önce<\/b> yap.", "tags": ["turkce", "metin"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>yon_sil(\"kadıköy doğu\")<\/code> <code>\"kadıköy\"<\/code> vermeli ama yön kelimesi silinmiyor. Kod hata da vermiyor. Sorun ne?", "starter": "import re\n\ndef yon_sil(ad):\n    ad = re.sub(\"\\b(kuzey|güney|doğu|batı)\\b\", \" \", ad)\n    return \" \".join(ad.split())\n\nprint(yon_sil(\"kadıköy doğu\"))\n", "sol": "import re\n\ndef yon_sil(ad):\n    ad = re.sub(r\"\\b(kuzey|güney|doğu|batı)\\b\", \" \", ad)\n    return \" \".join(ad.split())\n\nprint(yon_sil(\"kadıköy doğu\"))\n", "test": "assert yon_sil(\"kadıköy doğu\") == \"kadıköy\", f\"yon_sil('kadıköy doğu') → {yon_sil('kadıköy doğu')!r}\"\nassert yon_sil(\"şişhane kuzey\") == \"şişhane\", \"kuzey de silinmeli\"\nassert yon_sil(\"doğukent\") == \"doğukent\", \"Kelimenin içindeki doğu silinmemeli\"", "hint": "Desenin önünde <code>r<\/code> yok. Python <code>\"\\b\"<\/code>'yi \"geri sil\" karakterine çeviriyor; regex kelime sınırını hiç görmüyor.", "tags": ["regex"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "order", "q": "<code>tr_baslik<\/code> fonksiyonunun satırlarını doğru sıraya koy.", "lines": ["def tr_baslik(metin):", "    kelimeler = []", "    for k in metin.split():", "        ilk = {\"i\": \"İ\", \"ı\": \"I\"}.get(k[0], k[0].upper())", "        kelimeler.append(ilk + k[1:])", "    return \" \".join(kelimeler)"], "why": "Önce boş liste, sonra her kelime için ilk harfi düzeltip listeye ekleme, en sonda birleştirme. <code>return<\/code> döngünün dışında olmalı, yoksa ilk kelimeden sonra fonksiyon biter.", "tags": ["turkce", "dongu", "fonksiyon"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>hat_kodu(line)<\/code> fonksiyonu yaz. Adın başında \"harfler + rakamlar\" varsa onu döndürsün (<code>\"M4-KADIKOY-TAVSANTEPE\"<\/code> → <code>\"M4\"<\/code>), yoksa adı olduğu gibi döndürsün (<code>\"TCDD TASIMACILIK A.S.\"<\/code> → aynısı). <code>re.search<\/code> ve bir grup kullan.", "starter": "import re\n\ndef hat_kodu(line):\n    # re.search(r\"^([A-Z]+\\d+)\", line) eşleşme ya da None döndürür\n    return line\n\nprint(hat_kodu(\"M4-KADIKOY-TAVSANTEPE\"))\n", "sol": "import re\n\ndef hat_kodu(line):\n    eslesme = re.search(r\"^([A-Z]+\\d+)\", line)\n    if eslesme:\n        return eslesme.group(1)\n    return line\n", "test": "for _g, _b in [(\"M4-KADIKOY-TAVSANTEPE\", \"M4\"), (\"M11-GAYRETTEPE-ISTANBUL HAVALIMANI\", \"M11\"), (\"T3-KADIKOY-MODA\", \"T3\"),\n               (\"TCDD TASIMACILIK A.S.\", \"TCDD TASIMACILIK A.S.\"), (\"IETT NOSTALJIK TRAMVAY\", \"IETT NOSTALJIK TRAMVAY\")]:\n    assert hat_kodu(_g) == _b, f\"hat_kodu({_g!r}) → {hat_kodu(_g)!r}, beklenen {_b!r}\"", "hint": "<code>eslesme = re.search(r\"^([A-Z]+\\d+)\", line)<\/code>; <code>if eslesme:<\/code> ise <code>eslesme.group(1)<\/code>, değilse <code>line<\/code>. Eşleşme yoksa <code>re.search<\/code> <code>None<\/code> döndürür ve <code>None.group(1)<\/code> hata verir.", "tags": ["regex", "kosul", "fonksiyon"], "setup": [], "rev": false, "why": "8. durakta aynı deseni pandas'ta <code>str.extract(r\"^([A-Z]+\\d+)\")<\/code> ile bütün sütuna tek seferde uygulayacaksın.", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "mc", "q": "<code>r\"-\\s*\\d+$\"<\/code> deseni hangi metinde bir eşleşme bulur?", "opts": ["\"levent - 2 hol\"", "\"levent 2\"", "\"levent - 2\"", "\"levent-2a\""], "a": 2, "why": "Desen tire, isteğe bağlı boşluk, rakamlar ve hemen ardından <b>metnin sonu<\/b> ister. \"levent - 2 hol\"de rakamdan sonra metin devam ediyor, \"levent 2\"de tire yok, \"levent-2a\"da rakamdan sonra harf var.", "tags": ["regex"], "code": null, "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>İstasyon adı temizleyici.<\/b> Projendeki üç fonksiyonu sıfırdan yaz:<ol><li><code>tr_kucuk(metin)<\/code>: Türkçe küçük harf (<code>\"ISTOÇ\"<\/code> → <code>\"ıstoç\"<\/code>).<\/li><li><code>tr_baslik(metin)<\/code>: her kelimenin ilk harfi büyük; <code>i<\/code> → <code>İ<\/code>, <code>ı<\/code> → <code>I<\/code>.<\/li><li><code>istasyon_adi(ad)<\/code>: <code>tr_kucuk<\/code> → parantez içini sil → bağımsız <code>m2/m11<\/code>, <code>hol<\/code>, <code>konkors<\/code> kelimelerini sil → yön kelimelerini (kuzey, güney, doğu, batı) sil → sondaki <code>\"- 2\"<\/code> ve <code>\" 2\"<\/code> numaralarını sil → boşlukları topla → <code>\"ayrılıkçeşmesi\"<\/code> gibi kural dışı adları sözlükle düzelt → <code>tr_baslik<\/code> ve <code>\"İtü\"<\/code> → <code>\"İTÜ\"<\/code>.<\/li><\/ol>Beklenen sonuçlar:<pre class=\"py\">KADIKÖY (DOĞU)        → Kadıköy\nÜsküdar 1             → Üsküdar\nŞİŞHANE KUZEY         → Şişhane\nİTÜ AYAZAĞA           → İTÜ Ayazağa\nYenikapı M2 Hol       → Yenikapı\nLevent - 2            → Levent\nMecidiyeköy 2 Hol     → Mecidiyeköy\nAYRILIKÇEŞMESİ        → Ayrılıkçeşme<\/pre>Test bu adların yanında birkaç benzer adı da dener.", "starter": "import re\n\ndef tr_kucuk(metin):\n    # I → ı, İ → i, sonra lower()\n    return metin\n\ndef tr_baslik(metin):\n    # her kelimenin ilk harfi büyük (i → İ, ı → I)\n    return metin\n\ndef istasyon_adi(ad):\n    # 1) tr_kucuk  2) parantez içi  3) m2/hol/konkors  4) yön kelimeleri\n    # 5) sondaki \"- 2\"  6) sondaki \" 2\"  7) boşluklar  8) kural dışı adlar  9) tr_baslik + İTÜ\n    return ad\n\nfor giris in [\"KADIKÖY (DOĞU)\", \"Üsküdar 1\", \"ŞİŞHANE KUZEY\", \"İTÜ AYAZAĞA\",\n              \"Yenikapı M2 Hol\", \"Levent - 2\", \"AYRILIKÇEŞMESİ\"]:\n    print(f\"{giris:20} → {istasyon_adi(giris)}\")\n", "sol": "import re\n\ndef tr_kucuk(metin):\n    return metin.replace(\"I\", \"ı\").replace(\"İ\", \"i\").lower()\n\ndef tr_baslik(metin):\n    kelimeler = []\n    for k in metin.split():\n        ilk = {\"i\": \"İ\", \"ı\": \"I\"}.get(k[0], k[0].upper())\n        kelimeler.append(ilk + k[1:])\n    return \" \".join(kelimeler)\n\ndef istasyon_adi(ad):\n    ad = tr_kucuk(ad)\n    ad = re.sub(r\"\\(.*?\\)\", \" \", ad)\n    ad = re.sub(r\"\\b(m\\d+|hol|konkors)\\b\", \" \", ad)\n    ad = re.sub(r\"\\b(kuzey|güney|guney|doğu|dogu|batı|bati)\\b\", \" \", ad)\n    ad = re.sub(r\"-\\s*\\d+$\", \" \", ad)\n    ad = re.sub(r\"(?<=\\D)\\s\\d+(\\s|$)\", \" \", ad)\n    ad = re.sub(r\"\\s+\", \" \", ad).strip()\n    ad = {\"ayrılıkçeşmesi\": \"ayrılıkçeşme\", \"özgürlük meydan\": \"özgürlük meydanı\"}.get(ad, ad)\n    return tr_baslik(ad).replace(\"İtü\", \"İTÜ\")\n\nfor giris in [\"KADIKÖY (DOĞU)\", \"Üsküdar 1\", \"ŞİŞHANE KUZEY\", \"İTÜ AYAZAĞA\",\n              \"Yenikapı M2 Hol\", \"Levent - 2\", \"AYRILIKÇEŞMESİ\"]:\n    print(f\"{giris:20} → {istasyon_adi(giris)}\")\n", "test": "assert tr_kucuk(\"ISTOÇ\") == \"ıstoç\", f\"tr_kucuk('ISTOÇ') → {tr_kucuk('ISTOÇ')!r}, beklenen 'ıstoç'\"\nassert tr_kucuk(\"İSTANBUL\") == \"istanbul\", f\"tr_kucuk('İSTANBUL') → {tr_kucuk('İSTANBUL')!r}, beklenen 'istanbul'\"\nassert tr_baslik(\"ıhlamur işçi blokları\") == \"Ihlamur İşçi Blokları\", f\"tr_baslik('ıhlamur işçi blokları') → {tr_baslik('ıhlamur işçi blokları')!r}\"\nfor _g, _b in [(\"KADIKÖY (DOĞU)\", \"Kadıköy\"), (\"Kadıköy (Batı)\", \"Kadıköy\"), (\"Üsküdar 1\", \"Üsküdar\"),\n               (\"ŞİŞHANE KUZEY\", \"Şişhane\"), (\"İTÜ AYAZAĞA\", \"İTÜ Ayazağa\"), (\"Yenikapı M2 Hol\", \"Yenikapı\"),\n               (\"Levent - 2\", \"Levent\"), (\"Gayrettepe M11 Konkors\", \"Gayrettepe\"), (\"HACIOSMAN\", \"Hacıosman\"),\n               (\"Vezneciler (İstanbul Ünv.)\", \"Vezneciler\"), (\"Bostancı Batı 2\", \"Bostancı\"), (\"SİRKECİ GÜNEY\", \"Sirkeci\"),\n               (\"AYRILIKÇEŞMESİ\", \"Ayrılıkçeşme\"), (\"Mecidiyeköy 2 Hol\", \"Mecidiyeköy\"), (\"4. LEVENT\", \"4. Levent\")]:\n    _s = istasyon_adi(_g)\n    assert _s == _b, f\"istasyon_adi({_g!r}) → {_s!r}, beklenen {_b!r}\"", "hint": "Önce <code>tr_kucuk<\/code> ve <code>tr_baslik<\/code>'i bitir, sonra <code>istasyon_adi<\/code>'yi 5. ara duraktaki sırayla yaz. Her <code>re.sub<\/code>'da silinen parçanın yerine <code>\" \"<\/code> koy, en sonda <code>re.sub(r\"\\s+\", \" \", ad).strip()<\/code>. Kural dışı ad için <code>{\"ayrılıkçeşmesi\": \"ayrılıkçeşme\"}.get(ad, ad)<\/code>. Test \"4. LEVENT\" gibi rakamla başlayan bir adın bozulmadığını da kontrol ediyor.", "tags": ["regex", "turkce", "metin", "fonksiyon"], "setup": [], "rev": false, "why": "Projende bu fonksiyon <code>yolcu[\"station_name\"].map(istasyon_adi)<\/code> ile her satıra uygulanıyor; giriş adları tek istasyona toplanıyor ve en yoğun istasyonlar grafiği ancak böyle doğru çıkıyor.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "Regex'te <code>\\d<\/code> neyi eşler?", "opts": ["Harf", "Rakam", "Boşluk", "Nokta"], "a": 1, "why": "<code>\\d<\/code> = digit, yani rakam.", "tags": ["regex"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>re.sub(r\"\\s+\", \" \", \"Hacı    Osman  \").strip()<\/code> ne verir?", "opts": ["\"Hacı Osman\"", "\"HacıOsman\"", "\"Hacı    Osman\"", "\"Hacı Osman \""], "a": 0, "why": "<code>\\s+<\/code> art arda boşlukları tek boşluğa indirir, <code>.strip()<\/code> sondaki boşluğu atar.", "tags": ["regex"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>\"a  b\".split(\" \")<\/code> (arada iki boşluk) neyi verir?", "opts": ["['a', 'b']", "['a', '', 'b']", "['a  b']", "['a', ' ', 'b']"], "a": 1, "why": "Ayırıcı verince her boşlukta bölünür; iki boşluğun arasında boş bir metin kalır. Parametresiz <code>split()<\/code> bunu yapmaz.", "tags": ["metin"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>\"İSTANBUL\".lower() == \"istanbul\"<\/code> sonucu nedir?", "opts": ["True", "False", "Hata", "None"], "a": 1, "why": "Python İ'yi \"i + nokta işareti\" diye iki karaktere çevirir; metinler eşit çıkmaz. Bu yüzden <code>tr_kucuk<\/code> var.", "tags": ["turkce"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b6", "no": 6, "tur": "ders", "baslik": "Modüller, dosyalar ve script yapısı", "hat": "M6", "ozet": "import biçimleri, dosya okuma-yazma, pathlib, JSON, try/except ve bir .py dosyasının iskeleti.", "dosya": "harita/build_map.py", "proje": "import json\nimport sys\nfrom pathlib import Path\n\nKOK = Path(__file__).resolve().parent\nVERI = KOK / \"data\"\nOSM_HAM = VERI / \"osm_ham.json\"\n...\ndef osm_indir():\n    ...\n        for url in OVERPASS_SUNUCULARI:\n            try:\n                ...\n                json.loads(govde)  # geçerli JSON mu?\n                OSM_HAM.write_bytes(govde)\n                return\n            except Exception as hata:  # sunucu meşgul / zaman aşımı\n                print(f\"  {url} başarısız: {hata}\")\n    ...\n\ndef hat_geometrileri():\n    ham = json.loads(OSM_HAM.read_text(encoding=\"utf-8\"))\n    ...\n    HATLAR_GEOJSON.write_text(json.dumps(geojson, ensure_ascii=False, separators=(\",\", \":\")), encoding=\"utf-8\")\n...\ndef main():\n    if \"--yenile\" in sys.argv or not OSM_HAM.exists():\n        osm_indir()\n    ...\n\nif __name__ == \"__main__\":\n    main()", "adimlar": [{"baslik": "import: hazır kodu kullanmak", "html": "\n<p>Python'un gücü hazır <b>modüllerden<\/b> gelir. Modül, içinde fonksiyonlar ve değişkenler olan bir <code>.py<\/code> dosyasıdır;\n<code>import<\/code> onu programına yükler. Dört yazım biçimi var ve projende hepsi geçiyor:<\/p>\n<pre class=\"py\">import os                             # modülün tamamı        → os.makedirs(...)\nimport pandas as pd                   # takma adla            → pd.read_csv(...)\nfrom scipy import stats               # modülden bir parça    → stats.spearmanr(...)\nfrom matplotlib.patches import Patch  # alt modülden bir sınıf → Patch(...)<\/pre>\n<p>İlk biçimde modülün adını her seferinde yazarsın: <code>os.makedirs<\/code>. Biraz uzun ama fonksiyonun nereden geldiği hep bellidir.\n<code>as<\/code> ile verilen takma ad yalnızca bir kısaltmadır. <code>pd<\/code>, <code>np<\/code>, <code>plt<\/code> herkesin kullandığı alışkanlıklardır;\nkodunu okuyan biri hemen tanır. <code>from ... import ...<\/code> ise ismi doğrudan getirir, başına modül adı yazmazsın.<\/p>\n<p>Modüller üç yerden gelir: Python'la birlikte gelen <b>standart kütüphane<\/b> (<code>os<\/code>, <code>re<\/code>, <code>json<\/code>, <code>sys<\/code>,\n<code>pathlib<\/code>), <code>pip install<\/code> ile kurduğun paketler (<code>pandas<\/code>, <code>matplotlib<\/code>, <code>scipy<\/code>) ve kendi yazdığın\n<code>.py<\/code> dosyaları. <code>build_map.py<\/code>'nin başındaki importların hepsi standart kütüphaneden; haritayı üretmek için hiçbir paket kurman gerekmiyor.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Takma ad verdikten sonra uzun adı kullanmak. <code>import pandas as pd<\/code> dedikten sonra\n<code>pandas.read_csv<\/code> yazarsan <code>NameError: name 'pandas' is not defined<\/code> alırsın. Aynı şekilde <code>from scipy import stats<\/code>\ndedikten sonra yalnızca <code>stats<\/code> tanımlıdır; <code>scipy.stats<\/code> çalışmaz.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>from os import *<\/code> gibi \"hepsini getir\" yazımı da var ama kaçınılır. Hangi ismin nereden geldiği kaybolur;\niki modülde aynı isim varsa biri ötekini sessizce ezer. Importları dosyanın en başına toplamak da bir gelenek: dosyayı açan, neye ihtiyaç duyduğunu ilk bakışta görür.<\/div>\n", "ornek": "import math\nimport statistics as st\nfrom collections import Counter\n\nprint(math.sqrt(144))\nprint(st.mean([5200, 6100, 3900]))\nprint(Counter([\"M2\", \"M4\", \"M2\", \"T1\", \"M2\"]).most_common(1))\n\nimport pandas as pd\nprint(pd.__name__)     # takma ad, asıl modülü gösterir", "ornek_setup": []}, {"baslik": "Dosyalar: open, with ve pathlib", "html": "\n<p>Bir dosyayı okumak ya da yazmak için önce <b>açarsın<\/b>. En güvenli yol <code>with<\/code> bloğudur:<\/p>\n<pre class=\"py\">with open(\"hatlar.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"M2\\nM4\\n\")        # \"w\": yaz (dosya varsa içi silinir!)\n\nwith open(\"hatlar.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"T1\\n\")            # \"a\": sonuna ekle\n\nwith open(\"hatlar.txt\", encoding=\"utf-8\") as f:   # varsayılan \"r\": oku\n    for satir in f:\n        print(satir.strip())<\/pre>\n<p><code>with<\/code> bloğu bitince dosya <b>kendiliğinden kapanır<\/b>, arada hata çıksa bile. Kapanmayan bir dosyaya yazdıkların diske ulaşmayabilir.<\/p>\n<h3>pathlib: yollarla rahat çalışmak<\/h3>\n<p><code>build_map.py<
