\/code> dosya yollarını <code>Path<\/code> nesneleriyle kuruyor:<\/p>\n<pre class=\"py\">from pathlib import Path\nKOK = Path(__file__).resolve().parent   # bu .py dosyasının klasörü\nVERI = KOK / \"data\"                     # \"/\" yol parçalarını birleştirir\nOSM_HAM = VERI / \"osm_ham.json\"\nOSM_HAM.exists()                        # dosya var mı? True / False\nOSM_HAM.read_text(encoding=\"utf-8\")     # aç, oku, kapat: tek satırda\nOSM_HAM.name, OSM_HAM.suffix            # 'osm_ham.json', '.json'<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>Path(__file__).resolve().parent<\/code> yolları, programı hangi klasörden çalıştırdığından bağımsız yapar.\n<code>python harita/build_map.py<\/code> de desen, <code>harita<\/code> klasörüne girip <code>python build_map.py<\/code> de desen dosyalar bulunur.\n<code>\"data/osm_ham.json\"<\/code> gibi göreli bir yol ise yalnızca doğru klasördeyken çalışır. Notebook'taki <code>os.makedirs(\"figures\", exist_ok=True)<\/code>\nde benzer bir özen: klasör zaten varsa hata vermez.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>encoding=\"utf-8\"<\/code>'i unutmak. Windows'ta varsayılan kodlama farklı olabilir; \"Kadıköy\" gibi Türkçe harfler\nbozuk okunur ya da yazarken hata çıkar. Metin dosyalarında kodlamayı hep açıkça yaz.<\/div>\n", "ornek": "from pathlib import Path\n\nyol = Path(\"hatlar.txt\")\nwith open(yol, \"w\", encoding=\"utf-8\") as f:\n    f.write(\"M2\\nM4\\n\")\nwith open(yol, \"a\", encoding=\"utf-8\") as f:\n    f.write(\"T1\\n\")\n\nprint(yol.exists(), yol.name, yol.suffix)\nprint(yol.read_text(encoding=\"utf-8\").split())\nprint(Path(\"harita\") / \"data\" / \"istasyonlar.json\")\n\nyol.unlink()            # denemeyi temizle: dosyayı sil\nprint(yol.exists())", "ornek_setup": []}, {"baslik": "JSON: veriyi metin olarak saklamak", "html": "\n<p><b>JSON<\/b>, verinin metin hâlidir. Sözlük, liste, sayı, metin, True/False ve None'dan oluşan her yapıyı JSON'a çevirip dosyaya yazabilir,\nsonra aynen geri okuyabilirsin. Haritandaki <code>istasyonlar.json<\/code> ve <code>hatlar_osm.geojson<\/code> böyle dosyalar.<\/p>\n<pre class=\"py\">import json\nveri = {\"hat\": \"M2\", \"istasyon\": \"Şişli\", \"yolcu\": 6100, \"acik\": True}\nmetin = json.dumps(veri, ensure_ascii=False)   # nesne → metin\n# '{\"hat\": \"M2\", \"istasyon\": \"Şişli\", \"yolcu\": 6100, \"acik\": true}'\ngeri = json.loads(metin)                         # metin → nesne\ngeri[\"yolcu\"]                                    # 6100<\/pre>\n<p>Sondaki <b>s<\/b> \"string\" (metin) demek: <code>dumps<\/code>/<code>loads<\/code> metinle, <code>dump<\/code>/<code>load<\/code> doğrudan açık bir dosyayla çalışır:<\/p>\n<pre class=\"py\">with open(\"ayar.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(veri, f, ensure_ascii=False, indent=2)   # indent: girintili, okunaklı\nwith open(\"ayar.json\", encoding=\"utf-8\") as f:\n    veri = json.load(f)<\/pre>\n<p><code>build_map.py<\/code>'de <code>json.dumps(geojson, ensure_ascii=False, separators=(\",\", \":\"))<\/code> yazmışsın. <code>separators<\/code> virgülden ve\niki noktadan sonraki boşlukları atar; büyük bir dosya böylece gözle görülür biçimde küçülür. İnsan okuyacaksa <code>indent=2<\/code>, tarayıcı okuyacaksa sıkıştırılmış yazım.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>ensure_ascii=False<\/code> olmadan Türkçe harfler kaçış koduna çevrilir: \"Şişli\" dosyaya <code>\"\\u015ei\\u015fli\"<\/code>\ndiye yazılır. Geri okununca yine doğru çıkar, ama dosyayı açıp okuyamazsın ve boyutu büyür.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> JSON'u Python sanmak. JSON'da metinler <b>çift tırnak<\/b> ister; <code>True<\/code> yerine <code>true<\/code>,\n<code>None<\/code> yerine <code>null<\/code> yazılır. <code>json.loads(\"{'hat': 'M2'}\")<\/code> tek tırnak yüzünden <code>JSONDecodeError<\/code> verir.\nBir de demetler (tuple) JSON'da listeye döner; geri okuyunca liste gelir.<\/div>\n", "ornek": "import json\n\nveri = {\"hat\": \"M2\", \"istasyon\": \"Şişli\", \"acik\": True, \"not\": None, \"konum\": (41.06, 28.99)}\nprint(json.dumps(veri))                          # Türkçe harfler kaçışlı\nprint(json.dumps(veri, ensure_ascii=False))\nprint(json.dumps(veri, ensure_ascii=False, separators=(\",\", \":\")))\n\ngeri = json.loads(json.dumps(veri))\nprint(geri[\"istasyon\"], geri[\"konum\"])           # demet listeye döndü", "ornek_setup": []}, {"baslik": "try / except: hatayla baş etmek", "html": "\n<p>Her şey her zaman yolunda gitmez: dosya yoktur, sunucu cevap vermez, metin sayıya çevrilemez. Python bu durumlarda bir <b>istisna<\/b> (exception)\nfırlatır ve program durur. <code>try<\/code>/<code>except<\/code> ile \"bunu dene, olmazsa şunu yap\" dersin:<\/p>\n<pre class=\"py\">try:\n    sayi = int(\"on iki\")\nexcept ValueError:\n    sayi = None           # çevrilemezse program durmaz, sayi None olur<\/pre>\n<p>Projendeki <code>osm_indir<\/code> bu fikrin güzel bir örneği. Overpass sunucularını sırayla dener. Biri hata verirse mesajı yazıp sıradakine geçer,\nbiri başarılı olunca <code>return<\/code> ile çıkar:<\/p>\n<pre class=\"py\">for url in OVERPASS_SUNUCULARI:\n    try:\n        ...                              # indir, json.loads ile kontrol et, dosyaya yaz\n        return\n    except Exception as hata:            # sunucu meşgul / zaman aşımı\n        print(f\"  {url} başarısız: {hata}\")<\/pre>\n<p><code>as hata<\/code> yakalanan istisnayı bir isme bağlar, böylece mesajını yazdırabilirsin. İki ek parça daha var: <code>else<\/code> bloğu yalnızca\nhata <b>çıkmazsa<\/b> çalışır; <code>finally<\/code> ise her durumda çalışır. Dosya kapatmak, geçici dosyayı silmek gibi temizlik işleri <code>finally<\/code>'ye yazılır.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Her şeyi yakalamak. <code>except Exception<\/code> yazım hatalarını, yanlış değişken adlarını da yutar; program sessizce yanlış çalışır.\nBeklediğin hatayı adıyla yakala: dosya yoksa <code>FileNotFoundError<\/code>, bozuk JSON'da <code>json.JSONDecodeError<\/code>, sözlükte olmayan anahtarda\n<code>KeyError<\/code>, çevrilemeyen sayıda <code>ValueError<\/code>. <code>osm_indir<\/code>'deki geniş yakalama ise bilinçli: ağ hatalarının türü çok,\nhepsinde yapılacak iş aynı (sıradaki sunucuya geç).<\/div>\n", "ornek": "import json\n\ndef sahte_indir(url):\n    # Bu sayfada internet yok; sunucuların cevabını taklit ediyoruz\n    if \"kumi\" in url:\n        return '{\"elements\": []}'\n    if \"mail\" in url:\n        return \"<html>Sunucu meşgul<\/html>\"\n    raise TimeoutError(\"zaman aşımı\")\n\nfor url in [\"overpass-api.de\", \"maps.mail.ru\", \"overpass.kumi.systems\"]:\n    try:\n        veri = json.loads(sahte_indir(url))\n    except (TimeoutError, json.JSONDecodeError) as hata:\n        print(f\"{url} başarısız: {type(hata).__name__}: {hata}\")\n    else:\n        print(f\"{url} tamam, {len(veri['elements'])} öğe\")\n        break\n\ntry:\n    with open(\"olmayan_dosya.json\", encoding=\"utf-8\") as f:\n        ayarlar = json.load(f)\nexcept FileNotFoundError:\n    ayarlar = {}\nprint(\"ayarlar:\", ayarlar)", "ornek_setup": []}, {"baslik": "Script iskeleti: main, sys.argv, __name__", "html": "\n<p>Bir <code>.py<\/code> dosyası iki şekilde kullanılır: <b>doğrudan çalıştırılır<\/b> (<code>python build_map.py<\/code>) ya da başka bir dosyadan\n<b>import edilir<\/b>. Python her dosyaya <code>__name__<\/code> adında bir değişken verir. Doğrudan çalıştırılan dosyada değeri <code>\"__main__\"<\/code>,\nimport edilen dosyada ise modülün adıdır (<code>\"build_map\"<\/code>).<\/p>\n<pre class=\"py\">def main():\n    if \"--yenile\" in sys.argv or not OSM_HAM.exists():\n        osm_indir()\n    ...\n\nif __name__ == \"__main__\":\n    main()<\/pre>\n<p>Son iki satır \"yalnızca doğrudan çalıştırıldıysam işe başla\" demek. Böylece başka bir dosya <code>from build_map import sadelestir<\/code> yazıp\nyalnızca o fonksiyonu kullanabilir; import sırasında harita baştan üretilmez, OSM'den veri indirilmez.<\/p>\n<h3>sys.argv: komut satırı<\/h3>\n<p><code>sys.argv<\/code>, programı çalıştırırken yazdığın kelimelerin listesidir. <code>python harita/build_map.py --yenile<\/code> için\n<code>[\"harita/build_map.py\", \"--yenile\"]<\/code> olur. İlk eleman her zaman dosyanın adıdır, seçenekler ondan sonra gelir.\n<code>\"--yenile\" in sys.argv<\/code> bu yüzden basit bir açma-kapama düğmesi gibi çalışır.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Kodu bir <code>main()<\/code> fonksiyonunda toplamak, dosyanın üst kısmını (sabitler, yardımcı fonksiyonlar) çalışan kısmından ayırır.\n<code>clean_data.py<\/code> gibi yukarıdan aşağı akan kısa scriptlerde şart değil. Ama dosya büyüdükçe bu iskelet okumayı çok kolaylaştırır.<\/div>\n<p>Bu sayfadaki kod bir dosyadan ya da komut satırından çalışmıyor. Örnekte <code>sys.argv<\/code>'yi ve <code>__name__<\/code>'i bu yüzden elle\nayarlıyoruz; gerçek bir script'te ikisini de Python kendisi doldurur. <code>--yenile<\/code>'yi silip tekrar çalıştır.<\/p>\n", "ornek": "import sys\n\ndef main():\n    if \"--yenile\" in sys.argv:\n        print(\"OSM verisi yeniden indirilecek\")\n    else:\n        print(\"Önbellekteki veri kullanılacak\")\n    print(\"Tüm argümanlar:\", sys.argv)\n\n# Komut satırında şunu yazmışız gibi yapalım:  python build_map.py --yenile\nsys.argv = [\"build_map.py\", \"--yenile\"]\n__name__ = \"__main__\"     # doğrudan çalıştırılan dosyada bunu Python kendisi yapar\n\nif __name__ == \"__main__\":\n    main()", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "<code>import pandas as pd<\/code> satırından sonra hangisi doğru?", "opts": ["pandas.read_csv(...)", "pd.read_csv(...)", "read_csv(...)", "as.read_csv(...)"], "a": 1, "why": "Takma ad verdiysen modülü o adla kullanırsın.", "tags": ["import"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>from scipy import stats<\/code> yazdıktan sonra hangisi çalışır?", "opts": ["stats.spearmanr(x, y)", "scipy.stats.spearmanr(x, at': 'M2'}\")", "json.loads('[1, 2, 3]')", "json.loads('null')"], "a": 1, "why": "JSON'da metinler ve anahtarlar çift tırnak ister. <code>null<\/code> geçerli bir JSON'dur ve <code>None<\/code> olarak okunur.", "tags": ["json"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>sayiya_cevir(\"on iki\")<\/code> <code>None<\/code> döndürmeli, ama program hata verip duruyor. Düzelt.", "starter": "def sayiya_cevir(metin):\n    try:\n        return int(metin)\n    except KeyError:\n        return None\n\nprint(sayiya_cevir(\"12\"), sayiya_cevir(\"on iki\"))\n", "sol": "def sayiya_cevir(metin):\n    try:\n        return int(metin)\n    except ValueError:\n        return None\n\nprint(sayiya_cevir(\"12\"), sayiya_cevir(\"on iki\"))\n", "test": "assert sayiya_cevir(\"12\") == 12, \"Sayı olan metin int'e çevrilmeli\"\nassert sayiya_cevir(\"on iki\") is None, \"Çevrilemeyen metin için None dönmeli\"", "hint": "<code>int(\"on iki\")<\/code> hangi hatayı veriyor? Hata mesajının ilk kelimesine bak ve <code>except<\/code>'e onu yaz.", "tags": ["hata_yakalama"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>gunluge_ekle<\/code> her çağrıldığında dosyanın <b>sonuna<\/b> yeni bir satır eklemeli. Ama iki kez çağırınca dosyada yalnızca son mesaj kalıyor, satır sonu da yok. İki sorunu da düzelt.", "starter": "from pathlib import Path\n\ndef gunluge_ekle(yol, mesaj):\n    with open(yol, \"w\", encoding=\"utf-8\") as f:\n        f.write(mesaj)\n\ngunluge_ekle(\"gunluk.txt\", \"OSM indirildi\")\ngunluge_ekle(\"gunluk.txt\", \"Harita yazıldı\")\nprint(Path(\"gunluk.txt\").read_text(encoding=\"utf-8\"))\nPath(\"gunluk.txt\").unlink()\n", "sol": "from pathlib import Path\n\ndef gunluge_ekle(yol, mesaj):\n    with open(yol, \"a\", encoding=\"utf-8\") as f:\n        f.write(mesaj + \"\\n\")\n\ngunluge_ekle(\"gunluk.txt\", \"OSM indirildi\")\ngunluge_ekle(\"gunluk.txt\", \"Harita yazıldı\")\nprint(Path(\"gunluk.txt\").read_text(encoding=\"utf-8\"))\nPath(\"gunluk.txt\").unlink()\n", "test": "import os\n_y = \"b06_gunluk_test.txt\"\nif os.path.exists(_y):\n    os.remove(_y)\ngunluge_ekle(_y, \"OSM indirildi\")\ngunluge_ekle(_y, \"Harita yazıldı\")\n_icerik = open(_y, encoding=\"utf-8\").read() if os.path.exists(_y) else \"\"\nfor _d in (_y, \"gunluk.txt\"):\n    if os.path.exists(_d):\n        os.remove(_d)\nassert _icerik == \"OSM indirildi\\nHarita yazıldı\\n\", f\"İki çağrıdan sonra dosya içeriği: {_icerik!r}\"", "hint": "<code>\"w\"<\/code> dosyayı her açılışta sıfırlar; sona eklemek için <code>\"a\"<\/code>. <code>write<\/code> satır sonunu kendisi eklemez: <code>mesaj + \"\\n\"<\/code>.", "tags": ["dosya"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "order", "q": "Bir script'in iskeletini doğru sıraya koy.", "lines": ["import sys", "def main():", "    if \"--yenile\" in sys.argv:", "        print(\"OSM verisi indiriliyor\")", "if __name__ == \"__main__\":", "    main()"], "why": "Importlar en üstte, sonra fonksiyon tanımı, en altta çalıştırma bloğu. <code>if __name__<\/code> bloğu fonksiyondan sonra gelmeli; yoksa <code>main<\/code> henüz tanımlanmamış olur.", "tags": ["script", "import"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>secenekler(argv)<\/code> fonksiyonu yaz. Bir <code>sys.argv<\/code> listesi alsın ve sözlük döndürsün: <code>\"yenile\"<\/code> anahtarı <code>--yenile<\/code> listede varsa <code>True<\/code>, yoksa <code>False<\/code>; <code>\"dpi\"<\/code> anahtarı <code>--dpi<\/code>'den sonra gelen sayı (<code>int<\/code>), <code>--dpi<\/code> yoksa 150.", "starter": "def secenekler(argv):\n    # buraya yaz\n    return {}\n\nprint(secenekler([\"build_map.py\", \"--dpi\", \"300\", \"--yenile\"]))\n", "sol": "def secenekler(argv):\n    dpi = 150\n    if \"--dpi\" in argv:\n        dpi = int(argv[argv.index(\"--dpi\") + 1])\n    return {\"yenile\": \"--yenile\" in argv, \"dpi\": dpi}\n\nprint(secenekler([\"build_map.py\", \"--dpi\", \"300\", \"--yenile\"]))\n", "test": "for _a, _b in [([\"build_map.py\"], {\"yenile\": False, \"dpi\": 150}),\n               ([\"build_map.py\", \"--yenile\"], {\"yenile\": True, \"dpi\": 150}),\n               ([\"build_map.py\", \"--dpi\", \"300\"], {\"yenile\": False, \"dpi\": 300}),\n               ([\"build_map.py\", \"--dpi\", \"72\", \"--yenile\"], {\"yenile\": True, \"dpi\": 72})]:\n    assert secenekler(_a) == _b, f\"secenekler({_a}) → {secenekler(_a)}, beklenen {_b}\"", "hint": "<code>\"--yenile\" in argv<\/code> zaten True/False verir. Sayının yeri: <code>argv.index(\"--dpi\") + 1<\/code>; metin olarak gelir, <code>int(...)<\/code> ile çevir.", "tags": ["script", "liste", "sozluk"], "setup": [], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Harita ayar dosyası.<\/b> Haritanın ayarlarını bir JSON dosyasında tutacaksın. Kullanıcının dosyasında olmayan ayarlar varsayılan değerlerden gelsin.<ol><li><code>ayar_yaz(yol, ayarlar)<\/code>: sözlüğü <code>yol<\/code>'a JSON olarak yaz. UTF-8, <code>ensure_ascii=False<\/code>, <code>indent=2<\/code>.<\/li><li><code>ayar_oku(yol)<\/code>: dosyadaki sözlüğü döndür. Dosya yoksa (<code>FileNotFoundError<\/code>) boş sözlük <code>{}<\/code> döndür.<\/li><li><code>ayarlari_al(yol, varsayilan)<\/code>: varsayılanları, dosyadaki değerlerle güncellenmiş <b>yeni<\/b> bir sözlük olarak döndür. <code>varsayilan<\/code> sözlüğünün kendisi değişmemeli.<\/li><li>Alttaki denemeyi çalıştır: <code>dpi<\/code> ve <code>baslik<\/code> dosyadan, <code>renk<\/code> varsayılandan gelmeli.<\/li><\/ol>", "starter": "import json\n\nVARSAYILAN = {\"baslik\": \"İstasyon kullanım haritası\", \"dpi\": 150, \"renk\": \"#3b6ea5\"}\n\ndef ayar_yaz(yol, ayarlar):\n    pass\n\ndef ayar_oku(yol):\n    pass\n\ndef ayarlari_al(yol, varsayilan):\n    pass\n\n# Deneme\nayar_yaz(\"ayarlar.json\", {\"dpi\": 300, \"baslik\": \"Kadıköy çevresi\"})\nprint(ayarlari_al(\"ayarlar.json\", VARSAYILAN))\nprint(ayarlari_al(\"olmayan.json\", VARSAYILAN))\n", "sol": "import json\n\nVARSAYILAN = {\"baslik\": \"İstasyon kullanım haritası\", \"dpi\": 150, \"renk\": \"#3b6ea5\"}\n\ndef ayar_yaz(yol, ayarlar):\n    with open(yol, \"w\", encoding=\"utf-8\") as f:\n        json.dump(ayarlar, f, ensure_ascii=False, indent=2)\n\ndef ayar_oku(yol):\n    try:\n        with open(yol, encoding=\"utf-8\") as f:\n            return json.load(f)\n    except FileNotFoundError:\n        return {}\n\ndef ayarlari_al(yol, varsayilan):\n    sonuc = dict(varsayilan)\n    sonuc.update(ayar_oku(yol))\n    return sonuc\n\n# Deneme\nayar_yaz(\"ayarlar.json\", {\"dpi\": 300, \"baslik\": \"Kadıköy çevresi\"})\nprint(ayarlari_al(\"ayarlar.json\", VARSAYILAN))\nprint(ayarlari_al(\"olmayan.json\", VARSAYILAN))\n", "test": "import os, json\n_y, _yok = \"b06_test_ayar.json\", \"b06_olmayan_dosya.json\"\n_v = {\"baslik\": \"Harita\", \"dpi\": 150, \"renk\": \"#3b6ea5\"}\nfor _d in (_y, _yok):\n    if os.path.exists(_d):\n        os.remove(_d)\ntry:\n    ayar_yaz(_y, {\"baslik\": \"Kadıköy\", \"dpi\": 300})\n    _ham = open(_y, encoding=\"utf-8\").read() if os.path.exists(_y) else None\n    _geri = ayar_oku(_y) if _ham is not None else None\n    _bos = ayar_oku(_yok)\n    _son = ayarlari_al(_y, _v)\n    _eksik = ayarlari_al(_yok, _v)\nfinally:\n    for _d in (_y, \"ayarlar.json\"):\n        if os.path.exists(_d):\n            os.remove(_d)\nassert _ham is not None, \"ayar_yaz dosyayı oluşturmadı\"\nassert \"Kadıköy\" in _ham, \"Dosyada Türkçe harfler kaçışlı yazılmış; ensure_ascii=False ver\"\nassert json.loads(_ham) == {\"baslik\": \"Kadıköy\", \"dpi\": 300}, f\"Dosyadaki JSON yazdığın sözlükle aynı değil: {_ham!r}\"\nassert _geri == {\"baslik\": \"Kadıköy\", \"dpi\": 300}, f\"ayar_oku dosyadaki sözlüğü döndürmeli, döndürdüğü: {_geri!r}\"\nassert _bos == {}, f\"Dosya yoksa ayar_oku {{}} döndürmeli, döndürdüğü: {_bos!r}\"\nassert _son == {\"baslik\": \"Kadıköy\", \"dpi\": 300, \"renk\": \"#3b6ea5\"}, f\"ayarlari_al sonucu: {_son!r}\"\nassert _v == {\"baslik\": \"Harita\", \"dpi\": 150, \"renk\": \"#3b6ea5\"}, \"varsayilan sözlüğü değişti; önce bir kopyasını al (dict(varsayilan))\"\nassert _eksik == _v and _eksik is not _v, \"Dosya yoksa varsayılanların bir kopyası dönmeli\"", "hint": "<code>ayar_yaz<\/code>: <code>with open(yol, \"w\", encoding=\"utf-8\") as f:<\/code> ve <code>json.dump(ayarlar, f, ensure_ascii=False, indent=2)<\/code>. <code>ayar_oku<\/code>: aynı bloğu <code>try<\/code> içine al, <code>except FileNotFoundError: return {}<\/code>. <code>ayarlari_al<\/code>: <code>sonuc = dict(varsayilan)<\/code> ile kopya al, sonra <code>sonuc.update(ayar_oku(yol))<\/code>.", "tags": ["json", "dosya", "hata_yakalama", "sozluk"], "setup": [], "rev": false, "why": "Bu desen (varsayılan + kullanıcı dosyası) gerçek programlarda çok yaygındır. <code>build_map.py<\/code>'deki önbellek mantığı da benzer: dosya varsa onu kullan, yoksa yeniden üret.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>json.dumps<\/code> ne yapar?", "opts": ["Metni sözlüğe çevirir", "Python nesnesini JSON metnine çevirir", "Dosyayı siler", "İnternetten indirir"], "a": 1, "why": "dumps = dump string: nesne → metin. Tersi <code>json.loads<\/code>.", "tags": ["json"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>with open(...) as f:<\/code> bloğu bitince dosyaya ne olur?", "opts": ["Silinir", "Açık kalır, elle kapatmak gerekir", "Kendiliğinden kapanır", "İçi boşaltılır"], "a": 2, "why": "<code>with<\/code>'in bütün amacı bu: blok bitince, hata çıksa bile dosya kapanır.", "tags": ["dosya"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>build_map.py<\/code> başka bir dosyadan <code>import<\/code> edilirse içindeki <code>__name__<\/code> neye eşit olur?", "opts": ["\"__main__\"", "\"build_map\"", "None", "\"import\""], "a": 1, "why": "Import edilen dosyada <code>__name__<\/code> modülün adıdır; bu yüzden <code>if __name__ == \"__main__\":<\/code> bloğu çalışmaz.", "tags": ["script"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Var olan bir dosyayı <code>\"w\"<\/code> modunda açıp yazarsan eski içeriğe ne olur?", "opts": ["Korunur, sona eklenir", "Silinir, yerine yenisi yazılır", "Hata verir", "Başa eklenir"], "a": 1, "why": "<code>\"w\"<\/code> dosyayı sıfırlar. Sona eklemek için <code>\"a\"<\/code> kullanılır.", "tags": ["dosya"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b7", "no": 7, "tur": "ders", "baslik": "pandas 1: veriyi okumak ve temizlemek", "hat": "M7", "ozet": "DataFrame ve Series, sütun/satır seçimi, maske, .loc ile düzeltme ve tarihler: clean_data.py'nin ilk yarısı.", "dosya": "clean_data.py", "proje": "import pandas as pd\ndf = pd.read_csv(\"2025-yl-yaa_gore_rayl_sistemler_istasyon_bazl_yolcu_ve_yolculuk_saylar.csv\", sep=\";\", encoding=\"utf-8-sig\")\ndf = df.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\ndf[\"date\"]=pd.to_datetime(dict(year=df.transaction_year, month=df.transaction_month, day=df.transaction_day))\ndf[\"weekday\"] = df[\"date\"].dt.day_name()\ndf[\"is_weekend\"] = df[\"date\"].dt.weekday >= 5\nbos_istasyon = df[\"station_name\"].isna()\ndf.loc[bos_istasyon & (df[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"\ndf.loc[bos_istasyon & (df[\"line\"] == \"IETT NOSTALJIK TRAMVAY\"), \"station_name\"] = \"Taksim-Tünel Nostaljik Tramvay\"\ndf.loc[df[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"town\"] = \"EyüpSultan\"\ndf.loc[df[\"station_name\"] == \"KAZIMKARABEKİR\", \"town\"] = \"Gaziosmanpaşa\"", "adimlar": [{"baslik": "DataFrame, Series ve index", "html": "\n<p>pandas'ta bir tablo <b>DataFrame<\/b>'dir: adı olan sütunlar ve numaralı satırlar. Her sütun tek başına bir <b>Series<\/b>'tir:\nher değerin yanında bir etiket taşıyan tek boyutlu bir dizi. Satırların soldaki etiketlerine <b>index<\/b> denir; aksi söylenmedikçe 0, 1, 2… diye gider.<\/p>\n<pre class=\"py\">import pandas as pd\ndf = pd.read_csv(\"2025-yl-...csv\", sep=\";\", encoding=\"utf-8-sig\")<\/pre>\n<p><code>clean_data.py<\/code>'nin ilk satırı bu. <code>sep=\";\"<\/code> gerekiyor, çünkü İBB dosyaları noktalı virgülle ayrılmış. Türkçe ayarlı Excel ondalık için virgül\nkullandığından, Türkiye'deki CSV'lerde bu çok yaygın. <code>utf-8-sig<\/code> ise dosyanın başındaki görünmez \"BOM\" işaretini tanır. Kaydederken de aynı kodlamayı\nkullanman, Excel'in dosyayı açınca Türkçe harfleri doğru göstermesini sağlar.<\/p>\n<h3>Tabloyu tanımak<\/h3>\n<pre class=\"py\">df.shape        # (satır, sütun) → (7, 12)\ndf.head(3)      # ilk 3 satır (sayı vermezsen 5)\ndf.columns      # sütun adları\ndf.dtypes       # her sütunun tipi\ndf.info()       # tipler + her sütunda kaç dolu değer var\ndf.describe()   # sayısal sütunların özeti: ortalama, en küçük, en büyük…<\/pre>\n<p>Yeni bir veri setiyle ilk işin bunlara bakmak olmalı. <code>info()<\/code> özellikle değerli: \"station_name … 5 non-null\" satırı,\n7 satırın 2'sinde istasyon adının boş olduğunu hemen söyler.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Bu sayfadaki hazır tablolar (<code>ham<\/code>, <code>yolcu<\/code>) bir dosyadan değil, kodun içindeki bir metinden okunuyor.\npandas için fark yok: aynı <code>read_csv<\/code>, aynı <code>sep=\";\"<\/code>. <code>ham<\/code>, projendeki ham dosyanın 7 satırlık bir örneği:\nkoordinat sütunları, \"Unkown\" yaş, boş istasyon adları, yanlış ilçe; temizleyeceğin her şey içinde.<\/div>\n", "ornek": "print(ham.shape)\nprint(ham.columns.tolist())\nprint(ham[[\"line\", \"station_name\", \"town\", \"age\"]].head(3))\nham.info()\nprint(type(ham).__name__, type(ham[\"town\"]).__name__)", "ornek_setup": ["ham"]}, {"baslik": "Sütun ve satır seçmek: [], .loc, .iloc", "html": "\n<pre class=\"py\">ham[\"town\"]                       # tek sütun → Series\nham[[\"line\", \"town\"]]             # sütun listesi → DataFrame (iki köşeli parantez!)\nham.loc[2]                        # index etiketi 2 olan satır → Series\nham.loc[2, \"town\"]                # tek hücre → 'Üsküdar'\nham.loc[0:2, [\"line\", \"town\"]]    # etiket 0'dan 2'ye (2 DAHİL), iki sütun\nham.iloc[0:2]                     # konum 0 ve 1 (2 HARİÇ)\nham.iloc[-1]                      # son satır<\/pre>\n<p><code>.loc<\/code> <b>etiketle<\/b>, <code>.iloc<\/code> <b>konumla<\/b> (0'dan başlayan sıra numarasıyla) seçer. Köşeli parantezin içinde önce satırlar,\nvirgülden sonra sütunlar gelir. Index 0, 1, 2… olduğu sürece ikisi çoğu zaman aynı sonucu verir. Fark, satır silince ya da sıralayınca ortaya çıkar:\netiket satırla birlikte gider, konum ise baştan sayılır.<\/p>\n<p>Sütun silmek için <code>drop<\/code> kullanılır. <code>clean_data.py<\/code>'nin ikinci satırı:<\/p>\n<pre class=\"py\">df = df.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>df.drop(columns=[...])<\/code> yazıp sonucu bir isme atamamak. pandas yöntemlerinin çoğu tabloyu yerinde değiştirmez;\nmetin yöntemlerinde olduğu gibi <b>yeni<\/b> bir tablo döndürür. <code>df = df.drop(...)<\/code> demezsen sütunlar yerinde durur.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>.loc<\/code>'ta dilimin sonu dahildir, çünkü etiketlerde \"bir sonraki\" diye bir şey yoktur; index tarih ya da\nistasyon adı da olabilir. <code>loc[\"Kadıköy\":\"Üsküdar\"]<\/code> yazınca Üsküdar'ın da gelmesini beklersin. <code>.iloc<\/code> ise Python listeleri\ngibi davranır: sonu hariç.<\/div>\n", "ornek": "print(ham[\"town\"].head(3))\nprint(ham[[\"line\", \"town\"]].head(3))\nprint(ham.loc[2, \"town\"])\nprint(len(ham.loc[0:2]), len(ham.iloc[0:2]))   # 3 ve 2: fark nereden geliyor?\n\ntemiz = ham.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\nprint(ham.shape, temiz.shape)                   # ham'ın kendisi değişmedi", "ornek_setup": ["ham"]}, {"baslik": "Maske: koşula uyan satırlar", "html": "\n<p>Bir sütunu bir değerle karşılaştırınca her satır için True/False içeren bir Series çıkar. Buna <b>maske<\/b> denir.\nMaskeyi köşeli parantez içine verince yalnızca True olan satırlar kalır:<\/p>\n<pre class=\"py\">kadikoy = ham[\"town\"] == \"Kadıköy\"     # [True, True, False, True, False, False, False]\nham[kadikoy]                            # yalnızca Kadıköy satırları\nham[ham[\"passanger_cnt\"] &gt; 1000]       # tek satırda da yazılabilir\nham[\"station_name\"].isna()              # boş (NaN) hücreler True\nham[\"line\"].isin([\"T3-KADIKOY-MODA\", \"IETT NOSTALJIK TRAMVAY\"])   # listedekilerden biri mi?<\/pre>\n<h3>Koşulları birleştirmek<\/h3>\n<p><code>&amp;<\/code> \"ve\", <code>|<\/code> \"veya\", <code>~<\/code> \"değil\" demek. Python'un <code>and<\/code>, <code>or<\/code>, <code>not<\/code> kelimeleri\nburada <b>çalışmaz<\/b>: tek bir True/False beklerler, yüzlerce değerlik bir Series'i nasıl yorumlayacaklarını bilemezler.\n\"The truth value of a Series is ambiguous\" hatası tam olarak bunu söyler.<\/p>\n<pre class=\"py\">bos = ham[\"station_name\"].isna()\nham[bos &amp; (ham[\"line\"] == \"T3-KADIKOY-MODA\")]     # boş VE T3\nham[~bos]                                         # boş OLMAYANLAR\nham[(ham[\"town\"] == \"Fatih\") | (ham[\"town\"] == \"Beyoğlu\")]<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Parantezleri unutmak. Python <code>&amp;<\/code> ve <code>|<\/code>'yi <code>==<\/code> ve <code>&gt;<\/code>'dan <b>önce<\/b> hesaplar.\n<code>ham[\"town\"] == \"Fatih\" | ham[\"town\"] == \"Beyoğlu\"<\/code> aslında <code>ham[\"town\"] == (\"Fatih\" | ham[\"town\"]) == \"Beyoğlu\"<\/code> diye okunur ve\nanlamsız bir hata verir. Her koşulu paranteze al.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>clean_data.py<\/code>'de maskeyi önce <code>bos_istasyon<\/code> adıyla bir değişkene atamışsın. Bu iyi bir alışkanlık:\naynı maske iki satırda kullanılıyor ve adı ne seçtiğini anlatıyor. Bir de: maskenin <code>sum()<\/code>'ı kaç satırın True olduğunu verir,\nçünkü True 1, False 0 sayılır.<\/div>\n", "ornek": "bos = ham[\"station_name\"].isna()\nprint(bos.tolist())\nprint(ham[bos][[\"line\", \"town\"]])\nprint(ham[~bos & (ham[\"town\"] == \"Kadıköy\")][\"station_name\"].tolist())\nprint(ham[ham[\"passanger_cnt\"] > 1000][\"station_name\"].tolist())\nprint(\"Boş istasyon adı:\", bos.sum())    # True'lar 1 sayılır", "ornek_setup": ["ham"]}, {"baslik": ".loc ile değer atamak", "html": "\n<p>Maskeyle satır seçmeyi öğrendin; şimdi o satırlardaki değerleri <b>değiştirelim<\/b>. Kalıp hep aynı:<\/p>\n<pre class=\"py\">df.loc[satır_maskesi, \"sütun\"] = yeni_değer<\/pre>\n<p><code>clean_data.py<\/code>'de istasyon adı boş kalan iki hattı ve ilçesi yanlış yazılmış bir istasyonu böyle düzeltiyorsun:<\/p>\n<pre class=\"py\">bos_istasyon = df[\"station_name\"].isna()\ndf.loc[bos_istasyon &amp; (df[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"\ndf.loc[bos_istasyon &amp; (df[\"line\"] == \"IETT NOSTALJIK TRAMVAY\"), \"station_name\"] = \"Taksim-Tünel Nostaljik Tramvay\"\ndf.loc[df[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"town\"] = \"EyüpSultan\"<\/pre>\n<p>Yalnızca maskenin True olduğu satırlarda, yalnızca adı verilen sütun değişir; tablonun geri kalanına dokunulmaz. Yeni bir sütun eklemek daha da kolay:\n<code>df[\"yeni\"] = ...<\/code> sütunu oluşturur. Sağ taraf tek bir değerse bütün satırlara aynı değer yazılır.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <b>Zincirleme atama<\/b>: <code>df[maske][\"station_name\"] = \"...\"<\/code>. Bu iki ayrı adımdır. Önce <code>df[maske]<\/code>\nseçilen satırların <b>kopyasını<\/b> üretir, sonra atama o kopyaya yapılır; asıl tablo değişmez. pandas bu yüzden bir uyarı gösterir\n(<code>SettingWithCopyWarning<\/code>, yeni sürümlerde <code>ChainedAssignmentError<\/code>). <code>df[\"station_name\"][maske] = ...<\/code> yazımı da aynı sorunu taşır:\neski sürümlerde bazen çalışır, yenilerinde hiç çalışmaz. Tek güvenli yol, satırı ve sütunu tek bir <code>.loc[...]<\/code> içinde vermek.<\/div>\n<p>Örnekte önce yanlış yazımı çalıştırıyoruz; çıktıdaki uyarıya ve boş ad sayısının değişmediğine dikkat et.<\/p>\n", "ornek": "bos = ham[\"station_name\"].isna()\n\n# YANLIŞ: kopyaya yazar, ham değişmez (pandas uyarı verir)\nham[bos][\"station_name\"] = \"?\"\nprint(ham[\"station_name\"].isna().sum(), \"boş ad kaldı\")\n\n# DOĞRU: satır ve sütun tek .loc içinde\nham.loc[bos & (ham[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"\nham.loc[ham[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"town\"] = \"EyüpSultan\"\nprint(ham[\"station_name\"].isna().sum(), \"boş ad kaldı\")\nprint(ham[[\"station_name\", \"town\"]])", "ornek_setup": ["ham"]}, {"baslik": "Tarihler: pd.to_datetime ve .dt", "html": "\n<p>Ham dosyada tarih üç ayrı sayı sütununda duruyor: <code>transaction_year<\/code>, <code>transaction_month<\/code>, <code>transaction_day<\/code>.\nGün adına, hafta sonuna ya da aya göre bakabilmek için bunları gerçek bir tarih sütununa çevirmen gerekiyor:<\/p>\n<pre class=\"py\">df[\"date\"] = pd.to_datetime(dict(year=df.transaction_year, month=df.transaction_month, day=df.transaction_day))<\/pre>\n<p><code>pd.to_datetime<\/code> metinden de tarih üretir: <code>pd.to_datetime(\"2025-03-08\")<\/code>. Burada ise ona <code>year<\/code>, <code>month<\/code>, <code>day<\/code>\nanahtarlı bir sözlük veriyorsun; her satırın üç sayısını birleştirip tek bir tarih yapıyor. <code>df.transaction_year<\/code> yazımı,\n<code>df[\"transaction_year\"]<\/code>'ın kısa hâlidir; adında boşluk olmayan sütunlarda çalışır.<\/p>\n<h3>.dt: tarih sütununun araç kutusu<\/h3>\n<pre class=\"py\">df[\"date\"].dt.day_name()    # 'Monday', 'Saturday' …\ndf[\"date\"].dt.weekday       # Pazartesi=0 … Pazar=6\ndf[\"date\"].dt.month         # 3, 10 …\ndf[\"date\"].dt.year          # 2025<\/pre>\n<p><code>.dt<\/code> üzerinden çağrılan her şey bütün sütuna tek seferde uygulanır. <code>clean_data.py<\/code>'deki iki satır buradan geliyor:<\/p>\n<pre class=\"py\">df[\"weekday\"] = df[\"date\"].dt.day_name()\ndf[\"is_weekend\"] = df[\"date\"].dt.weekday &gt;= 5     # Cumartesi (5) ve Pazar (6)<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>weekday<\/code> sayısı karşılaştırmada işe yarar: <code>&gt;= 5<\/code> tek hamlede hafta sonunu verir.\n<code>day_name()<\/code> ise tabloda ve grafikte okunacak adı verir. İkisini de saklaman bu yüzden mantıklı.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>.dt<\/code>'yi atlamak: <code>df[\"date\"].weekday<\/code> <code>AttributeError<\/code> verir, çünkü bu bir Series, tek bir tarih değil.\nTek bir tarihte (<code>pd.Timestamp<\/code>) ise tersine <code>.dt<\/code> yazılmaz: <code>pd.Timestamp(\"2025-03-08\").day_name()<\/code>.<\/div>\n", "ornek": "ham[\"date\"] = pd.to_datetime(dict(year=ham.transaction_year, month=ham.transaction_month, day=ham.transaction_day))\nham[\"weekday\"] = ham[\"date\"].dt.day_name()\nham[\"is_weekend\"] = ham[\"date\"].dt.weekday >= 5\nprint(ham[[\"date\", \"weekday\", \"is_weekend\"]])\nprint(ham[\"date\"].dt.month.tolist())\nprint(pd.Timestamp(\"2025-03-08\").day_name())", "ornek_setup": ["ham"]}], "sorular": [{"t": "mc", "q": "<code>df.shape<\/code> <code>(99, 9)<\/code> ise tabloda kaç satır var?", "opts": ["9", "99", "108", "891"], "a": 1, "why": "<code>shape<\/code> her zaman (satır, sütun) sırasıyla gelir.", "tags": ["pandas_temel"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>ham.info()<\/code> 7 satırlık tabloda <code>station_name<\/code> için \"5 non-null\" gösteriyor. Bu ne demek?", "opts": ["5 farklı istasyon var", "2 satırda istasyon adı boş", "İlk 5 satır okunmuş", "5 satırda ad tekrar ediyor"], "a": 1, "why": "non-null = dolu değer. 7 satırdan 5'i dolu, demek ki 2'si boş (NaN).", "tags": ["pandas_temel", "fillna"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>ham[[\"town\"]]<\/code> (iki köşeli parantez) ne döndürür?", "opts": ["Series", "DataFrame", "list", "str"], "a": 1, "why": "Dıştaki köşeli parantez seçim, içteki bir <b>liste<\/b>. Sütun listesi verince, tek elemanlı bile olsa, sonuç DataFrame olur. <code>ham[\"town\"]<\/code> ise Series.", "tags": ["pandas_temel"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "Bu kod ne yazdırır? (<code>ham<\/code>'ın index'i 0'dan 6'ya)", "opts": ["4 3", "3 3", "4 4", "3 4"], "a": 0, "why": "<code>.loc[1:4]<\/code> etiket 1, 2, 3, 4'ü alır (sonu dahil). <code>.iloc[1:4]<\/code> konum 1, 2, 3'ü alır (sonu hariç).", "tags": ["loc"], "code": "print(len(ham.loc[1:4]), len(ham.iloc[1:4]))", "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "İki koşulu birleştirmenin doğru yolu hangisi?", "opts": ["df[df[\"a\"] > 1 and df[\"b\"] < 5]", "df[(df[\"a\"] > 1) & (df[\"b\"] < 5)]", "df[df[\"a\"] > 1 & df[\"b\"] < 5]", "df[(df[\"a\"] > 1) and (df[\"b\"] < 5)]"], "a": 1, "why": "pandas'ta <code>and<\/code> yerine <code>&amp;<\/code> kullanılır ve her koşul parantez içinde yazılır.", "tags": ["maske"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "fill", "q": "İstasyon adı <b>dolu<\/b> olan satırları seç.", "code": "dolu = ham[___ham[\"station_name\"].isna()]", "a": [["~"]], "why": "<code>~<\/code> maskeyi tersine çevirir: True'lar False, False'lar True olur. <code>ham[\"station_name\"].notna()<\/code> da aynı işi görür.", "tags": ["maske", "fillna"], "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Hangi satır tabloyu <b>gerçekten<\/b> değiştirir?", "opts": ["df[maske][\"town\"] = \"EyüpSultan\"", "df[\"town\"][maske] = \"EyüpSultan\"", "df.loc[maske, \"town\"] = \"EyüpSultan\"", "df[maske].town = \"EyüpSultan\""], "a": 2, "why": "Satır ve sütun tek bir <code>.loc[...]<\/code> içinde verilince atama asıl tabloya yapılır. Diğerleri önce bir ara sonuç üretip ona yazar.", "tags": ["loc"], "code": null, "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "fill", "q": "ÇIRÇIR DOĞU istasyonunun ilçesini düzelt.", "code": "ham.___[ham[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"___\"] = \"EyüpSultan\"", "a": [["loc"], ["town"]], "why": "<code>.loc[satır_maskesi, \"sütun\"]<\/code>: değişecek sütun <code>town<\/code>.", "tags": ["loc", "maske"], "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "fill", "q": "Cumartesi ve Pazar için True olan sütunu oluştur (Pazartesi=0).", "code": "df[\"is_weekend\"] = df[\"date\"].___.weekday >= ___", "a": [["dt"], ["5"]], "why": "Tarih araçları <code>.dt<\/code> altında; Cumartesi 5, Pazar 6.", "tags": ["tarih"], "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "<code>pd.Timestamp(\"2025-03-09\")<\/code> bir Pazar günü. <code>.weekday()<\/code> kaç verir?", "opts": ["0", "5", "6", "7"], "a": 2, "why": "Pazartesi 0'dan başlar: Cumartesi 5, Pazar 6.", "tags": ["tarih"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Hangisi <b>DataFrame<\/b> döndürür?", "opts": ["ham[\"town\"]", "ham[[\"town\"]]", "ham.loc[0, \"town\"]", "ham[\"town\"].isna()"], "a": 1, "why": "Sütun <b>listesi<\/b> verince sonuç DataFrame olur. Tek sütun adı Series, tek hücre ise tek bir değer verir.", "tags": ["pandas_temel"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "<code>ham.head()<\/code> (içi boş) kaç satır gösterir?", "opts": ["1", "3", "5", "Hepsini"], "a": 2, "why": "Sayı vermezsen <code>head<\/code> ilk 5 satırı gösterir. <code>head(3)<\/code> ilk 3'ü.", "tags": ["pandas_temel"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Koordinat ve numara sütunlarını sil, sonucu yine <code>ham<\/code>'a ata.", "code": "ham = ham.___(columns=[\"longitude\", \"latitude\", \"station_number\"])", "a": [["drop"]], "why": "<code>drop(columns=[...])<\/code> yeni bir tablo döndürür; <code>ham = ...<\/code> ile saklarsın.", "tags": ["pandas_temel"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır? (<code>ham<\/code> başta 12 sütunlu)", "opts": ["12", "10", "2", "Hata verir"], "a": 0, "why": "<code>drop<\/code> yeni bir tablo döndürdü ama onu bir isme atamadık. <code>ham<\/code> hâlâ 12 sütunlu.", "tags": ["pandas_temel"], "code": "ham.drop(columns=[\"longitude\", \"latitude\"])\nprint(ham.shape[1])", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır? (Kadıköy satırlarının yolcuları: 1260, 214, 330)", "opts": ["1804", "1474", "3", "4636"], "a": 0, "why": "Maske Kadıköy'deki üç satırı seçer; <code>.loc[maske, \"passanger_cnt\"]<\/code> o satırların yolcu sütununu verir; <code>sum()<\/code> toplar: 1260 + 214 + 330.", "tags": ["loc", "maske"], "code": "print(ham.loc[ham[\"town\"] == \"Kadıköy\", \"passanger_cnt\"].sum())", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>ham<\/code> tablosunda <code>longitude<\/code>, <code>latitude<\/code>, <code>station_number<\/code> sütunlarını sil, sonra yıl/ay/gün'den <code>date<\/code> sütunu oluştur.", "starter": "# ham tablosu hazır. İlk satırlarına bak:\nprint(ham.head(3))\n\n", "sol": "ham = ham.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\nham[\"date\"] = pd.to_datetime(dict(year=ham.transaction_year, month=ham.transaction_month, day=ham.transaction_day))", "test": "assert \"longitude\" not in ham.columns and \"station_number\" not in ham.columns, \"Koordinat/numara sütunları hâlâ duruyor\"\nassert \"date\" in ham.columns, \"date sütunu yok\"\nassert str(ham[\"date\"].iloc[0].date()) == \"2025-03-03\", \"İlk satırın tarihi 2025-03-03 olmalı\"", "hint": "<code>ham = ham.drop(columns=[...])<\/code>; sonucu tekrar <code>ham<\/code>'a atamayı unutma. Tarih için <code>pd.to_datetime(dict(year=..., month=..., day=...))<\/code>.", "tags": ["pandas_temel", "tarih"], "setup": ["ham"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>yolcu<\/code> tablosunda (99 satır) ilçesi <code>\"Kadıköy\"<\/code> olan <b>ve<\/b> hafta sonuna denk gelen satır sayısını bul, <code>sayi<\/code>'ya ata. <code>is_weekend<\/code> sütunu zaten True/False.", "starter": "kadikoy = yolcu[\"town\"] == \"Kadıköy\"\nsayi = 0\nprint(sayi)\n", "sol": "kadikoy = yolcu[\"town\"] == \"Kadıköy\"\nsayi = len(yolcu[kadikoy & yolcu[\"is_weekend\"]])\nprint(sayi)\n", "test": "assert sayi == 9, f\"sayi 9 olmalı, şu an {sayi}\"", "hint": "İki maskeyi <code>&amp;<\/code> ile birleştir: <code>yolcu[kadikoy &amp; yolcu[\"is_weekend\"]]<\/code>, sonra <code>len(...)<\/code>. Maskenin <code>.sum()<\/code>'ı da aynı sayıyı verir.", "tags": ["maske"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> T3 satırının boş istasyon adı <code>\"Kadıköy-Moda T3\"<\/code> olmalı. Kod hata vermiyor ama tablo değişmiyor. Düzelt.", "starter": "bos = ham[\"station_name\"].isna()\nham[bos & (ham[\"line\"] == \"T3-KADIKOY-MODA\")][\"station_name\"] = \"Kadıköy-Moda T3\"\nprint(ham[\"station_name\"].tolist())\n", "sol": "bos = ham[\"station_name\"].isna()\nham.loc[bos & (ham[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"\nprint(ham[\"station_name\"].tolist())\n", "test": "_t3 = ham.loc[ham[\"line\"] == \"T3-KADIKOY-MODA\", \"station_name\"].tolist()\nassert _t3 == [\"Kadıköy-Moda T3\"], f\"T3 satırının adı: {_t3}\"\nassert ham[\"station_name\"].isna().sum() == 1, \"Yalnızca T3 satırı değişmeliydi (nostaljik tramvay boş kalmalı)\"", "hint": "Zincirleme atama kopyaya yazar. Satır maskesini ve sütunu tek bir <code>.loc[maske, \"station_name\"]<\/code> içinde ver.", "tags": ["loc", "maske"], "setup": ["ham"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Kadıköy'deki <b>ve<\/b> 1000'den fazla yolcusu olan satırları seçmek istiyoruz, ama kod hata veriyor. Düzelt.", "starter": "secim = ham[ham[\"town\"] == \"Kadıköy\" & ham[\"passanger_cnt\"] > 1000]\nprint(secim[\"station_name\"].tolist())\n", "sol": "secim = ham[(ham[\"town\"] == \"Kadıköy\") & (ham[\"passanger_cnt\"] > 1000)]\nprint(secim[\"station_name\"].tolist())\n", "test": "assert secim[\"station_name\"].tolist() == [\"Kadıköy (Doğu)\"], f\"Seçilen istasyonlar: {secim['station_name'].tolist()}\"", "hint": "<code>&amp;<\/code>, <code>==<\/code> ve <code>&gt;<\/code>'dan önce hesaplanıyor. Her koşulu ayrı parantez içine al.", "tags": ["maske"], "setup": ["ham"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "order", "q": "Satırları sıraya koy: dosyayı oku, tarih kur, hafta sonunu işaretle, hafta sonu yolcu toplamını yazdır.", "lines": ["df = pd.read_csv(\"yolcu.csv\", sep=\";\", encoding=\"utf-8-sig\")", "df[\"date\"] = pd.to_datetime(dict(year=df.transaction_year, month=df.transaction_month, day=df.transaction_day))", "df[\"is_weekend\"] = df[\"date\"].dt.weekday >= 5", "hafta_sonu = df[df[\"is_weekend\"]]", "print(hafta_sonu[\"passanger_cnt\"].sum())"], "why": "Her satır bir öncekinin ürettiği şeyi kullanıyor: date olmadan is_weekend, is_weekend olmadan hafta_sonu olmaz.", "tags": ["tarih", "maske", "pandas_temel"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>ham<\/code>'da tarih sütunu yok. Önce <code>date<\/code> sütununu kur, sonra <b>hafta sonuna<\/b> denk gelen satırların <code>passanger_cnt<\/code> toplamını <code>hafta_sonu_yolcu<\/code>'ya ata. Hafta sonunu tarihten bul (<code>.dt.weekday<\/code>).", "starter": "hafta_sonu_yolcu = 0\nprint(hafta_sonu_yolcu)\n", "sol": "ham[\"date\"] = pd.to_datetime(dict(year=ham.transaction_year, month=ham.transaction_month, day=ham.transaction_day))\nhafta_sonu_yolcu = ham.loc[ham[\"date\"].dt.weekday >= 5, \"passanger_cnt\"].sum()\nprint(hafta_sonu_yolcu)\n", "test": "assert hafta_sonu_yolcu == 1660, f\"hafta_sonu_yolcu 1660 olmalı, şu an {hafta_sonu_yolcu}\"\nassert \"weekday\" in __kod__ or \"day_name\" in __kod__, \"Hafta sonunu tarihten bul: .dt.weekday ya da .dt.day_name()\"", "hint": "Üç adım: <code>ham[\"date\"] = pd.to_datetime(dict(...))<\/code>, maske <code>ham[\"date\"].dt.weekday &gt;= 5<\/code>, sonra <code>ham.loc[maske, \"passanger_cnt\"].sum()<\/code>.", "tags": ["tarih", "loc", "maske"], "setup": ["ham"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır? (<code>station_name<\/code> 2 satırda boş: T3 ve Beyoğlu'ndaki nostaljik tramvay)", "opts": ["6", "5", "7", "1"], "a": 0, "why": "<code>~bos<\/code> dolu olan 5 satırı seçer. <code>|<\/code> \"veya\" olduğu için Beyoğlu satırı da eklenir; o satırın adı boş olsa bile. 5 + 1 = 6.", "tags": ["maske"], "code": "bos = ham[\"station_name\"].isna()\nprint(len(ham[~bos | (ham[\"town\"] == \"Beyoğlu\")]))", "rev": false, "zorluk": 3, "yer": "al"}, {"t": "code", "q": "<b>Ham veriyi temizle.<\/b> <code>clean_data.py<\/code>'nin ilk yarısını <code>ham<\/code> tablosu üzerinde yeniden yaz. Sonunda <code>ham<\/code>:<ol><li><code>longitude<\/code>, <code>latitude<\/code>, <code>station_number<\/code> sütunlarını içermesin;<\/li><li>yıl/ay/gün'den kurulmuş bir <code>date<\/code> sütunu,<\/li><li>gün adını tutan <code>weekday<\/code> (<code>\"Monday\"<\/code>…) ve Cumartesi/Pazar için True olan <code>is_weekend<\/code> sütunları olsun;<\/li><li>istasyon adı boş olan <code>T3-KADIKOY-MODA<\/code> satırı <code>\"Kadıköy-Moda T3\"<\/code>, <code>IETT NOSTALJIK TRAMVAY<\/code> satırı <code>\"Taksim-Tünel Nostaljik Tramvay\"<\/code> olsun;<\/li><li><code>ÇIRÇIR DOĞU<\/code> istasyonunun ilçesi <code>\"EyüpSultan\"<\/code> olsun.<\/li><\/ol>Satır sayısı değişmemeli, diğer değerlere dokunulmamalı.", "starter": "# ham tablosu hazır (temizlenmemiş, 7 satır). Önce bak:\nprint(ham[[\"line\", \"station_name\", \"town\"]])\n\n# 1) koordinat ve numara sütunlarını sil\n# 2) date sütunu\n# 3) weekday ve is_weekend\n# 4) boş istasyon adları (T3 ve nostaljik tramvay)\n# 5) ÇIRÇIR DOĞU'nun ilçesi\n", "sol": "ham = ham.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\nham[\"date\"] = pd.to_datetime(dict(year=ham.transaction_year, month=ham.transaction_month, day=ham.transaction_day))\nham[\"weekday\"] = ham[\"date\"].dt.day_name()\nham[\"is_weekend\"] = ham[\"date\"].dt.weekday >= 5\n\nbos_istasyon = ham[\"station_name\"].isna()\nham.loc[bos_istasyon & (ham[\"line\"] == \"T3-KADIKOY-MODA\"), \"station_name\"] = \"Kadıköy-Moda T3\"\nham.loc[bos_istasyon & (ham[\"line\"] == \"IETT NOSTALJIK TRAMVAY\"), \"station_name\"] = \"Taksim-Tünel Nostaljik Tramvay\"\nham.loc[ham[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"town\"] = \"EyüpSultan\"\n\nprint(ham[[\"station_name\", \"town\", \"weekday\", \"is_weekend\"]])\n", "test": "assert len(ham) == 7, f\"Satır sayısı 7 kalmalı, şu an {len(ham)}\"\nfor _s in [\"longitude\", \"latitude\", \"station_number\"]:\n    assert _s not in ham.columns, f\"{_s} sütunu hâlâ duruyor\"\nassert \"date\" in ham.columns, \"date sütunu yok\"\nassert ham[\"date\"].iloc[0] == pd.Timestamp(\"2025-03-03\") and ham[\"date\"].iloc[5] == pd.Timestamp(\"2025-10-06\"), \"date sütunu yıl/ay/gün'den doğru kurulmamış\"\nassert \"weekday\" in ham.columns, \"weekday sütunu yok\"\nassert ham[\"weekday\"].tolist() == [\"Monday\", \"Monday\", \"Saturday\", \"Saturday\", \"Saturday\", \"Monday\", \"Monday\"], \"weekday gün adlarını tutmalı (.dt.day_name())\"\nassert \"is_weekend\" in ham.columns, \"is_weekend sütunu yok\"\nassert [bool(_x) for _x in ham[\"is_weekend\"]] == [False, False, True, True, True, False, False], \"is_weekend yalnızca Cumartesi ve Pazar için True olmalı\"\n_adlar = ham[\"station_name\"].tolist()\nassert _adlar[3] == \"Kadıköy-Moda T3\", f\"T3 satırının adı: {_adlar[3]!r}\"\nassert _adlar[4] == \"Taksim-Tünel Nostaljik Tramvay\", f\"Nostaljik tramvay satırının adı: {_adlar[4]!r}\"\nassert _adlar == [\"Kadıköy (Doğu)\", \"Kozyatağı\", \"Üsküdar 1\", \"Kadıköy-Moda T3\", \"Taksim-Tünel Nostaljik Tramvay\", \"ÇIRÇIR DOĞU\", \"Kağıthane\"], f\"Diğer istasyon adları değişmemeli: {_adlar}\"\n_ilce = ham[\"town\"].tolist()\nassert _ilce[5] == \"EyüpSultan\", f\"ÇIRÇIR DOĞU'nun ilçesi: {_ilce[5]!r}\"\nassert _ilce == [\"Kadıköy\", \"Kadıköy\", \"Üsküdar\", \"Kadıköy\", \"Beyoğlu\", \"EyüpSultan\", \"Kağıthane\"], f\"Diğer ilçeler değişmemeli: {_ilce}\"", "hint": "Sırayla: <code>ham = ham.drop(columns=[...])<\/code> → <code>pd.to_datetime(dict(year=..., month=..., day=...))<\/code> → <code>.dt.day_name()<\/code> ve <code>.dt.weekday &gt;= 5<\/code> → <code>bos = ham[\"station_name\"].isna()<\/code> ve iki <code>ham.loc[bos &amp; (ham[\"line\"] == \"...\"), \"station_name\"] = \"...\"<\/code> → <code>ham.loc[ham[\"station_name\"] == \"ÇIRÇIR DOĞU\", \"town\"] = \"EyüpSultan\"<\/code>.", "tags": ["pandas_temel", "tarih", "maske", "loc"], "setup": ["ham"], "rev": false, "why": "Bu adımlar <code>clean_data.py<\/code>'nin ilk yarısıyla birebir aynı. Yaş kategorisi ve hat kodu gibi kalan dönüşümleri 8. durakta ekleyeceksin.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>df[\"town\"]<\/code> ne döndürür?", "opts": ["DataFrame", "Series", "list", "str"], "a": 1, "why": "Tek köşeli parantez + tek sütun adı → Series. <code>df[[\"town\"]]<\/code> ise DataFrame.", "tags": ["pandas_temel"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>df[\"date\"].dt.weekday<\/code> Pazartesi için kaç verir?", "opts": ["1", "0", "7", "\"Monday\""], "a": 1, "why": "Pazartesi 0, Pazar 6.", "tags": ["tarih"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>.loc[0:2]<\/code> ile <code>.iloc[0:2]<\/code> arasındaki fark nedir?", "opts": ["Fark yok", ".loc sonu dahil eder (3 satır), .iloc etmez (2 satır)", ".iloc sonu dahil eder", ".loc yalnızca sütun seçer"], "a": 1, "why": "<code>.loc<\/code> etiketle ve sonu dahil, <code>.iloc<\/code> konumla ve sonu hariç çalışır.", "tags": ["loc"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "Maskelerde \"değil\" için hangi işaret kullanılır?", "opts": ["!", "not", "~", "-"], "a": 2, "why": "<code>~maske<\/code> True'ları False, False'ları True yapar. <code>not<\/code> Series üzerinde hata verir.", "tags": ["maske"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"sonra": 7, "id": "t2", "no": 2, "tur": "tekrar", "baslik": "Tekrar durağı 2", "aralik": [3, 4, 5, 6, 7], "adet": 8, "ozet": "Fonksiyonlardan pandas'a: 3–7. duraklar, en çok zorlandığın konular önce."}, {"id": "b8", "no": 8, "tur": "ders", "baslik": "pandas 2: dönüştürmek", "hat": "M8", "ozet": "Metin sütunları (.str), değer düzeltme (replace, fillna, astype), sıralı kategori, value_counts, melt ↔ pivot ve to_csv: clean_data.py'nin sonu ve clean_trips.py.", "dosya": "clean_data.py · clean_trips.py", "proje": "# clean_data.py (son kısım)\ndf[\"age\"] = df[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})\nyas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\ndf[\"age\"] = pd.Categorical(df[\"age\"], categories=yas_sirasi, ordered=True)\ndf[\"line_code\"] = df[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0].fillna(df[\"line\"])\ndf[\"line_code\"] = df[\"line_code\"].replace({\n    \"TCDD TASIMACILIK A.S.\": \"Marmaray\",\n    \"TCDD - GAYRETTEPE-ISTANBUL YENI HAVALIMANI\": \"M11\",\n    })\ndf.to_csv(\"passenger_clean.csv\", index=False, sep=\";\", encoding=\"utf-8-sig\")\n\n# clean_trips.py\nsefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun = sefer_uzun.dropna(subset=[\"sefer_sayisi\"])\nsefer_uzun[\"sefer_sayisi\"] = sefer_uzun[\"sefer_sayisi\"].astype(int)\nsefer_uzun.to_csv(\"trips_clean.csv\", index=False, sep=\";\", encoding=\"utf-8-sig\")", "adimlar": [{"baslik": "Metin sütunları: .str yöntemleri", "html": "\n<p>Bir sütundaki her metne aynı işlemi yapmak için döngü yazmana gerek yok. Metin sütunlarının <code>.str<\/code> adında bir araç kutusu var;\nPython'un metin yöntemlerini bütün sütuna tek seferde uygular.<\/p>\n<pre class=\"py\">ham[\"line\"].str.upper()                    # hepsi büyük harf\nham[\"line\"].str.contains(\"TCDD\")           # her satır için True / False\nham[\"line\"].str.replace(\"-\", \" \")          # metnin İÇİNDEKİ parçayı değiştirir\nham[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")   # desene uyan parçayı çeker<\/pre>\n<h3>str.extract ile hat kodu<\/h3>\n<p>Projende hat kodunu hattın uzun adından çekiyorsun. Desen şunu arar: satır başında (<code>^<\/code>) bir ya da daha çok büyük harf\n(<code>[A-Z]+<\/code>), hemen ardından rakamlar (<code>\\d+<\/code>). Parantezin içi <b>yakalanacak grup<\/b>tur.<\/p>\n<pre class=\"py\">line                         extract(...)[0]\nM4-KADIKOY-TAVSANTEPE   →    M4\nT3-KADIKOY-MODA         →    T3\nTCDD TASIMACILIK A.S.   →    NaN   (desene uymuyor)\nIETT NOSTALJIK TRAMVAY  →    NaN<\/pre>\n<p><code>extract<\/code> her zaman bir <b>DataFrame<\/b> döndürür; her grup bir sütun olur. Senin tek grubun var, onu <code>[0]<\/code> ile Series olarak alıyorsun.\nDesene uymayan satırlar NaN olur. Sen de onları <code>.fillna(df[\"line\"])<\/code> ile hattın tam adıyla dolduruyorsun.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>df[\"line\"].upper()<\/code> yazarsan <code>AttributeError<\/code> alırsın: <code>upper<\/code> tek bir metnin yöntemidir, Series'in değil.\n<code>.str<\/code> \"bu yöntemi her hücreye ayrı ayrı uygula\" demektir. Boş (NaN) hücrelere dokunmaz, hata da vermez; sonuçta onlar yine boş kalır.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Boş hücresi olan bir sütunda <code>str.contains<\/code> ile maske yapmak. Bazı pandas sürümlerinde boş satırlar\nTrue/False yerine NaN döner ve <code>df[maske]<\/code> hata verir. Güvenli yol: <code>df[\"station_name\"].str.contains(\"Kadıköy\", na=False)<\/code>.\nBir de Türkçe harf uyarısı: <code>\"Şişli\".upper()<\/code> sonucu <code>\"ŞIŞLI\"<\/code> olur, <code>\"ŞİŞLİ\"<\/code> değil.<\/div>\n", "ornek": "kod = ham[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0]\nprint(kod.tolist())\nprint(kod.fillna(ham[\"line\"]).tolist())\n\nprint(ham[\"line\"].str.contains(\"TCDD\").sum(), \"satırda TCDD geçiyor\")\nprint(ham[\"station_name\"].str.upper().tolist())", "ornek_setup": ["ham"]}, {"baslik": "Değerleri düzeltmek: replace, fillna, astype", "html": "\n<p>Temizliğin büyük kısmı \"şu değeri şuna çevir\" işidir. Projende üç araç bu işi görüyor:<\/p>\n<pre class=\"py\">df[\"age\"] = df[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})   # değer → değer\nkod = kod.fillna(df[\"line\"])                              # boşları doldur\nuzun[\"sefer_sayisi\"] = uzun[\"sefer_sayisi\"].astype(int)   # tipi değiştir<\/pre>\n<h3>replace ile str.replace farkı<\/h3>\n<p><code>replace<\/code> hücrenin <b>tamamı<\/b> eşleşirse değiştirir. Sözlük verirsen birden çok düzeltmeyi tek seferde yaparsın;\n\"TCDD TASIMACILIK A.S.\" → \"Marmaray\" düzeltmen böyle. <code>str.replace<\/code> ise metnin <b>içindeki<\/b> parçayı değiştirir:<\/p>\n<pre class=\"py\">s = pd.Series([\"M2\", \"M2-YENIKAPI\"])\ns.replace({\"M2\": \"X\"})        # ['X', 'M2-YENIKAPI']   tam eşleşme\ns.str.replace(\"M2\", \"X\")      # ['X', 'X-YENIKAPI']    parça<\/pre>\n<h3>fillna: sabit değerle ya da başka bir sütunla<\/h3>\n<p><code>fillna(0)<\/code> her boşluğa 0 koyar. <code>fillna(df[\"line\"])<\/code> ise her boş hücreyi <b>aynı satırdaki<\/b> <code>line<\/code> değeriyle doldurur;\npandas satırları index'e göre eşleştirir.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Sonucu geri atamamak. <code>df[\"age\"].replace({...})<\/code> tek başına yeni bir Series üretir ama onu hiçbir yere koymaz;\n<code>df<\/code> değişmez. Doğrusu <code>df[\"age\"] = df[\"age\"].replace({...})<\/code>. <code>fillna<\/code>, <code>astype<\/code>, <code>dropna<\/code> ve\n<code>sort_values<\/code> için de durum aynı.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>astype(int)<\/code> boş hücre varken hata verir, çünkü tam sayı tipinde NaN diye bir değer yok.\nBu yüzden <code>clean_trips.py<\/code>'de önce <code>dropna(subset=[\"sefer_sayisi\"])<\/code>, sonra <code>astype(int)<\/code> geliyor. <code>subset<\/code> yalnızca\no sütuna bakar; başka sütunlardaki boşluklar yüzünden satır silinmez.<\/div>\n", "ornek": "import pandas as pd\n\ns = pd.Series([\"M2\", \"M2-YENIKAPI\", \"TCDD TASIMACILIK A.S.\"])\nprint(s.replace({\"TCDD TASIMACILIK A.S.\": \"Marmaray\"}).tolist())\nprint(s.str.replace(\"M2\", \"X\").tolist())\n\nsefer_sayisi = pd.Series([14200.0, None, 3000.0])\nprint(sefer_sayisi.fillna(0).astype(int).tolist())\nprint(sefer_sayisi.dropna().astype(int).tolist())", "ornek_setup": []}, {"baslik": "Sıralı kategori: Categorical", "html": "\n<p>Yaş grupları düz metin olarak durursa pandas onları <b>alfabetik<\/b> sıralar. Karakter tablosunda \"&lt;\" işareti rakamlardan sonra geldiği için sıra bozulur:<\/p>\n<pre class=\"py\">sorted([\"&lt;20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"])\n# ['20-30', '30-60', '60+', '&lt;20', 'Bilinmiyor']   → \"&lt;20\" üç grubun arkasına düştü<\/pre>\n<p>Çözüm, sütunu <b>kategori<\/b>ye çevirip sırayı kendin belirlemek:<\/p>\n<pre class=\"py\">yas_sirasi = [\"&lt;20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\ndf[\"age\"] = pd.Categorical(df[\"age\"], categories=yas_sirasi, ordered=True)<\/pre>\n<p>Artık <code>sort_values()<\/code>, <code>groupby<\/code> ve grafikler bu sırayı izler. <code>ordered=True<\/code> karşılaştırmayı da anlamlı kılar:\n<code>df[\"age\"] &lt; \"60+\"<\/code> 60 yaş altındaki grupları seçer.<\/p>\n<h3>value_counts: kaç tane, yüzde kaç?<\/h3>\n<pre class=\"py\">df[\"age\"].value_counts()                 # her değerden kaç satır (çoktan aza)\ndf[\"age\"].value_counts(normalize=True)   # oran; toplamı 1\ndf[\"age\"].value_counts(sort=False)       # kategori sırasıyla<\/pre>\n<p>Kategori sütununda veride hiç olmayan gruplar da 0 ile listelenir. Hangi grubun eksik olduğunu böyle görürsün.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Kategoriye çevirmeden önce yazım hatalarını düzeltmemek. <code>categories<\/code> listesinde olmayan bir değer\n(ör. \"Unkown\") sessizce <b>NaN<\/b> olur; yeni pandas sürümleri buna bir de uyarı ekler. Projende önce <code>replace<\/code>, sonra <code>Categorical<\/code>\ngelmesinin sebebi bu. Sıra ters olsaydı \"Bilinmiyor\" grubu boş kalırdı.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Kategori, pandas'a \"bu sütunun alabileceği değerler bunlar ve sıraları bu\" bilgisini verir. Grafikte yaş çubuklarının\n&lt;20'den 60+'ya doğru dizilmesi bu bilgiden gelir. Kategori sütunuyla gruplarken <code>observed=True<\/code> yaz\n(<code>groupby(\"age\", observed=True)<\/code>); böylece sürümden sürüme değişen varsayılan davranışa takılmazsın. Not defterinde de böyle yazmışsın.<\/div>\n", "ornek": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nprint(sorted(yolcu[\"age\"].unique()))          # alfabetik\n\nyolcu[\"age\"] = pd.Categorical(yolcu[\"age\"], categories=yas_sirasi, ordered=True)\nprint(yolcu[\"age\"].value_counts(sort=False))\nprint(yolcu[\"age\"].value_counts(normalize=True).round(2))\nprint((yolcu[\"age\"] < \"60+\").sum(), \"satır 60 yaş altında\")", "ornek_setup": ["yolcu"]}, {"baslik": "Geniş ↔ uzun: melt ve pivot", "html": "\n<p>Sefer dosyası <b>geniş<\/b> biçimde: her hat ayrı bir sütun. Göz için rahat, ama yolcu tablosuyla birleştirmek ya da hatlara göre gruplamak için\n<b>uzun<\/b> biçim gerekir: bir sütunda hat adı, bir sütunda değer.<\/p>\n<pre class=\"py\">GENİŞ (sefer, kısaltılmış)           UZUN (sefer_uzun)\nTarih       M2     M4     TF1         Tarih       line_code  sefer_sayisi\n2025-03-01  14200  12100  3000   →    2025-03-01  M2         14200\n2025-10-01  14800  12600  NaN         2025-10-01  M2         14800\n                                      2025-03-01  M4         12100\n                                      2025-10-01  M4         12600\n                                      2025-03-01  TF1        3000\n                                      2025-10-01  TF1        NaN<\/pre>\n<pre class=\"py\">sefer_uzun = sefer.melt(id_vars=\"Tarih\",            # olduğu gibi kalacak sütun\n                        var_name=\"line_code\",       # eski sütun adları buraya\n                        value_name=\"sefer_sayisi\")  # hücre değerleri buraya<\/pre>\n<p>Satır sayısı = tarih sayısı × hat sütunu sayısı. Sonra <code>dropna(subset=[\"sefer_sayisi\"])<\/code> ile boş olanlar atılır.<\/p>\n<h3>Tersine: pivot<\/h3>\n<p><code>pivot<\/code> uzun tabloyu yeniden genişletir; <code>melt<\/code>'in tersidir:<\/p>\n<pre class=\"py\">geri = sefer_uzun.pivot(index=\"Tarih\", columns=\"line_code\", values=\"sefer_sayisi\")<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>id_vars<\/code>'ı unutmak. O zaman <code>Tarih<\/code> da \"eriyen\" sütunlardan biri olur: tarihler ile sefer sayıları\naynı değer sütununa karışır ve hangi sayının hangi güne ait olduğu kaybolur.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> Uzun biçimde her satır tek bir gözlemdir: \"şu tarihte, şu hatta, şu kadar sefer\". <code>groupby<\/code>, <code>merge<\/code> ve\ngrafik araçları bu biçimi bekler. Veriye yeni bir hat eklendiğinde kodun değişmez; yalnızca satır sayısı artar.<\/div>\n", "ornek": "print(sefer)\nuzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nprint(uzun.shape)            # 3 tarih × 4 hat = 12 satır\n\nuzun = uzun.dropna(subset=[\"sefer_sayisi\"])\nuzun[\"sefer_sayisi\"] = uzun[\"sefer_sayisi\"].astype(int)\nprint(uzun.head())\n\ngeri = uzun.pivot(index=\"Tarih\", columns=\"line_code\", values=\"sefer_sayisi\")\nprint(geri)                  # attığın boş hücre NaN olarak geri geldi", "ornek_setup": ["sefer"]}, {"baslik": "Sonucu kaydetmek: to_csv", "html": "\n<p>Temizlik bitince sonucu dosyaya yazarsın. Analiz defteri her seferinde ham veriyle uğraşmak yerine temiz dosyayı okur. Projendeki satır:<\/p>\n<pre class=\"py\">df.to_csv(\"passenger_clean.csv\", index=False, sep=\";\", encoding=\"utf-8-sig\")<\/pre>\n<ul>\n<li><code>index=False<\/code>: 0, 1, 2… satır numaralarını dosyaya yazma.<\/li>\n<li><code>sep=\";\"<\/code>: sütunları noktalı virgülle ayır. Türkçe Excel ondalık için virgül kullandığından noktalı virgül daha güvenli.<\/li>\n<li><code>encoding=\"utf-8-sig\"<\/code>: dosyanın başına küçük bir işaret (BOM) koyar; Excel bunu görünce \"Kadıköy\"deki ö'yü doğru okur.<\/li>\n<\/ul>\n<p>Dosya adı vermezsen <code>to_csv<\/code> metni <b>döndürür<\/b>. Dosyaya ne yazılacağını görmek için kullanışlı:<\/p>\n<pre class=\"py\">print(uzun.head(2).to_csv(index=False, sep=\";\"))\n# Tarih;line_code;sefer_sayisi\n# 2024-03-01;M2;13900\n# 2025-03-01;M2;14200<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>index=False<\/code>'u unutmak. Dosyaya fazladan bir sütun yazılır; geri okuduğunda <code>Unnamed: 0<\/code> adlı\nanlamsız bir sütunla karşılaşırsın. Okurken de yazarken kullandığın <code>sep<\/code>'i ver: noktalı virgülle yazıp virgülle okursan her satır tek sütuna sıkışır.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> CSV düz metindir; \"bu sütun tarihti\" ya da \"bu sütun sıralı kategoriydi\" bilgisini taşımaz. Bu yüzden not defterinin\nilk hücresinde <code>parse_dates=[\"date\"]<\/code> ile tarihi, <code>pd.Categorical(...)<\/code> ile yaş sırasını <b>yeniden<\/b> kuruyorsun.<\/div>\n", "ornek": "import io\n\nuzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nuzun = uzun.dropna(subset=[\"sefer_sayisi\"])\nuzun[\"sefer_sayisi\"] = uzun[\"sefer_sayisi\"].astype(int)\nkucuk = uzun.head(3)\n\nmetin = kucuk.to_csv(index=False, sep=\";\")\nprint(metin)\nprint(kucuk.to_csv(sep=\";\"))     # index=False olmadan: baştaki fazladan sütun\n\ngeri = pd.read_csv(io.StringIO(metin), sep=\";\", parse_dates=[\"Tarih\"])\nprint(geri.columns.tolist(), geri.shape)", "ornek_setup": ["sefer"]}], "sorular": [{"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["T", "TF1", "TF", "NaN"], "a": 1, "why": "<code>[A-Z]+<\/code> \"TF\"yi, <code>\\d+<\/code> \"1\"i yakalar; grup ikisini birlikte tutar.", "tags": ["regex", "pandas_metin"], "code": "s = pd.Series([\"TF1-MACKA-TASKISLA\"])\nkod = s.str.extract(r\"^([A-Z]+\\d+)\")[0]\nprint(kod[0])", "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>ham[\"line\"].upper()<\/code> neden hata verir?", "opts": ["Series'in upper yöntemi yok; .str.upper() gerekir", "Sütunda sayılar var", "upper yalnızca Türkçe harflerle çalışır", "Önce astype(str) yapmak gerekir"], "a": 0, "why": "Metin yöntemleri tek bir metin içindir. Sütunun her hücresine uygulamak için araya <code>.str<\/code> girer.", "tags": ["pandas_metin"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["['X', 'M2-YENIKAPI']", "['X', 'X-YENIKAPI']", "['M2', 'M2-YENIKAPI']", "hata verir"], "a": 0, "why": "<code>replace<\/code> yalnızca hücrenin tamamı \"M2\" olan satırı değiştirir. Parçayı değiştirmek için <code>str.replace<\/code> gerekirdi.", "tags": ["fillna", "pandas_metin"], "code": "s = pd.Series([\"M2\", \"M2-YENIKAPI\"])\nprint(s.replace({\"M2\": \"X\"}).tolist())", "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "fill", "q": "Boşlukları doldur: hat kodu çıkmayan satırları hattın tam adıyla doldur, sonra sefer sayısı boş olan satırları at.", "code": "kod = df[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0].___(df[\"line\"])\nuzun = uzun.___(subset=[\"sefer_sayisi\"])", "a": [["fillna"], ["dropna"]], "why": "<code>fillna<\/code> boşları doldurur, <code>dropna(subset=...)<\/code> o sütunu boş olan satırları atar.", "tags": ["fillna"], "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>categories<\/code> listesinde olmayan \"Unkown\" değeri <code>pd.Categorical<\/code> sonrası ne olur?", "opts": ["Listenin sonuna eklenir", "NaN olur", "Kendiliğinden Bilinmiyor olur", "Satır silinir"], "a": 1, "why": "Kategori yalnızca listedeki değerleri tutabilir; geri kalanı boş (NaN) olur. Önce <code>replace<\/code>, sonra <code>Categorical<\/code>.", "tags": ["kategori"], "code": null, "rev": false, "zorluk": 2, "yer": "a2"}, {"t": "mc", "q": "<code>value_counts(normalize=True)<\/code> ne döndürür?", "opts": ["Her değerin satır sayısını", "Her değerin oranını (toplamı 1)", "Yalnızca en sık değeri", "Kaç farklı değer olduğunu"], "a": 1, "why": "<code>normalize=True<\/code> sayıları toplama böler; yüzde için 100'le çarparsın.", "tags": ["value_counts"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "<code>sefer<\/code> tablosunda 3 tarih satırı ve 4 hat sütunu var. <code>sefer.melt(id_vars=\"Tarih\")<\/code> kaç satır verir?", "opts": ["3", "4", "7", "12"], "a": 3, "why": "Her tarih × her hat sütunu bir satır olur: 3 × 4 = 12.", "tags": ["melt"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "fill", "q": "Boşlukları doldur: geniş sefer tablosunu uzun hâle getir.", "code": "sefer_uzun = sefer.melt(id_vars=___, var_name=___, value_name=\"sefer_sayisi\")", "a": [["\"Tarih\"", "[\"Tarih\"]"], ["\"line_code\""]], "why": "<code>id_vars<\/code> sabit kalan sütun, <code>var_name<\/code> eski sütun adlarının gideceği yeni sütunun adı.", "tags": ["melt"], "rev": false, "zorluk": 2, "yer": "a3"}, {"t": "mc", "q": "<code>to_csv<\/code>'de <code>index=False<\/code> yazmazsan ne olur?", "opts": ["Dosya yazılmaz", "Satır numaraları fazladan bir sütun olarak yazılır", "Sütun adları yazılmaz", "Tarihler bozulur"], "a": 1, "why": "Index de dosyaya yazılır; geri okurken <code>Unnamed: 0<\/code> diye görünür.", "tags": ["csv"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "fill", "q": "Boşlukları doldur: projendeki gibi, satır numarası olmadan ve noktalı virgülle kaydet.", "code": "df.to_csv(\"temiz.csv\", index=___, sep=___, encoding=\"utf-8-sig\")", "a": [["False"], ["\";\""]], "why": "<code>index=False<\/code> ve <code>sep=\";\"<\/code>.", "tags": ["csv"], "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "Yaş sütununu neden <code>Categorical(..., ordered=True)<\/code> yaptın?", "opts": ["Bellek kazanmak için", "Tablolarda ve grafiklerde yaşların mantıklı sırayla gelmesi için", "Hatalı değerleri silmek için", "Sayıya çevirmek için"], "a": 1, "why": "Alfabetik sırada \"&lt;20\" üç grubun arkasına düşerdi. Kategori sırayı senin listene bağlar.", "tags": ["kategori"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["0", "1", "2", "3"], "a": 1, "why": "Yalnızca ortadaki metinde \"TCDD\" geçiyor. True'lar 1 sayıldığı için <code>sum()<\/code> kaç satırın eşleştiğini verir.", "tags": ["pandas_metin", "maske"], "code": "s = pd.Series([\"M4-KADIKOY\", \"TCDD TASIMACILIK A.S.\", \"T1-KABATAS\"])\nprint(s.str.contains(\"TCDD\").sum())", "rev": false, "zorluk": 1, "yer": "al"}, {"t": "fill", "q": "Boşlukları doldur: hat adında \"TCDD\" geçen satırları seç; boş hücreler False sayılsın.", "code": "maske = ham[\"line\"].str.___(\"TCDD\", na=___)\nprint(ham[maske])", "a": [["contains"], ["False"]], "why": "<code>str.contains<\/code> her satır için True/False verir; <code>na=False<\/code> boş hücreleri False yapar.", "tags": ["pandas_metin", "maske"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[1, 0, 3]", "[1.0, 0.0, 3.0]", "[1, 3]", "hata verir"], "a": 0, "why": "Önce boşluk 0 olur (1.0, 0.0, 3.0), sonra <code>astype(int)<\/code> hepsini tam sayıya çevirir. <code>fillna<\/code> olmasaydı <code>astype(int)<\/code> hata verirdi.", "tags": ["fillna"], "code": "s = pd.Series([1.0, None, 3.0])\nprint(s.fillna(0).astype(int).tolist())", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "order", "q": "<code>clean_trips.py<\/code>'nin satırlarını sıraya koy.", "lines": ["sefer = pd.read_excel(\"sefer.xlsx\")", "uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")", "uzun = uzun.dropna(subset=[\"sefer_sayisi\"])", "uzun[\"sefer_sayisi\"] = uzun[\"sefer_sayisi\"].astype(int)", "uzun.to_csv(\"trips_clean.csv\", index=False, sep=\";\")"], "why": "Oku → uzun hâle getir → boşları at → tipi düzelt → kaydet. NaN varken <code>astype(int)<\/code> hata verirdi; bu yüzden <code>dropna<\/code> önce.", "tags": ["melt", "fillna"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>ham<\/code> tablosunda <code>line_code<\/code> sütunu oluştur: <code>str.extract<\/code> ile kodu çek, uymayanları <code>line<\/code> ile doldur, sonra <code>\"TCDD TASIMACILIK A.S.\"<\/code>'ı <code>\"Marmaray\"<\/code> yap.", "starter": "ham[\"line_code\"] = ham[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0]\nprint(ham[[\"line\", \"line_code\"]])\n", "sol": "ham[\"line_code\"] = ham[\"line\"].str.extract(r\"^([A-Z]+\\d+)\")[0].fillna(ham[\"line\"])\nham[\"line_code\"] = ham[\"line_code\"].replace({\"TCDD TASIMACILIK A.S.\": \"Marmaray\"})\nprint(ham[[\"line\", \"line_code\"]])", "test": "kodlar = list(ham[\"line_code\"])\nassert kodlar[0] == \"M4\", \"İlk satır M4 olmalı\"\nassert \"Marmaray\" in kodlar, \"TCDD TASIMACILIK A.S. → Marmaray yapılmadı\"\nassert ham[\"line_code\"].isna().sum() == 0, \"Boş (NaN) line_code kaldı; fillna kullan\"", "hint": "<code>.fillna(ham[\"line\"])<\/code>, sonra <code>.replace({\"TCDD TASIMACILIK A.S.\": \"Marmaray\"})<\/code>. Sonucu sütuna geri atamayı unutma.", "tags": ["pandas_metin", "fillna"], "setup": ["ham"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>clean_trips.py<\/code>'yi yeniden yaz. <code>sefer<\/code> geniş tablosunu <code>melt<\/code> ile uzun hâle getir (<code>sefer_uzun<\/code>; sütunlar <code>Tarih<\/code>, <code>line_code<\/code>, <code>sefer_sayisi<\/code>), boş sefer sayılarını at, sayıları tam sayı yap, sonra <code>Tarih<\/code>'ten <code>year<\/code> ve <code>month<\/code> sütunlarını ekle.", "starter": "print(sefer)\nsefer_uzun = \n", "sol": "sefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun = sefer_uzun.dropna(subset=[\"sefer_sayisi\"])\nsefer_uzun[\"sefer_sayisi\"] = sefer_uzun[\"sefer_sayisi\"].astype(int)\nsefer_uzun[\"year\"] = sefer_uzun[\"Tarih\"].dt.year\nsefer_uzun[\"month\"] = sefer_uzun[\"Tarih\"].dt.month\nprint(sefer_uzun)", "test": "assert list(sefer_uzun.columns) == [\"Tarih\", \"line_code\", \"sefer_sayisi\", \"year\", \"month\"], f\"Sütunlar: {list(sefer_uzun.columns)}\"\nassert len(sefer_uzun) == 11, f\"Boşlar atılınca 11 satır kalmalı, şu an {len(sefer_uzun)}\"\nassert pd.api.types.is_integer_dtype(sefer_uzun[\"sefer_sayisi\"]), \"sefer_sayisi tam sayı olmalı (astype(int))\"\nassert set(sefer_uzun[\"year\"]) == {2024, 2025} and set(sefer_uzun[\"month\"]) == {3, 10}, \"year / month yanlış; .dt.year ve .dt.month kullan\"", "hint": "<code>sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")<\/code>, sonra <code>dropna(subset=[...])<\/code>, <code>astype(int)<\/code> ve <code>sefer_uzun[\"Tarih\"].dt.year<\/code>.", "tags": ["melt", "fillna", "tarih"], "setup": ["sefer"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod yaşları sıralı kategoriye çeviriyor ama \"Bilinmiyor\" grubu 0 çıkıyor ve bir satırın yaşı boş (NaN) kalıyor. Neden? Düzelt.", "starter": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nham[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})\nham[\"age\"] = pd.Categorical(ham[\"age\"], categories=yas_sirasi, ordered=True)\nprint(ham[\"age\"].value_counts(sort=False))\n", "sol": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nham[\"age\"] = ham[\"age\"].replace({\"Unkown\": \"Bilinmiyor\"})\nham[\"age\"] = pd.Categorical(ham[\"age\"], categories=yas_sirasi, ordered=True)\nprint(ham[\"age\"].value_counts(sort=False))", "test": "assert isinstance(ham[\"age\"].dtype, pd.CategoricalDtype), \"age sütunu kategori olmalı\"\nassert list(ham[\"age\"].cat.categories) == [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"], \"Kategori listesi değişmemeli\"\nassert ham[\"age\"].isna().sum() == 0, \"age sütununda NaN kaldı: \\\"Unkown\\\" kategoriye çevrilmeden önce düzeltilmeli\"\nassert (ham[\"age\"] == \"Bilinmiyor\").sum() == 1, \"Bir satır Bilinmiyor olmalı\"", "hint": "İkinci satır bir sonuç üretiyor ama onu hiçbir yere atamıyor: <code>ham[\"age\"] = ham[\"age\"].replace(...)<\/code>.", "tags": ["fillna", "kategori"], "setup": ["ham"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Yaş sütunu kategoriye çevrildi. Her yaş grubunun satırlar içindeki payını <b>yüzde<\/b> olarak ve <b>yaş sırasıyla<\/b> hesapla: <code>pay<\/code>. Veride olmayan gruplar (&lt;20, Bilinmiyor) 0 olarak görünmeli.", "starter": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nyolcu[\"age\"] = pd.Categorical(yolcu[\"age\"], categories=yas_sirasi, ordered=True)\npay = \n", "sol": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nyolcu[\"age\"] = pd.Categorical(yolcu[\"age\"], categories=yas_sirasi, ordered=True)\npay = yolcu[\"age\"].value_counts(normalize=True, sort=False) * 100\nprint(pay.round(1))", "test": "assert [str(i) for i in pay.index] == [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"], f\"Yaş sırası bozuk: {list(pay.index)}\"\nassert abs(float(pay[\"20-30\"]) - 100 / 3) < 0.01, \"20-30 payı yaklaşık 33.33 olmalı (yüzde)\"\nassert float(pay[\"<20\"]) == 0, \"<20 grubunun payı 0 olmalı\"", "hint": "<code>value_counts(normalize=True, sort=False)<\/code> oranları kategori sırasıyla verir; 100'le çarp. <code>sort=False<\/code> yerine sonuna <code>.sort_index()<\/code> da ekleyebilirsin.", "tags": ["value_counts", "kategori"], "setup": ["yolcu"], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod sefer tablosunu uzun hâle getirmek istiyor ama çıktıda tarihler sefer sayılarıyla aynı sütuna karışmış ve tabloda 15 satır var. Düzelt: sonuç <code>Tarih<\/code>, <code>line_code<\/code>, <code>sefer_sayisi<\/code> sütunlu 12 satır olmalı.", "starter": "sefer_uzun = sefer.melt(var_name=\"line_code\", value_name=\"sefer_sayisi\")\nprint(sefer_uzun)\n", "sol": "sefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nprint(sefer_uzun)", "test": "assert list(sefer_uzun.columns) == [\"Tarih\", \"line_code\", \"sefer_sayisi\"], f\"Sütunlar: {list(sefer_uzun.columns)}\"\nassert len(sefer_uzun) == 12, f\"12 satır olmalı (3 tarih × 4 hat), şu an {len(sefer_uzun)}\"", "hint": "Hangi sütunun <b>erimeden<\/b> kalacağını söylemedin: <code>id_vars=\"Tarih\"<\/code>.", "tags": ["melt"], "setup": ["sefer"], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>melt<\/code>'in tersini yap: <code>sefer_uzun<\/code>'u <code>pivot<\/code> ile yeniden geniş tabloya çevir (<code>geri<\/code>; satırlar tarih, sütunlar hat). Sonra <code>geri<\/code>'deki boş hücre sayısını <code>bos<\/code> değişkenine yaz.", "starter": "sefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun = sefer_uzun.dropna(subset=[\"sefer_sayisi\"])\n\ngeri = \nbos = \n", "sol": "sefer_uzun = sefer.melt(id_vars=\"Tarih\", var_name=\"line_code\", value_name=\"sefer_sayisi\")\nsefer_uzun = sefer_uzun.dropna(subset=[\"sefer_sayisi\"])\n\ngeri = sefer_uzun.pivot(index=\"Tarih\", columns=\"line_code\", values=\"sefer_sayisi\")\nbos = int(geri.isna().sum().sum())\nprint(geri)\nprint(bos)", "test": "assert \"pivot\" in __kod__, \"pivot kullan\"\nassert geri.shape == (3, 4), f\"3 satır × 4 sütun olmalı, şu an {geri.shape}\"\nassert sorted(geri.columns) == [\"M2\", \"M4\", \"T1\", \"TF1\"], f\"Sütunlar hatlar olmalı: {list(geri.columns)}\"\nassert geri.loc[pd.Timestamp(\"2025-03-01\"), \"M2\"] == 14200, \"2025-03-01 / M2 hücresi 14200 olmalı\"\nassert bos == 1, f\"Bir boş hücre olmalı (TF1, 2025-10-01), şu an {bos}\"", "hint": "<code>sefer_uzun.pivot(index=\"Tarih\", columns=\"line_code\", values=\"sefer_sayisi\")<\/code>. Boşları saymak için <code>geri.isna().sum().sum()<\/code>: ilk <code>sum<\/code> sütun başına, ikincisi hepsini toplar.", "tags": ["melt", "fillna"], "setup": ["sefer"], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>clean_data.py'yi baştan yaz.<\/b> <code>ham<\/code> tablosu İBB dosyasının yedi satırlık bir örneği. <code>df = ham.copy()<\/code> ile başla ve projendeki bütün temizlik adımlarını sırayla uygula:<ol><li><code>longitude<\/code>, <code>latitude<\/code>, <code>station_number<\/code> sütunlarını sil.<\/li><li>Yıl/ay/gün sütunlarından <code>date<\/code>; ondan <code>weekday<\/code> (gün adı) ve <code>is_weekend<\/code> (Cumartesi/Pazar mı?).<\/li><li>Boş istasyon adlarını doldur: T3-KADIKOY-MODA → \"Kadıköy-Moda T3\", IETT NOSTALJIK TRAMVAY → \"Taksim-Tünel Nostaljik Tramvay\".<\/li><li>\"ÇIRÇIR DOĞU\" istasyonunun ilçesini \"EyüpSultan\" yap.<\/li><li>Yaş: \"Unkown\" → \"Bilinmiyor\", sonra <code>yas_sirasi<\/code> ile sıralı kategori.<\/li><li><code>line_code<\/code>: <code>str.extract<\/code> + <code>fillna<\/code>, sonra \"TCDD TASIMACILIK A.S.\" → \"Marmaray\" ve \"TCDD - GAYRETTEPE-ISTANBUL YENI HAVALIMANI\" → \"M11\".<\/li><\/ol>", "starter": "df = ham.copy()\nyas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\n\n# 1) Koordinat ve istasyon numarası sütunlarını sil\n\n# 2) date, weekday, is_weekend\n\n# 3) Boş istasyon adlarını doldur\n\n# 4) ÇIRÇIR DOĞU → EyüpSultan\n\n# 5) Yaş: Unkown → Bilinmiyor, sonra sıralı kategori\n\n# 6) line_code\n\nprint(df)\n", "sol": "df = ham.copy()\nyas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\n\ndf = df.drop(columns=[\"longitude\", \"latitude\", \"station_number\"])\n\ndf[\"date\"] = pd.to_datetime(dict(year=df.transaction_year, month=df.transaction_month, day=df.transaction_day))\ndf[\"weekday\"] = df[\"date\"].dt.day
