<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kod Hattı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#eef1f5; --panel:#ffffff; --panel-2:#f6f8fb; --ink:#152030; --muted:#566377; --faint:#8793a5;
  --rule:#d5dce6; --accent:#0b4f9c; --accent-ink:#ffffff; --accent-soft:#e3edf9;
  --ok:#17804a; --ok-soft:#e2f4ea; --bad:#c2303b; --bad-soft:#fbe7e9; --warn:#9a6a12; --warn-soft:#fbf1dc;
  --code-bg:#f3f5f9; --code-ink:#1d2736; --tok-kw:#8a2bb3; --tok-str:#1f7a3f; --tok-num:#b3541e; --tok-com:#7f8a9a; --tok-fn:#0b5cad;
  --shadow:0 1px 2px rgba(21,32,48,.06),0 4px 16px rgba(21,32,48,.06);
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0e131a; --panel:#151c26; --panel-2:#1a2330; --ink:#e4e9f0; --muted:#a2adbd; --faint:#6f7b8d;
    --rule:#2a3544; --accent:#6aa6ff; --accent-ink:#0b1220; --accent-soft:#1b2a40;
    --ok:#4cc38a; --ok-soft:#153024; --bad:#ff6b76; --bad-soft:#3a1b20; --warn:#e3b049; --warn-soft:#352a14;
    --code-bg:#10161f; --code-ink:#dfe6ef; --tok-kw:#d19bff; --tok-str:#7fd49a; --tok-num:#ffab70; --tok-com:#6f7b8d; --tok-fn:#79b8ff;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0e131a; --panel:#151c26; --panel-2:#1a2330; --ink:#e4e9f0; --muted:#a2adbd; --faint:#6f7b8d;
  --rule:#2a3544; --accent:#6aa6ff; --accent-ink:#0b1220; --accent-soft:#1b2a40;
  --ok:#4cc38a; --ok-soft:#153024; --bad:#ff6b76; --bad-soft:#3a1b20; --warn:#e3b049; --warn-soft:#352a14;
  --code-bg:#10161f; --code-ink:#dfe6ef; --tok-kw:#d19bff; --tok-str:#7fd49a; --tok-num:#ffab70; --tok-com:#6f7b8d; --tok-fn:#79b8ff;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,pre,textarea,.opt,.ord-line,.fill-code{font-family:var(--mono);font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}
.opt.duz{font-feature-settings:normal}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

/* ─── yerleşim ─── */
.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-right:1px solid var(--rule);padding:20px 18px 28px;scrollbar-width:thin}
.main{min-width:0;padding-block:28px 80px;padding-inline:clamp(16px,4vw,48px)}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
.wrap>*,.q>*,.warmup>*{min-width:0}

.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .logo{width:34px;height:34px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 15px/1 var(--display);font-stretch:85%}
.brand b{font:800 21px/1 var(--display);font-stretch:88%;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.pybar{margin:16px 0 14px;display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--rule);border-radius:8px;padding:7px 10px}
.pybar .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto}
.pybar[data-s="yukleniyor"] .dot{background:var(--warn);animation:nabiz 1s infinite}
.pybar[data-s="hazir"] .dot{background:var(--ok)}
.pybar[data-s="hata"] .dot{background:var(--bad)}
.pybar button{margin-left:auto;border:1px solid var(--rule);background:var(--panel);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer}
@keyframes nabiz{50%{opacity:.35}}

/* hat şeması */
.line-map{list-style:none;margin:6px 0 0;padding:0;position:relative}
.line-map::before{content:"";position:absolute;left:17px;top:14px;bottom:14px;width:6px;border-radius:3px;background:var(--rule)}
.line-map .fill{position:absolute;left:17px;top:14px;width:6px;border-radius:3px;background:var(--accent);transition:height .4s}
.stop{position:relative}
.stop a{display:flex;align-items:center;gap:12px;padding:6px 8px 6px 4px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:13.5px;line-height:1.25}
.stop a:hover{background:var(--panel-2)}
.stop a[aria-current="page"]{background:var(--accent-soft)}
.stop .node{position:relative;z-index:1;flex:0 0 32px;height:32px;display:grid;place-items:center}
.stop .node span{width:30px;height:22px;border-radius:5px;display:grid;place-items:center;font:800 11px/1 var(--display);font-stretch:85%;color:#fff;box-shadow:0 0 0 3px var(--panel)}
.stop.tekrar .node span{width:22px;height:22px;border-radius:50%;background:var(--panel)!important;border:4px solid var(--ink);box-shadow:0 0 0 3px var(--panel)}
.stop .nm{flex:1;min-width:0}
.stop .nm small{display:block;color:var(--faint);font-size:11.5px}
.stop .chk{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.stop.bitti .chk{color:var(--ok);font-weight:600}
.side-links{display:flex;flex-direction:column;gap:2px;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule)}
.side-links a{padding:6px 8px;border-radius:7px;text-decoration:none;color:var(--ink);font-size:13.5px}
.side-links a:hover{background:var(--panel-2)}
.side-links a[aria-current="page"]{background:var(--accent-soft)}
.theme-row{display:flex;gap:6px;margin-top:14px}
.theme-row button{flex:1;border:1px solid var(--rule);background:var(--panel-2);border-radius:7px;padding:5px;font-size:12px;cursor:pointer}
.theme-row button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.mobile-top{display:none}

/* ─── içerik ─── */
.ch-head{display:flex;gap:18px;align-items:flex-start}
.ch-badge{flex:0 0 auto;width:64px;height:64px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 22px/1 var(--display);font-stretch:80%}
.ch-badge.tekrar{border-radius:50%;background:var(--panel)!important;border:9px solid var(--ink);color:var(--ink);font-size:0}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ch-head h1{font-size:clamp(26px,4vw,36px);font-weight:800;font-stretch:88%;margin-top:6px;letter-spacing:-.015em}
.ch-head p{margin:6px 0 0;color:var(--muted)}
.prose{max-width:68ch}
.prose h3{font-size:18px;font-weight:700;margin:22px 0 6px}
.prose p{margin:0 0 10px}
.prose ul,.prose ol{margin:0 0 10px;padding-left:22px}
.prose code,.q-text code,.why code,.hint code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}
pre.py,pre.out,.q-code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;margin:8px 0 12px;overflow-x:auto;font-size:13px;line-height:1.55;white-space:pre}
.t-kw{color:var(--tok-kw);font-weight:600}.t-str{color:var(--tok-str)}.t-num{color:var(--tok-num)}.t-com{color:var(--tok-com);font-style:italic}.t-fn{color:var(--tok-fn)}

.proje{border:1px solid var(--rule);border-radius:12px;background:var(--panel);overflow:hidden}
.proje header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--rule);background:var(--panel-2);font-size:12.5px;color:var(--muted)}
.proje header b{color:var(--ink);font-weight:600}
.proje pre{margin:0;border:0;border-radius:0}

.warmup{border:1px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:14px 16px}
.warmup .eyebrow{color:var(--warn)}

.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:6px;margin-top:10px}
.sec-title h2{font-size:20px;font-weight:800;font-stretch:90%}
.sec-title span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* soru kartı */
.q{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.q[data-durum="dogru"]{border-color:color-mix(in srgb,var(--ok) 55%,var(--rule))}
.q-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
.q-top .tur{font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.q-top .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--panel-2);border:1px solid var(--rule);color:var(--muted)}
.q-text{font-size:15px}
.q-code{margin:0}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1px solid var(--rule);background:var(--panel-2);border-radius:9px;padding:9px 12px;cursor:pointer;font-family:var(--mono);font-size:13.5px}
.opt.duz{font-family:var(--body);font-size:14.5px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.dogru{border-color:var(--ok);background:var(--ok-soft)}
.opt.yanlis{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{border-radius:9px;padding:9px 12px;font-size:14px}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:4px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:4px solid var(--bad)}
.fb.info{background:var(--panel-2);border-left:4px solid var(--faint)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13.5px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.ana{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ana:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.kbd{font-size:11.5px;color:var(--faint)}
/* boşluk doldur */
.fill-code{background:var(--code-bg);color:var(--code-ink);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;font:13px/2 var(--mono);white-space:pre;overflow-x:auto}
.fill-code input{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--faint);border-radius:5px;padding:1px 5px;min-width:3ch}
.fill-code input.dogru{border-color:var(--ok);background:var(--ok-soft)}
.fill-code input.yanlis{border-color:var(--bad);background:var(--bad-soft)}
/* sıralama */
.ord{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.ord-box,.ord-line{min-width:0;max-width:100%}
.ord-box{border:1px dashed var(--rule);border-radius:9px;padding:8px;min-height:46px;display:flex;flex-direction:column;gap:6px}
.ord-box.cevap{border-style:solid;background:var(--panel-2)}
.ord-box .lbl{font-size:11.5px;color:var(--faint);padding:0 4px}
.ord-line{font:13px/1.4 var(--mono);white-space:pre;text-align:left;border:1px solid var(--rule);background:var(--panel);border-radius:7px;padding:6px 10px;cursor:pointer;overflow-x:auto}
.ord-line:hover{border-color:var(--accent)}
/* editör */
.ed{position:relative;border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--code-bg)}
.ed textarea{display:block;width:100%;min-height:150px;resize:vertical;border:0;background:transparent;color:var(--code-ink);padding:12px 14px;font-size:13px;line-height:1.55;tab-size:4;white-space:pre;overflow:auto}
.ed textarea:focus{outline:none}
.ed:focus-within{border-color:var(--accent)}
.out{background:var(--code-bg);border:1px solid var(--rule);border-radius:9px;padding:10px 14px;font:12.5px/1.5 var(--mono);white-space:pre-wrap;overflow-x:auto;max-height:340px;overflow-y:auto}
.out .err{color:var(--bad)}
.out img{display:block;max-width:100%;background:#fff;border-radius:6px;margin-top:8px}
.hint{font-size:14px;background:var(--warn-soft);border-left:4px solid var(--warn);border-radius:9px;padding:9px 12px}

/* genel bakış */
.hero{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:12px}
.hero h1{font-size:clamp(30px,5vw,46px);font-weight:800;font-stretch:82%;letter-spacing:-.02em}
.hero p{margin:0;max-width:62ch;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--panel-2);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:800 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.bars{display:grid;gap:7px}
.barrow{display:grid;grid-template-columns:38px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;text-decoration:none;color:var(--ink)}
.mini{display:grid;place-items:center;width:34px;height:22px;border-radius:5px;color:#fff;font:800 11px/1 var(--display);font-stretch:85%}
.barrow .t{display:block;font-size:13px;margin-bottom:4px}
.barrow .b{display:block;height:10px;border-radius:5px;background:var(--panel-2);border:1px solid var(--rule);overflow:hidden}
.barrow .b i{display:block;height:100%}
.barrow .n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.weak{display:flex;flex-wrap:wrap;gap:8px}
.weak a{display:inline-flex;gap:6px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px}
.weak a b{color:var(--bad);font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:10px}
.pager a{flex:1;border:1px solid var(--rule);background:var(--panel);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--ink);font-size:14px}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a.sonraki{text-align:right}
.score{font:800 40px/1 var(--display);font-variant-numeric:tabular-nums}

/* ara duraklar */
.serit{display:flex;flex-wrap:wrap;gap:6px;padding-block:4px}
.serit button{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink)}
.serit button:hover{border-color:var(--accent)}
.serit button b{font-family:var(--display);margin-right:4px}
.adim{display:flex;flex-direction:column;gap:12px;scroll-margin-top:64px}
.adim-bas{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--ink);padding-bottom:6px}
.adim-bas .no{font:800 13px/1 var(--display);background:var(--ink);color:var(--panel);border-radius:6px;padding:5px 8px;font-variant-numeric:tabular-nums}
.adim-bas h2{font-size:21px;font-weight:800;font-stretch:90%}
.neden,.tuzak{border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14.5px}
.neden{background:var(--accent-soft);border-left:4px solid var(--accent)}
.tuzak{background:var(--bad-soft);border-left:4px solid var(--bad)}
.neden>b:first-child,.tuzak>b:first-child{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
.neden>b:first-child{color:var(--accent)}.tuzak>b:first-child{color:var(--bad)}
.neden code,.tuzak code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}
.q.ornek{box-shadow:none;background:var(--panel-2);border-style:dashed}
.zor{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid}
.zor.z1{color:var(--ok);border-color:var(--ok)}.zor.z2{color:var(--warn);border-color:var(--warn)}.zor.z3{color:var(--bad);border-color:var(--bad)}
.q.proje{border-width:2px;border-color:var(--ink)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .serit{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:thin}
  .serit button{flex:0 0 auto}
  .serit #durum{flex:0 0 auto}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,88vw);z-index:20;transform:translateX(-102%);transition:transform .25s;box-shadow:var(--shadow)}
  .side.acik{transform:none}
  .mobile-top{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;background:var(--panel);border-bottom:1px solid var(--rule);padding:10px 16px}
  .mobile-top button{border:1px solid var(--rule);background:var(--panel-2);border-radius:8px;padding:5px 11px;cursor:pointer}
  .mobile-top b{font:800 17px/1 var(--display);font-stretch:88%}
  .main{padding-block:18px 60px}
  .stats{grid-template-columns:1fr}
  .ch-head{gap:12px}.ch-badge{width:48px;height:48px;font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="mobile-top"><button id="menuBtn" aria-controls="side" aria-expanded="false">Duraklar</button><b>Kod Hattı</b></div>
<div class="app">
  <nav class="side" id="side" aria-label="Bölümler">
    <a class="brand" href="#harita"><span class="logo">Py</span><span><b>Kod Hattı</b><small>İstanbul raylı sistem projesiyle Python</small></span></a>
    <div class="pybar" id="pybar" data-s="yok"><span class="dot"></span><span id="pytxt">Python yüklenmedi</span><button id="pyload">Yükle</button></div>
    <ol class="line-map" id="lineMap"><div class="fill" id="lineFill"></div></ol>
    <div class="side-links">
      <a href="#harita" data-r="harita">Hat haritası · ilerleme</a>
      <a href="#deneme" data-r="deneme">Deneme tahtası</a>
    </div>
    <div class="theme-row" role="group" aria-label="Tema">
      <button data-t="system">Sistem</button><button data-t="light">Açık</button><button data-t="dark">Koyu</button>
    </div>
  </nav>

<script id="icerik" type="application/json">{"bolumler": [{"id": "b1", "no": 1, "tur": "ders", "baslik": "Python'a ilk adım", "hat": "M1", "ozet": "Değişkenler, veri tipleri, sayılarla işlem ve f-string ile düzgün çıktı.", "dosya": "analiz.ipynb", "proje": "ANA_RENK = \"#3b6ea5\"\nKAYNAK = \"İBB Açık Veri Portalı\"\n...\nveri = (hat_yolcu / 1_000_000).sort_values()\n...\nax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)\n...\nsatir = f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"", "adimlar": [{"baslik": "Değişken: bir değere isim vermek", "html": "\n<p>Program yazarken değerleri bir yerde tutman gerekir. Python'da bunun için <b>değişken<\/b> kullanırsın:\nbir isim, eşittir işareti ve bir değer.<\/p>\n<pre class=\"py\">yolcu = 23301956\nhat = \"M2\"<\/pre>\n<p>Buradaki <code>=<\/code> matematikteki \"eşittir\" değildir; \"sağdaki değeri hesapla, soldaki isme bağla\" demektir.\nBu yüzden şu satır Python'da gayet anlamlıdır:<\/p>\n<pre class=\"py\">sayac = 5\nsayac = sayac + 1    # önce sağ taraf hesaplanır (6), sonra sayac'a yazılır\nprint(sayac)         # 6<\/pre>\n<h3>İsim kuralları<\/h3>\n<ul>\n<li>Harf veya alt çizgiyle başlar; rakamla başlayamaz: <code>hat1<\/code> olur, <code>1hat<\/code> olmaz.<\/li>\n<li>Boşluk içeremez. Kelimeleri alt çizgiyle ayırırsın: <code>hat_yolcu<\/code>, <code>sefer_sayisi<\/code>. Buna <b>snake_case<\/b> denir.<\/li>\n<li>Büyük/küçük harf farklıdır: <code>Yolcu<\/code> ile <code>yolcu<\/code> iki ayrı değişkendir.<\/li>\n<li>Türkçe harf kullanılabilir (<code>gün_sayısı<\/code>) ama çoğu projede, seninki dahil, ASCII tercih edilir; klavye ve araç sorunlarını önler.<\/li>\n<\/ul>\n<div class=\"neden\"><b>Neden böyle?<\/b> Projende <code>ANA_RENK<\/code>, <code>KAYNAK<\/code> gibi tamamen büyük harfli isimler var.\nPython bunları özel işlemez; bu bir <b>gelenek<\/b>tir: \"bu değer program boyunca değişmeyecek bir ayardır\" demek.\nKodu okuyan biri büyük harfi görünce bunun bir sabit olduğunu hemen anlar.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Değişkeni tanımlamadan kullanmak: <code>print(yolcu_sayisi)<\/code> yazıp daha önce\n<code>yolcu_sayisi = …<\/code> demediysen <code>NameError: name 'yolcu_sayisi' is not defined<\/code> alırsın. Yazım farkı da aynı hatayı verir\n(<code>yolcu<\/code> tanımlı, <code>yoclu<\/code> değil).<\/div>\n", "ornek": "yolcu = 23301956\nhat = \"M2\"\nprint(hat, yolcu)\n\nyolcu = yolcu + 1_000   # eski değerin üzerine yazılır\nprint(hat, yolcu)", "ornek_setup": []}, {"baslik": "Veri tipleri ve dönüşüm", "html": "\n<p>Her değerin bir <b>tipi<\/b> vardır. Tip, o değerle neler yapabileceğini belirler. Projende en çok bu dördü geçiyor:<\/p>\n<pre class=\"py\">yolcu = 23301956      # int   → tam sayı\npay = 12.5            # float → ondalıklı sayı\nhat = \"M2\"            # str   → metin (tırnak içinde)\nhafta_sonu = False    # bool  → True / False<\/pre>\n<p><code>type(deger)<\/code> bir değerin tipini söyler: <code>type(12.5)<\/code> → <code>float<\/code>.<\/p>\n<h3>Tip dönüşümü<\/h3>\n<p>Dosyadan okunan veya kullanıcıdan gelen değerler çoğu zaman <b>metin<\/b> olarak gelir. Hesap yapmak için sayıya çevirmen gerekir:<\/p>\n<pre class=\"py\">int(\"2025\")      # 2025   (metin → tam sayı)\nfloat(\"3.5\")     # 3.5\nstr(145)         # \"145\"  (sayı → metin)\nint(7.9)         # 7      (yuvarlamaz, ondalığı atar)\nround(7.9)       # 8      (yuvarlar)<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Metinle sayıyı toplamak: <code>\"Yolcu: \" + 145<\/code> →\n<code>TypeError: can only concatenate str (not \"int\") to str<\/code>. Ya sayıyı metne çevir (<code>\"Yolcu: \" + str(145)<\/code>)\nya da, daha iyisi, bir sonraki adımdaki f-string'i kullan.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>\"5\" + \"5\"<\/code> sonucu <code>\"55\"<\/code> (metinler uç uca eklenir), <code>5 + 5<\/code> sonucu <code>10<\/code>.\nPython \"ne demek istedin?\" diye tahmin yürütmez; tipler karışınca hata verir. Bu sıkı davranış, veride sessizce yanlış sonuç çıkmasını önler.\nSenin <code>clean_trips.py<\/code>'de <code>astype(int)<\/code> yapman da aynı fikrin pandas'taki karşılığı.<\/div>\n", "ornek": "yil = \"2025\"               # metin olarak geldi\nprint(type(yil))\nprint(int(yil) + 1)         # sayıya çevirince hesap yapılabilir\nprint(\"Yıl: \" + yil)        # metinle metin birleşir\nprint(int(7.9), round(7.9))", "ornek_setup": []}, {"baslik": "Sayılarla işlem", "html": "\n<pre class=\"py\">print(7 + 3)     # 10\nprint(7 - 3)     # 4\nprint(7 * 3)     # 21\nprint(7 / 2)     # 3.5   → bölme her zaman float verir\nprint(7 // 2)    # 3     → tam bölme (aşağı yuvarlar)\nprint(7 % 2)     # 1     → kalan\nprint(2 ** 3)    # 8     → üs<\/pre>\n<h3>İşlem önceliği<\/h3>\n<p>Python da matematikteki sırayı izler: önce parantez, sonra <code>**<\/code>, sonra <code>* / // %<\/code>, en son <code>+ -<\/code>.<\/p>\n<pre class=\"py\">2 + 3 * 4        # 14, 20 değil\n(2 + 3) * 4      # 20<\/pre>\n<p>Projende pay hesabı böyle: <code>hat_yolcu / hat_yolcu.sum() * 100<\/code>. Bölme ve çarpma aynı öncelikte olduğu için <b>soldan sağa<\/b> yapılır:\nönce bölünür, sonra 100'le çarpılır. İstediğin de tam olarak bu.<\/p>\n<h3>Büyük sayılar<\/h3>\n<p><code>1_000_000<\/code> ile <code>1000000<\/code> aynı sayıdır; alt çizgi yalnızca okumayı kolaylaştırır. Projende milyona çevirirken\n<code>hat_yolcu / 1_000_000<\/code> yazmışsın. <code>1e6<\/code> da aynı değerdir ama float'tır (<code>1000000.0<\/code>).<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Yüzdeyi hesaplarken parantezi unutmak: <code>a / a + b * 100<\/code> ile <code>a / (a + b) * 100<\/code> çok farklıdır.\nEmin değilsen parantez koy; fazla parantez hata değildir.<\/div>\n", "ornek": "m2 = 145_000_000\nt1 = 107_000_000\npay = m2 / (m2 + t1) * 100\nprint(pay)\nprint(round(pay, 1))\nprint(17 // 5, 17 % 5)   # 17 = 5*3 + 2", "ornek_setup": []}, {"baslik": "f-string ile düzgün çıktı", "html": "\n<p>Tırnaktan önce <code>f<\/code> koyarsan, süslü parantez içindeki ifade hesaplanıp metne yerleştirilir:<\/p>\n<pre class=\"py\">hat = \"M2\"\nyolcu = 23301956\nprint(f\"{hat} hattı: {yolcu} yolcu\")      # M2 hattı: 23301956 yolcu\nprint(f\"Milyon: {yolcu / 1_000_000}\")    # içeride hesap da yapılabilir<\/pre>\n<h3>Biçim belirteçleri<\/h3>\n<p>İki noktadan sonra sayının nasıl yazılacağını söylersin:<\/p>\n<pre class=\"py\">deger = 23.30196\nf\"{deger:.1f}\"      # '23.3'        → virgülden sonra 1 basamak (yuvarlar)\nf\"{deger:.0f}\"      # '23'\nf\"{23301956:,}\"     # '23,301,956'  → binlik ayırıcı\nf\"{'M2':&gt;6}\"        # '    M2'      → 6 karakterlik alana sağa yasla\nf\"{'M2':&lt;6}|\"       # 'M2    |'     → sola yasla\nf\"{0.734:.1%}\"      # '73.4%'       → yüzdeye çevirip yazar<\/pre>\n<p>Projende grafik çubuklarının ucundaki sayılar <code>f\"{deger:.1f}\"<\/code>, alt bilgideki kaynak satırı\n<code>f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"<\/code> ile üretiliyor.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Aynı satırı <code>\"Kaynak: \" + KAYNAK + \" | Dönem: \" + donem<\/code> diye de yazabilirdin,\nama her değişkeni <code>str()<\/code> ile çevirmen, boşlukları elle ayarlaman gerekirdi. f-string hem kısa hem de metnin son hâlini\nokurken görmeni sağlar.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>f<\/code>'yi unutmak: <code>print(\"{deger:.1f}\")<\/code> ekrana aynen <code>{deger:.1f}<\/code> yazar,\nhata vermez. Çıktıda süslü parantez görüyorsan ilk şüphelin eksik <code>f<\/code>'dir.<\/div>\n", "ornek": "deger = 72.64\nprint(f\"{deger:.1f} milyon\")\nprint(f\"%{deger:.0f}\")\nprint(f\"{23301956:,} yolcu\")\nfor hat in [\"M2\", \"Marmaray\"]:\n    print(f\"{hat:<10}|\")", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["5", "6", "7", "hata"], "a": 2, "why": "Satırlar sırayla çalışır: x önce 5, sonra 6, sonra 7 olur.", "tags": ["degisken"], "code": "x = 5\nx = x + 1\nx = x + 1\nprint(x)", "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Hangisi geçerli bir değişken adı?", "opts": ["2025_yolcu", "hat yolcu", "hat_yolcu", "hat-yolcu"], "a": 2, "why": "Rakamla başlayamaz, boşluk ve tire içeremez; alt çizgi serbest.", "tags": ["degisken"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>\"5\" + \"5\"<\/code> sonucu nedir?", "opts": ["\"55\"", "10", "\"10\"", "hata"], "a": 0, "why": "İki metin toplanınca uç uca eklenir.", "tags": ["tipler"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "<code>int(\"3.7\")<\/code> ne olur?", "opts": ["3", "4", "3.7", "ValueError hatası"], "a": 3, "why": "<code>int()<\/code> ondalıklı bir <b>metni<\/b> doğrudan çeviremez. Önce <code>float(\"3.7\")<\/code>, sonra <code>int(...)<\/code> gerekir.", "tags": ["tipler"], "code": null, "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "<code>print(7 // 2)<\/code> ne yazdırır?", "opts": ["3.5", "3", "4", "1"], "a": 1, "why": "<code>//<\/code> tam bölmedir; sonucun tam kısmını verir.", "tags": ["aritmetik"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "<code>10 - 4 / 2<\/code> kaçtır?", "opts": ["3.0", "8.0", "3", "8"], "a": 1, "why": "Önce bölme: 4/2 = 2.0; sonra 10 - 2.0 = 8.0. Bölme float verdiği için sonuç da float.", "tags": ["aritmetik"], "code": null, "rev": false, "zorluk": 2, "yer": "a2"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["12.35", "12.3", "12.4", "12"], "a": 2, "why": "<code>.1f<\/code> virgülden sonra 1 basamak bırakır ve yuvarlar: 12.36 → 12.4.", "tags": ["fstring"], "code": "deger = 12.36\nprint(f\"{deger:.1f}\")", "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "fill", "q": "Boşlukları doldur: yolcu sayısını milyona çevirip bir basamakla yazdır.", "code": "yolcu = 23_301_956\nmilyon = yolcu / ___\nprint(f\"{milyon:___} milyon\")", "a": [["1_000_000", "1000000", "1e6"], [".1f"]], "why": "Bölmek için 1 milyon (<code>1_000_000<\/code>), biçim için <code>.1f<\/code>.", "tags": ["aritmetik", "fstring"], "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>type(12.5)<\/code> ne döndürür?", "opts": ["int", "float", "str", "bool"], "a": 1, "why": "Ondalık noktası olan sayılar <code>float<\/code>'tır.", "tags": ["tipler"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "<code>print(2 ** 3 + 1)<\/code> ne yazdırır?", "opts": ["9", "16", "7", "2"], "a": 0, "why": "Önce üs: 2**3 = 8, sonra +1.", "tags": ["aritmetik"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Hangi satır <code>%73<\/code> yazdırır?", "opts": ["print(f\"%{72.6:.0f}\")", "print(\"%{72.6:.0f}\")", "print(f\"%{72.6:.1f}\")", "print(f\"{72.6}%\")"], "a": 0, "why": "Başta <code>f<\/code> olmalı; <code>.0f<\/code> ondalık bırakmaz ve 72.6'yı 73'e yuvarlar.", "tags": ["fstring"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>toplam<\/code> değişkenine 1.890.000 ata ve <code>f\"Toplam: {toplam:,}\"<\/code> ile yazdır.", "starter": "toplam = \n", "sol": "toplam = 1_890_000\nprint(f\"Toplam: {toplam:,}\")", "test": "assert toplam == 1890000, \"toplam 1890000 olmalı\"\nassert \"1,890,000\" in __cikti__, \"Çıktıda 1,890,000 görünmeli\"", "hint": "Önce <code>toplam = 1_890_000<\/code>, sonra print içinde f-string.", "tags": ["fstring", "degisken"], "setup": [], "rev": false, "why": "", "zorluk": 1, "hata": false, "yer": "al"}, {"t": "fill", "q": "Metin olarak gelen yılı sayıya çevirip bir sonraki yılı hesapla.", "code": "yil = \"2025\"\nsonraki = ___(yil) + 1\nprint(sonraki)", "a": [["int"]], "why": "<code>int()<\/code> metni tam sayıya çevirir.", "tags": ["tipler"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Bu kod <code>TypeError<\/code> veriyor. Düzelt ki <code>Hat: M2 | Yolcu: 23301956<\/code> yazdırsın.", "starter": "hat = \"M2\"\nyolcu = 23301956\nprint(\"Hat: \" + hat + \" | Yolcu: \" + yolcu)\n", "sol": "hat = \"M2\"\nyolcu = 23301956\nprint(f\"Hat: {hat} | Yolcu: {yolcu}\")", "test": "assert \"Hat: M2 | Yolcu: 23301956\" in __cikti__, f\"Çıktı beklenen satırı içermiyor: {__cikti__!r}\"", "hint": "Metinle sayı <code>+<\/code> ile birleşmez. <code>str(yolcu)<\/code> ya da f-string kullan.", "tags": ["tipler", "fstring"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> M2'nin yıllık yolcusu 145 milyon, T1'inki 107 milyon. M2'nin bu iki hat içindeki payını yüzde olarak hesapla, <code>pay<\/code>'a ata ve <code>M2 payı: %57.5<\/code> biçiminde yazdır.", "starter": "m2 = 145_000_000\nt1 = 107_000_000\npay = \n", "sol": "m2 = 145_000_000\nt1 = 107_000_000\npay = m2 / (m2 + t1) * 100\nprint(f\"M2 payı: %{pay:.1f}\")", "test": "assert abs(pay - 57.54) < 0.01, f\"pay yaklaşık 57.54 olmalı, şu an {pay}\"\nassert \"M2 payı: %57.5\" in __cikti__, f\"Çıktı biçimi farklı: {__cikti__!r}\"", "hint": "Parantez önemli: <code>m2 / (m2 + t1) * 100<\/code>. Yazdırırken <code>:.1f<\/code>.", "tags": ["aritmetik", "fstring"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Hafta içi günlük ortalaması yanlış çıkıyor. Ay boyunca 89.900.000 yolcu var; bunun 4.000.000'u 8 hafta sonu gününde. Hafta içi ortalaması = (toplam − hafta sonu yolcusu) ÷ (gün − hafta sonu günü). Parantezleri düzelt.", "starter": "aylik_toplam = 89_900_000\ngun = 31\nhafta_ici_gunluk = aylik_toplam - 4_000_000 / gun - 8\nprint(round(hafta_ici_gunluk))\n", "sol": "aylik_toplam = 89_900_000\ngun = 31\nhafta_ici_gunluk = (aylik_toplam - 4_000_000) / (gun - 8)\nprint(round(hafta_ici_gunluk))\n", "test": "assert abs(hafta_ici_gunluk - 3_734_782.6) < 1, f\"hafta_ici_gunluk yaklaşık 3734782.6 olmalı, şu an {hafta_ici_gunluk}\"", "hint": "İki tarafa da parantez gerek: <code>(aylik_toplam - 4_000_000) / (gun - 8)<\/code>.", "tags": ["aritmetik"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "mc", "q": "<code>f\"{0.734:.1%}\"<\/code> ne üretir?", "opts": ["\"0.7%\"", "\"73.4%\"", "\"73%\"", "\"0.734%\""], "a": 1, "why": "<code>%<\/code> biçimi sayıyı 100'le çarpar ve sonuna % koyar.", "tags": ["fstring"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>sure_dk = 135<\/code> dakikayı saat ve dakikaya ayır (<code>saat<\/code>, <code>dakika<\/code>) ve <code>2 sa 15 dk<\/code> yazdır. <code>//<\/code> ve <code>%<\/code> kullan.", "starter": "sure_dk = 135\n", "sol": "sure_dk = 135\nsaat = sure_dk // 60\ndakika = sure_dk % 60\nprint(f\"{saat} sa {dakika} dk\")", "test": "assert (saat, dakika) == (2, 15), f\"saat=2, dakika=15 olmalı: {saat}, {dakika}\"\nassert \"2 sa 15 dk\" in __cikti__, \"Çıktı 2 sa 15 dk olmalı\"\nassert \"//\" in __kod__ and \"%\" in __kod__, \"// ve % kullan\"", "hint": "<code>sure_dk // 60<\/code> tam saat, <code>sure_dk % 60<\/code> kalan dakika.", "tags": ["aritmetik", "fstring"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Hat özet tablosu.<\/b> Üç hattın yıllık yolcu ve sefer sayıları değişkenlerde hazır. Her hat için <b>sefer başına yolcuyu<\/b> hesapla ve aşağıdaki gibi <b>hizalı<\/b> üç satır yazdır (hat adı 10 karakter sola yaslı, yolcu binlik ayırıcılı ve 13 karakter sağa yaslı, sefer başına yolcu ondalıksız 4 karakter):<pre class=\"py\">M5        |    73,262,300 |  809\nT1        |   107,000,000 |  331\nTF1       |       221,489 |   68<\/pre>", "starter": "# hat, yıllık yolcu, yıllık sefer\nhat1, yolcu1, sefer1 = \"M5\", 73_262_300, 90_558\nhat2, yolcu2, sefer2 = \"T1\", 107_000_000, 323_261\nhat3, yolcu3, sefer3 = \"TF1\", 221_489, 3_257\n\n", "sol": "# hat, yıllık yolcu, yıllık sefer\nhat1, yolcu1, sefer1 = \"M5\", 73_262_300, 90_558\nhat2, yolcu2, sefer2 = \"T1\", 107_000_000, 323_261\nhat3, yolcu3, sefer3 = \"TF1\", 221_489, 3_257\n\nprint(f\"{hat1:<10}| {yolcu1:>13,} | {yolcu1 / sefer1:>4.0f}\")\nprint(f\"{hat2:<10}| {yolcu2:>13,} | {yolcu2 / sefer2:>4.0f}\")\nprint(f\"{hat3:<10}| {yolcu3:>13,} | {yolcu3 / sefer3:>4.0f}\")", "test": "satirlar = [s for s in __cikti__.splitlines() if s.strip()]\nassert len(satirlar) == 3, f\"3 satır bekleniyor, {len(satirlar)} satır var\"\nassert satirlar[0] == \"M5        |    73,262,300 |  809\", f\"1. satır farklı: {satirlar[0]!r}\"\nassert satirlar[1] == \"T1        |   107,000,000 |  331\", f\"2. satır farklı: {satirlar[1]!r}\"\nassert satirlar[2] == \"TF1       |       221,489 |   68\", f\"3. satır farklı: {satirlar[2]!r}\"", "hint": "Tek satır için şablon: <code>f\"{hat1:&lt;10}| {yolcu1:&gt;13,} | {yolcu1 / sefer1:&gt;4.0f}\"<\/code>. <code>&lt;10<\/code> sola yaslı 10 karakter, <code>&gt;13,<\/code> sağa yaslı ve binlik ayırıcılı, <code>&gt;4.0f<\/code> ondalıksız 4 karakter.", "tags": ["fstring", "aritmetik"], "setup": [], "rev": false, "why": "Hizalı çıktı, sonuçları tablo gibi okumanı sağlar; <code>print(df)<\/code> da arka planda buna benzer biçimlendirme yapıyor.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>hat = \"M2\"<\/code> satırından sonra <code>hat + \"A\"<\/code> neyi verir?", "opts": ["\"M2A\"", "hata verir", "\"M2 A\"", "M2A (tırnaksız isim)"], "a": 0, "why": "İki metni <code>+<\/code> ile toplamak onları uç uca ekler.", "tags": ["tipler"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>print(10 % 3)<\/code> ne yazdırır?", "opts": ["3", "1", "3.33", "0"], "a": 1, "why": "<code>%<\/code> bölümden kalandır: 10 = 3×3 + <b>1<\/b>.", "tags": ["aritmetik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>round(2.567, 2)<\/code> neyi verir?", "opts": ["2.56", "2.57", "3", "2.6"], "a": 1, "why": "İkinci argüman basamak sayısıdır; 2.567 → 2.57.", "tags": ["aritmetik"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>print(\"{x}\")<\/code> (başında f yok) ne yazdırır?", "opts": ["x'in değeri", "{x}", "hata", "boş satır"], "a": 1, "why": "f olmadan süslü parantezler olduğu gibi yazılır.", "tags": ["fstring"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b2", "no": 2, "tur": "ders", "baslik": "Listeler ve sözlükler", "hat": "M2", "ozet": "Birden çok değeri bir arada tutmak: liste, dilim, tuple, sözlük ve küme.", "dosya": "analiz.ipynb", "proje": "yas_sirasi = [\"<20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\n\nTUR_RENK = {\n    \"Metro\": \"#3b6ea5\",\n    \"Tramvay\": \"#e08a3c\",\n    \"Füniküler\": \"#5a9e6f\",\n    \"Teleferik\": \"#8c6bb1\",\n    \"Banliyö (TCDD)\": \"#8c564b\",\n}\n...\nveri = ilk10.iloc[::-1]\n...\nmedyanlar, madlar, n_ler = [], [], []\n...\naciklamalar = {\n    \"2025-01-01\": (\"Yılbaşı\", \"kesin\"),\n    \"2025-01-06\": (\"Referans penceresi yarıyıl tatilini içeriyor\", \"yöntem etkisi\"),\n    ...\n}\ntablo[\"aciklama\"] = [aciklamalar.get(t.strftime(\"%Y-%m-%d\"), (\"?\", \"?\"))[0] for t in tablo.index]\n...\ndx, dy, hizalama = ETIKET_KONUM.get(kod, (4, 3, \"left\"))", "adimlar": [{"baslik": "Liste: sıralı bir kutu", "html": "\n<p>Bir değişken tek bir değer tutar. Ama projende 12 ay, 5 yaş grubu, onlarca hat var. Birden çok değeri sırayla\nbir arada tutmak için <b>liste<\/b> kullanırsın: köşeli parantez, aralarında virgül.<\/p>\n<pre class=\"py\">yas_sirasi = [\"&lt;20\", \"20-30\", \"30-60\", \"60+\", \"Bilinmiyor\"]\nlen(yas_sirasi)     # 5 → eleman sayısı<\/pre>\n<h3>İndeks: sıra numarası 0'dan başlar<\/h3>\n<pre class=\"py\">yas_sirasi[0]       # \"&lt;20\"       → ilk eleman\nyas_sirasi[3]       # \"60+\"\nyas_sirasi[-1]      # \"Bilinmiyor\" → sondan birinci\nyas_sirasi[5]       # IndexError: 5 elemanlı listede son indeks 4<\/pre>\n<h3>Dilim: bir parçayı almak<\/h3>\n<p><code>liste[bas:bit]<\/code> yeni bir liste verir. Başlangıç dahildir, bitiş <b>dahil değildir<\/b>. Boş bırakılan taraf\n\"en baştan\" ya da \"sona kadar\" demektir. İsteğe bağlı üçüncü sayı adımdır.<\/p>\n<pre class=\"py\">aylar = [\"Oca\", \"Şub\", \"Mar\", \"Nis\", \"May\", \"Haz\"]\naylar[1:3]      # [\"Şub\", \"Mar\"]\naylar[:3]       # [\"Oca\", \"Şub\", \"Mar\"]  → ilk üç\naylar[-2:]      # [\"May\", \"Haz\"]         → son iki\naylar[::2]      # [\"Oca\", \"Mar\", \"May\"]  → birer atlayarak\naylar[::-1]     # tersten: [\"Haz\", \"May\", ... \"Oca\"]<\/pre>\n<p>Metinler de aynı kurala uyar: <code>\"2025-04-23\"[:4]<\/code> → <code>\"2025\"<\/code>. Projende\n<code>veri = ilk10.iloc[::-1]<\/code> satırı da bu fikri kullanıyor: yatay çubuk grafikte en büyük değer en üstte görünsün diye\nsıra ters çevriliyor.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Bitişin dahil olmaması ilk bakışta tuhaf gelir ama işi kolaylaştırır. <code>aylar[:3]<\/code>\ntam 3 eleman verir; <code>aylar[:3] + aylar[3:]<\/code> listenin tamamını boşluksuz ve tekrarsız geri verir.<\/div>\n", "ornek": "aylar = [\"Oca\", \"Şub\", \"Mar\", \"Nis\", \"May\", \"Haz\"]\nprint(aylar[0], aylar[-1])\nprint(aylar[1:3])\nprint(aylar[-2:])\nprint(aylar[::-1])\nprint(len(aylar), \"ay\")", "ornek_setup": []}, {"baslik": "Listeyi değiştirmek", "html": "\n<p>Liste oluşturulduktan sonra değiştirilebilir. En sık kullanacağın yöntemler:<\/p>\n<pre class=\"py\">hatlar = [\"M2\", \"T1\"]\nhatlar.append(\"M4\")          # sona bir eleman ekler → [\"M2\", \"T1\", \"M4\"]\nhatlar.extend([\"F1\", \"M2\"])  # başka listenin elemanlarını ekler\nhatlar[0] = \"M1\"             # 0. elemanı değiştirir\nhatlar.index(\"M4\")           # 2 → \"M4\" kaçıncı sırada?\nhatlar.count(\"M2\")           # 1 → kaç kez geçiyor?\n\"T1\" in hatlar               # True → listede var mı?<\/pre>\n<p>Projende <code>referans_hesapla<\/code> fonksiyonu boş listelerle başlıyor (<code>medyanlar, madlar, n_ler = [], [], []<\/code>)\nve döngünün her turunda <code>medyanlar.append(m)<\/code> ile bir değer ekliyor. \"Boş liste + append\" kalıbını çok göreceksin.<\/p>\n<h3>sort mu, sorted mı?<\/h3>\n<pre class=\"py\">sayilar = [3, 1, 2]\nyeni = sorted(sayilar)   # yeni, sıralı bir liste döner; sayilar değişmez\nsayilar.sort()           # listenin kendisini sıralar, None döndürür<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>sayilar = sayilar.sort()<\/code> yazmak. <code>.sort()<\/code> listeyi yerinde sıralar ve\n<code>None<\/code> döndürür; elinde liste yerine <code>None<\/code> kalır. Ya yalnızca <code>sayilar.sort()<\/code> ya da\n<code>sayilar = sorted(sayilar)<\/code>.<\/div>\n<h3>İki isim, tek liste<\/h3>\n<pre class=\"py\">a = [\"M2\", \"T1\"]\nb = a            # kopya DEĞİL: b de aynı listeyi gösterir\nb.append(\"M4\")\nprint(a)         # ['M2', 'T1', 'M4'] → a da değişti!\nc = a.copy()     # gerçek kopya; c'yi değiştirmek a'yı etkilemez<\/pre>\n<div class=\"neden\"><b>Neden böyle?<\/b> 1. durakta gördüğün gibi <code>=<\/code> sağdaki değeri soldaki isme <b>bağlar<\/b>, kopyalamaz.\nSayı ve metin değiştirilemediği için bu fark orada görünmez; liste değiştirilebildiği için burada görünür. pandas'ta\n<code>.copy()<\/code> görmenin sebebi de bu: projende <code>tablo = anomaliler[[...]].copy()<\/code> yazıp yeni sütunları kopyaya\neklemişsin.<\/div>\n", "ornek": "a = [\"M2\", \"T1\"]\nb = a\nb.append(\"M4\")\nprint(\"a:\", a)\n\nc = a.copy()\nc.append(\"F1\")\nprint(\"a:\", a, \"| c:\", c)\n\nsayilar = [3, 1, 2]\nprint(sorted(sayilar), sayilar)\nprint(sayilar.sort())   # None!\nprint(sayilar)", "ornek_setup": []}, {"baslik": "Tuple ve açma", "html": "\n<p><b>Tuple<\/b> listeye benzer ama normal parantezle yazılır ve oluşturulduktan sonra <b>değiştirilemez<\/b>. \"Bunlar birlikte bir\nbütün\" demek istediğin küçük gruplar için kullanılır: bir konum, bir (açıklama, güven) çifti.<\/p>\n<pre class=\"py\">konum = (4, 3, \"left\")\nkonum[0]          # 4 → indeks listedeki gibi çalışır\nkonum[0] = 10     # TypeError: tuple değiştirilemez<\/pre>\n<h3>Açma (unpacking)<\/h3>\n<p>Soldaki isim sayısı sağdaki eleman sayısına eşitse, elemanlar tek satırda ayrı değişkenlere dağıtılır:<\/p>\n<pre class=\"py\">dx, dy, hizalama = (4, 3, \"left\")\nprint(dx)          # 4\nprint(hizalama)    # left<\/pre>\n<p>Projende saçılım grafiğindeki etiketleri tam olarak böyle konumlamışsın:\n<code>dx, dy, hizalama = ETIKET_KONUM.get(kod, (4, 3, \"left\"))<\/code>. <code>rho, p = stats.spearmanr(...)<\/code> da öyle:\nfonksiyon iki değerlik bir tuple döndürüyor.<\/p>\n<h3>Döngüde açma<\/h3>\n<p><code>for x in liste:<\/code> listenin her elemanı için girintili satırları bir kez çalıştırır (ayrıntısı 4. durakta).\nElemanlar çift ise onları doğrudan iki isme açabilirsin:<\/p>\n<pre class=\"py\">for hat, ist in [(\"M2\", \"Taksim\"), (\"T1\", \"Eminönü\")]:\n    print(f\"{ist} ({hat})\")<\/pre>\n<p>Projendeki <code>etiketler = [f\"{ist} ({hat})\" for hat, ist in veri.index]<\/code> satırı da böyle: en yoğun istasyonlar\ngrafiğinde <code>veri<\/code>'nin indeksi (hat, istasyon) çiftlerinden oluşuyor.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Sayıları tutturamamak: <code>a, b = (1, 2, 3)<\/code> →\n<code>ValueError: too many values to unpack<\/code>. Soldaki isim sayısı sağdaki eleman sayısıyla aynı olmalı.<\/div>\n", "ornek": "konum = (4, 3, \"left\")\ndx, dy, hizalama = konum\nprint(dx, dy, hizalama)\n\nciftler = [(\"M2\", \"Taksim\"), (\"T1\", \"Eminönü\"), (\"M4\", \"Kozyatağı\")]\nfor hat, ist in ciftler:\n    print(f\"{ist} ({hat})\")\n\na, b = 1, 2\na, b = b, a     # takas: geçici değişken gerekmez\nprint(a, b)", "ornek_setup": []}, {"baslik": "Sözlük: anahtarla değere ulaşmak", "html": "\n<p>Listede bir değere sıra numarasıyla ulaşırsın. <b>Sözlükte<\/b> ise bir <b>anahtarla<\/b>: \"Metro'nun rengi ne?\"\nSüslü parantez içinde <code>anahtar: değer<\/code> çiftleri yazılır.<\/p>\n<pre class=\"py\">TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\nTUR_RENK[\"Metro\"]                  # \"#3b6ea5\"\nTUR_RENK[\"Teleferik\"] = \"#8c6bb1\"  # yeni anahtar ekler (varsa üzerine yazar)\n\"Metro\" in TUR_RENK                # True → in anahtarlara bakar<\/pre>\n<h3>Olmayan anahtar: köşeli parantez mi, get mi?<\/h3>\n<pre class=\"py\">TUR_RENK[\"Füniküler\"]              # KeyError: 'Füniküler'\nTUR_RENK.get(\"Füniküler\")          # None\nTUR_RENK.get(\"Füniküler\", \"gri\")   # \"gri\" → yoksa varsayılan<\/pre>\n<h3>Gezmek: keys, values, items<\/h3>\n<pre class=\"py\">for tur, renk in TUR_RENK.items():   # (anahtar, değer) çiftleri\n    print(tur, renk)\nlist(TUR_RENK)              # ['Metro', 'Tramvay', 'Teleferik'] → anahtarlar<\/pre>\n<p>Sözlük, anahtarların eklendiği sırayı korur. Projende lejantı hep Metro, Tramvay, Füniküler… sırasıyla göstermek için\n<code>list(TUR_RENK)<\/code> kullanman bu sayede işe yarıyor.<\/p>\n<h3>Değeri tuple olan sözlük<\/h3>\n<p>Değer herhangi bir şey olabilir: liste, tuple, hatta başka bir sözlük. Anomali bölümündeki <code>aciklamalar<\/code>'da\nher tarih bir (açıklama, güven) çiftine bağlı:<\/p>\n<pre class=\"py\">aciklamalar = {\"2025-01-01\": (\"Yılbaşı\", \"kesin\"),\n               \"2025-11-11\": (\"Açıklanamadı\", \"açıklanamadı\")}\naciklamalar[\"2025-01-01\"][1]                  # \"kesin\"\naciklamalar.get(\"2025-05-05\", (\"?\", \"?\"))[0]  # \"?\"<\/pre>\n<p>Kampüs hatları grafiğindeki <code>stiller<\/code> ise iç içe sözlük: <code>stiller[\"TF1\"][\"color\"]<\/code> önce hattı, sonra özelliği seçer.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Projendeki <code>.get(..., (\"?\", \"?\"))<\/code> satırında varsayılanın da bir çift olması bilinçli:\nardından <code>[0]<\/code> ya da <code>[1]<\/code> alınıyor. Varsayılan tek bir <code>\"?\"<\/code> olsaydı <code>[1]<\/code> hata verirdi\n(tek harfli metnin 1. indeksi yok). Varsayılan, gerçek değerle aynı biçimde olmalı.<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>in<\/code> ile değer aramak: <code>\"#3b6ea5\" in TUR_RENK<\/code> → <code>False<\/code>,\nçünkü <code>in<\/code> yalnızca anahtarlara bakar. Değerlerde aramak için <code>\"#3b6ea5\" in TUR_RENK.values()<\/code>.<\/div>\n", "ornek": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\nTUR_RENK[\"Teleferik\"] = \"#8c6bb1\"\nprint(TUR_RENK.get(\"Füniküler\", \"gri\"))\nprint(\"Metro\" in TUR_RENK, \"#3b6ea5\" in TUR_RENK)\n\naciklamalar = {\"2025-01-01\": (\"Yılbaşı\", \"kesin\"),\n               \"2025-04-19\": (\"AÖF ara sınavı\", \"olası\")}\nfor tarih, (aciklama, guven) in aciklamalar.items():   # değer de bir çift: parantezle açılır\n    print(tarih, aciklama, \"→\", guven)", "ornek_setup": []}, {"baslik": "Küme (set): tekrarsız topluluk", "html": "\n<p><b>Küme<\/b> her değeri yalnızca <b>bir kez<\/b> tutar ve sırası yoktur. Süslü parantezle yazılır ama iki nokta içermez;\nbir listeden <code>set(...)<\/code> ile de oluşturulur.<\/p>\n<pre class=\"py\">turler = [\"Metro\", \"Tramvay\", \"Metro\", \"Metro\"]\nset(turler)              # {'Metro', 'Tramvay'} → tekrarlar atıldı\nlen(set(turler))         # 2 → kaç farklı tür var?\n\"Metro\" in set(turler)   # True<\/pre>\n<p>Projende lejanttaki türleri toplarken <code>{hat_turu(kod) for kod in veri.index}<\/code> yazmışsın: yirmiyi aşkın hattan\nyalnızca 5 farklı tür kalıyor. (Bu yazımın adı küme üreteci; 4. durakta göreceksin.) pandas'taki <code>.nunique()<\/code>\nde \"kaç farklı değer var?\" sorusunun aynısı.<\/p>\n<h3>Kesişim, birleşim, fark<\/h3>\n<pre class=\"py\">sefer_var = {\"M2\", \"M4\", \"T1\", \"TF1\"}\nyolcu_var = {\"M2\", \"M4\", \"T1\", \"Marmaray\", \"M11\"}\nsefer_var &amp; yolcu_var    # {'M2', 'M4', 'T1'} → ikisinde de olan\nsefer_var | yolcu_var    # hepsi, tekrarsız\nyolcu_var - sefer_var    # {'Marmaray', 'M11'} → yolcusu olup seferi olmayan<\/pre>\n<p>Son satır, projende <code>merge<\/code> sonrası <code>isna()<\/code> ile bulduğun \"sefer verisi olmayan hatlar\" listesinin küme\nhâli.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Boş küme için <code>{}<\/code> yazmak. <code>{}<\/code> boş <b>sözlüktür<\/b>; boş küme\n<code>set()<\/code> ile yapılır. Bir de: kümenin sırası olmadığı için <code>kume[0]<\/code> hata verir. Sıralı bir liste gerekiyorsa\n<code>sorted(kume)<\/code>.<\/div>\n", "ornek": "turler = [\"Metro\", \"Tramvay\", \"Metro\", \"Füniküler\", \"Metro\"]\nprint(set(turler))              # sırası her seferinde farklı olabilir\nprint(len(set(turler)), \"farklı tür\")\n\nsefer_var = {\"M2\", \"M4\", \"T1\", \"TF1\"}\nyolcu_var = {\"M2\", \"M4\", \"T1\", \"Marmaray\", \"M11\"}\nprint(sorted(sefer_var & yolcu_var))\nprint(sorted(yolcu_var - sefer_var))", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["\"Oca\"", "\"Şub\"", "\"Ara\"", "hata"], "a": 2, "why": "<code>-1<\/code> sondan birinci elemandır.", "tags": ["liste"], "code": "aylar = [\"Oca\", \"Şub\", \"Mar\", \"Ara\"]\nprint(aylar[-1])", "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "<code>[10, 20, 30, 40, 50][1:3]<\/code> neyi verir?", "opts": ["[10, 20, 30]", "[20, 30]", "[20, 30, 40]", "[10, 20]"], "a": 1, "why": "Başlangıç (1) dahil, bitiş (3) hariç: indeks 1 ve 2.", "tags": ["dilim"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["[1, 2]", "[1, 2, 3]", "[3]", "hata"], "a": 1, "why": "<code>b = a<\/code> kopya yapmaz; iki isim aynı listeyi gösterir. <code>b<\/code>'ye eklenen <code>a<\/code>'da da görünür.", "tags": ["liste"], "code": "a = [1, 2]\nb = a\nb.append(3)\nprint(a)", "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "<code>x = [3, 1, 2].sort()<\/code> satırından sonra <code>x<\/code> nedir?", "opts": ["[1, 2, 3]", "[3, 1, 2]", "None", "hata"], "a": 2, "why": "<code>.sort()<\/code> listeyi yerinde sıralar ve <code>None<\/code> döndürür. Sıralı bir liste almak için <code>sorted(...)<\/code>.", "tags": ["liste"], "code": null, "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["4", "3", "left", "(4, 3)"], "a": 1, "why": "Açmada sıra korunur: <code>x<\/code> = 4, <code>y<\/code> = 3, <code>z<\/code> = \"left\".", "tags": ["tuple"], "code": "x, y, z = (4, 3, \"left\")\nprint(y)", "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "<code>a, b = (1, 2, 3)<\/code> ne olur?", "opts": ["a = 1, b = 2 olur; 3 atılır", "a = 1, b = (2, 3) olur", "ValueError hatası", "a = (1, 2, 3) olur, b boş kalır"], "a": 2, "why": "İki isme üç değer açılamaz: <code>ValueError: too many values to unpack<\/code>.", "tags": ["tuple"], "code": null, "rev": false, "zorluk": 2, "yer": "a2"}, {"t": "fill", "q": "Sözlükte olmayan hat için hata yerine <code>\"gri\"<\/code> dönsün.", "code": "renk = {\"M1\": \"kırmızı\", \"M2\": \"yeşil\"}\nprint(renk.___(\"M9\", ___))", "a": [["get"], ["\"gri\""]], "why": "<code>.get(anahtar, varsayılan)<\/code>: anahtar yoksa varsayılanı döndürür.", "tags": ["sozluk"], "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>d = {\"a\": 1}<\/code> iken <code>d[\"b\"]<\/code> ne olur?", "opts": ["None", "0", "KeyError hatası", "\"b\""], "a": 2, "why": "Köşeli parantezle olmayan bir anahtar istenirse <code>KeyError<\/code>. Güvenli yol: <code>d.get(\"b\")<\/code>.", "tags": ["sozluk"], "code": null, "rev": false, "zorluk": 1, "yer": "a3"}, {"t": "mc", "q": "<code>len({\"M2\", \"T1\", \"M2\", \"M2\"})<\/code> kaçtır?", "opts": ["4", "3", "2", "1"], "a": 2, "why": "Küme tekrarları tutmaz: geriye <code>{\"M2\", \"T1\"}<\/code> kalır.", "tags": ["kume"], "code": null, "rev": false, "zorluk": 1, "yer": "a4"}, {"t": "mc", "q": "<code>x = {}<\/code> satırından sonra <code>x<\/code> nedir?", "opts": ["Boş küme", "Boş sözlük", "Boş liste", "Hata verir"], "a": 1, "why": "<code>{}<\/code> boş sözlüktür. Boş küme için <code>set()<\/code> yazılır.", "tags": ["kume", "sozluk"], "code": null, "rev": false, "zorluk": 2, "yer": "a4"}, {"t": "mc", "q": "<code>\"Yenikapı\"[:4]<\/code> neyi verir?", "opts": ["\"Yeni\"", "\"Yenik\"", "\"kapı\"", "\"ı\""], "a": 0, "why": "Metinler de liste gibi dilimlenir: indeks 0, 1, 2, 3.", "tags": ["dilim"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "<code>aylar[::-1]<\/code> ne yapar?", "opts": ["İlk elemanı siler", "Listeyi ters sırada verir", "Son elemanı verir", "Hata verir"], "a": 1, "why": "Adım -1 olunca liste sondan başa okunur.", "tags": ["dilim"], "code": null, "rev": false, "zorluk": 1, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> <code>TUR_RENK<\/code> sözlüğüne <code>\"Teleferik\"<\/code> anahtarıyla <code>\"#8c6bb1\"<\/code> değerini ekle, sonra sözlükteki anahtar sayısını <code>adet<\/code> değişkenine ata.", "starter": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\n\n", "sol": "TUR_RENK = {\"Metro\": \"#3b6ea5\", \"Tramvay\": \"#e08a3c\"}\nTUR_RENK[\"Teleferik\"] = \"#8c6bb1\"\nadet = len(TUR_RENK)", "test": "assert TUR_RENK.get(\"Teleferik\") == \"#8c6bb1\", \"Teleferik anahtarı yok ya da değeri yanlış\"\nassert adet == 3, \"adet 3 olmalı\"", "hint": "Ekleme: <code>sozluk[anahtar] = deger<\/code>. Sayma: <code>len(...)<\/code>.", "tags": ["sozluk"], "setup": [], "rev": false, "why": "", "zorluk": 1, "hata": false, "yer": "al"}, {"t": "order", "q": "Satırları doğru sıraya koy: sözlükten bir tarihin (açıklama, güven) çiftini alıp <code>Yılbaşı (kesin)<\/code> yazdır.", "lines": ["aciklamalar = {\"2025-01-01\": (\"Yılbaşı\", \"kesin\")}", "cift = aciklamalar.get(\"2025-01-01\", (\"?\", \"?\"))", "aciklama, guven = cift", "print(f\"{aciklama} ({guven})\")"], "why": "Önce sözlük tanımlanır, sonra çift alınır, sonra açılır, en son yazdırılır. Her satır bir öncekinin sonucunu kullanır.", "tags": ["sozluk", "tuple"], "rev": false, "zorluk": 1, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["2", "3", "4", "hata"], "a": 1, "why": "<code>append<\/code> tek bir eleman ekler; burada eklenen eleman bir listenin kendisi: <code>['M2', 'T1', ['F1', 'TF2']]<\/code>. Elemanları tek tek eklemek için <code>extend<\/code> kullanılır.", "tags": ["liste"], "code": "hatlar = [\"M2\", \"T1\"]\nhatlar.append([\"F1\", \"TF2\"])\nprint(len(hatlar))", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "fill", "q": "Listeyi bozmadan sıralı bir kopya al, sonra en küçük iki değeri yazdır.", "code": "yolcu = [23.3, 145.2, 12.5, 107.0, 73.3]\nsirali = ___(yolcu)\nprint(sirali[___])   # [12.5, 23.3]\nprint(yolcu)         # değişmemiş olmalı", "a": [["sorted"], [":2", "0:2"]], "why": "<code>sorted<\/code> yeni liste döndürür, <code>yolcu<\/code> bozulmaz; <code>[:2]<\/code> ilk iki eleman.", "tags": ["liste", "dilim"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["kesin", "?", "None", "KeyError hatası"], "a": 1, "why": "\"2025-01-02\" sözlükte yok; <code>.get<\/code> varsayılan çifti <code>(\"?\", \"?\")<\/code> döndürür, onun 1. elemanı da <code>\"?\"<\/code>.", "tags": ["sozluk", "tuple"], "code": "aciklamalar = {\"2025-01-01\": (\"Yılbaşı\", \"kesin\")}\nprint(aciklamalar.get(\"2025-01-02\", (\"?\", \"?\"))[1])", "rev": false, "zorluk": 2, "yer": "al"}, {"t": "fill", "q": "İç içe sözlükten F4'ün çizgi stilini (<code>--<\/code>) al.", "code": "stiller = {\"TF1\": {\"color\": \"#3b6ea5\", \"linestyle\": \"-\"},\n           \"F4\": {\"color\": \"#3b6ea5\", \"linestyle\": \"--\"}}\nprint(stiller[___][___])", "a": [["\"F4\""], ["\"linestyle\""]], "why": "Önce dıştaki anahtar (hat), sonra içteki anahtar (özellik): <code>stiller[\"F4\"][\"linestyle\"]<\/code>.", "tags": ["sozluk"], "rev": false, "zorluk": 2, "yer": "al"}, {"t": "mc", "q": "<code>{\"M2\", \"M4\", \"T1\"} &amp; {\"M4\", \"T1\", \"F1\"}<\/code> neyi verir?", "opts": ["{'M4', 'T1'}", "{'M2', 'M4', 'T1', 'F1'}", "{'M2'}", "{'F1'}"], "a": 0, "why": "<code>&amp;<\/code> kesişimdir: iki kümede de olan elemanlar.", "tags": ["kume"], "code": null, "rev": false, "zorluk": 2, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> <code>yedek<\/code> listesinin hatların <b>ilk hâlini<\/b> saklaması gerekiyordu, ama <code>hatlar<\/code>'a eklenen TF1 <code>yedek<\/code>'te de görünüyor. Düzelt: <code>yedek<\/code> <code>[\"M2\", \"T1\", \"M4\"]<\/code> kalsın, <code>hatlar<\/code>'a TF1 eklensin.", "starter": "hatlar = [\"M2\", \"T1\", \"M4\"]\nyedek = hatlar\nhatlar.append(\"TF1\")\nprint(yedek)\n", "sol": "hatlar = [\"M2\", \"T1\", \"M4\"]\nyedek = hatlar.copy()\nhatlar.append(\"TF1\")\nprint(yedek)\n", "test": "assert yedek == [\"M2\", \"T1\", \"M4\"], f\"yedek değişmemeli, şu an {yedek}\"\nassert hatlar == [\"M2\", \"T1\", \"M4\", \"TF1\"], f\"hatlar'a TF1 eklenmeli, şu an {hatlar}\"", "hint": "<code>yedek = hatlar<\/code> kopya yapmaz. <code>hatlar.copy()<\/code> (ya da <code>list(hatlar)<\/code>) gerçek bir kopya verir.", "tags": ["liste"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Hatayı bul:<\/b> Aylık günlük ortalamaları sıralayıp en düşüğünü yazdırmak istiyor ama <code>TypeError: 'NoneType' object is not subscriptable<\/code> alıyor. Düzelt ki <code>en_dusuk<\/code> 2.44 olsun.", "starter": "aylik = [3.02, 2.95, 3.10, 2.44, 3.19]\nsirali = aylik.sort()\nen_dusuk = sirali[0]\nprint(en_dusuk)\n", "sol": "aylik = [3.02, 2.95, 3.10, 2.44, 3.19]\nsirali = sorted(aylik)\nen_dusuk = sirali[0]\nprint(en_dusuk)\n", "test": "assert en_dusuk == 2.44, f\"en_dusuk 2.44 olmalı, şu an {en_dusuk}\"", "hint": "<code>aylik.sort()<\/code> <code>None<\/code> döndürür. Yeni sıralı liste için <code>sorted(aylik)<\/code> kullan.", "tags": ["liste"], "setup": [], "rev": false, "why": "", "zorluk": 2, "hata": true, "yer": "al"}, {"t": "code", "q": "<b>Dene:<\/b> Yolcu verisinde ve sefer verisinde geçen hat kodları iki listede (tekrarlı). Kümelerle:<br><code>ortak<\/code>: iki listede de olan hatların <b>sıralı listesi<\/b>,<br><code>eksik<\/code>: yolcu verisinde olup sefer verisinde olmayan hatların <b>sıralı listesi<\/b>.", "starter": "yolcu_hatlar = [\"M2\", \"M4\", \"T1\", \"Marmaray\", \"M2\", \"M11\", \"T1\", \"TF1\"]\nsefer_hatlar = [\"M2\", \"M4\", \"T1\", \"TF1\", \"M4\"]\n\nortak = \neksik = \n", "sol": "yolcu_hatlar = [\"M2\", \"M4\", \"T1\", \"Marmaray\", \"M2\", \"M11\", \"T1\", \"TF1\"]\nsefer_hatlar = [\"M2\", \"M4\", \"T1\", \"TF1\", \"M4\"]\n\nortak = sorted(set(yolcu_hatlar) & set(sefer_hatlar))\neksik = sorted(set(yolcu_hatlar) - set(sefer_hatlar))\nprint(ortak, eksik)", "test": "assert ortak == [\"M2\", \"M4\", \"T1\", \"TF1\"], f\"ortak yanlış: {ortak}\"\nassert eksik == [\"M11\", \"Marmaray\"], f\"eksik yanlış: {eksik}\"", "hint": "Önce iki listeyi <code>set(...)<\/code> ile kümeye çevir; <code>&amp;<\/code> kesişim, <code>-<\/code> fark. Sonucu <code>sorted(...)<\/code> ile listeye çevir. (<code>sorted<\/code> metinleri harf harf karşılaştırır: \"M11\", \"M2\"'den önce gelir.)", "tags": ["kume", "liste"], "setup": [], "rev": false, "why": "", "zorluk": 3, "hata": false, "yer": "al"}, {"t": "code", "q": "<b>Anomali açıklamalarının güven dağılımı.<\/b> Aşağıdaki <code>aciklamalar<\/code> sözlüğü projendekinin aynısı: her tarih bir (açıklama, güven) çiftine bağlı. Projende güven düzeylerini <code>tablo[\"guven\"].value_counts()<\/code> tek satırda sayıyor; burada aynı işi sözlükle elle yapacaksın.<br>1) <code>sayac<\/code> sözlüğünü doldur: her güven düzeyi → kaç gün (ör. <code>{\"kesin\": 17, ...}<\/code>).<br>2) <code>aciklanan<\/code>: sebebi bulunan gün sayısı, yani <code>\"kesin\"<\/code> ve <code>\"olası\"<\/code> günlerinin toplamı.<br>3) Her düzeyi toplam içindeki yüzdesiyle şu biçimde yazdır: <code>kesin: 17 gün (%73.9)<\/code>", "starter": "aciklamalar = {\n    \"2025-01-01\": (\"Yılbaşı\", \"kesin\"),\n    \"2025-01-06\": (\"Referans penceresi yarıyıl tatilini içeriyor\", \"yöntem etkisi\"),\n    \"2025-01-07\": (\"Referans penceresi yarıyıl tatilini içeriyor\", \"yöntem etkisi\"),\n    \"2025-02-21\": (\"Yoğun kar; okullar tatil\", \"kesin\"),\n    \"2025-03-29\": (\"Ramazan Bayramı arifesi\", \"kesin\"),\n    \"2025-03-31\": (\"Ramazan Bayramı\", \"kesin\"),\n    \"2025-04-01\": (\"Ramazan Bayramı\", \"kesin\"),\n    \"2025-04-02\": (\"Okulların 2. dönem ara tatili\", \"kesin\"),\n    \"2025-04-03\": (\"Okulların 2. dönem ara tatili\", \"kesin\"),\n    \"2025-04-04\": (\"Okulların 2. dönem ara tatili\", \"kesin\"),\n    \"2025-04-19\": (\"AÖF ara sınavı; sınava girenlere ücretsiz ulaşım\", \"olası\"),\n    \"2025-04-23\": (\"23 Nisan tatili + öğlen 6,2'lik deprem\", \"kesin\"),\n    \"2025-04-24\": (\"Deprem sonrası okullar ve üniversiteler tatil\", \"kesin\"),\n    \"2025-04-25\": (\"Deprem sonrası okullar ve üniversiteler tatil\", \"kesin\"),\n    \"2025-05-01\": (\"1 Mayıs; Valilik kararıyla istasyon ve hat kapatmaları\", \"kesin\"),\n    \"2025-06-06\": (\"Kurban Bayramı\", \"kesin\"),\n    \"2025-06-09\": (\"Kurban Bayramı\", \"kesin\"),\n    \"2025-10-28\": (\"Cumhuriyet Bayramı arifesi\", \"kesin\"),\n    \"2025-10-29\": (\"Cumhuriyet Bayramı\", \"kesin\"),\n    \"2025-11-11\": (\"Açıklanamadı\", \"açıklanamadı\"),\n    \"2025-12-07\": (\"Açıklanamadı\", \"açıklanamadı\"),\n    \"2025-12-28\": (\"Açıklanamadı (referans penceresi kısa)\", \"açıklanamadı\"),\n    \"2025-12-31\": (\"Yılbaşı arifesi\", \"kesin\"),\n}\n\n# 1) her güven düzeyini say\nsayac = {}\n\n\n# 2) sebebi bulunan gün sayısı\naciklanan =\n\n# 3) her düzeyi \"kesin: 17 gün (%73.9)\" biçiminde yazdır\n", "sol": "aciklamalar = {\n    \"2025-01-01\": (\"Yılbaşı\", \"kesin\"),\n    \"2025-01-06\": (\"Referans penceresi yarıyıl tatilini içeriyor\", \"yöntem etkisi\"),\n    \"2025-01-07\": (\"Referans penceresi yarıyıl tatilini içeriyor\", \"yöntem etkisi\"),\n    \"2025-02-21\": (\"Yoğun kar; okullar tatil\", \"kesin\"),\n    \"2025-03-29\": (\"Ramazan Bayramı arifesi\", \"kesin\"),\n    \"2025-03-31\": (\"Ramazan Bayramı\", \"kesin\"),\n    \"2025-04-01\": (\"Ramazan Bayramı\", \"kesin\"),\n    \"2025-04-02\": (\"Okulların 2. dönem ara tatili\", \"kesin\"),\n    \"2025-04-03\": (\"Okulların 2. dönem ara tatili\", \"kesin\"),\n    \"2025-04-04\": (\"Okulların 2. dönem ara tatili\", \"kesin\"),\n    \"2025-04-19\": (\"AÖF ara sınavı; sınava girenlere ücretsiz ulaşım\", \"olası\"),\n    \"2025-04-23\": (\"23 Nisan tatili + öğlen 6,2'lik deprem\", \"kesin\"),\n    \"2025-04-24\": (\"Deprem sonrası okullar ve üniversiteler tatil\", \"kesin\"),\n    \"2025-04-25\": (\"Deprem sonrası okullar ve üniversiteler tatil\", \"kesin\"),\n    \"2025-05-01\": (\"1 Mayıs; Valilik kararıyla istasyon ve hat kapatmaları\", \"kesin\"),\n    \"2025-06-06\": (\"Kurban Bayramı\", \"kesin\"),\n    \"2025-06-09\": (\"Kurban Bayramı\", \"kesin\"),\n    \"2025-10-28\": (\"Cumhuriyet Bayramı arifesi\", \"kesin\"),\n    \"2025-10-29\": (\"Cumhuriyet Bayramı\", \"kesin\"),\n    \"2025-11-11\": (\"Açıklanamadı\", \"açıklanamadı\"),\n    \"2025-12-07\": (\"Açıklanamadı\", \"açıklanamadı\"),\n    \"2025-12-28\": (\"Açıklanamadı (referans penceresi kısa)\", \"açıklanamadı\"),\n    \"2025-12-31\": (\"Yılbaşı arifesi\", \"kesin\"),\n}\n\n# 1) her güven düzeyini say\nsayac = {}\nfor aciklama, guven in aciklamalar.values():\n    sayac[guven] = sayac.get(guven, 0) + 1\n\n# 2) sebebi bulunan gün sayısı\naciklanan = sayac[\"kesin\"] + sayac[\"olası\"]\n\n# 3) her düzeyi \"kesin: 17 gün (%73.9)\" biçiminde yazdır\ntoplam = len(aciklamalar)\nfor guven, adet in sayac.items():\n    print(f\"{guven}: {adet} gün (%{adet / toplam * 100:.1f})\")\n", "test": "assert sayac == {\"kesin\": 17, \"yöntem etkisi\": 2, \"olası\": 1, \"açıklanamadı\": 3}, f\"sayac yanlış: {sayac}\"\nassert aciklanan == 18, f\"aciklanan 18 olmalı (17 kesin + 1 olası), şu an {aciklanan}\"\nfor satir in [\"kesin: 17 gün (%73.9)\", \"yöntem etkisi: 2 gün (%8.7)\", \"olası: 1 gün (%4.3)\", \"açıklanamadı: 3 gün (%13.0)\"]:\n    assert satir in __cikti__, f\"Çıktıda şu satır yok: {satir!r}\"", "hint": "Değerler (açıklama, güven) çifti: <code>for aciklama, guven in aciklamalar.values():<\/code>. Saymak için <code>sayac[guven] = sayac.get(guven, 0) + 1<\/code>: ilk görüşte 0'dan başlar. Yüzde: <code>adet / len(aciklamalar) * 100<\/code>, biçim <code>:.1f<\/code>. Yazdırmak için <code>for guven, adet in sayac.items():<\/code>.", "tags": ["sozluk", "tuple", "fstring"], "setup": [], "rev": false, "why": "<code>sozluk.get(anahtar, 0) + 1<\/code> kalıbı \"say\" demenin en kısa yoludur; pandas'ın <code>value_counts()<\/code>'u da arka planda aynı işi yapar.", "zorluk": 3, "hata": false, "yer": "proje"}, {"t": "mc", "q": "<code>len([\"M1\", \"M2\", \"M4\"])<\/code> kaçtır?", "opts": ["2", "3", "4", "M4"], "a": 1, "why": "Listede 3 eleman var.", "tags": ["liste"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>aylar<\/code> 12 ay adından oluşan bir listeyse <code>aylar[-2:]<\/code> neyi verir?", "opts": ["[\"Kas\", \"Ara\"]", "[\"Ara\"]", "[\"Oca\", \"Şub\"]", "[\"Eki\", \"Kas\"]"], "a": 0, "why": "<code>-2<\/code> sondan ikinci elemandan başlar, bitiş boş olduğu için sona kadar gider.", "tags": ["dilim"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>t = (1, 2)<\/code> iken <code>t[0] = 5<\/code> ne olur?", "opts": ["t = (5, 2) olur", "t = (1, 2, 5) olur", "TypeError hatası", "Hiçbir şey olmaz"], "a": 2, "why": "Tuple değiştirilemez; değiştirmek gerekiyorsa liste kullanılır.", "tags": ["tuple"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}, {"t": "mc", "q": "<code>list({\"Metro\": 1, \"Tramvay\": 2})<\/code> neyi verir?", "opts": ["[\"Metro\", \"Tramvay\"]", "[1, 2]", "[(\"Metro\", 1), (\"Tramvay\", 2)]", "hata"], "a": 0, "why": "Sözlüğü listeye çevirince (ya da üzerinde gezince) <b>anahtarlar<\/b> gelir. Değerler için <code>.values()<\/code>, çiftler için <code>.items()<\/code>.", "tags": ["sozluk"], "code": null, "rev": true, "zorluk": 1, "yer": "rev"}]}, {"id": "b3", "no": 3, "tur": "ders", "baslik": "Koşullar ve fonksiyonlar", "hat": "M3", "ozet": "Doğru mu yanlış mı: if/elif/else ile karar vermek, def ile bir işi paketleyip tekrar kullanmak.", "dosya": "analiz.ipynb", "proje": "def hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod == \"IETT TUNEL\":\n        return \"Füniküler\"\n    if kod == \"IETT NOSTALJIK TRAMVAY\":\n        return \"Tramvay\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"\n\ndef baslik_ekle(ax, baslik, altbaslik=None):\n    ax.set_title(baslik, loc=\"left\", fontsize=12, fontweight=\"bold\", pad=22 if altbaslik else 10)\n    if altbaslik:\n        ax.text(0, 1.02, altbaslik, transform=ax.transAxes, fontsize=9, color=\"gray\", va=\"bottom\")\n\ndef footer_ekle(fig, donem, birim, not_metni=None):\n    satir = f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"\n    if not_metni:\n        satir = not_metni + \"\\n\" + satir\n    fig.text(0.01, 0.01, satir, fontsize=7, color=\"gray\", va=\"bottom\")", "adimlar": [{"baslik": "Karşılaştırma ve doğruluk değeri", "html": "\n<p>Program karar verirken bir soruya \"evet\" ya da \"hayır\" cevabı arar. Bu cevabın tipi <code>bool<\/code>'dur:\n<code>True<\/code> ya da <code>False<\/code>. Karşılaştırmalar böyle bir değer üretir:<\/p>\n<pre class=\"py\">yolcu = 23_301_956\nyolcu &gt; 1_000_000      # True\nyolcu == 0             # False  → eşit mi? (iki eşittir)\nkod = \"TF1\"\nkod != \"M2\"            # True   → eşit değil mi?\nkod.startswith(\"TF\")   # True   → \"TF\" ile mi başlıyor?\n\"M\" in kod             # False  → içinde \"M\" geçiyor mu?<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Karşılaştırmada tek eşittir yazmak: <code>if kod = \"M2\":<\/code> →\n<code>SyntaxError<\/code>. Tek <code>=<\/code> değer atar, çift <code>==<\/code> karşılaştırır.<\/div>\n<h3>Her değerin bir doğruluğu var<\/h3>\n<p><code>if<\/code>'in yanına yalnızca True/False değil, <b>herhangi bir değer<\/b> yazabilirsin. Python onu \"doğru gibi\" ya da\n\"yanlış gibi\" yorumlar. Yanlış sayılanların listesi kısa:<\/p>\n<pre class=\"py\">bool(None)   # False\nbool(0)      # False   (0.0 da)\nbool(\"\")     # False   → boş metin\nbool([])     # False   → boş liste ({} ve set() de)\nbool(\"0\")    # True!   → içi dolu bir metin\nbool([0])    # True    → bir elemanı olan liste<\/pre>\n<p>Geri kalan her şey doğru sayılır. Projendeki <code>baslik_ekle<\/code> tam bunu kullanıyor: <code>if altbaslik:<\/code> satırı\n\"alt başlık verildiyse ve boş değilse\" demek. <code>None<\/code> gelse de <code>\"\"<\/code> gelse de alt başlık yazılmaz.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>if altbaslik is not None and altbaslik != \"\":<\/code> yazmak da doğru olurdu ama uzun.\n\"Boş olan her şey yanlıştır\" kuralı sayesinde en sık sorulan soru (\"içinde bir şey var mı?\") tek kelimeyle sorulur.<\/div>\n", "ornek": "for deger in [None, 0, \"\", [], \"0\", [0], \"Alt başlık\"]:\n    print(repr(deger), \"→\", bool(deger))\n\nkod = \"TF1\"\nprint(kod.startswith(\"TF\"), kod.startswith(\"M\"), \"F\" in kod)", "ornek_setup": []}, {"baslik": "if / elif / else ve and, or, not", "html": "\n<pre class=\"py\">yolcu = 5_000_000\nif yolcu &gt; 10_000_000:\n    print(\"büyük hat\")\nelif yolcu &gt; 1_000_000:\n    print(\"orta hat\")      # bu çalışır\nelse:\n    print(\"küçük hat\")<\/pre>\n<p>Python yukarıdan aşağı bakar ve <b>ilk doğru<\/b> koşulun bloğunu çalıştırır; sonrakilere hiç bakmaz. <code>elif<\/code>\n\"değilse şuna bak\", <code>else<\/code> \"hiçbiri tutmadıysa\" demektir; ikisi de isteğe bağlıdır. Hangi satırların koşula ait\nolduğunu <b>girinti<\/b> (4 boşluk) belirler; koşul satırı iki noktayla (<code>:<\/code>) biter.<\/p>\n<h3>Koşulları birleştirmek<\/h3>\n<pre class=\"py\">kod == \"Marmaray\" or kod.startswith(\"TCDD\")   # biri doğruysa yeter\nyolcu &gt; 1_000 and yolcu &lt; 5_000               # ikisi de doğru olmalı\nnot hafta_sonu                                 # tersine çevirir<\/pre>\n<p><code>hat_turu<\/code>'nun ilk satırı <code>or<\/code> kullanıyor: Marmaray da, TCDD ile başlayan Sirkeci–Kazlıçeşme de aynı türe\ngidiyor. (pandas sütunlarında <code>and<\/code>/<code>or<\/code> yerine <code>&amp;<\/code>/<code>|<\/code> kullanılır; anomali\nkoşulundaki <code>&amp;<\/code> bu yüzden.)<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> <code>if kod == \"M2\" or \"M4\":<\/code> yazmak. Bu,\n<code>(kod == \"M2\") or (\"M4\")<\/code> diye okunur; <code>\"M4\"<\/code> boş olmayan bir metin olduğu için koşul <b>her zaman\ndoğrudur<\/b>. Doğrusu: <code>kod == \"M2\" or kod == \"M4\"<\/code>, daha kısası <code>kod in (\"M2\", \"M4\")<\/code>.<\/div>\n<h3>Tek satırlık if<\/h3>\n<pre class=\"py\">pad = 22 if altbaslik else 10<\/pre>\n<p>\"Alt başlık varsa 22, yoksa 10.\" <code>baslik_ekle<\/code>'deki <code>pad=22 if altbaslik else 10<\/code> bu; pasta grafiğindeki\n<code>ha=\"left\" if x &gt; 0 else \"right\"<\/code> da etiketin sağa mı sola mı hizalanacağını böyle seçiyor.<\/p>\n", "ornek": "yolcu = 5_000_000\nif yolcu > 10_000_000:\n    print(\"büyük hat\")\nelif yolcu > 1_000_000:\n    print(\"orta hat\")\nelse:\n    print(\"küçük hat\")\n\nkod = \"T1\"\nprint(kod == \"M2\" or \"M4\")     # tuzak: \"M4\" döner, o da doğru sayılır\nprint(kod in (\"M2\", \"M4\"))     # doğrusu\n\naltbaslik = None\nprint(22 if altbaslik else 10)", "ornek_setup": []}, {"baslik": "Fonksiyon: bir işi paketlemek", "html": "\n<p>Aynı işi birçok yerde yapıyorsan onu bir kez <b>fonksiyon<\/b> olarak yazar, sonra adıyla çağırırsın. Projende\n<code>hat_turu<\/code> her grafikte, <code>baslik_ekle<\/code> ve <code>footer_ekle<\/code> her şekilde tekrar tekrar çağrılıyor.<\/p>\n<pre class=\"py\">def milyon(sayi):                      # def, isim, parametre, iki nokta\n    return round(sayi / 1_000_000, 1)  # girintili gövde\n\nmilyon(23_301_956)    # 23.3\nmilyon(950_000)       # 0.9<\/pre>\n<p><code>sayi<\/code> bir <b>parametredir<\/b>: çağırırken verdiğin değer (<b>argüman<\/b>) bu isme bağlanır. <code>return<\/code>\nsonucu çağrılan yere geri verir ve fonksiyonu <b>hemen bitirir<\/b>; ondan sonraki satırlar çalışmaz.<\/p>\n<h3>return ile print aynı şey değil<\/h3>\n<pre class=\"py\">def yaz(sayi):\n    print(sayi / 1_000_000)     # ekrana yazar, geriye bir şey vermez\n\ndef ver(sayi):\n    return sayi / 1_000_000     # değeri geri verir\n\nx = yaz(5_000_000)   # ekranda 5.0 görünür ama x = None\ny = ver(5_000_000)   # ekranda bir şey yok, y = 5.0\ny + 1                # 6.0\nx + 1                # TypeError: None ile toplama yapılamaz<\/pre>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Sonucu <code>print<\/code> edip <code>return<\/code> etmeyi unutmak. Ekranda doğru sayıyı\ngördüğün için her şey yolunda sanırsın; ama sonucu bir değişkene ya da listeye koyunca elinde <code>None<\/code> olur.\n<code>return<\/code> satırı olmayan fonksiyon her zaman <code>None<\/code> döndürür.<\/div>\n<div class=\"neden\"><b>Neden böyle?<\/b> <code>print<\/code> insana, <code>return<\/code> programa konuşur.\n<code>renkler = [TUR_RENK[hat_turu(kod)] for kod in veri.index]<\/code> satırının çalışması için <code>hat_turu<\/code>'nun türü\nekrana yazması değil, <b>döndürmesi<\/b> gerekir.<\/div>\n", "ornek": "def milyon(sayi):\n    return round(sayi / 1_000_000, 1)\n\ndef yaz(sayi):\n    print(sayi / 1_000_000)\n\na = milyon(23_301_956)\nb = yaz(23_301_956)\nprint(\"a =\", a)\nprint(\"b =\", b)", "ornek_setup": []}, {"baslik": "Koşul sırası: hat_turu nasıl çalışıyor?", "html": "\n<p>Artık projendeki <code>hat_turu<\/code>'yu okuyabilirsin. Her <code>if<\/code>'in içinde bir <code>return<\/code> var: ilk tutan\nkoşul türü döndürür ve fonksiyon orada biter. Bu yüzden <code>elif<\/code> yazmaya gerek kalmamış; bir önceki if tuttuysa\nsonrakilere zaten gelinmez.<\/p>\n<pre class=\"py\">def hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod == \"IETT TUNEL\":\n        return \"Füniküler\"\n    if kod == \"IETT NOSTALJIK TRAMVAY\":\n        return \"Tramvay\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"          # hiçbiri tutmadıysa: F1, F2, F4<\/pre>\n<p><code>\"TF1\"<\/code> hem <code>\"TF\"<\/code> hem <code>\"T\"<\/code> ile başlıyor. TF kontrolü T'den <b>önce<\/b> geldiği için teleferik\ndoğru sınıflanıyor. Sırayı değiştirseydin TF1 ve TF2 sessizce \"Tramvay\" olurdu: hata mesajı yok, yalnızca grafikte yanlış renk.\nAynısı Marmaray için de geçerli: o da \"M\" ile başlıyor! İlk satır en üstte olmasaydı Marmaray \"Metro\" sayılırdı.<\/p>\n<div class=\"neden\"><b>Neden böyle?<\/b> Genel kuralı başa koyarsan, ona uyan her özel durumu yutar. Kural: <b>en dar koşul önce,\nen geniş koşul sona<\/b>. İstisnalar (Marmaray, IETT hatları) en üstte; \"TF ile başlıyor\" \"T ile başlıyor\"dan daha dar olduğu için\nondan önce; en sonda da \"geri kalan her şey\".<\/div>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Her yolun bir <code>return<\/code>'e çıktığından emin olmamak. Son satırdaki\n<code>return \"Füniküler\"<\/code> olmasaydı F1 için fonksiyon hiçbir şey döndürmez, yani <code>None<\/code> verirdi;\n<code>TUR_RENK[None]<\/code> ise <code>KeyError<\/code>.<\/div>\n", "ornek": "def hat_turu(kod):\n    if kod == \"Marmaray\" or kod.startswith(\"TCDD\"):\n        return \"Banliyö (TCDD)\"\n    if kod.startswith(\"TF\"):\n        return \"Teleferik\"\n    if kod.startswith(\"M\"):\n        return \"Metro\"\n    if kod.startswith(\"T\"):\n        return \"Tramvay\"\n    return \"Füniküler\"\n\nfor kod in [\"M4\", \"TF1\", \"T1\", \"Marmaray\", \"F4\"]:\n    print(kod, \"→\", hat_turu(kod))", "ornek_setup": []}, {"baslik": "Parametreler ve kapsam", "html": "\n<pre class=\"py\">def footer_ekle(fig, donem, birim, not_metni=None):\n    satir = f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"\n    if not_metni:\n        satir = not_metni + \"\\n\" + satir\n    ...<\/pre>\n<p><code>not_metni=None<\/code> bir <b>varsayılan değerdir<\/b>: çağıran bu argümanı vermezse <code>None<\/code> olur. Böylece aynı\nfonksiyonu iki türlü çağırabilirsin:<\/p>\n<pre class=\"py\">footer_ekle(fig, \"2025\", \"yolcu (milyon)\")\nfooter_ekle(fig, \"2025\", \"%\", \"Not: Kesikli çizgi %100 düzeyidir.\")<\/pre>\n<p>Varsayılanlı parametreler varsayılansızlardan <b>sonra<\/b> gelir: <code>def f(a=1, b):<\/code> yazılamaz.<\/p>\n<h3>İsimli argüman<\/h3>\n<p>Argümanı sırayla değil <b>adıyla<\/b> da verebilirsin: <code>isim=deger<\/code>. Sıra önemsizleşir, kod kendini anlatır. Projende\nmatplotlib çağrılarının neredeyse hepsi böyle: <code>ax.text(deger + 2, i, f\"{deger:.1f}\", va=\"center\", fontsize=8)<\/code>.\n<code>ax.text<\/code>'in onlarca parametresi var; sen yalnızca değiştirmek istediklerini adıyla veriyorsun, gerisi varsayılan kalıyor.<\/p>\n<h3>Kapsam: fonksiyonun içi ayrı bir oda<\/h3>\n<pre class=\"py\">def yuzde(parca, butun):\n    oran = parca / butun      # oran yalnızca fonksiyonun içinde var\n    return oran * 100\n\nyuzde(1, 4)    # 25.0\nprint(oran)    # NameError: name 'oran' is not defined<\/pre>\n<p>Fonksiyon içinde oluşan değişkenler fonksiyon bitince silinir; dışarı çıkmanın yolu <code>return<\/code>'dür. Fonksiyon dışarıdaki\nbir değeri <b>okuyabilir<\/b> ama: <code>footer_ekle<\/code> içindeki <code>KAYNAK<\/code>, en üstte tanımlı sabiti böyle okuyor.<\/p>\n<div class=\"tuzak\"><b>Sık yapılan hata<\/b> Fonksiyonun içinde hesaplanan bir değişkeni dışarıda kullanmaya çalışmak. Sonucu\n<code>return<\/code> et ve çağırırken bir değişkene ata: <code>pay = yuzde(1, 4)<\/code>.<\/div>\n", "ornek": "KAYNAK = \"İBB Açık Veri Portalı\"\n\ndef kaynak_satiri(donem, birim, not_metni=None):\n    satir = f\"Kaynak: {KAYNAK} | Dönem: {donem} | Birim: {birim}\"\n    if not_metni:\n        satir = not_metni + \"\\n\" + satir\n    return satir\n\nprint(kaynak_satiri(\"2025\", \"yolcu (milyon)\"))\nprint()\nprint(kaynak_satiri(birim=\"%\", donem=\"2025\", not_metni=\"Not: isimli argümanlarda sıra serbest.\"))", "ornek_setup": []}], "sorular": [{"t": "mc", "q": "Hangisi <code>if<\/code> içinde <b>doğru<\/b> sayılır?", "opts": ["\"\"", "0", "[]", "\"0\""], "a": 3, "why": "<code>\"0\"<\/code> boş olmayan bir metindir, o yüzden doğru sayılır. Boş metin, 0 ve boş liste yanlıştır.", "tags": ["kosul"], "code": null, "rev": false, "zorluk": 1, "yer": "a0"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["True", "False", "None", "hata"], "a": 0, "why": "Tek bir boşluk bile olsa metin boş değildir; yalnızca <code>\"\"<\/code> yanlış sayılır.", "tags": ["kosul"], "code": "print(bool(\" \"))", "rev": false, "zorluk": 2, "yer": "a0"}, {"t": "mc", "q": "<code>print(5 &gt; 3 and 2 &gt; 4)<\/code> ne yazdırır?", "opts": ["True", "False", "None", "hata"], "a": 1, "why": "<code>and<\/code> için iki taraf da doğru olmalı; 2 &gt; 4 yanlış.", "tags": ["kosul"], "code": null, "rev": false, "zorluk": 1, "yer": "a1"}, {"t": "mc", "q": "Bu kod ne yazdırır?", "opts": ["metro", "diğer", "hiçbir şey", "hata"], "a": 0, "why": "<code>kod == \"M2\" or \"M4\"<\/code> ifadesinin sağ tarafı <code>\"M4\"<\/code>, boş olmayan metin: her zaman doğru. Doğrusu <code>kod in (\"M2\", \"M4\")<\/code>.", "tags": ["kosul"], "code": "kod = \"T1\"\nif kod == \"M2\" or \"M4\":\n    print(\"metro\")\nelse:\n    print(\"diğer\")", "rev": false, "zorluk": 2, "yer": "a1"}, {"t": "mc", "q": "Fonksiyon içinde <code>return<\/code> çalıştıktan sonra ne olur?", "opts": ["Sonraki satırlar da çalışır", "Fonksiyondan hemen çıkılır", "Fonksiyon baştan başlar", "Hata oluşur"], "a": 1, "why": "<code>return<\/code> değeri geri verir ve fonksiyonu bitirir.", "tags": ["fonksiyon"], "code": null, "rev": false, "zorluk": 1, "yer": "a2"}, {"t": "mc", "q": "Bu kod ekrana ne yazdırır?", "opts": ["5.0", "Önce 5.0, sonra None", "None", "hata"], "a": 1, "why": "Fonksiyon içindeki <code>print<\/code> 5.0 yazar; ama <code>return<\/code> olmadığı için <code>sonuc<\/code> <code>None<\/code> olur ve o da yazdırılır.", "tags": ["fonksiyon"], "code": "def ikiye_bol(x):\n    print(x / 2)\n\nsonuc = ikiye_bol(10)\nprint(sonuc)", "rev": false, "zorluk": 2, "yer": "a2"}, {"t": "mc", "q": "Projendeki <code>hat_
